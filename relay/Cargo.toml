[package]
name = "bts-relay"
version = "0.1.0"
description = "Cloud-Relay zwischen Schiedsrichter-Tablets und bts-light"
edition = "2021"

[dependencies]
relay-proto = { path = "../relay-proto" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2.5"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
include_dir = "0.7"
base64 = "0.23"
# OS-Zufall für Telefon-Kopplungscodes (ADR 0004); ohnehin schon transitiv
# im Workspace-Dependency-Baum.
getrandom = "0.4"

[dev-dependencies]
# Nur die Test-Uhr (`tokio::time::pause`/`advance`) — keine neue Crate,
# dasselbe tokio mit einem Feature mehr, damit der 20-s-Timeout eines alten
# Turnier-PCs im Test nicht real abgewartet werden muss.
tokio = { version = "1", features = ["test-util"] }
# Echter WebSocket-Client für die Transport-Deckel (Spec relay-haerten, PR 4):
# Sie wirken erst am Upgrade und lassen sich ohne echte Verbindung nicht
# prüfen. Beide Crates liegen schon im Workspace-Baum (App bzw. axum).
tokio-tungstenite = "0.30"
futures-util = "0.3"
