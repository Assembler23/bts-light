  if (pending && pending.courtId === c.court_id) classes.push("pending");

  // Drei-Stufen-Badges (Spec tl-web-panelsystem, Schritt 10): „gesperrt"
  // war bisher unbenannt (bloßes `.badge` ohne Stufe) — jetzt Alarm, wie
  // Verletzung und TL-Ruf (sofort handeln). Pause/kein Tablet bleiben
  // Warnung (im Blick behalten, kein sofortiger Handlungsdruck).
  const badges = [];
  if (c.locked) badges.push('<span class="badge badge-alarm">gesperrt</span>');
  if (c.injury) badges.push('<span class="badge badge-alarm">Verletzung</span>');
  if (c.official_call) badges.push('<span class="badge badge-alarm">TL gerufen</span>');
  // „Fertig, aber kein Ergebnis" (Spec `tl-warnung-fertiges-spiel`): dieselbe
  // Alarm-Sprache wie gesperrt/Verletzung/TL gerufen — da muss jemand hin.
  if (fertigOhneErgebnis(c)) {
    badges.push('<span class="badge badge-alarm" '
      + 'title="Die Sätze ergeben einen Sieger, das Feld ist aber noch belegt. '
      + 'Vermutlich wurde das Ergebnis nicht übermittelt.">Ergebnis fehlt</span>');
  }
  if (c.pause) badges.push(pauseBadge(c.pause));
  if (c.match_id && !c.tablet_connected) badges.push('<span class="badge badge-warn">kein Tablet</span>');

  // Satz-/Matchball: nur für die Turnierleitung, nie auf den Hallen-TVs
  // (Scope-Entscheidung 20.07.2026, Plan 16). Die Streifenfarben bleiben
  // unangetastet — Rot heißt dort weiterhin „überfällig". Info-Stufe, NICHT
  // Alarm: reine Planungshilfe, kein Handlungsdruck — und die Form (Rahmen
  // statt Vollton-Fläche, siehe CSS `.badge-info`) hält Matchball optisch
  // klar vom alarmroten „überfällig"-Streifen auseinander (Akzeptanz-
  // kriterium), obwohl beide dieselbe Grundfarbe (Rose/Rot) nutzen.
  const ball = c.match_id && !c.locked ? gamePointKind(c) : null;
  if (ball === "match") { classes.push("gp-match"); badges.push('<span class="badge badge-info badge-info-match">Matchball</span>'); }
  else if (ball === "set") { classes.push("gp-set"); badges.push('<span class="badge badge-info badge-info-set">Satzball</span>'); }

  let body, foot = "";
  if (pending && pending.courtId === c.court_id) {
    // Unterwegs: sichtbar vorläufig. Nichts wird als Tatsache dargestellt,
    // was der Turnier-PC noch nicht bestätigt hat.
    body = `<div class="empty-hint">wird zugewiesen …</div>
            <div class="meta">Warte auf die Bestätigung vom Turnier-PC.</div>`;
  } else if (c.match_id) {
    const sets = (c.sets || []).map(([a, b]) => `${a}:${b}`).join(" · ") || "0:0";
    body = `<div class="pair">${pairOf(c.team1, c.team2, c.team1_nat, c.team2_nat, c.team1_club, c.team2_club,
      { ids1: c.team1_ids, ids2: c.team2_ids })}</div>
            <div class="meta">${esc([klasse(c.discipline, c.class_label), c.round_name].filter(Boolean).join(" · "))}</div>`;
    // Beschriftung nur noch, wenn sie etwas sagt, das man sonst nicht sieht.
    // „auf dem Feld seit" und „im Spiel seit" stehen inzwischen als Farbe an
    // der Kachel — das Wort wiederholte nur, was der Streifen schon zeigt,
    // und kostete auf dem Tablet eine ganze Zeile je Feld. Ein fälliger
    // Aufruf ist dagegen eine Aufforderung und bleibt ausgeschrieben.
    // „Fällig" heißt: noch nicht gesprochen. Hat die Halle die Stufe
    // schon gehört (c.call_stage), wäre „Letzter Aufruf" eine stehen
    // gebliebene Aufforderung — und widerspräche mit „Aufrufe
    // unbegrenzt" dem Knopf „Erneut aufrufen" derselben Kachel
    // (Review 17.08.2026).
    const gesprochenUhr = c.call_stage || 0;
    const clockLabel =
      stage >= 3 && gesprochenUhr < 3 ? "Letzter Aufruf" :
      stage >= 2 && gesprochenUhr < 2 ? "2. Aufruf fällig" : "";
    // Geschätzte Restzeit (Spec spielzeiten-prognose, Etappe D): eine vom
    // Host aus Live-Stand und Medianen gerechnete Schätzung — hinter dem
    // Profil-Schalter, weil nicht jede Turnierleitung eine dritte Zahl in
    // der Fußzeile will. `remaining_min` fehlt an alten Hosts und bei
    // ausgeschalteter Prognose → dann erscheint nichts.
    const rest = zeigeRestzeitAktiv() && c.remaining_min != null
      ? `<span class="restzeit num" title="geschätzte Restzeit des laufenden Spiels">
           ~${Number(c.remaining_min)}<small>min Rest</small>
         </span>`
      : "";
    foot = `<span class="score num" title="Satzstand">${esc(sets)}</span>
            ${rest}
            <span class="clock num stage${stage}" data-since="${c.on_court_since_ms || ""}" data-court="${c.court_id}"
                  title="${isPlaying(c) ? "im Spiel seit" : "auf dem Feld seit"}">
              ${UHR}<span class="zeit">${c.on_court_since_ms ? "" : "–"}</span>
              ${clockLabel ? `<small>${esc(clockLabel)}</small>` : ""}
            </span>`;
  } else if (c.clearing) {
    body = `<div class="empty-hint">wird noch geräumt</div>
            <div class="meta">Das Spiel ist beendet, BTP hat das Feld noch nicht freigegeben.</div>`;
  } else {
    body = `<div class="empty-hint">frei</div>`;
  }

  const bediener = c.scorekeeper && c.scorekeeper.length
    ? `<div class="meta">Bedienung: ${esc(c.scorekeeper.join(" / "))}</div>` : "";

  // Schiedsrichter/Aufschlagrichter (Spec schiedsrichter-management): Namen
  // plus Konflikt-KATEGORIE. Die beiden Knöpfe („einteilen"/„ansagen")
  // stehen seit ADR 0026 im ⋯-Menü der Kachel — hier bleibt die reine
  // Information stehen.
  const schiris = state.officials_managed && c.match_id
    ? `<div class="meta">
         ${(c.sr || []).length ? `SR: ${esc(c.sr.join(" / "))}` : "SR: –"}
         ${(c.ar || []).length ? ` · AR: ${esc(c.ar.join(" / "))}` : ""}
         ${c.official_warn ? `<span class="badge badge-warn" title="Konflikt">${esc(c.official_warn)}</span>` : ""}
       </div>`
    : "";

  // Erneut aufrufen: im Regelfall nur bei einem Spiel, das noch nicht
  // angefangen hat, und nur bis zum dritten Aufruf — danach entscheidet
  // die Turnierleitung, nicht noch ein Knopf. Mit der Profil-Option
  // „Aufrufe unbegrenzt" (Feldtest 17.08.2026) bleibt der Knopf dagegen
  // immer da, auch bei laufendem Spiel; ab dem vierten Aufruf spricht das
  // Ansage-Gerät die schlichte Feld-Ansage ohne Stufenwort.
  // `call_stage` zählt die **gesprochenen** Aufrufe (0 = noch keiner). Auf
  // dem Feld zu stehen gilt als erster Aufruf — deshalb hier die 1 als
  // Untergrenze der Anzeige.
  const gesprochen = c.call_stage || 0;
  const erfolgt = Math.max(gesprochen, 1);
  // Der Knopf bleibt nie hinter der Uhr zurück: Stünde daneben „Letzter
  // Aufruf", während er den zweiten anbietet, widersprächen sich zwei
  // Anzeigen auf demselben Bildschirm. Der Turnier-PC rechnet genauso.
  const naechste = Math.max(erfolgt + 1, stage);
  const aufrufText = naechste === 3 ? "Letzter Aufruf"
    : naechste > 3 ? "Erneut aufrufen" : `${naechste}. Aufruf`;
  // Was schon gerufen wurde, steht als Tatsache da — sonst tippen zwei
  // Turnierleitungen nacheinander denselben Aufruf.
  const gerufen = c.match_id && gesprochen > 1
    ? `<span class="badge badge-warn">${gesprochen}. Aufruf erfolgt</span>` : "";
  // Zieh-Griff: nur an belegten Feldern — ein freies Feld ist ein Ziel,
  // keine Ziehquelle. `aria-hidden` wie bei der Warteliste: rein visuelle
  // Zusatz-Affordanz, Antippen der Kachel bleibt der barrierefreie Weg.
  const griff = c.match_id
    ? `<span class="drag-griff" aria-hidden="true" title="Zum Ziehen greifen">⠿</span>` : "";
  // ── ⋯-Menü der Kachel (ADR 0026, Plan E) ─────────────────────────────
  // Die Kachel trug bis zu vier eigene Knöpfe („einteilen", „ansagen",
  // Aufruf, Punktverlauf) plus Satzstand und Uhr — bei 26 Feldern auf einem
  // Tablet ist das eine Wand aus Bedienelementen. Sichtbar bleiben Paarung,
  // Satzstand, Uhr, Statusabzeichen und Zieh-Griff; alles Handelnde zieht
  // hierher — seit dem Feldtest 17.08.2026 auch der Punktverlauf-Knopf.
  // Dasselbe Kebab-Muster wie die Spielzeile, inklusive Offen-Zustand über
  // den Redraw (`openKebabCourtId`).
  const kachelAktionen = [];
  if (state.officials_managed && c.match_id) {
    kachelAktionen.push(`<button type="button" data-off-court="${c.court_id}" data-off-match="${c.match_id}"
        title="Schiedsrichter einteilen">Schiedsrichter einteilen</button>`);
    if ((c.sr || []).length || (c.ar || []).length) {
      kachelAktionen.push(`<button type="button" data-off-say="${c.court_id}"
          title="Schiedsrichter ansagen">Schiedsrichter ansagen</button>`);
    }
  }
  // Billige Bedingung zuerst: `aufrufeUnbegrenzt()` läuft durch die
  // Profil-Auflösung und soll im Normalfall gar nicht erst rechnen.
  if (c.match_id && ((!isPlaying(c) && gesprochen < 3) || aufrufeUnbegrenzt())) {
    // Drei Wege, denselben Aufruf auszulösen: für beide Parteien (bisheriges
    // Verhalten, ohne `side` gesendet) oder gezielt für eine — in der Regel
    // fehlt nur eine, und der ganze Saal noch einmal auszurufen nervt alle
    // anderen. Die Wire-Form der Partei entspricht exakt dem
    // Vorbereitungs-Nachruf (`PrepCallSide`: "both"/"team1"/"team2"), die
    // Aufruf-STUFE zählt weiterhin allein der Turnier-PC.
    kachelAktionen.push(`<button type="button" data-call="${c.court_id}" data-match="${c.match_id}"
        data-made="${gesprochen}" title="Ansage in der Halle auslösen">${esc(aufrufText)}</button>`);
    kachelAktionen.push(`<button type="button" data-call="${c.court_id}" data-match="${c.match_id}"
        data-made="${gesprochen}" data-call-side="team1"
        title="Nur diese Partei erneut aufrufen">${esc(aufrufText)} — ${esc(shortSide(c.team1))}</button>`);
    kachelAktionen.push(`<button type="button" data-call="${c.court_id}" data-match="${c.match_id}"
        data-made="${gesprochen}" data-call-side="team2"
        title="Nur diese Partei erneut aufrufen">${esc(aufrufText)} — ${esc(shortSide(c.team2))}</button>`);
  }
  // Nachruf an die Zähltafelbedienung (Spec tl-sicht-feinschliff, Punkt 2 —
  // der seit ADR 0007 offene Baustein). `scorekeeper_assigned` deckt alle
  // drei Fälle ab, in denen es niemanden zu rufen gibt: leere
  // Warteschlange, Feld mit abgeschalteter Bediener-Vergabe und global
  // ausgeschaltete Verwaltung — in allen dreien weist der Turnier-PC gar
  // nicht erst zu. Kein Aufruf: Der Knopf trägt keine Stufe und steht
  // deshalb getrennt von den Aufruf-Knöpfen.
  if (state.scorekeeper_managed && c.match_id && c.scorekeeper_assigned) {
    kachelAktionen.push(`<button type="button" data-sk-say="${c.court_id}"
        title="Zähltafelbedienung nachrufen">Bedienung nachrufen</button>`);
  }
  // „Bitte mit dem Spielen beginnen" (Spec tl-sicht-feinschliff, Punkt 3):
  // Die Spieler stehen am Feld, es fällt aber kein Punkt. Nur dann sinnvoll
  // — sobald gezählt wird, ist die Aufforderung gegenstandslos. Bewusst
  // KEIN Aufruf: Die Stufe bleibt stehen, deshalb steht der Knopf auch
  // getrennt von den Aufruf-Knöpfen darüber und hat keine `data-made`.
  if (c.match_id && !isPlaying(c)) {
    kachelAktionen.push(`<button type="button" data-startplay="${c.court_id}" data-match="${c.match_id}"
        title="Ansage: Feld soll mit dem Spielen beginnen">Bitte anfangen</button>`);
  }
  if (c.match_id) {
    kachelAktionen.push(`<button type="button" data-court-result="${c.court_id}"
        title="Endstand eintragen">✎ Ergebnis eintragen</button>`);
  }
  // Punktverlauf (Spec punktverlauf-graph): nur wenn es wirklich einen
  // Verlauf gibt (has_timeline) — kein Klick ins Leere. Der Graph selbst
  // bleibt lazy: geladen wird erst beim Klick, nie im Zustands-Push.
  if (c.match_id && c.has_timeline) {
    kachelAktionen.push(`<button type="button" data-graph="${c.match_id}"
        title="Punktverlauf anzeigen">📈 Punktverlauf</button>`);
    // Zettel unter derselben Schranke: Ohne Aufzeichnung gäbe es nichts
    // zu drucken (Papier-Ergebnis).
    kachelAktionen.push(`<button type="button" data-zettel="${c.match_id}"
        title="Schiedsrichterzettel drucken">🖨 Zettel</button>`);
  }
  // Feld sperren/freigeben (Spec `tl-web-felder-sperren`).
  //
  // Nur wenn der Turnier-PC die Aktion kennt: Der Relay wird bei jedem
  // main-Merge deployt, die App erst mit einem Release-Tag. Dazwischen spricht
  // diese Seite womöglich mit einem älteren Host — und der verwirft eine
  // unbekannte Aktion STILL, ohne Fehlermeldung. Ein Knopf, der nichts tut und
  // nichts sagt, ist schlimmer als keiner (E13).
  if (state.can_lock_courts) {
    if (c.locked) {
      kachelAktionen.push(`<button type="button" data-unlock="${c.court_id}"
          title="Feld wieder für die Vergabe freigeben">🔓 Feld freigeben</button>`);
    } else {
      // Läuft ein Spiel, greift die Sperre erst danach — der Text sagt das,
      // statt etwas zu versprechen, das nicht eintritt.
      const txt = c.match_id ? "Feld nach diesem Spiel sperren" : "Feld sperren";
      kachelAktionen.push(`<button type="button" data-lock="${c.court_id}"
          title="Keine automatische Vergabe mehr auf dieses Feld">🔒 ${txt}</button>`);
    }
  }
  const kebabOffen = openKebabCourtId === c.court_id;
  const kebab = kachelAktionen.length
    ? `<details class="kebab" data-kebab-court="${c.court_id}"${kebabOffen ? " open" : ""}>
         <summary aria-label="Weitere Aktionen" title="Weitere Aktionen">⋯</summary>
         <div class="kebab-menu">
           <div class="kebab-group">
             <span class="kebab-label">${esc(c.court)}</span>
             <div class="kebab-actions">${kachelAktionen.join("")}</div>
           </div>
         </div>
       </details>`
    : "";

  return `<article class="${classes.join(" ")}" tabindex="0" data-court="${c.court_id}"
                   ${cellStyle ? `style="${cellStyle}"` : ""} ${picked ? 'role="button"' : ""}>
    <div class="card-top"><span class="court-name">${esc(c.court)}</span>${gerufen}${badges.join("")}${griff}${kebab}</div>
    ${body}${bediener}${schiris}
    <div class="card-foot">${foot}</div>
  </article>`;
}

/** Pausen-Text mit Countdown bzw. Überziehung (Spec spielzeiten-prognose,
 *  E9): Vor Ablauf zählt „Pause m:ss" runter; danach hält das Tablet die
 *  Pause (ADR 0028) und hier zählt rot „überzogen +m:ss" hoch, bis am Feld
 *  weitergespielt wird. Gegen die Server-Uhr gerechnet, wie alle Uhren
 *  dieser Seite. */
function pauseText(endsAt) {
  // Aufgerundet wie `restzeit` — beide Countdowns aufs selbe Ziel zeigen
  // so in jeder Sekunde dieselbe Zahl.
  const rest = Math.ceil((endsAt - serverNow()) / 1000);
  return rest < 0 ? `überzogen +${zeitspanne(-rest)}` : `Pause ${zeitspanne(rest)}`;
}

/** Pausen-Abzeichen einer Feldkachel (Spec spielzeiten-prognose, E9/E10):
 *  BWF-Pause mit Countdown (Warn-Stufe) bzw. Überziehung (Alarm-Stufe);
 *  Behandlungspause als „Behandlung seit …" ohne Countdown. Ein altes
 *  Tablet ohne `started_at_ms`/`ends_at_ms` degradiert zum schlichten
 *  „Pause"-Badge von früher. Die Sekunden tickt `tickClocks()` weiter. */
function pauseBadge(p) {
  if (p.kind === "injury") {
    // Zeitfeld startet leer — `tickClocks()` (läuft direkt nach jedem
    // Render) füllt es. Ein eingebetteter Sekundenwert machte das
    // Kachel-HTML bei jedem Abgleich „anders" und hebelte den
    // Keyed-Abgleich aus.
    const seit = p.started_at_ms
      ? ` seit <span class="zeit num" data-pause-started="${p.started_at_ms}"></span>`
      : "";
    return `<span class="badge badge-warn pause-chip"
      title="Behandlungspause läuft">Behandlung${seit}</span>`;
  }
  if (!p.ends_at_ms) return '<span class="badge badge-warn">Pause</span>';
  const over = p.ends_at_ms - serverNow() <= 0;
  return `<span class="badge ${over ? "badge-alarm" : "badge-warn"} pause-chip num"
    data-pause-ends="${p.ends_at_ms}"
    title="${over
      ? "Pause überzogen — auf dem Tablet weiterspielen"
      : "Satz-/Spielpause läuft"}"></span>`;
}

/** Welche Feldkachel ihr ⋯-Menü gerade offen hat — über das Neuzeichnen
 *  hinweg gemerkt, exakt wie `openKebabMatchId` bei der Spielzeile: Der
 *  Poll-Takt liegt bei 2 s, und ein natives `<details>` überlebt kein
 *  `innerHTML`-Ersetzen. */
let openKebabCourtId = null;

/**
 * Setzt ein ⋯-Menü (Feldkachel ODER Spielzeile) ans Ansichtsfenster (siehe
 * die CSS-Begründung bei `.kebab-menu`): unter den Auslöser, wenn darunter
 * Platz ist, sonst darüber; waagerecht rechtsbündig am Auslöser, aber nie
 * über den Fensterrand hinaus. Ohne diese Rechnung wäre das Menü einer
 * Kachel in der untersten Reihe oder einer Zeile am unteren Panel-Rand
 * schlicht nicht sichtbar.
 */
function platziereKebabMenue(det) {
  const menu = det.querySelector(".kebab-menu");
  const anker = det.querySelector("summary");
  if (!menu || !anker) return;
  // Erst an eine bekannte Stelle setzen, dann messen: Die eigene Breite
  // hängt am Inhalt, und ein Restwert vom letzten Öffnen verfälschte sie.
  menu.style.left = "0px";
  menu.style.top = "0px";
  const a = anker.getBoundingClientRect();
  const m = menu.getBoundingClientRect();
  const rand = 8;
  const passtDrunter = window.innerHeight - a.bottom >= m.height + rand;
  const top = passtDrunter ? a.bottom + 6 : Math.max(rand, a.top - m.height - 6);
  const left = Math.min(
    Math.max(rand, a.right - m.width),
    Math.max(rand, window.innerWidth - m.width - rand),
  );
  menu.style.top = `${top}px`;
  menu.style.left = `${left}px`;
}

/** Offene ⋯-Menüs folgen ihrem Auslöser: Sie hängen am Ansichtsfenster
 *  (siehe `.kebab-menu`), Rollen eines Panel-Körpers bewegt aber den
 *  Auslöser unter ihnen weg — ohne Nachführung schwebte das Menü über
 *  einer fremden Zeile, und die trägt nur Gattungs-Beschriftungen
 *  („Spiel", „Nachruf"): ein Klick träfe das falsche Spiel. Rollt der
 *  Auslöser ganz aus dem Sichtfenster, schließt das Menü stattdessen.
 *  Capture-Phase, weil Scroll-Ereignisse der Panel-Körper nicht bubbeln;
 *  über rAF gebündelt wie `scheduleFitCourts`. */
/** „Nur EIN offenes ⋯-Menü" — SEITENWEIT, nicht je Panel: Die Menüs
 *  hängen alle am Ansichtsfenster; zwei offene überlagerten sich auch
 *  über Panel-Grenzen hinweg (Kachel + Zeile gleichzeitig). Eine
 *  Funktion für beide Verdrahtungen (Review 17.08.2026). */
function schliesseAndereKebabs(det) {
  document.querySelectorAll(".kebab[open]").forEach((other) => {
    if (other !== det) other.open = false;
  });
}

let kebabFolgePending = false;
function folgeOffenenKebabs() {
  document.querySelectorAll(".kebab[open]").forEach((det) => {
    const anker = det.querySelector("summary");
    if (!anker) return;
    const a = anker.getBoundingClientRect();
    if (a.bottom < 0 || a.top > window.innerHeight) {
      det.open = false;
      return;
    }
    platziereKebabMenue(det);
  });
}
document.addEventListener("scroll", () => {
  if (kebabFolgePending) return;
  kebabFolgePending = true;
  requestAnimationFrame(() => {
    kebabFolgePending = false;
    folgeOffenenKebabs();
  });
}, true);
window.addEventListener("resize", folgeOffenenKebabs);

/**
 * Verdrahtet die Feld-Kacheln.
 *
 * Zwei Rollen, je nachdem, ob gerade ein Spiel gewählt ist: Ohne Auswahl ist
 * ein belegtes Feld der **Griff** (antippen wählt das Spiel zum Umhängen,
 * ziehen ebenso). Mit Auswahl ist jede Kachel ein **Ziel**.
 */
/** Zeitpunkt der letzten Spielbeginn-Ansage je Feld — die Doppeltipp-Sperre.
 *  Bewusst hier statt am Knopf: Der überlebt den nächsten Redraw nicht
 *  (siehe Kommentar an der Verdrahtung). */
const spielbeginnZuletzt = new Map();

/** Zeitpunkt des letzten Bediener-Nachrufs je Feld — die Doppeltipp-Sperre.
 *  Bewusst hier statt am Knopf: Der überlebt den nächsten Redraw nicht
 *  (siehe Kommentar an der Verdrahtung). */
const skNachrufZuletzt = new Map();

function wireCourts(box) {
  // Der Aufruf-Knopf zuerst und mit gestopptem Weiterreichen: Sonst wählte
  // derselbe Tipp zusätzlich das Spiel aus, und die Kachel spränge unter dem
  // Finger in den Umhäng-Zustand.
  scopeAll(box, "button[data-call]").forEach((btn) => {
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const courtId = Number(btn.dataset.call);
      const matchId = Number(btn.dataset.match);
      // Ohne `side` = beide Parteien = bisheriges Verhalten. Das Feld wird
      // deshalb nur gesetzt, wenn wirklich eine Partei gemeint ist — ein
      // älterer Turnier-PC, der `side` noch nicht kennt, ruft dann eben
      // beide, statt gar nicht zu rufen (Serde ignoriert unbekannte Felder).
      const side = btn.dataset.callSide || null;
      btn.disabled = true;
      // Die Vorgangskennung trägt den Stand, den diese Kachel kennt — kein
      // Zeitfenster. Ein Doppeltipp vor dem nächsten Neuzeichnen ist damit
      // dieselbe Kennung und wird als Wiederholung erkannt; ein bewusster
      // zweiter Aufruf danach hat einen neuen Stand und geht durch. Ein
      // Zeitfenster verschluckte den zweiten Aufruf — und ein Aufruf ist
      // seinem Wesen nach wiederholbar. Die Partei gehört mit in die
      // Kennung: „erst A rufen, dann B" sind zwei verschiedene Absichten
      // auf demselben Stand. Mit „Aufrufe unbegrenzt" bewegt eine
      // Partei-Wiederholung die Stufe nicht mehr unbedingt — dann macht
      // eine Zeitmarke die Kennung eindeutig, sonst spielte
      // `remembered_result` die alte Antwort stumm ab (Review
      // 17.08.2026); den Doppel-Tipp fängt das `disabled` oben ab.
      const nonce = aufrufeUnbegrenzt() ? `-${Date.now()}` : "";
      send(
        `call-${courtId}-${matchId}-${side || "both"}-${btn.dataset.made}${nonce}`,
        side
          ? { action: "announce_court_call", courtId, matchId, side }
          : { action: "announce_court_call", courtId, matchId },
        "Aufruf ausgelöst.",
      );
    });
    btn.addEventListener("pointerdown", (ev) => ev.stopPropagation());
  });

  // Ergebnis eintragen, direkt vom Feld — bisher nur über „Spiel wählen →
  // Band oben" erreichbar. Vorbelegt mit dem Live-Satzstand der Kachel,
  // genau wie der Weg über das Band (`start()`), damit ein Nachtrag nicht
  // bei null anfängt.
  scopeAll(box, "button[data-court-result]").forEach((btn) => {
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const court = state.courts.find((x) => String(x.court_id) === btn.dataset.courtResult);
      if (!court || !court.match_id) return;
      const t1 = (court.team1 || []).join(" / "), t2 = (court.team2 || []).join(" / ");
      openResultDialog({
        matchId: court.match_id,
        label: `${court.court}: ${t1} vs. ${t2}`,
        sets: court.sets || [],
        bestOf: court.best_of,
        overwrite: false,
        team1: t1, team2: t2,
      });
    });
    btn.addEventListener("pointerdown", (ev) => ev.stopPropagation());
  });

  // Das ⋯-Menü der Kachel: Weder Öffnen/Schließen noch ein Tipp im Menü
  // darf zusätzlich das Spiel auswählen oder einen Zug starten (Muster der
  // Spielzeile, siehe `wireQueue`).
  scopeAll(box, ".kebab[data-kebab-court]").forEach((det) => {
    const courtId = Number(det.dataset.kebabCourt);
    det.addEventListener("click", (ev) => ev.stopPropagation());
    det.addEventListener("pointerdown", (ev) => ev.stopPropagation());
    det.addEventListener("toggle", () => {
      if (det.open) {
        openKebabCourtId = courtId;
        schliesseAndereKebabs(det);
        platziereKebabMenue(det);
      } else if (openKebabCourtId === courtId) {
        openKebabCourtId = null;
      }
    });
    // Ein aus dem Markup heraus offenes `<details open>` (der über den
    // Redraw gerettete Zustand) löst KEIN `toggle` aus — die Platzierung
    // muss deshalb hier ausdrücklich nachgeholt werden. Nebeneffekt, den
    // wir wollen: Sie läuft damit bei jedem Neuzeichnen mit, das Menü folgt
    // seiner Kachel, wenn die Kompaktstufe wechselt.
    if (det.open) platziereKebabMenue(det);
  });

  // Graph-Knopf, seit dem Feldtest 17.08.2026 im ⋯-Menü: Das umschließende
  // `<details class="kebab">` stoppt Klick und Zeigegesten-Start bereits
  // für alle Menü-Einträge; die eigenen Stopper bleiben aus Gleichklang
  // mit den Nachbar-Knöpfen stehen. Der Tipp schließt das Menü — sonst
  // schwebte es dank `position: fixed` hinter dem Graph-Overlay weiter
  // und läge nach dessen Schließen noch über fremden Kacheln
  // (Review-Fund 17.08.2026).
  scopeAll(box, "button[data-zettel]").forEach((btn) => {
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const det = btn.closest(".kebab");
      if (det) det.open = false;
      const c = state.courts.find((x) => String(x.match_id) === btn.dataset.zettel);
      if (!c) return;
      openZettel(
        [c.match_id],
        `${(c.team1 || []).join(" / ")} vs. ${(c.team2 || []).join(" / ")}`,
      );
    });
  });
  scopeAll(box, "button[data-graph]").forEach((btn) => {
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const det = btn.closest(".kebab");
      if (det) det.open = false;
      const c = state.courts.find((x) => String(x.match_id) === btn.dataset.graph);
      if (!c) return;
      openTimeline(c.match_id, `${(c.team1 || []).join(" / ")} vs. ${(c.team2 || []).join(" / ")}`, null);
    });
    btn.addEventListener("pointerdown", (ev) => ev.stopPropagation());
  });

  // Einteilen-Knopf: wie der Graph-Knopf mit gestopptem Weiterreichen,
  // sonst wählte derselbe Tipp zusätzlich das Spiel zum Umhängen.
  // Ansage-Knopf: eine nachträgliche Zuweisung sagt nie von selbst an
  // (Spec Nr. 8) — gesprochen wird in der Halle, nicht auf diesem Gerät.
  scopeAll(box, "button[data-off-say]").forEach((btn) => {
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const courtId = Number(btn.dataset.offSay);
      send(
        `off-say-${courtId}-${Math.floor(Date.now() / OP_WINDOW_MS)}`,
        { action: "announce_officials", courtId },
        "Ansage ausgelöst.",
      );
    });
    btn.addEventListener("pointerdown", (ev) => ev.stopPropagation());
  });

  // Feld sperren: ohne Rückfrage. Ein Fehlgriff richtet keinen Schaden an
  // (das laufende Spiel zählt zu Ende) und ist mit einem zweiten Tipp
  // zurückgenommen.
  scopeAll(box, "button[data-lock]").forEach((btn) => {
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const courtId = Number(btn.dataset.lock);
      send(
        `lock-${courtId}-1-${Math.floor(Date.now() / OP_WINDOW_MS)}`,
        { action: "lock_court", courtId, locked: true },
        "Feld gesperrt — die Automatik lässt es jetzt aus.",
      );
    });
    btn.addEventListener("pointerdown", (ev) => ev.stopPropagation());
  });

  // Feld freigeben: MIT Rückfrage. Das ist die gefährliche Richtung — ein
  // zweites Gerät sieht nur „gesperrt" ohne Grund und gäbe womöglich ein
  // kaputtes Feld frei; die Automatik legt dann sofort ein Spiel darauf.
  scopeAll(box, "button[data-unlock]").forEach((btn) => {
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const courtId = Number(btn.dataset.unlock);
      const feld = (state.courts || []).find((x) => x.court_id === courtId);
      const name = feld ? feld.court : courtId;
      if (!confirm(`Feld ${name} wieder freigeben?\n\nDie automatische Vergabe `
        + `legt danach wieder Spiele darauf. Wenn das Feld gesperrt wurde, weil `
        + `etwas kaputt ist, bitte erst nachsehen.`)) {
        return;
      }
      send(
        `lock-${courtId}-0-${Math.floor(Date.now() / OP_WINDOW_MS)}`,
        { action: "lock_court", courtId, locked: false },
        "Feld freigegeben.",
      );
    });
    btn.addEventListener("pointerdown", (ev) => ev.stopPropagation());
  });

  // „Bitte anfangen": beliebig oft auslösbar (Spec A3.4) — wer nach fünf
  // Minuten immer noch nicht spielt, wird eben erneut gebeten. Deshalb ein
  // Zeitstempel-Nonce in der Vorgangs-Kennung statt des 20-s-Fensters
  // (`OP_WINDOW_MS`): Das Fenster ist gegen versehentliche Doppel-Sendungen
  // gedacht und schluckte eine BEWUSSTE Wiederholung stumm.
  //
  // Die Doppeltipp-Sperre liegt im Modul-Zustand, NICHT als `disabled` am
  // Knopf: `send()` stößt in seinem `finally` einen Abruf an, und ein
  // geänderter Zustand zeichnet die Kacheln neu — der frische Knopf wäre
  // sofort wieder scharf, lange vor Ablauf der Sekunde. Im laufenden
  // Turnier ändert sich fast jede Sekunde etwas, die Sperre wäre also
  // genau dann wirkungslos, wenn sie gebraucht wird (Review 18.08.2026).
  scopeAll(box, "button[data-startplay]").forEach((btn) => {
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const courtId = Number(btn.dataset.startplay);
      const matchId = Number(btn.dataset.match);
      const zuletzt = spielbeginnZuletzt.get(courtId) || 0;
      if (Date.now() - zuletzt < 1000) return;
      spielbeginnZuletzt.set(courtId, Date.now());
      send(
        `startplay-${courtId}-${matchId}-${Date.now()}`,
        { action: "announce_start_play", courtId, matchId },
        "Ansage ausgelöst.",
      );
    });
    btn.addEventListener("pointerdown", (ev) => ev.stopPropagation());
  });

  // Bediener-Nachruf: beliebig oft auslösbar wie die anderen Ansagen, aber
  // gedeckelt bei Stufe 3 — der Turnier-PC zählt. Zeitstempel-Nonce statt
  // des 20-s-Fensters (`OP_WINDOW_MS`), das eine BEWUSSTE Wiederholung
  // stumm schluckte.
  //
  // Die Doppeltipp-Sperre liegt im Modul-Zustand, NICHT als `disabled` am
  // Knopf: `send()` stößt in seinem `finally` einen Abruf an, und ein
  // geänderter Zustand zeichnet die Kacheln neu — der frische Knopf wäre
  // sofort wieder scharf, lange vor Ablauf der Sekunde. Im laufenden
  // Turnier ändert sich fast jede Sekunde etwas, die Sperre wäre also
  // genau dann wirkungslos, wenn sie gebraucht wird (Review 18.08.2026).
  scopeAll(box, "button[data-sk-say]").forEach((btn) => {
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const courtId = Number(btn.dataset.skSay);
      const zuletzt = skNachrufZuletzt.get(courtId) || 0;
      if (Date.now() - zuletzt < 1000) return;
      skNachrufZuletzt.set(courtId, Date.now());
      send(
        `sk-say-${courtId}-${Date.now()}`,
        { action: "announce_scorekeeper", courtId },
        "Nachruf ausgelöst.",
      );
    });
    btn.addEventListener("pointerdown", (ev) => ev.stopPropagation());
  });

  scopeAll(box, "button[data-off-court]").forEach((btn) => {
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      openOfficialAssign(Number(btn.dataset.offCourt), Number(btn.dataset.offMatch));
    });
    btn.addEventListener("pointerdown", (ev) => ev.stopPropagation());
  });

  scopeAll(box, ".card[data-court]").forEach((el) => {
    const court = state.courts.find((c) => String(c.court_id) === el.dataset.court);
    if (!court) return;
    // Klick-Handler lösen zur KLICK-Zeit aus `state` auf (Muster
    // `data-prep` in `wireQueue`): Seit dem Keyed-Abgleich überleben
    // Listener viele Renders. Nur die Zieh-Nutzlast (`enableDrag`) behält
    // das Wiring-Zeit-Objekt — ändert sich Sichtbares an der Kachel,
    // wird sie ohnehin ersetzt und neu verdrahtet.
    const frisch = () => state.courts.find((c) => String(c.court_id) === el.dataset.court);

    // ── Spieler-Links (Spec tl-sicht-feinschliff A4.1) ──────────────────
    // VOR der `picked`-Weiche, weil beide Zweige sie brauchen: Die Kachel
    // wird bei jeder Auswahl neu gebaut (sie bekommt `target`) und dann
    // über den jeweils gültigen Zweig verdrahtet. Stünde das unten, hätte
    // eine Kachel genau so lange keine Link-Behandlung, wie ein Spiel zur
    // Zuweisung ausgewählt ist — also mitten im häufigsten Arbeitsgang
    // (Review 18.08.2026).
    //
    // Ein Klick auf den badhub-Link darf das Feld weder aufnehmen noch
    // bezuweisen. `pointerdown` bleibt unangetastet: Der Name ist die
    // größte Trefffläche der Kachel, ein dort angesetzter ZUG muss weiter
    // funktionieren — endet er über dem Namen, fängt `suppressNextClick`
    // die Navigation ab. Wortgleich zu `wireQueue`.
    const istSpielerLink = (ev) =>
      ev.target instanceof Element && !!ev.target.closest("a.sp-name");
    scopeAll(el, "a.sp-name").forEach((a) => {
      a.addEventListener("click", (ev) => {
        ev.stopPropagation();
        if (suppressNextClick) ev.preventDefault();
      });
    });

    if (picked) {
      const go = () => {
        if (suppressNextClick) return;
        const c = frisch();
        if (c) assignTo(c);
      };
      el.addEventListener("click", go);
      el.addEventListener("keydown", (ev) => {
        // Enter/Leertaste auf einem fokussierten Spieler-Link gehören dem
        // Link, nicht der Zuweisung.
        if (istSpielerLink(ev)) return;
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(); }
      });
      return;
    }
    // Ohne Auswahl: ein laufendes Spiel lässt sich von hier aufnehmen.
    if (!court.match_id) return;
    const alsMatch = (c) => ({
      match_id: c.match_id,
      team1: c.team1,
      team2: c.team2,
      draw_name: "",
      round_name: c.round_name,
      discipline: c.discipline,
      class_label: c.class_label,
      // Ein laufendes Spiel bleibt in seiner Halle — das Zielfeld wird
      // danach beurteilt.
      hall: c.location,
    });
    const go = () => {
      if (suppressNextClick) return;
      const c = frisch();
      if (c && c.match_id) pick(alsMatch(c), c.court_id);
    };
    el.addEventListener("click", go);
    el.addEventListener("keydown", (ev) => {
      // Enter/Leertaste auf einem fokussierten Spieler-Link gehören dem
      // Link (badhub-Seite öffnen) — sonst finge die Kachel sie ab und
      // nähme stattdessen das Spiel auf.
      if (istSpielerLink(ev)) return;
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(); }
    });
    enableDrag(el, alsMatch(court), court.court_id);
  });
}

// ── Render-Sparsamkeit (Feldtest 17.08.2026: „Performance im Blick") ───
// Zwei Stufen gegen das Alle-zwei-Sekunden-Neuzeichnen der ganzen Seite:
//
// STUFE 1 — Panel-Kurzschluss: Jede render*()-Funktion baut ihren
// HTML-String ohnehin. `setzeHtmlWennNeu` merkt sich je Container den
// zuletzt gesetzten String und überspringt `innerHTML` + Verdrahtung,
// wenn er unverändert ist. Ein Punktgewinn zeichnet dann nur noch das
// Felder-Panel neu; alle anderen behalten DOM, Listener, Scroll-Position.
//
// STUFE 2 — Keyed-Abgleich für die zwei heißesten Listen (Felder,
// Spielliste): `reconcileKeyed` gleicht Container-Kinder je Schlüssel ab —
// nur geänderte Kacheln/Zeilen werden ersetzt (und NUR die neu
// verdrahtet), verschobene umgehängt, der Rest bleibt stehen. Offene
// ⋯-Menüs und Fokus überleben damit von selbst; die bisherigen Retter
// (`openKebabCourtId` & Co.) bleiben als doppelter Boden.
//
// Damit unveränderte Kacheln/Zeilen auch unverändert BLEIBEN, tragen die
// HTML-Bauer keine sekündlich tickenden Zeittexte mehr — die Uhrfelder
// starten leer und `tickClocks()` (läuft am Ende jedes `render()` und
// weiter sekündlich) füllt sie sofort.
//
// Beide Stände hängen per WeakMap am Container-ELEMENT: Baut
// `renderPanels()` das Panel-Gerüst neu, entsteht ein neues Element und
// der Stand verfällt von allein.
const panelHtmlStand = new WeakMap();
function setzeHtmlWennNeu(el, html) {
  if (panelHtmlStand.get(el) === html) return false;
  panelHtmlStand.set(el, html);
  el.innerHTML = html;
  return true;
}

const keyedHtmlStand = new WeakMap();
/** Kind eines Containers mit diesem Abgleich-Schlüssel — Suche über die
 *  Kinderliste statt `querySelector`, weil Schlüssel (Hallennamen!) jedes
 *  Zeichen enthalten dürfen. */
function kindMitKey(box, key) {
  for (const el of box.children) {
    if (el.dataset.reconKey === key) return el;
  }
  return null;
}

/**
 * Gleicht die Kinder von `box` mit `items` ab: `keyOf` liefert den
 * stabilen Schlüssel, `htmlOf` das Soll-HTML des Elements, `wire`
 * verdrahtet NUR neue/ersetzte Elemente (bestehende behalten ihre
 * Listener — deshalb dürfen Handler nichts aus dem Bauzeitpunkt
 * einfangen, was veraltet; sie lesen ihren Stand aus `state`).
 */
function reconcileKeyed(box, items, keyOf, htmlOf, wire) {
  // Derselbe Container läuft abwechselnd über beide Mechanismen (Liste ↔
  // „leer"-Hinweis via `setzeHtmlWennNeu`). Der String-Stand MUSS hier
  // verfallen: Sonst gliche der Leer-Hinweis nach einem
  // gefüllt-leer-gefüllt-Zyklus dem gemerkten String, `setzeHtmlWennNeu`
  // überspränge das Leeren, und alte Kacheln blieben stehen
  // (Review-Fund 17.08.2026).
  panelHtmlStand.delete(box);
  let stand = keyedHtmlStand.get(box);
  if (!stand) { stand = new Map(); keyedHtmlStand.set(box, stand); }
  const alte = new Map();
  for (const el of Array.from(box.children)) {
    const k = el.dataset.reconKey;
    // Fremdkinder (z. B. der „Keine Felder"-Hinweis eines früheren
    // Renders) fliegen raus — sie gehören nicht zum Abgleich.
    if (k == null) { el.remove(); continue; }
    alte.set(k, el);
  }
  const tmp = document.createElement("template");
  const gebraucht = new Set();
  let cursor = box.firstElementChild;
  for (const item of items) {
    const key = String(keyOf(item));
    gebraucht.add(key);
    const html = htmlOf(item);
    let el = alte.get(key);
    if (!el || stand.get(key) !== html) {
      tmp.innerHTML = html;
      const neu = tmp.content.firstElementChild;
      neu.dataset.reconKey = key;
      if (el) {
        if (cursor === el) cursor = neu;
        el.replaceWith(neu);
      } else {
        box.insertBefore(neu, cursor);
      }
      el = neu;
      alte.set(key, el);
      stand.set(key, html);
      wire(el, item);
    }
    if (el === cursor) {
      cursor = cursor.nextElementSibling;
    } else {
      box.insertBefore(el, cursor);
    }
  }
  for (const [k, el] of alte) {
    if (!gebraucht.has(k)) el.remove();
  }
  // Ein Aufräumer für den String-Stand genügt — er deckt auch Schlüssel,
  // deren Element längst weg ist (z. B. nach einem Leer-Hinweis).
  for (const k of [...stand.keys()]) {
    if (!gebraucht.has(k)) stand.delete(k);
  }
}

/** `querySelectorAll` einschließlich des Scopes SELBST, wenn er passt —
 *  die wire*()-Funktionen laufen seit dem Keyed-Abgleich auch mit einer
 *  einzelnen Zeile/Kachel als Scope, und die matcht z. B. `.row.pick`
 *  selbst statt als Nachfahre. Mit einem Container als Scope verhält
 *  sich das exakt wie vorher. */
function scopeAll(scope, sel) {
  const treffer = Array.from(scope.querySelectorAll(sel));
  if (scope.matches && scope.matches(sel)) treffer.unshift(scope);
  return treffer;
}

function renderCourts() {
  if (!state) return;
  const courts = state.courts.filter((c) => !hallFilter || c.location === hallFilter);
  setPanelCount("courts", courts.length);
  // Seit dem Mehrspalten-Layout ist „Felder" ein gewöhnliches Panel: Ist es
  // ausgeblendet oder zugeklappt, gibt es die Kachelbox gar nicht — den
  // Zähler im Kopf soll sie trotzdem vorher gesetzt haben (er steht auch
  // zugeklappt da).
  const box = $("courts");
  if (!box) return;
  if (!courts.length) {
    setzeHtmlWennNeu(box, `<p class="note">Keine Felder${hallFilter ? " in dieser Halle" : ""}.</p>`);
    // Auch die leere Halle muss `fitCourts()` erreichen — sonst bliebe nach
    // einem Hallenwechsel eine Mini-Kompaktstufe von vorher hängen.
    scheduleFitCourts();
    return;
  }
  // Nach Hallen gruppieren, solange kein Filter gesetzt ist — sonst wäre
  // bei mehreren Hallen nicht erkennbar, wo ein Feld steht.
  let gruppen;
  if (state.multi_hall && !hallFilter) {
    const map = new Map();
    for (const c of courts) {
      const key = c.location || "";
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(c);
    }
    gruppen = [...map.entries()].map(([hall, list]) => ({ hall, list, kopf: true }));
  } else {
    gruppen = [{ hall: hallFilter || "", list: courts, kopf: false }];
  }
  const gruppenKey = (g) => `${g.kopf ? "H:" : "F:"}${g.hall}`;
  // Außenebene: je Gruppe eine Hülle (Überschrift + LEERES Raster). Ihr
  // HTML enthält bewusst keine Kacheln — die Hülle wird nur ersetzt, wenn
  // Hallenname oder Raster-Spaltenzahl wechseln; die Kacheln darin pflegt
  // die Innenebene für sich.
  reconcileKeyed(box, gruppen, gruppenKey, (g) => {
    const layout = findHallLayout(g.hall);
    const style = layout
      ? ` style="grid-template-columns:repeat(${layout.columns}, minmax(0, 1fr))"`
      : "";
    const grid = `<div class="courts"${style}></div>`;
    return g.kopf
      ? `<div class="hall-group"><h3>${g.hall ? hallMarke(g.hall) + esc(g.hall) : "Ohne Halle"}</h3>${grid}</div>`
      : grid;
  }, () => {});
  // Innenebene: die Kacheln jeder Gruppe, je `court_id` abgeglichen — bei
  // einem Punktgewinn wird genau EINE Kachel ersetzt und neu verdrahtet,
  // die übrigen (samt offenem ⋯-Menü und Fokus) bleiben stehen.
  for (const g of gruppen) {
    const huelle = kindMitKey(box, gruppenKey(g));
    if (!huelle) continue;
    const grid = huelle.classList.contains("courts")
      ? huelle
      : huelle.querySelector(".courts");
    if (!grid) continue;
    const layout = findHallLayout(g.hall);
    const pos = layout ? gridPositions(g.list.length, layout) : null;
    reconcileKeyed(
      grid,
      g.list.map((c, i) => ({
        c,
        style: pos ? `grid-column:${pos[i].col + 1};grid-row:${pos[i].row + 1}` : "",
      })),
      (e) => e.c.court_id,
      (e) => courtCard(e.c, e.style),
      (el) => wireCourts(el),
    );
  }
  scheduleFitCourts();
  // Frisch gebaute Kacheln tragen leere Uhrfelder — vor dem nächsten
  // Anstrich füllen, auch wenn dieser Aufruf NICHT aus `render()` kam
  // (pick/assign/Drag rufen renderCourts direkt; Review 17.08.2026).
  scheduleTickClocks();
}

/**
 * Passt die Größe der Feld-Kacheln an den Platz an, den das Panel „Felder"
 * gerade hat — Ziel: IMMER alle Felder auf einen Blick, nie ein
 * abgeschnittenes Feld (Wunsch vom 10.08.2026 nach dem Turniertest: „alle
 * Felder auf einen Blick — die Liste läuft, die Felder nicht"). Läuft
 * gebündelt über `requestAnimationFrame` nach jedem Neuzeichnen der Felder
 * und bei jeder Größenänderung (`scheduleFitCourts`, unten).
 *
 * **Gemessen wird die Felderbox, nicht das Fenster** — deshalb ist es egal,
 * in welcher Spalte „Felder" steht, wie breit sie ist und wie viele Panels
 * über oder unter ihm liegen (Plan tl-liste-vereinfachen F). Der frühere
 * Sonderweg (Inline-Deckel auf einer fixierten `<section>`, eigene
 * Fallunterscheidung „gestapelt/nebeneinander", `--liste-min`-Reserve für
 * die Liste daneben) ist damit ersatzlos entfallen: Wie viel Höhe das Panel
 * bekommt, entscheidet jetzt allein das Flex-Modell seiner Spalte, also die
 * `heightFr`-Verteilung und die Panel-Ränder — dieselbe Regel wie für jedes
 * andere Panel.
 *
 * Stufenweise, aber OHNE Rückkopplung: Vor jedem Durchlauf geht es zurück
 * auf die Ausgangsstufe — sonst bliebe eine einmal gewählte Kompaktstufe
 * hängen, auch wenn inzwischen (Hallenfilter, weniger Felder, mehr Platz)
 * wieder alles ohne sie hineinpasst. Von dort aus je EINE Messung pro Stufe
 * (normal → `kacheln-kompakt` → `kacheln-mini`) — kein Nachjustieren in
 * einer Schleife, kein `ResizeObserver`, der sich durch die eigene
 * Klassenänderung selbst erneut auslösen könnte. Passt selbst die kleinste
 * Stufe nicht (winziges Telefon, sehr viele Felder), rollt der Panel-Körper
 * — das kann er ohnehin (`.panel-body { overflow-y: auto }`), es braucht
 * dafür keine eigene Klasse mehr.
 */
function fitCourts() {
  const panel = document.querySelector('.panel[data-panel="courts"]');
  const box = $("courts");
  // Kein Panel (ausgeblendet), kein Körper (zugeklappt) oder keine
  // Kachelbox: nichts zu messen. Alle drei Fälle nehmen das Panel komplett
  // aus dem Höhenmodell — es bleibt kein Inline-Deckel zurück, den man
  // aufräumen müsste (das Element ist ja weg).
  const koerper = panel && panel.querySelector(".panel-body");
  if (!panel || !koerper || !box) return;
  box.classList.remove("kacheln-kompakt", "kacheln-mini");
  // Bedarfs-Deckel eines früheren Durchlaufs zurücknehmen, bevor gemessen
  // wird — sonst maße man den eigenen Deckel statt des verfügbaren Platzes.
  panel.style.maxHeight = "";
  // +1 Px Toleranz gegen Rundungsfehler bei gebrochenen Pixelwerten.
  const passt = () => koerper.scrollHeight <= koerper.clientHeight + 1;
  // Hat jemand die Höhe dieses Panels von Hand gezogen? Dann bleibt sie
  // exakt stehen — dieselbe Unterscheidung wie früher zwischen Automatik
  // und handgezogener Listenhöhe, nur liegt das Maß jetzt im Profil
  // (`heightFr`) statt in `localStorage`. Ein Doppeltipp auf einen
  // Panel-Rand setzt alle Höhen auf 1 zurück und schaltet damit die
  // Automatik wieder ein.
  const eigenerAnteil = normalizedLayout(resolveActiveProfile())
    .panels.find((p) => p.key === "courts");
  const automatik = !eigenerAnteil || (Number(eigenerAnteil.heightFr) || 1) === 1;
  /**
   * Ungenutzte Höhe zurückgeben: Braucht die Kachelbox weniger, als ihr
   * `heightFr`-Anteil hergibt, deckelt ein Inline-`max-height` das Panel auf
   * den tatsächlichen Bedarf — die überschüssige Höhe verteilt das
   * Flex-Modell von selbst an die übrigen Panels derselben Spalte (Flexbox
   * behandelt eine `max-height`-Verletzung genau so). Ohne das stünde unter
   * den Kacheln ein leerer Block, während die Liste darunter rollt.
   *
   * Gemessen wird die **Kachelbox**, nicht der Scroll-Bereich des Körpers.
   * Der Unterschied entscheidet, ob überhaupt etwas zurückgegeben wird:
   * `scrollHeight` ist nach unten durch `clientHeight` geklammert, und
   * hierher kommt man nur, wenn der Inhalt passt (`passt()`) — dann sind
   * beide gleich, und der Deckel wäre exakt die aktuelle Höhe. Er gäbe also
   * nie etwas ab (Review 18.08.2026: zwei Kacheln in einem 400-px-Stapel
   * behielten 174 px statt 119 px, die Liste bekam nichts).
   *
   * Keine Rückkopplung: Die Kachelbox ordnet sich nach der BREITE, ihre
   * Höhe hängt nicht am Deckel — und beim nächsten Durchlauf fällt er oben
   * ohnehin zuerst wieder weg.
   */
  const uebernehmeBedarf = () => {
    if (!automatik) return;
    const kopf = panel.querySelector(".panel-head");
    panel.style.maxHeight =
      ((kopf ? kopf.offsetHeight : 0) + box.getBoundingClientRect().height) + "px";
  };
  if (passt()) { uebernehmeBedarf(); return; }
  box.classList.add("kacheln-kompakt");
  if (passt()) { uebernehmeBedarf(); return; }
  box.classList.remove("kacheln-kompakt");
  box.classList.add("kacheln-mini");
  if (passt()) { uebernehmeBedarf(); return; }
  // Selbst „mini" passt nicht: Der Panel-Körper rollt (das tut er ohnehin),
  // und der Bedarfs-Deckel bleibt bewusst AUS — er würde auf ein
  // `scrollHeight` kürzen wollen, das hier gerade zu groß ist.
}

// Mehrfach angestoßen (z. B. mehrere Render-Aufrufe im selben Zug, dazu
// `resize`) sammelt sich in EINEM `requestAnimationFrame` statt mehrfach
// hintereinander zu messen — die eigentliche Entlastung gegen Layout-
// Flackern kommt aber schon aus `fitCourts()` selbst (feste Stufenzahl,
// keine Schleife).
let fitScheduled = false;
function scheduleFitCourts() {
  if (fitScheduled) return;
  fitScheduled = true;
  requestAnimationFrame(() => {
    fitScheduled = false;
    fitCourts();
    // Offene ⋯-Menüs nachführen: Ein Kompaktstufen-Wechsel oder eine
    // umsortierte Liste verschiebt Auslöser OHNE Scroll-Ereignis — seit
    // dem Keyed-Abgleich läuft die Platzierung nicht mehr bei jedem
    // Render über die Verdrahtung mit (Review-Fund 17.08.2026).
    folgeOffenenKebabs();
  });
}

// Den früheren Trennsteg (`#steg`, Aufteilung Felder ↔ Spielliste, je
// Gerät in `localStorage`) gibt es nicht mehr. Seine Aufgabe — eine
// Layout-Grenze mit dem Finger verschieben — erledigt seit dem
// Mehrspalten-Layout (Plan tl-liste-vereinfachen F) DERSELBE Mechanismus,
// der schon die Panel-Höhen verteilt: `wireStegs()` weiter unten, einmal
// waagerecht (`.panel-steg`, Höhe zweier Panels einer Spalte) und einmal
// senkrecht (`.col-steg`, Breite zweier Spalten). Zwei halb parallele
// Ziehmechanismen wären genau der Wildwuchs, den dieser Umbau beseitigt.
// Die gezogenen Maße liegen damit auch nicht mehr geräte-lokal, sondern im
// Profil (`heightFr`/`columnWidths`) — das Profil ist laut Spec
// verbindlich, eine `localStorage`-Ebene darüber wäre eine verbotene
// zweite Wahrheit.

/**
 * Eine Zeile der einen Spielliste (ADR 0026). Sie zeigt ohne geöffnetes
 * Kontextmenü höchstens SECHS sichtbare Elemente (Spec tl-web-panelsystem;
 * die Rechnung steht ausführlich im CSS bei `.row .who-block`):
 *
 * PRIMÄR (immer sichtbar): Zieh-Griff (jede noch nicht gerufene Zeile),
 * Spielnummer, Name+Meta (EIN Block, `.who-block`), der Statusblock (EIN
 * Wrapper `.row-status` mit Hallen-Kürzel, Pausen-Eieruhr und den
 * beiden Abzeichen), der Vorbereitungs-Ruf-Knopf (vermutlich die häufigste
 * Einzelaktion an einer Zeile) und das Kebab-Menü selbst.
 *
 * HINTER DEM KEBAB (⋮, seltener gebraucht): „nach oben schieben" und
 * „Ergebnis eintragen", die Auto-Vergabe-Ausnahme (Umschalter, nicht die
 * Anzeige-Badge — die bleibt primär sichtbar), alle drei Nachruf-Knöpfe
 * (braucht man nur, wenn jemand nicht kommt) und der Spielort-Wähler (nur
 * im Mehr-Hallen-Turnier ohne Disziplin-Regel überhaupt vorhanden).
 *
 * `topMatchId` ist die Kennung der ersten UMSORTIERBAREN Zeile der gerade
 * gezeigten Liste — Ziel des Menüpunkts „nach oben schieben".
 */
function queueRow(m, topMatchId) {
  const parts = [];
  // „Spielt gerade" ist ein echtes Hindernis: Der Turnier-PC lehnt eine
  // solche Zuweisung ab (`assign::check_assign`), ein Tipp führte nur zu
  // einer Fehlermeldung. Die Mindestpause ist dagegen eine Empfehlung, die
  // die Turnierleitung übergehen darf — sie ist serverseitig ausdrücklich
  // KEIN Blocker (`check_assign` prüft nur „spielt gerade"). Deshalb bleibt
  // eine pausierende Zeile wählbar; vor dem Schreiben fragt `assignTo()`
  // nach (Feldtest 22.08.2026).
  const pickable = !m.blocked || m.blocked.reason === "pause";
  // Der Zieh-Griff hängt allein daran, dass das Spiel noch NICHT gerufen
  // ist: Der manuelle Präfix wirkt nur innerhalb der nicht gerufenen Spiele
  // (`assign::ready_queue`), ein Zug an einer gerufenen Zeile wäre
  // serverseitig ein stilles No-Op. Blockierte Zeilen sind seit ADR 0026
  // ausdrücklich ziehbar — Spielbereitschaft ist kein Sortierkriterium
  // mehr, und wer vorausplant, muss auch ein noch pausierendes Spiel
  // einsortieren können.
  const sortierbar = !m.prep_call;
  if (sortierbar) {
    // Zieh-Griff: eigenes Element statt der ganzen Zeile als Ziehfläche
    // (siehe CSS-Erklärung bei `.drag-griff` und `enableReorderDrag` im
    // Skript). Fokussierbar mit Pfeiltasten-Fallback (wie beim
    // Schiedsrichter-Griff) — kein reines Dekorationselement mehr.
    parts.push(`<span class="drag-griff" tabindex="0" role="button"
      title="Zum Umsortieren greifen oder mit Pfeiltasten verschieben"
      aria-label="Spiel in der Reihenfolge verschieben — ziehen oder Pfeiltasten">⠿</span>`);
  }
  if (zeigeNummern()) parts.push(`<span class="no num">${m.match_num ?? "–"}</span>`);
  // Nur die Häppchen aufnehmen, die eingeschaltet sind — `filter(Boolean)`
  // entfernt danach sowohl fehlende Werte (BTP liefert keine Runde) als auch
  // ausgeschaltete zugleich, ohne dass ein Trenner „·" ins Leere zeigt.
  const metaHaeppchen = [];
  if (zeigeDisziplinAktiv()) metaHaeppchen.push(klasse(m.discipline, m.class_label));
  if (zeigeGruppeAktiv()) metaHaeppchen.push(m.draw_name);
  if (zeigeRundeAktiv()) metaHaeppchen.push(m.round_name);
  // Bereitschaftslage als Farbe am NAMEN statt als Hinweistext (Nutzer-
  // Befund 17.08.2026: Die Begründungstexte machten die Liste
  // unübersichtlich). Rot = steht gerade auf einem Feld, Orange = noch in
  // der Mindestpause; die Worte dazu stehen im `title` des Namens. Die
  // Zuordnung läuft über `player_keys` (Lizenznummer bzw. normalisierter
  // Name, exakt `assign::player_key`) — ein bloßer Namensvergleich färbte
  // zwei gleichnamige Spieler einer Paarung gemeinsam. Alte Hosts ohne
  // das Feld: Rückfall auf die Namen, das alte (unscharfe) Verhalten.
  const belegt = new Set(
    ((m.blocked
      && (m.blocked.player_keys && m.blocked.player_keys.length
        ? m.blocked.player_keys
        : m.blocked.players)) || []).map((k) => spielerKey(k, "")));
  const pauseBis = m.blocked && m.blocked.reason === "pause"
    ? new Date(m.blocked.until_ms).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })
    : "";
  const lage = (key) => {
    if (!belegt.has(key)) return null;
    return m.blocked.reason === "playing"
      ? { cls: "sp-spielt", titel: "spielt gerade" }
      : { cls: "sp-pause", titel: `pausiert noch bis ${pauseBis}` };
  };
  // Name + Meta als EIN Flex-Kind (vorher zwei) — zählt in der
  // 6-Elemente-Grenze nur einmal.
  parts.push(`<span class="who-block">
      <span class="who">${pairOf(m.team1, m.team2, m.team1_nat, m.team2_nat, m.team1_club, m.team2_club,
        { ids1: m.team1_ids, ids2: m.team2_ids, lage })}</span>
      <span class="draw">${esc(metaHaeppchen.filter(Boolean).join(" · "))}</span>
    </span>`);
  // ── Statusblock: EIN Flex-Kind, beliebig viele Marken darin ──────────
  // Hier landet alles, was früher eine eigene Abschnitts-Überschrift war
  // (ADR 0026): die Halle (früher Gruppen-Überschrift) und die
  // Bereitschaftslage (früher eines von vier Panels). Eingefärbt
  // ausschließlich über das bestehende Drei-Stufen-System — kein vierter
  // Farbtopf. „Spielbereit" bekommt bewusst KEINE Marke: Das ist der
  // Normalfall, und in einer Liste mit hundert Zeilen wäre eine Marke an
  // fast jeder Zeile keine Information mehr.
  const status = [];
  // Ohne Hallenzuordnung steht hier bewusst NICHTS mehr (bis 17.08.2026
  // ein „ohne Halle"-Warn-Badge): Das fehlende Hallen-Kürzel selbst ist
  // die Symbolik — Hinweistexte machten die Liste unübersichtlich.
  if (state.multi_hall && m.hall) {
    status.push(`<span class="hall-kuerzel" title="${esc(m.hall)}${m.hall_source === "auto" ? " — automatisch vorverteilt" : ""}">${hallMarke(m.hall)}${esc(hallenKuerzel(m.hall))}${m.hall_source === "auto" ? "·A" : ""}</span>`);
  }
  if (m.predicted_start_ms && !m.prep_call) {
    // Startzeit-Prognose (Spec spielzeiten-prognose, E8): voraussichtlicher
    // Aufruf, minutengerundet vom Host simuliert. Eine Prognose in der
    // Vergangenheit (Stand seit Minuten unverändert — sie bewegt bewusst
    // nicht die Revision) heißt schlicht „gleich dran". „~" kennzeichnet
    // Werte, hinter denen nur der Startwert steht (E7), nicht Messwerte.
    const gleich = m.predicted_start_ms - serverNow() < 60000;
    const wann = gleich
      ? "gleich"
      : new Date(m.predicted_start_ms)
        .toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
    status.push(`<span class="badge badge-info predicted num"
      title="Voraussichtlicher Aufruf — Prognose aus den bisherigen Spielzeiten${m.predicted_uncertain ? " (noch ohne Messwerte: Startwert aus den Einstellungen)" : ""}">${UHR}${m.predicted_uncertain && !gleich ? "~" : ""}${wann}</span>`);
  }
  if (m.prep_call) {
    // Info-Stufe: gerufen ist eine Zustandsmeldung, kein Handlungsdruck —
    // der entsteht erst, wenn niemand kommt, und dann zählt die Uhr
    // daneben. Marke und Uhr sind zwei Kinder EINES Wrappers und zählen
    // deshalb zusammen als ein Zeilen-Element.
    // Zeittext startet leer, `tickClocks()` füllt ihn — eingebettete
    // Sekundenwerte hebelten den Keyed-Abgleich der Zeilen aus.
    status.push(`<span class="badge badge-info">gerufen</span>`);
    status.push(`<span class="called num" data-since="${m.prep_call.called_at_ms}"></span>`);
  }
  // Wunschfeld (Spec `tl-wunschfeld`): Ohne diese Marke sähe ein wartendes
  // Wunschspiel in der Liste aus wie jedes andere spielbereite — und niemand
  // wüsste, worauf es wartet.
  if (m.wish_court) {
    const feld = (state.courts || []).find((c) => c.court_id === m.wish_court);
    const name = feld ? feld.court : m.wish_court;
    const belegt = feld && feld.match_id;
    status.push(`<span class="badge ${belegt ? "badge-warn" : "badge-info"}"
      title="Die Automatik legt dieses Spiel nur auf ${esc(String(name))}${
        belegt ? " — das Feld ist gerade belegt" : ""}">⌖ ${esc(String(name))}</span>`);
  }
  if (m.blocked && m.blocked.reason === "pause") {
    // Mindestpause: Eieruhr + Rest-Countdown statt Badge und Satz — WER
    // pausiert, sagen die orange gefärbten Namen links daneben. Tickt
    // sekündlich in `tickClocks` (Muster der Gerufen-Uhr).
    status.push(`<span class="wartet num" data-until="${m.blocked.until_ms}"
      title="${esc((m.blocked.players || []).join(" und "))} pausiert noch bis ${pauseBis}">${EIERUHR}<span class="zeit"></span></span>`);
  }
  // „Spielt gerade" bekommt gar keine Statusmarke mehr: Die rot gefärbten
  // Namen tragen die Aussage vollständig (Nutzer-Befund 17.08.2026).
  // Die beiden bestehenden Abzeichen (Auto-Vergabe-Ausnahme, Spec
  // `feldvergabe-ausnahme`; manuell einsortiert, Spec
  // `spielliste-manuelle-reihenfolge`) — seit Schritt 10 über die geteilte
  // Drei-Stufen-Klasse eingefärbt, seit ADR 0026 im selben Wrapper wie der
  // übrige Status.
  if (m.excluded_from_auto_assign) {
    status.push(`<span class="badge badge-warn" title="Von der automatischen Feldvergabe ausgenommen — manuelles Zuweisen geht weiterhin">⏸ Auto-Vergabe aus</span>`);
  }
  if (m.manual) {
    status.push(`<span class="badge badge-info" title="Manuell in die Spielreihenfolge einsortiert">↕️</span>`);
  }
  if (status.length) parts.push(`<span class="row-status">${status.join("")}</span>`);
  // Der Aufruf in die Vorbereitung ist eine eigene Handlung, nicht Teil des
  // Zuweisens — er holt die Spieler an den Meeting Point, bevor ein Feld
  // frei ist. Deshalb ein eigener Knopf statt einer Geste, und bewusst
  // PRIMÄR sichtbar (vermutlich die häufigste Einzelaktion an einer Zeile).
  //
  // Als Sinnbild statt als Satz: In einer Liste mit 120 Zeilen frisst der
  // ausgeschriebene Knopf die halbe Zeile. Ein Umschalter mit zwei Zuständen
  // reicht — gedrückt heißt „ist gerufen". Beschriftung bleibt für
  // Vorlesehilfen und als Tooltip erhalten, damit niemand raten muss.
  const prepTitel = m.prep_call ? "Aufruf zurücknehmen" : "In Vorbereitung rufen";
  parts.push(`<button type="button" class="prep" data-prep="${m.match_id}"
    aria-pressed="${m.prep_call ? "true" : "false"}"
    title="${prepTitel}" aria-label="${prepTitel}">${MEGAFON}</button>`);

  // ── Kebab-Menü: Sekundäres (Spec Schritt 11) ─────────────────────────
  const kebabGroups = [];
  // „Nach oben schieben" (ADR 0026): der tastatur- und touchfreundliche Weg
  // für den häufigsten Zug, ohne über eine womöglich hundert Zeilen lange
  // Liste ziehen zu müssen. Kein neuer Wire-Vertrag nötig — es ist ein
  // gewöhnliches `queue_reorder` vor die erste umsortierbare Zeile.
  // Steht das Spiel schon dort (oder ist es gerufen und damit gar nicht
  // Teil der Reihenfolge), erscheint der Eintrag gar nicht erst: Ein
  // sichtbarer Menüpunkt, der nichts tut, ist schlimmer als keiner —
  // niemand weiß, ob die Aktion misslang oder überflüssig war.
  const kannHoch = sortierbar && topMatchId != null && topMatchId !== m.match_id;
  const zeilenAktionen = [];
  if (kannHoch) {
    zeilenAktionen.push(`<button type="button" data-queue-top="${m.match_id}"
        title="An den Anfang der Spielliste schieben">↑ Nach oben schieben</button>`);
  }
  // „Ergebnis eintragen" für ein Spiel, das nie auf einem Feld stand
  // (Zettel, mündliche Ansage). Öffnet exakt denselben Dialog wie das
  // Aktionsband oben — gemeinsamer Weg über `openQueueResultDialog()`,
  // kein zweiter Aufbau desselben Formulars.
  zeilenAktionen.push(`<button type="button" data-queue-result="${m.match_id}"
      title="Endstand ohne Feld nachtragen">✎ Ergebnis eintragen</button>`);
  // Vorabzettel (Spec schiedsrichterzettel-autodruck): der Bogen zum
  // Mitgeben, bevor das Spiel läuft. Anders als beim Archivzettel der
  // Beendet-Liste gibt es hier KEINE `has_timeline`-Schranke — dass noch
  // nichts aufgezeichnet ist, ist ja gerade der Grund für das leere Blatt.
  zeilenAktionen.push(`<button type="button" data-queue-zettel="${m.match_id}"
      title="Leeren Schiedsrichterzettel drucken">🖨 Zettel (leer)</button>`);
  kebabGroups.push(`<div class="kebab-group">
      <span class="kebab-label">Spiel</span>
      <div class="kebab-actions">${zeilenAktionen.join("")}</div>
    </div>`);
  // Auto-Vergabe-Ausnahme: seltener gebraucht als der Vorbereitungs-Ruf,
  // deshalb hier statt als zweiter Icon-Knopf auf der Zeile.
  const exclTitel = m.excluded_from_auto_assign
    ? "Wieder in die automatische Feldvergabe aufnehmen"
    : "Von der automatischen Feldvergabe ausnehmen";
  kebabGroups.push(`<div class="kebab-group">
      <span class="kebab-label">Automatische Feldvergabe</span>
      <div class="kebab-row">
        <button type="button" class="auto-excl" data-auto-excl="${m.match_id}"
          aria-pressed="${m.excluded_from_auto_assign ? "true" : "false"}"
          title="${exclTitel}">⏸ ${m.excluded_from_auto_assign ? "Wieder aufnehmen" : "Ausnehmen"}</button>
      </div>
    </div>`);
  // Spielort setzen, ohne ein Feld zu belegen. BTP liefert `LocationID` nur,
  // wenn das Turnier die Spalte selbst pflegt, und nimmt Rückschreibungen
  // nicht an (SENDUPDATE mit LocationID: Result=1, Wert verworfen, gemessen
  // 10.08.2026) — ohne diesen Wähler bliebe ein Spiel ohne Disziplin-Regel
  // bis zum Aufruf hallenlos, und der Hallenfilter zeigte es in keiner der
  // beiden Hallen. Nur im Mehr-Hallen-Turnier; nur solange eine Regel es
  // nicht ohnehin festlegt (dann wäre die Wahl folgenlos) — ohnehin die
  // Ausnahme, deshalb im Kebab statt auf der Zeile.
  if (state.multi_hall && m.hall_source !== "rule") {
    // Voller Hallenname statt Kürzel: Im Kebab-Menü ist Platz, den die Zeile
    // selbst nicht mehr hergibt.
    const optionen = ['<option value="" title="kein fester Spielort">–</option>']
      .concat(state.halls.map((h) =>
        `<option value="${esc(h.name)}"${h.name === m.hall ? " selected" : ""}>${esc(h.name)}</option>`));
    // Grenze ehrlich benannt: Der Wähler wirkt in bts-light, Vergabe und
    // Liveticker, aber BTP verwirft den Spielort still (gemessen 10.08.2026).
    kebabGroups.push(`<div class="kebab-group">
        <span class="kebab-label">${hallMarke(m.hall)}Spielort (BTP übernimmt ihn nicht)</span>
        <div class="kebab-row">
          <select class="hallwahl${m.hall_source === "manual" ? " gesetzt" : ""}"
            data-hall-for="${m.match_id}" aria-label="Spielort">${optionen.join("")}</select>
        </div>
      </div>`);
  }
  // Wunschfeld (Spec `tl-wunschfeld`): Die Automatik legt dieses Spiel dann
  // nur auf dieses Feld und hält es dafür frei, sobald das Spiel spielbereit
  // ist. Für Endspiele, die aufs Hauptfeld gehören.
  //
  // Nur wenn der Turnier-PC die Aktion kennt — sonst zeigte die Seite einen
  // Wähler, dessen Wirkung im Nichts verpufft, und die Turnierleitung glaubte,
  // das Endspiel sei gesteuert (dieselbe Versions-Schere wie beim Sperren).
  if (state.can_set_wish_court) {
    // Nur Felder, die zur Halle des Spiels passen — ein Wunsch in die falsche
    // Halle lehnt der Turnier-PC ohnehin ab. Ohne Hallenzuordnung: alle.
    const passend = (state.courts || []).filter(
      (c) => !m.hall || !c.hall || c.hall === m.hall);
    const optionen = ['<option value="" title="kein Wunschfeld">–</option>']
      .concat(passend.map((c) =>
        `<option value="${c.court_id}"${c.court_id === m.wish_court ? " selected" : ""}>`
        + `${esc(c.court)}${c.locked ? " (gesperrt)" : ""}</option>`));
    kebabGroups.push(`<div class="kebab-group">
        <span class="kebab-label">Wunschfeld (die Automatik hält es frei)</span>
        <div class="kebab-row">
          <select class="hallwahl${m.wish_court ? " gesetzt" : ""}"
            data-wish-for="${m.match_id}" aria-label="Wunschfeld">${optionen.join("")}</select>
        </div>
      </div>`);
  }
  // Nachruf, wenn jemand nicht erscheint — seltener gebraucht als der
  // Erst-Ruf, deshalb hier statt auf der Zeile. Getrennt nach Partei, weil
  // in der Regel nur eine fehlt.
  if (m.prep_call) {
    // `data-made` trägt den Stand in die Vorgangskennung: Ein Doppeltipp vor
    // dem nächsten Neuzeichnen zählt als Wiederholung, ein bewusster zweiter
    // Nachruf danach geht durch.
    const stand = m.prep_call.recalls || 0;
    kebabGroups.push(`<div class="kebab-group">
        <span class="kebab-label">Nachruf</span>
        <div class="recall kebab-actions">
          <button type="button" data-recall="${m.match_id}" data-side="both" data-made="${stand}">beide Parteien</button>
          <button type="button" data-recall="${m.match_id}" data-side="team1" data-made="${stand}">${esc(shortSide(m.team1))}</button>
          <button type="button" data-recall="${m.match_id}" data-side="team2" data-made="${stand}">${esc(shortSide(m.team2))}</button>
        </div>
      </div>`);
  }
  const kebabOffen = openKebabMatchId === m.match_id;
  parts.push(`<details class="kebab" data-kebab="${m.match_id}"${kebabOffen ? " open" : ""}>
      <summary aria-label="Weitere Aktionen" title="Weitere Aktionen">⋮</summary>
      <div class="kebab-menu">${kebabGroups.join("")}</div>
    </details>`);

  const selected = picked && picked.match.match_id === m.match_id;
  return `<div class="row${m.blocked ? " blocked" : ""}${pickable ? " pick" : ""}"
               data-match="${m.match_id}" data-id="${m.match_id}"
               ${pickable ? `tabindex="0" role="button" aria-selected="${!!selected}"` : ""}>
            ${parts.join("")}</div>`;
}

/** Welche Zeile ihr Kebab-Menü gerade offen hat — über Neuzeichnen hinweg
 *  gemerkt (der Poll-Takt liegt bei 2s; ohne diesen Merker schlösse sich
 *  das Menü mitten in der Bedienung von selbst, ein natives `<details>`
 *  überlebt kein `innerHTML`-Ersetzen). */
let openKebabMatchId = null;

/** Verdrahtet die Zeilen der Warteliste. */
function wireQueue(box) {
  // Der badhub-Spieler-Link öffnet die Spielerseite in einem neuen Tab —
  // ein Klick darauf darf das Spiel nicht ZUSÄTZLICH auswählen. Anders als
  // beim Megafon-Knopf bleibt `pointerdown` aber unangetastet: Der Name ist
  // die größte Trefffläche der Zeile, ein dort angesetzter ZUG (Maus aufs
  // Feld ziehen) muss weiter funktionieren (Review-Fund 17.08.2026). Endet
  // so ein Zug über dem Namen, folgt noch ein Klick-Ereignis — das darf
  // dann auch nicht navigieren (`suppressNextClick`, Muster `enableDrag`).
  scopeAll(box, "a.sp-name").forEach((a) => {
    a.addEventListener("click", (ev) => {
      ev.stopPropagation();
      if (suppressNextClick) ev.preventDefault();
    });
  });
  scopeAll(box, "button[data-prep]").forEach((btn) => {
    btn.addEventListener("click", (ev) => {
      // Nicht bis zur Zeile durchreichen — sonst wählte der Klick zusätzlich
      // das Spiel aus, und die Auswahl bliebe unbeabsichtigt stehen.
      ev.stopPropagation();
      // Zur KLICK-Zeit aus `state` auflösen, nicht beim Verdrahten
      // einfangen: Seit dem Keyed-Abgleich überleben Listener viele
      // Renders, ein eingefangenes Objekt wäre irgendwann veraltet.
      const match = state.queue.find((m) => String(m.match_id) === btn.dataset.prep);
      if (match) togglePrepCall(match);
    });
    // Auch der Zeigegesten-Start darf hier nicht zum Ziehen führen.
    btn.addEventListener("pointerdown", (ev) => ev.stopPropagation());
  });
  scopeAll(box, ".kebab").forEach((det) => {
    const matchId = Number(det.dataset.kebab);
    // Weder Öffnen/Schließen noch ein Tipp im Menü darf die Zeile
    // zusätzlich auswählen oder einen Zug starten.
    det.addEventListener("click", (ev) => ev.stopPropagation());
    det.addEventListener("pointerdown", (ev) => ev.stopPropagation());
    det.addEventListener("toggle", () => {
      if (det.open) {
        openKebabMatchId = matchId;
        schliesseAndereKebabs(det);
        platziereKebabMenue(det);
      } else if (openKebabMatchId === matchId) {
        openKebabMatchId = null;
      }
    });
    // Über den Redraw gerettetes `<details open>` löst kein `toggle` aus —
    // Platzierung nachholen, wie bei der Feldkachel (`wireCourts`). So folgt
    // das Menü seiner Zeile auch, wenn die Liste sich umsortiert.
    if (det.open) platziereKebabMenue(det);
  });
  // „Nach oben schieben": derselbe Wire-Aufruf wie ein Zug bis ganz nach
  // oben (`queue_reorder` vor die erste umsortierbare Zeile) — kein
  // Sonderweg, damit beide Bedienarten dieselbe Wirkung haben.
  scopeAll(box, "button[data-queue-top]").forEach((btn) => {
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const matchId = Number(btn.dataset.queueTop);
      const before = queueTopMatchId();
      if (before == null || before === matchId) return;
      send(
        `queue-reorder-${matchId}-${before}-${Math.floor(Date.now() / OP_WINDOW_MS)}`,
        { action: "queue_reorder", matchId, beforeMatchId: before },
        "Nach oben geschoben.",
      );
    });
    btn.addEventListener("pointerdown", (ev) => ev.stopPropagation());
  });
  scopeAll(box, "button[data-queue-result]").forEach((btn) => {
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      // Klick-Zeit-Auflösung, siehe `data-prep`.
      const match = state.queue.find((m) => String(m.match_id) === btn.dataset.queueResult);
      if (match) openQueueResultDialog(match);
    });
    btn.addEventListener("pointerdown", (ev) => ev.stopPropagation());
  });
  scopeAll(box, "button[data-queue-zettel]").forEach((btn) => {
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      // Klick-Zeit-Auflösung, siehe `data-prep`.
      const match = state.queue.find((m) => String(m.match_id) === btn.dataset.queueZettel);
      if (!match) return;
      const paarung = `${(match.team1 || []).join(" / ")} – ${(match.team2 || []).join(" / ")}`;
      openZettel([match.match_id], paarung, true);
    });
    btn.addEventListener("pointerdown", (ev) => ev.stopPropagation());
  });
  scopeAll(box, "button[data-auto-excl]").forEach((btn) => {
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      // Klick-Zeit-Auflösung, siehe `data-prep` — sonst schaltete ein
      // veraltetes Objekt die Ausnahme in die falsche Richtung.
      const match = state.queue.find((m) => String(m.match_id) === btn.dataset.autoExcl);
      if (!match) return;
      const matchId = match.match_id;
      const excluded = !match.excluded_from_auto_assign;
      send(
        `auto-excl-${matchId}-${excluded}-${Math.floor(Date.now() / OP_WINDOW_MS)}`,
        { action: "exclude_from_auto_assign", matchId, excluded },
        excluded ? "Von der Auto-Vergabe ausgenommen." : "Wieder in der Auto-Vergabe.",
      );
    });
    btn.addEventListener("pointerdown", (ev) => ev.stopPropagation());
  });
  scopeAll(box, "select[data-hall-for]").forEach((sel) => {
    // Der Wähler darf weder das Spiel auswählen noch einen Zug starten.
    sel.addEventListener("click", (ev) => ev.stopPropagation());
    sel.addEventListener("pointerdown", (ev) => ev.stopPropagation());
    sel.addEventListener("change", (ev) => {
      ev.stopPropagation();
      const matchId = Number(sel.dataset.hallFor);
      const hall = sel.value;
      send(
        `hall-${matchId}-${hall}-${Math.floor(Date.now() / OP_WINDOW_MS)}`,
        { action: "set_hall", matchId, hall },
        hall ? `Spielort: ${hall}.` : "Spielort zurückgenommen.",
      );
    });
  });
  scopeAll(box, "select[data-wish-for]").forEach((sel) => {
    // Wie beim Spielort-Wähler: weder auswählen noch ziehen.
    sel.addEventListener("click", (ev) => ev.stopPropagation());
    sel.addEventListener("pointerdown", (ev) => ev.stopPropagation());
    sel.addEventListener("change", (ev) => {
      ev.stopPropagation();
      const matchId = Number(sel.dataset.wishFor);
      const courtId = sel.value ? Number(sel.value) : null;
      const feld = (state.courts || []).find((c) => c.court_id === courtId);
      send(
        `wish-${matchId}-${courtId || 0}-${Math.floor(Date.now() / OP_WINDOW_MS)}`,
        courtId
          ? { action: "set_wish_court", matchId, courtId }
          : { action: "set_wish_court", matchId },
        courtId
          ? `Wunschfeld: ${feld ? feld.court : courtId}. Die Automatik hält es frei, `
            + `sobald das Spiel dran ist.`
          : "Wunschfeld aufgehoben.",
      );
    });
  });
  scopeAll(box, "button[data-recall]").forEach((btn) => {
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const matchId = Number(btn.dataset.recall);
      const side = btn.dataset.side;
      send(
        `recall-${matchId}-${side}-${btn.dataset.made}`,
        { action: "announce_prep_call", matchId, side },
        "Nachruf ausgelöst.",
      );
    });
    btn.addEventListener("pointerdown", (ev) => ev.stopPropagation());
  });
  scopeAll(box, ".row.pick[data-match]").forEach((el) => {
    const match = state.queue.find((m) => String(m.match_id) === el.dataset.match);
    if (!match) return;
    // Auch hier zur Klick-Zeit auflösen (`enableDrag` unten behält das
    // Wiring-Zeit-Objekt als Zieh-Nutzlast — ändert sich Sichtbares an
    // der Zeile, wird sie ohnehin ersetzt und neu verdrahtet).
    const go = () => {
      if (suppressNextClick) return;
      const frisch = state.queue.find((m) => String(m.match_id) === el.dataset.match);
      if (frisch) pick(frisch, null);
    };
    el.addEventListener("click", go);
    el.addEventListener("keydown", (ev) => {
      // Enter/Leertaste auf einem fokussierten Spieler-Link gehören dem
      // Link (badhub-Seite öffnen) — ohne diese Ausnahme finge die Zeile
      // sie ab und wählte stattdessen das Spiel (Review-Fund 17.08.2026).
      if (ev.target instanceof Element && ev.target.closest("a.sp-name")) return;
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(); }
    });
    enableDrag(el, match, null);
  });
}

// ── Ziehen ────────────────────────────────────────────────────────────
// Bewusst eine dünne Schicht ÜBER dem Antipp-Automaten, kein zweiter Weg:
// Der Griff wählt das Spiel (wie ein Tipp), das Loslassen weist zu (wie der
// zweite Tipp). Bricht der Zug ab — Finger rutscht, Browser-Eigenheit —,
// bleibt das Spiel gewählt und lässt sich durch Antippen eines Felds
// zuweisen. Der Rettungsanker greift damit von selbst, ohne dass jemand
// merken muss, dass etwas schiefging.
//
// Selbst gebaut auf Zeigegesten statt mit einer Bibliothek: Der eingebaute
// Ziehen-Mechanismus der Browser funktioniert auf Touch nicht (HTML5-DnD
// feuert für Finger-Eingaben schlicht keine Ereignisse), und die Seite wird
// ohne Bau-Schritt ins Programm eingebettet.
//
// Auf Android-Chrome-Tablets zog das trotzdem nicht zuverlässig: Die Zeile
// trägt `touch-action: pan-y`, damit sich die Liste normal wischen lässt —
// und genau deshalb beansprucht der Browser jede Wischbewegung sofort als
// Scrollen. Bei Maus/Stift passiert das nicht (kein `touch-action` dafür),
// weshalb der Fehler nur auf Touch-Geräten auffiel.
//
// ERSTER Anlauf war ein Long-Press auf der ganzen Zeile: 300 ms ruhig
// halten „bewaffnet" den Zug, danach eine Klasse mit `touch-action: none`.
// Auf dem echten Android-Tablet klappte das nur in etwa 1 von 10 Versuchen
// („zu schnell will er scrollen und verliert den Touch"). Grund: Chrome
// legt das erlaubte `touch-action` schon beim ALLERERSTEN `touchstart` für
// die GESAMTE Geste fest, nicht neu bei jeder Bewegung — ein natürliches
// Fingerzittern von oft weniger als unseren 10 px reichte, damit der
// Browser die Geste noch WÄHREND der 300-ms-Wartezeit als Scrollen
// einstufte. Ab dann war sie für uns verloren (`pointercancel`), und keine
// später gesetzte Klasse konnte das rückgängig machen — ein Wettrennen, das
// ein Long-Press auf einer scrollbaren Liste strukturell nicht gewinnen
// kann. Frühe `touchmove`-Ereignisse präventiv abzufangen war auch keine
// Lösung: Genau das hätte das Scrollen kaputt gemacht, das der Long-Press
// ja erst ermöglichen sollte.
//
// ZWEITER, jetziger Anlauf: ein eigenes Griff-Element (`.drag-griff`, ⠿) an
// jeder ziehbaren Zeile/Kachel. Die Touch-Geste beginnt GEZIELT auf diesem
// Griff, der STATISCH `touch-action: none` trägt (CSS) — kein Wettrennen
// mehr, weil die Entscheidung schon beim `touchstart` auf dem Griff fällt,
// bevor überhaupt Bewegung stattfindet. Bewaffnet wird deshalb sofort, ohne
// Wartezeit und ohne Bewegungsschwelle (siehe `startTouchDrag`) — ein Tipp
// irgendwo sonst auf der Zeile/Kachel (nicht auf dem Griff) löst dagegen
// GAR KEINE Zug-Logik mehr aus und verhält sich wie vor der gesamten
// Touch-Drag-Arbeit: scrollen und Antippen-dann-Antippen. Ein
// `touchmove`-Listener auf `window` mit `{passive:false}` (`blockScroll`)
// unterdrückt zusätzlich das Scrollen für die Dauer des Zugs, auch wenn der
// Finger den Griff längst verlassen hat — er ist zugleich immun gegen den
// 2-Sekunden-Redraw der Liste, anders als eine Klasse an einem
// Zeilen-Element, die nach einem Neuzeichnen (frischer DOM-Knoten)
// wirkungslos wäre.
const DRAG_THRESHOLD_PX = 8;
/** Nach einem Zug folgt ein Klick-Ereignis, das hier geschluckt wird. */
let suppressNextClick = false;
/** Läuft gerade ein Zug? Solange bleibt das Aktionsband aus (siehe dort). */
let dragging = false;
/** Ein Touch-Zug ist zwischen dem Bewaffnen und seinem `teardown` unterwegs
 *  — knapp vor `dragging=true` gesetzt und exakt bis zum Aufräumen belegt.
 *  Getrennt von `dragging` gehalten, weil ein zweiter Finger (Handballen)
 *  sonst in genau dieser kurzen Lücke einen ZWEITEN Automaten starten
 *  könnte, der das globale `picked` überschreibt. */
let touchDragPending = false;

function enableDrag(el, match, fromCourtId) {
  // Zieh-Griff: eigener, separat verdrahteter Zeigegesten-Start NUR für
  // Touch (siehe Erklärung oben) — für Maus/Stift bleibt die ganze
  // Zeile/Kachel ziehbar wie bisher, der Griff braucht dafür keine eigene
  // Logik und fällt unten einfach mit durch (kein `stopPropagation`, sonst
  // bräche „Griff funktioniert auch für Maus").
  const griff = el.querySelector(".drag-griff");
  griff?.addEventListener("pointerdown", (down) => {
    if (down.pointerType !== "touch") return;
    // Weiterreichen stoppen: Die Zeile/Kachel bekommt diesen Tipp nicht
    // mehr — sonst sähe ihr eigener (Maus-orientierter) Zeigegesten-Start
    // unten denselben Tipp zusätzlich (auch wenn der inzwischen Touch
    // ignoriert, siehe dort — doppelte Absicherung ist hier billiger als
    // ein Doppel-Bewaffnen zu riskieren), UND ein bloßes Antippen des
    // Griffs dürfte über das nachfolgende `click` nicht als Auswahl
    // durchschlagen (siehe `suppressNextClick` unten in `startTouchDrag`).
    down.stopPropagation();
    // Derselbe Nebenläufigkeits-Wächter wie zuvor.
    if (dragging || touchDragPending) return;
    startTouchDrag(el, match, fromCourtId, down);
  });

  el.addEventListener("pointerdown", (down) => {
    // Touch startet AUSSCHLIESSLICH am Griff oben — ein Tipp/Wisch irgendwo
    // sonst auf der Zeile/Kachel bleibt hier komplett unbeteiligt.
    if (down.pointerType === "touch") return;
    // Nur die primäre Maustaste bzw. der Stift dürfen einen Zug starten.
    if (down.button !== 0) return;
    let ghost = null;
    let hovered = null;

    const move = (ev) => {
      const dx = ev.clientX - down.clientX;
      const dy = ev.clientY - down.clientY;
      if (!ghost) {
