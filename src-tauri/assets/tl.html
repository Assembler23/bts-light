                   ${woUnticked.has(w.id + ":" + c.match_id) ? "" : "checked"} />
            ${esc(c.round_name)} — ${esc(c.opponent)} kommt weiter</label>`).join("")}
        <div class="actions">
          <button type="button" class="primary" data-confirm="${esc(w.id)}">Kampflos werten</button>
          <button type="button" data-dismiss="${esc(w.id)}">Verwerfen</button>
        </div>
      </div>`).join("");

  // Abgewählte Spiele merken, damit sie ein Neuaufbau nicht wieder ankreuzt.
  box.querySelectorAll(".wo input[type=checkbox]").forEach((cb) => {
    const key = cb.closest(".wo").dataset.wo + ":" + cb.value;
    cb.addEventListener("change", () => {
      if (cb.checked) woUnticked.delete(key); else woUnticked.add(key);
    });
  });

  box.querySelectorAll("[data-confirm]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const card = btn.closest(".wo");
      const ids = [...card.querySelectorAll("input:checked")].map((i) => Number(i.value));
      if (!ids.length) { toast("Kein Spiel angekreuzt.", true); return; }
      await send(
        `wo-${btn.dataset.confirm}-${ids.join("_")}`,
        { action: "confirm_walkover", proposalId: btn.dataset.confirm, matchIds: ids },
        `${ids.length} Spiel(e) kampflos gewertet.`,
      );
    });
  });
  box.querySelectorAll("[data-dismiss]").forEach((btn) => {
    btn.addEventListener("click", () => send(
      `wo-dismiss-${btn.dataset.dismiss}`,
      { action: "dismiss_walkover", proposalId: btn.dataset.dismiss },
      "Vorschlag verworfen.",
    ));
  });
}

/**
 * Zähltafel-Warteschlange.
 *
 * Sichtbar nur, wenn dieser Turnier-PC Zähltafelbediener verwaltet
 * (`scorekeeper_managed`) — sonst gäbe es hier nichts zu bedienen. Die
 * Aktionen laufen über dieselben Vorgangskennungen wie am Turnier-PC:
 * `key` ist stabil je Eintrag — ein Doppeltipp ist damit dieselbe Kennung
 * und wird als Wiederholung erkannt (kein doppeltes Vorziehen).
 *
 * Nur `#sk-list` wird neu gezeichnet, nicht das umgebende `<details>` samt
 * Formular — sonst würde ein Name, an dem gerade getippt wird, beim
 * nächsten Abruf (alle zwei Sekunden) mitten im Tippen gelöscht.
 */
function renderScorekeepers() {
  const box = $("sk-box");
  box.hidden = !state.scorekeeper_managed;
  if (box.hidden) return;
  const list = state.scorekeepers || [];
  $("sk-count").textContent = list.length ? `(${list.length})` : "";
  $("sk-list").innerHTML = list.map((e, i) => `<li>
      <span class="sk-names">${esc(e.names.join(" / "))}</span>
      <span class="sk-wait num" data-since="${e.enqueued_ms}" title="wartet seit">${e.enqueued_ms ? elapsed(e.enqueued_ms) : ""}</span>
      ${i > 0 ? `<button type="button" data-sk-adv="${esc(e.key)}" title="an den Anfang der Warteschlange">▲</button>` : ""}
      <button type="button" data-sk-del="${esc(e.key)}" title="aus der Warteschlange nehmen">×</button>
    </li>`).join("");
  $("sk-list").querySelectorAll("[data-sk-adv]").forEach((b) =>
    b.addEventListener("click", () =>
      send(`sk-adv-${b.dataset.skAdv}`, { action: "scorekeeper_advance", key: b.dataset.skAdv }, "Vorgezogen.")));
  $("sk-list").querySelectorAll("[data-sk-del]").forEach((b) =>
    b.addEventListener("click", () =>
      send(`sk-del-${b.dataset.skDel}`, { action: "scorekeeper_remove", key: b.dataset.skDel }, "Aus der Warteschlange entfernt.")));
}

/** Manuell einen Zähltafelbediener in die Warteschlange eintragen. */
function addScorekeeper(ev) {
  ev.preventDefault();
  const roh = $("sk-name").value.trim();
  if (!roh) return;
  // Doppel: „A / B" — die Turnierleitung trennt die Namen selbst per
  // Schrägstrich, wie an anderer Stelle auf dieser Seite auch (Paarungen).
  const names = roh.split("/").map((s) => s.trim()).filter(Boolean);
  if (!names.length) return;
  // Zeitfenster statt fester Kennung: Anders als bei Vorziehen/Entfernen
  // gibt es hier keinen `key` — derselbe Name könnte auch bewusst zweimal
  // eingetragen werden (zwei Personen mit gleichem Namen). Ein Doppeltipp
  // innerhalb des Fensters gilt als Wiederholung, danach als neue Absicht.
  send(
    `sk-add-${roh}-${Math.floor(Date.now() / OP_WINDOW_MS)}`,
    { action: "scorekeeper_add", names },
    "Eingetragen.",
  );
  $("sk-name").value = "";
}

function renderAutoToggle() {
  const btn = $("auto-toggle");
  const aa = state.auto_assign || {};
  // Nur anbieten, wo er etwas bewirkt: Ist die automatische Vergabe in den
  // Einstellungen gar nicht eingeschaltet, gäbe es hier nichts anzuhalten.
  if (!aa.configured) { btn.hidden = true; return; }
  btn.hidden = false;
  btn.className = "auto " + (aa.enabled ? "on" : "off");
  btn.textContent = aa.enabled ? "Automatik läuft" : "Automatik pausiert";
  btn.setAttribute("aria-pressed", String(!!aa.enabled));
  btn.title = aa.enabled
    ? "Automatische Feldvergabe anhalten, solange von Hand umsortiert wird"
    : "Automatische Feldvergabe wieder laufen lassen";
}

async function toggleAuto() {
  const on = !(state.auto_assign && state.auto_assign.enabled);
  await send(
    `auto-${on}-${Math.floor(Date.now() / OP_WINDOW_MS)}`,
    { action: "set_auto_assign", enabled: on },
    on ? "Automatische Vergabe läuft wieder." : "Automatische Vergabe ist angehalten.",
  );
}

function render() {
  if (!state) return;
  // Ein gewähltes Spiel, das es so nicht mehr gibt, verschwindet aus der
  // Auswahl. Für die Warteliste heißt das „inzwischen vergeben", für ein
  // Feld „steht dort nicht mehr" — und dieser zweite Fall ist der
  // gefährliche: Ist auf dem Feld längst die nächste Begegnung, träfen
  // „Ergebnis eintragen" und „Feld freigeben" das laufende Spiel.
  if (picked && !pickIsStillValid()) picked = null;
  $("tournament").textContent = state.tournament || "";
  renderConnection();
  renderHalls();
  renderAutoToggle();
  renderActionBar();
  renderCourts();
  renderWalkovers();
  renderScorekeepers();
  renderQueue();
}

/** Nur die Uhren neu setzen — nicht die ganze Seite, sonst flackert sie
    jede Sekunde und man verliert die Scroll-Position. */
function tickClocks() {
  if (!state) return;
  document.querySelectorAll(".clock[data-since]").forEach((el) => {
    const since = Number(el.dataset.since);
    if (!since) return;
    const court = state.courts.find((c) => String(c.court_id) === el.dataset.court);
    const stage = court ? callStage(court, state.call_timer) : 0;
    // Gezielt in das Zeit-Feld schreiben, nicht in „das erste Kind": Seit
    // das Uhr-Sinnbild davorsteht, war das erste Kind der Leerraum vor dem
    // Symbol — die Kachel zeigte zwei Zeiten nebeneinander.
    const zeit = el.querySelector(".zeit");
    if (zeit) zeit.textContent = elapsed(since);
    el.className = `clock num stage${stage}`;
  });
  document.querySelectorAll(".called[data-since]").forEach((el) => {
    const since = Number(el.dataset.since);
    if (since) el.textContent = "gerufen seit " + elapsed(since);
  });
  document.querySelectorAll(".sk-wait[data-since]").forEach((el) => {
    const since = Number(el.dataset.since);
    if (since) el.textContent = elapsed(since);
  });
  // Der Sprung von „gerufen" auf „überfällig" hängt allein an der Uhr — er
  // käme sonst erst, wenn sich am Turnier sonst irgendetwas ändert. In einer
  // ruhigen Phase wäre das ausgerechnet nie.
  state.courts.forEach((c) => {
    const el = document.querySelector(`.card[data-court="${c.court_id}"]`);
    if (!el) return;
    const soll = "zustand-" + courtState(c);
    if (!el.classList.contains(soll)) {
      el.classList.remove("zustand-frei", "zustand-gerufen", "zustand-ueberfaellig",
        "zustand-laeuft", "zustand-beendet");
      el.classList.add(soll);
    }
  });
}

function start() {
  $("action-cancel").addEventListener("click", cancelPick);
  // Beide Knöpfe arbeiten auf `pickedCourt()`: Steht das gewählte Spiel
  // nicht mehr auf dem Feld, passiert nichts — statt das inzwischen dort
  // laufende Spiel zu treffen.
  $("action-free").addEventListener("click", () => {
    const court = pickedCourt();
    if (court) freeCourt(court);
    else pickVanished();
  });
  $("action-result").addEventListener("click", () => {
    const court = pickedCourt();
    if (court) enterResult(court);
    else pickVanished();
  });
  $("auto-toggle").addEventListener("click", toggleAuto);
  // Das Formular steht fest im Markup (siehe `renderScorekeepers`) und
  // wird nie neu gezeichnet — die Verdrahtung gehört deshalb hierher, nicht
  // in eine Render-Funktion, sonst hätte jeder Abruf einen weiteren
  // `submit`-Zuhörer angehängt.
  $("sk-add").addEventListener("submit", addScorekeeper);
  $("toast-close").addEventListener("click", hideToast);
  // Abbrechen per Tastatur — auf dem Desktop der schnellste Weg zurück.
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { cancelPick(); hideToast(); }
  });
  $("opt-nummern").checked = zeigeNummern;
  $("opt-nationen").checked = zeigeNationen;
  $("opt-nummern").addEventListener("change", (ev) =>
    setzeVorliebe("nummern", ev.currentTarget.checked));
  $("opt-nationen").addEventListener("change", (ev) =>
    setzeVorliebe("nationen", ev.currentTarget.checked));

  messeKopf();
  // Die Kopfzeile bricht um, sobald das Fenster schmaler wird — dann stimmt
  // auch die Höhe nicht mehr, an der die Felderspalte klebt.
  window.addEventListener("resize", messeKopf);
  poll();
  setInterval(tickClocks, 1000);
  // Im Hintergrund seltener abrufen: Ein Tablet in der Tasche muss den
  // Turnier-PC nicht alle zwei Sekunden fragen.
  let timer = setInterval(poll, 2000);
  document.addEventListener("visibilitychange", () => {
    clearInterval(timer);
    timer = setInterval(poll, document.hidden ? 10000 : 2000);
    // Beim Aufwecken sofort nachfragen, statt bis zum nächsten Takt einen
    // veralteten Stand zu zeigen.
    if (!document.hidden) poll();
  });
}

// Erst hier loslegen — **nach** allen Deklarationen. Weiter oben griff der
// erste Abruf auf noch nicht angelegte Variablen zu und starb; sichtbar
// wurde nur eine Verzögerung, bis der Takt zwei Sekunden später nachlegte.
if (!token) {
  $("gate").hidden = false;
} else {
  $("app").hidden = false;
  start();
}
</script>
