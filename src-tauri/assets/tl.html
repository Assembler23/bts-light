    const players = offPick.gewaehltePlayers.map((p) => p.id);
    // Verein und Sperrlisten sind zwei Aktionen — der Aktionssatz ist
    // geschlossen (ADR 0011), und beide Angaben werden getrennt gepflegt.
    send(`off-club-${id}-${Math.floor(Date.now() / OP_WINDOW_MS)}`,
      { action: "official_set_club", officialId: id, club: $("off-club").value }, null);
    send(`off-block-${id}-${Math.floor(Date.now() / OP_WINDOW_MS)}`,
      { action: "official_blocklist_set", officialId: id, clubs, players },
      "Gespeichert.");
    $("off-overlay").hidden = true;
    offCtx = null;
  });
}

/** Auswahllisten und Auswahl des offenen Pflege-Dialogs. */
let offPick = { players: [], clubs: [], gewaehltePlayers: [], gewaehlteClubs: [] };

/** Die gewählten Sperren als entfernbare Marken zeichnen. */
function renderOffChips() {
  const chip = (text, zusatz, attr) =>
    `<span class="off-chip">${esc(text)}${
      zusatz ? ` <span class="meta">${esc(zusatz)}</span>` : ""
    }<button type="button" ${attr} aria-label="Sperre entfernen">×</button></span>`;

  $("off-club-chips").innerHTML = offPick.gewaehlteClubs.length
    ? offPick.gewaehlteClubs.map((c) => chip(c, "", `data-del-club="${esc(c)}"`)).join("")
    : '<span class="meta">keine</span>';
  $("off-player-chips").innerHTML = offPick.gewaehltePlayers.length
    ? offPick.gewaehltePlayers.map((p) => chip(p.name, p.club, `data-del-player="${p.id}"`)).join("")
    : '<span class="meta">keine</span>';

  $("off-club-chips").querySelectorAll("[data-del-club]").forEach((b) =>
    b.addEventListener("click", () => {
      offPick.gewaehlteClubs = offPick.gewaehlteClubs.filter((c) => c !== b.dataset.delClub);
      renderOffChips();
    }));
  $("off-player-chips").querySelectorAll("[data-del-player]").forEach((b) =>
    b.addEventListener("click", () => {
      offPick.gewaehltePlayers = offPick.gewaehltePlayers
        .filter((p) => p.id !== Number(b.dataset.delPlayer));
      renderOffChips();
    }));
}

/**
 * Einteilung eines Felds: je Dienst eine Auswahl aus der Rotationsliste.
 *
 * Eine Zuweisung mit Konflikt wird **ausgeführt** — die Turnierleitung
 * entscheidet, die App warnt nur (Spec Nr. 2). Die Warnung selbst kommt mit
 * dem nächsten Zustand an der Kachel an, weil der Turnier-PC sie berechnet.
 */
function openOfficialAssign(courtId, matchId) {
  const c = (state.courts || []).find((x) => x.court_id === courtId);
  const liste = state.officials || [];
  offCtx = null; // kein Detail-Abruf offen
  $("off-title").textContent = c ? `Feld ${c.court}` : "Einteilung";
  // Vorauswahl über die ID, nicht über den Namen: Zwei Schiedsrichter mit
  // gleichem Anzeigenamen sind in einer großen Liste realistisch, und die
  // Auswahl muss die Person treffen.
  const auswahl = (rolle, aktuell) => `
    <label class="off-field">${rolle === "sr" ? "Schiedsrichter" : "Aufschlagrichter"}
      <select data-off-role="${rolle}">
        <option value="">—</option>
        ${liste.map((o) => `<option value="${o.id}" ${
          o.id === aktuell ? "selected" : ""
        }>${esc(o.name)}${o.paused ? " (Pause)" : ""}</option>`).join("")}
      </select>
    </label>`;
  $("off-body").innerHTML = auswahl("sr", c && c.sr_id) + auswahl("ar", c && c.ar_id) +
    `<p class="graph-note">Die Auswahl geht an BTP und erscheint dort im
      nächsten Abgleich; bis dahin zeigt die Kachel noch den Stand aus BTP.</p>`;
  $("off-overlay").hidden = false;
  $("off-body").querySelectorAll("select[data-off-role]").forEach((sel) => {
    sel.addEventListener("change", () => {
      const rolle = sel.dataset.offRole;
      const wert = sel.value;
      const stempel = Math.floor(Date.now() / OP_WINDOW_MS);
      if (!wert) {
        send(`off-clear-${matchId}-${rolle}-${stempel}`,
          { action: "official_clear", courtId, matchId, role: rolle }, "Zuweisung gelöst.");
      } else {
        send(`off-assign-${matchId}-${rolle}-${wert}-${stempel}`,
          { action: "official_assign", courtId, matchId, officialId: Number(wert), role: rolle },
          "Eingeteilt.");
      }
    });
  });
}

$("off-close").addEventListener("click", () => {
  $("off-overlay").hidden = true;
  offCtx = null;
});

// ── Profil-Verwaltung (Overlay, Spec tl-web-panelsystem, ADR 0024) ─────
// Zweite, bewusste Ausnahme von „kein Setup aus dem Web" (ADR 0024) — läuft
// über denselben `TlAction`-Kanal wie Schiedsrichter-Pflege/Feldvergabe-
// Ausnahme, kein eigener Endpunkt, keine Umgehung der Bearer-Token-Auth.
// Alle Nutzereingaben (Profilname) laufen konsequent durch `esc()`, wie an
// jeder anderen Stelle dieser Seite auch — kein `innerHTML` mit rohem
// Nutzertext.
//
// `profilesEditCtx` — `{ kopie, isNew }` im Editor, sonst `null`
// (Listenansicht). Bewusst NICHT vom ambienten Poll-Takt neu gezeichnet
// (anders als die Live-Seite): Ein Redraw mitten im Tippen des Namens
// würde die Eingabe löschen (dasselbe Problem, das `#sk-add` schon lange
// löst, indem sein Formular nie neu gezeichnet wird). Die Überschau-Liste
// aktualisiert sich stattdessen GEZIELT nach jeder eigenen Aktion (Wählen/
// Löschen/Standard setzen/Speichern), nicht bei jedem Fremd-Update.
let profilesEditCtx = null;

// ── Schriftgrößen-Zoom (Feldtest 17.08.2026, Punkt „Schriftgrößen") ────
// PRO GERÄT in localStorage, bewusst NICHT im geteilten Panel-Profil:
// Ein Profil beschreibt, WAS ein Bildschirm zeigt — wie groß die Schrift
// auf genau diesem Tablet sein muss, hängt an dessen Display und
// Betrachtungsabstand. Wirkt auf die Root-Schriftgröße; die Seite ist
// rem-basiert (seit diesem Feature auch die Trefflächen), alles skaliert
// mit, und `fitCourts()` misst echte Größen — die Kompaktstufen der
// Feldkacheln stellen sich von selbst nach.
const ZOOM_STUFEN = [85, 100, 115, 130];
function geraeteZoom() {
  try {
    const wert = Number(localStorage.getItem("tlZoom"));
    return ZOOM_STUFEN.includes(wert) ? wert : 100;
  } catch { return 100; }
}
function wendeGeraeteZoomAn() {
  // Prozentwert statt fester px: komponiert mit der Browser-/System-
  // Schriftgröße des Geräts (Barrierefreiheit) — bei 100 % bleibt der
  // Inline-Stil weg und die CSS-Grundgröße gilt unverändert.
  const zoom = geraeteZoom();
  document.documentElement.style.fontSize = zoom === 100 ? "" : `${zoom}%`;
}
function setzeGeraeteZoom(prozent) {
  if (prozent === geraeteZoom()) return;
  try { localStorage.setItem("tlZoom", String(prozent)); } catch { /* z. B. Privatmodus — Zoom gilt dann nur bis zum Neuladen */ }
  wendeGeraeteZoomAn();
  // Kopf-/Band-Maße hängen an der Schriftgröße — sofort neu messen, nicht
  // erst beim nächsten Poll (Review 17.08.2026).
  messeKopf();
  scheduleFitCourts();
  // Nur die vier Zoom-Knöpfe nachführen — ein Overlay-Neuaufbau risse
  // eine gerade getippte Profilnamen-Eingabe samt Fokus weg
  // (Review-Fund 17.08.2026).
  document.querySelectorAll("#profiles-body [data-zoom]").forEach((b) =>
    b.setAttribute("aria-pressed", String(Number(b.dataset.zoom) === prozent)));
}

function openProfilesOverlay() {
  profilesEditCtx = null;
  $("profiles-overlay").hidden = false;
  renderProfilesOverlay();
}
function closeProfilesOverlay() {
  $("profiles-overlay").hidden = true;
  profilesEditCtx = null;
}

function renderProfilesOverlay() {
  if ($("profiles-overlay").hidden) return;
  if (profilesEditCtx) renderProfileEditor(); else renderProfilesList();
}

function renderProfilesList() {
  $("profiles-title").textContent = "Profile";
  const katalog = (state && state.profiles) || [];
  const aktivId = resolveActiveProfile().id;
  const defaultId = (state && state.default_profile_id) || "";
  const zeilen = katalog.map((p) => {
    const tags = [];
    if (p.id === defaultId) tags.push('<span class="badge badge-info">Standard</span>');
    if (p.id === aktivId) tags.push('<span class="badge badge-info">aktiv auf diesem Gerät</span>');
    return `<div class="prof-row" data-prof="${esc(p.id)}">
        <span class="prof-name">${esc(p.name)}</span>
        <span class="prof-tags">${tags.join("")}</span>
        <span class="prof-actions">
          <button type="button" data-prof-select="${esc(p.id)}"${p.id === aktivId ? " disabled" : ""}>Für dieses Gerät wählen</button>
          <button type="button" data-prof-edit="${esc(p.id)}">Bearbeiten</button>
          <button type="button" data-prof-default="${esc(p.id)}"${p.id === defaultId ? " disabled" : ""}>Als Standard</button>
          <button type="button" class="danger" data-prof-delete="${esc(p.id)}">Löschen</button>
        </span>
      </div>`;
  }).join("");
  const leerHinweis = katalog.length
    ? ""
    : `<p class="prof-empty-hint">Noch kein eigenes Profil angelegt — dieses Gerät zeigt das eingebaute
        Standardprofil (alle Panels sichtbar, heutige Anzeige-Voreinstellungen). Leg unten ein Profil an,
        um Panels ein-/auszublenden, umzusortieren oder die Anzeige anzupassen.</p>`;
  const builtinHinweis = aktivId
    ? ""
    : `<p class="prof-empty-hint">Dieses Gerät zeigt gerade das eingebaute Standardprofil.</p>`;
  $("profiles-body").innerHTML = leerHinweis + builtinHinweis + zeilen + `
    ${katalog.length ? `<div class="prof-row">
        <span class="prof-name">Eingebautes Standardprofil</span>
        <span class="prof-actions">
          <button type="button" id="prof-select-builtin"${aktivId ? "" : " disabled"}>Für dieses Gerät wählen</button>
        </span>
      </div>` : ""}
    <form class="prof-new" id="prof-new-form">
      <input type="text" id="prof-new-name" placeholder="Name des neuen Profils" maxlength="60" required />
      <button type="submit" class="primary">Anlegen</button>
    </form>
    <div class="prof-geraet">
      <span class="prof-geraet-label">Schriftgröße — nur dieses Gerät</span>
      <div class="zoom-reihe" role="group" aria-label="Schriftgröße dieses Geräts">
        ${(() => { const aktiv = geraeteZoom(); return ZOOM_STUFEN.map((s) => `<button type="button" data-zoom="${s}"
            aria-pressed="${s === aktiv}">${s}&nbsp;%</button>`).join(""); })()}
      </div>
      <p class="prof-empty-hint">Gilt nur für dieses Gerät (nicht Teil des Profils) —
        jedes Tablet stellt seine Größe selbst ein.</p>
    </div>`;
  wireProfilesListEvents();
}

function wireProfilesListEvents() {
  $("profiles-body").querySelectorAll("[data-zoom]").forEach((b) =>
    b.addEventListener("click", () => setzeGeraeteZoom(Number(b.dataset.zoom))));
  $("profiles-body").querySelectorAll("[data-prof-select]").forEach((b) =>
    b.addEventListener("click", () => profileSelectAction(b.dataset.profSelect)));
  const builtinBtn = $("prof-select-builtin");
  if (builtinBtn) builtinBtn.addEventListener("click", () => profileSelectAction(""));
  $("profiles-body").querySelectorAll("[data-prof-edit]").forEach((b) =>
    b.addEventListener("click", () => {
      const p = ((state && state.profiles) || []).find((x) => x.id === b.dataset.profEdit);
      if (p) openProfileEditor(p);
    }));
  $("profiles-body").querySelectorAll("[data-prof-default]").forEach((b) =>
    b.addEventListener("click", async () => {
      const id = b.dataset.profDefault;
      const ok = await send(
        `profile-default-${id}-${Date.now()}`,
        { action: "profile_set_default", profileId: id },
        "Als Standard markiert.",
      );
      if (ok) { await poll(); renderProfilesOverlay(); }
    }));
  $("profiles-body").querySelectorAll("[data-prof-delete]").forEach((b) =>
    b.addEventListener("click", async () => {
      const id = b.dataset.profDelete;
      const p = ((state && state.profiles) || []).find((x) => x.id === id);
      const name = p ? p.name : "dieses Profil";
      // Löschen ist nicht rückgängig zu machen (Spec) — deshalb eine
      // ausdrückliche Bestätigung, wie beim Feld-Freigeben mit laufendem
      // Spielstand an anderer Stelle dieser Seite.
      if (!confirm(`„${name}" wirklich löschen? Das lässt sich nicht rückgängig machen. `
        + `Geräte, die es zeigen, fallen beim nächsten Abruf automatisch auf das Standardprofil zurück.`)) {
        return;
      }
      const ok = await send(
        `profile-delete-${id}-${Date.now()}`,
        { action: "profile_delete", profileId: id },
        "Profil gelöscht.",
      );
      if (ok) { await poll(); renderProfilesOverlay(); }
    }));
  $("prof-new-form").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const name = $("prof-new-name").value.trim();
    if (!name) return;
    openProfileEditor(null);
    // Namen direkt übernehmen — die Turnierleitung hat ihn schon
    // eingetippt, ein zweites Mal im Editor wäre unnötig.
    profilesEditCtx.kopie.name = name;
    renderProfilesOverlay();
  });
}

/** Für DIESES Gerät ein Profil wählen (`profileId === ""` = eingebautes
 *  Standardprofil). Kein Geräte-Feld im Payload — das aufrufende Gerät ist
 *  aus der Bearer-Token-Auth bekannt (Sicherheitsgrenze, ADR 0025). */
async function profileSelectAction(id) {
  const ok = await send(
    `profile-select-${id || "default"}-${Date.now()}`,
    { action: "profile_select", profileId: id },
    id ? "Profil für dieses Gerät gewählt." : "Standardprofil für dieses Gerät gewählt.",
  );
  if (!ok) return;
  activeProfileHeaderId = id; // optimistisch — der nächste Poll bestätigt über den Antwortkopf.
  pendingProfile = null;
  pendingBaseUpdatedAtMs = 0;
  await poll();
  renderProfilesOverlay();
  render();
}

/** Editor öffnen — `existing` (aus `state.profiles`) zum Bearbeiten, `null`
 *  für ein neues Profil (Vorlage: eingebautes Standardprofil). Vergibt bei
 *  einem neuen Profil sofort eine eigene, stabile ID (siehe ausführliche
 *  Begründung bei `mutateActiveProfile()` — dieselbe Überlegung gilt auch
 *  hier: Ein zweiter Speichern-Klick nach einem Netzfehler soll dasselbe
 *  Profil aktualisieren, nicht ein zweites anlegen). */
function openProfileEditor(existing) {
  const basis = existing ? cloneProfile(existing) : {
    id: genProfileId(), name: "", updatedAtMs: 0,
    panels: builtInProfile().panels.map((p) => ({ ...p })),
    columns: builtInProfile().columns,
    columnWidths: [],
    display: { ...builtInProfile().display },
  };
  // Die Aufteilung gleich beim Öffnen auflösen: Ein Bestandsprofil
  // (`columns: 0`) soll im Editor nicht „keine Spalte" zeigen, sondern das,
  // was es tatsächlich darstellt (aus `listPosition` abgeleitet).
  const layout = normalizedLayout(basis);
  basis.panels = layout.panels;
  basis.columns = layout.columns;
  basis.columnWidths = layout.widths;
  profilesEditCtx = { kopie: basis, isNew: !existing };
  renderProfilesOverlay();
}

/** Die im Editor sichtbaren Eingaben in die Arbeitskopie übernehmen.
 *  Eigene Funktion, weil der Editor nicht nur beim Speichern, sondern auch
 *  beim Umschalten der Spaltenzahl neu gezeichnet wird — ohne das ginge ein
 *  gerade getippter Name dabei verloren. */
function uebernehmeEditorFelder() {
  const { kopie } = profilesEditCtx;
  kopie.name = $("prof-edit-name").value;
  kopie.display = {
    ...kopie.display,
    showNumbers: $("prof-show-numbers").checked,
    showNations: $("prof-show-nations").checked,
    showClubNames: $("prof-show-club-names").checked,
    showClubLogos: $("prof-show-club-logos").checked,
    showDiscipline: $("prof-show-discipline").checked,
    showRound: $("prof-show-round").checked,
    showGroup: $("prof-show-group").checked,
    showCourtRemaining: $("prof-show-court-remaining").checked,
    unlimitedCourtCalls: $("prof-unlimited-calls").checked,
    // Achse des Panels „Spielzeiten": Auswahlfeld statt Häkchen — es sind
    // vier Werte, kein An/Aus. Ein unbekannter Wert (Profil aus einer
    // neueren Version) fiele beim Lesen ohnehin auf „group" zurück.
    // Rückfall auf den bisherigen Wert, nicht auf die Vorgabe: Fehlte das
    // Feld je (ausgeblendete Option), setzte „group" die gespeicherte Wahl
    // still zurück — dieselbe Haltung wie beim durchgereichten
    // `listPosition` darunter.
    timeStatsAxis: $("prof-time-axis") ? $("prof-time-axis").value : (kopie.display.timeStatsAxis || "group"),
    // `listPosition` steht bewusst NICHT mehr im Editor (Plan
    // tl-liste-vereinfachen F: abgelöst durch die Spaltenzahl), wird aber
    // unverändert weitergereicht — eine ältere App-Version liest daraus
    // weiterhin ihr Zwei-Bereiche-Layout.
  };
}

function renderProfileEditor() {
  const { kopie, isNew } = profilesEditCtx;
  $("profiles-title").textContent = isNew ? "Profil anlegen" : "Profil bearbeiten";
  const spalten = Math.min(Math.max(Math.round(Number(kopie.columns) || 1), 1), MAX_SPALTEN);
  const panelLi = (p) => {
    // Seit dem Mehrspalten-Layout hat JEDES Panel einen Zieh-Griff und eine
    // Spaltenauswahl — „Felder" hatte hier vorher als fixierte
    // Ankerposition beides nicht.
    const wahl = spalten > 1
      ? `<label class="prof-panel-col">Spalte
           <select data-panel-col-key="${esc(p.key)}">
             ${Array.from({ length: spalten }, (_, i) =>
               `<option value="${i + 1}"${p.column === i + 1 ? " selected" : ""}>${i + 1}</option>`).join("")}
           </select>
         </label>`
      : "";
    return `<li data-id="${esc(p.key)}">
        <span class="drag-griff panel-griff" tabindex="0" role="button"
            title="Zum Umsortieren greifen oder mit Pfeiltasten verschieben"
            aria-label="${esc(PANEL_TITLES[p.key])} in der Reihenfolge verschieben — ziehen oder Pfeiltasten">${PANEL_GRIFF}</span>
        <label class="prof-panel-label">
          <input type="checkbox" class="prof-check" data-panel-key="${esc(p.key)}" ${p.visible ? "checked" : ""} />
          <span class="prof-panel-name">${esc(PANEL_TITLES[p.key])}</span>
        </label>
        ${wahl}
      </li>`;
  };
  const d = kopie.display;
  $("profiles-body").innerHTML = `
    <label class="prof-field">Name
      <input type="text" id="prof-edit-name" value="${esc(kopie.name)}" maxlength="60" required />
    </label>
    <fieldset>
      <legend>Spalten</legend>
      <p class="prof-empty-hint">Wie viele Spalten die Seite nebeneinander zeigt. Auf schmalen
        Geräten (Tablet im Hochformat, Telefon) stehen die Spalten immer untereinander.</p>
      ${Array.from({ length: MAX_SPALTEN }, (_, i) =>
        `<label class="radio-row"><input type="radio" name="prof-cols" id="prof-cols-${i + 1}"
           ${spalten === i + 1 ? "checked" : ""} /> ${i + 1}</label>`).join("")}
    </fieldset>
    <ul class="prof-panels" id="prof-panels-list">
      ${kopie.panels.map(panelLi).join("")}
    </ul>
    <fieldset>
      <legend>Anzeige</legend>
      <label class="checkbox-row"><input type="checkbox" id="prof-show-numbers" ${d.showNumbers ? "checked" : ""} /> Spielnummer zeigen</label>
      <label class="checkbox-row"><input type="checkbox" id="prof-show-nations" ${d.showNations ? "checked" : ""} /> Nationen zeigen</label>
      <label class="checkbox-row"><input type="checkbox" id="prof-show-club-names" ${d.showClubNames ? "checked" : ""} /> Vereinsnamen zeigen</label>
      <label class="checkbox-row"><input type="checkbox" id="prof-show-club-logos" ${d.showClubLogos ? "checked" : ""} /> Vereinslogos zeigen</label>
      <label class="checkbox-row"><input type="checkbox" id="prof-show-discipline" ${d.showDiscipline ? "checked" : ""} /> Disziplin/Klasse zeigen</label>
      <label class="checkbox-row"><input type="checkbox" id="prof-show-round" ${d.showRound ? "checked" : ""} /> Runde zeigen</label>
      <label class="checkbox-row"><input type="checkbox" id="prof-show-group" ${d.showGroup ? "checked" : ""} /> Gruppe zeigen</label>
      <label class="checkbox-row"><input type="checkbox" id="prof-show-court-remaining" ${d.showCourtRemaining ? "checked" : ""} /> Restzeit laufender Spiele zeigen</label>
      <label class="checkbox-row"><input type="checkbox" id="prof-unlimited-calls" ${d.unlimitedCourtCalls ? "checked" : ""} /> Aufrufe unbegrenzt (auch über den 3. hinaus und bei laufendem Spiel)</label>
      <label class="checkbox-row" style="gap:8px">
        <span>Spielzeiten gruppieren nach</span>
        <select id="prof-time-axis">${ZEITEN_ACHSEN
          // „Halle" nur bei Mehr-Hallen-Turnieren anbieten (A1.6): Sonst
          // wäre die Auswertung eine einzige Zeile ohne Aussage. Ein Profil,
          // das die Achse bereits trägt (anderes Turnier, andere Halle),
          // behält seine Option — sonst kippte allein das Öffnen des
          // Editors die gespeicherte Wahl still auf „Konkurrenz".
          .filter((a) => a.id !== "hall"
            || (state && state.multi_hall) || d.timeStatsAxis === "hall")
          .map((a) =>
            `<option value="${a.id}"${(d.timeStatsAxis || "group") === a.id ? " selected" : ""}>${esc(a.label)}</option>`
          ).join("")}</select>
      </label>
    </fieldset>
    <div class="dlg-foot">
      <button type="button" id="prof-edit-cancel">Abbrechen</button>
      <button type="button" id="prof-edit-save" class="primary">Speichern</button>
    </div>`;
  wireProfileEditorEvents();
}

function wireProfileEditorEvents() {
  const { kopie } = profilesEditCtx;
  enableReorderDrag($("prof-panels-list"), (id, beforeId) => {
    // Nur das Datenmodell nachziehen — die Reihenfolge im DOM hat der Zug
    // selbst schon hergestellt (`startReorderDrag`), ein Re-Render hier
    // würde den gerade beendeten Zug unnötig noch einmal aufreißen.
    const arr = kopie.panels;
    const from = arr.findIndex((x) => x.key === id);
    if (from === -1) return;
    const [moved] = arr.splice(from, 1);
    const to = beforeId ? arr.findIndex((x) => x.key === beforeId) : -1;
    if (to === -1) arr.push(moved); else arr.splice(to, 0, moved);
  }, ".panel-griff");
  $("prof-panels-list").querySelectorAll("[data-panel-key]").forEach((cb) => {
    cb.addEventListener("change", () => {
      const setting = kopie.panels.find((p) => p.key === cb.dataset.panelKey);
      if (setting) setting.visible = cb.checked;
    });
  });
  // Spaltenzuordnung je Panel — dieselbe Bedienlogik wie die
  // Sichtbarkeits-Häkchen daneben: sofort in die Arbeitskopie, gespeichert
  // wird erst mit „Speichern".
  $("prof-panels-list").querySelectorAll("[data-panel-col-key]").forEach((sel) => {
    sel.addEventListener("change", () => {
      const setting = kopie.panels.find((p) => p.key === sel.dataset.panelColKey);
      if (setting) setting.column = Number(sel.value) || 1;
    });
  });
  for (let i = 1; i <= MAX_SPALTEN; i += 1) {
    $(`prof-cols-${i}`).addEventListener("change", () => {
      // Erst die übrigen Eingaben sichern (der Editor wird gleich neu
      // gezeichnet, damit die Spaltenauswahl je Panel die neue Anzahl
      // anbietet), dann die Aufteilung neu klammern: Ein Panel, dessen
      // Spalte es nicht mehr gibt, rutscht in die letzte statt zu
      // verschwinden (`normalizedLayout`).
      uebernehmeEditorFelder();
      kopie.columns = i;
      const layout = normalizedLayout(kopie);
      kopie.panels = layout.panels;
      kopie.columnWidths = layout.widths;
      renderProfilesOverlay();
    });
  }
  $("prof-edit-cancel").addEventListener("click", () => { profilesEditCtx = null; renderProfilesOverlay(); });
  $("prof-edit-save").addEventListener("click", async () => {
    uebernehmeEditorFelder();
    const name = kopie.name.trim();
    if (!name) { toast("Bitte einen Namen eingeben.", true); return; }
    kopie.name = name;
    kopie.updatedAtMs = Date.now();
    const warEigenesAktivesProfil = kopie.id && kopie.id === resolveActiveProfile().id;
    // Ausgangsstand VOR dem Schreiben festhalten — sonst sähe die
    // Bestätigungsprüfung in `resolveActiveProfile()` einen veralteten
    // Vergleichswert und verwürfe die eigene Fassung sofort wieder.
    const basisStand = ((state && state.profiles) || []).find((p) => p.id === kopie.id);
    const basisMs = (basisStand && basisStand.updatedAtMs) || 0;
    const ok = await send(
      `profile-save-${kopie.id}-${Date.now()}`,
      { action: "profile_save", profile: kopie },
      "Profil gespeichert.",
    );
    if (!ok) return;
    if (warEigenesAktivesProfil) {
      pendingProfile = cloneProfile(kopie);
      pendingBaseUpdatedAtMs = basisMs;
    }
    profilesEditCtx = null;
    await poll();
    renderProfilesOverlay();
    render();
  });
}

$("tablets-reload").addEventListener("click", reloadTablets);
$("profiles-open").addEventListener("click", openProfilesOverlay);
$("profiles-close").addEventListener("click", closeProfilesOverlay);
$("profiles-overlay").addEventListener("click", (ev) => {
  if (ev.target === ev.currentTarget) closeProfilesOverlay();
});

let graphTimer = null;

async function fetchTimeline() {
  if (!graphCtx) return;
  // Kontext festhalten: Kommt die Antwort erst an, nachdem das Overlay
  // gewechselt/geschlossen wurde, darf sie nicht ins falsche Fenster
  // malen (In-Flight-Race, Review-Befund 2026-08-11).
  const ctx = graphCtx;
  const body = $("graph-body");
  try {
    const res = await fetch(`${API}/timeline/${ctx.matchId}`, {
      headers: { Authorization: "Bearer " + token },
      cache: "no-store",
    });
    if (graphCtx !== ctx) return;
    if (res.status === 404) {
      // Nur beim ersten Laden: Ein transientes 404 (z. B. Host-Reconnect
      // am Relay) darf einen bereits gezeichneten Graphen nicht ersetzen.
      if (!body.dataset.geladen) {
        body.innerHTML = `<p class="graph-note">Zu diesem Spiel liegt kein Punktverlauf vor.</p>`;
      }
      return;
    }
    if (!res.ok) throw new Error("HTTP " + res.status);
    const tl = await res.json();
    if (graphCtx !== ctx) return;
    renderTimeline(tl);
  } catch {
    // Nur beim ERSTEN Laden eine Meldung — ein einzelner Fehl-Poll bei
    // offenem Overlay soll den bereits gezeichneten Graphen nicht ersetzen.
    if (graphCtx === ctx && !body.dataset.geladen) {
      body.innerHTML = `<p class="graph-note">Der Punktverlauf ist gerade nicht
        abrufbar — die Version des Turnier-PCs kennt ihn möglicherweise noch
        nicht, oder die Verbindung fehlt.</p>`;
    }
  }
}

function renderTimeline(tl) {
  const body = $("graph-body");
  const sets = tl.sets || [];
  let html = "";
  sets.forEach((s, i) => {
    const f = timelineSetFinal(s);
    const zwischenstand = (s.startA || s.startB)
      ? " · ab Zwischenstand aufgezeichnet" : "";
    html += `<div class="graph-set-cap">Satz ${i + 1} — ${f.a}:${f.b}${zwischenstand}</div>`
      + timelineSetSvg(s);
  });
  if (!sets.length) {
    html = `<p class="graph-note">Noch kein Ballwechsel aufgezeichnet.</p>`;
  }
  if (tl.midGame) {
    html += `<p class="graph-note">Teilverlauf: Die Zähltafel übernahm mit
      eingetipptem Zwischenstand — frühere Ballwechsel liegen nicht vor.</p>`;
  }
  if (tl.retired) {
    html += `<p class="graph-note">Das Spiel endete vorzeitig (Aufgabe/
      Disqualifikation) — der letzte Satz ist bewusst unvollständig.</p>`;
  }
  // Abweichungs-Hinweis (AK-8): Nur gegen ein GEWERTETES Ergebnis aus der
  // Beendet-Liste prüfbar; BTP bleibt die Wahrheit (R2).
  if (graphCtx && Array.isArray(graphCtx.finishedSets) && tl.finished && !tl.retired) {
    const passt = graphCtx.finishedSets.length === sets.length
      && graphCtx.finishedSets.every(([a, b], i) => {
        const f = timelineSetFinal(sets[i]);
        return f.a === a && f.b === b;
      });
    if (!passt) {
      html += `<p class="graph-note abweichung">Der aufgezeichnete Verlauf
        weicht vom gewerteten Ergebnis ab (nachträgliche Korrektur in BTP) —
        es gilt das gewertete Ergebnis.</p>`;
    }
  }
  body.innerHTML = html;
  body.dataset.geladen = "1";
}

function openTimeline(matchId, label, finishedSets) {
  graphCtx = { matchId, finishedSets };
  $("graph-title").textContent = `Punktverlauf — ${label}`;
  const body = $("graph-body");
  delete body.dataset.geladen;
  body.innerHTML = `<p class="graph-note">Punktverlauf wird geladen …</p>`;
  $("graph-overlay").hidden = false;
  fetchTimeline();
  // Laufende Spiele wachsen mit — derselbe 2-s-Takt wie der Zustand.
  // Nur solange das Overlay offen ist; die Payload ist winzig (AK-5).
  if (graphTimer) clearInterval(graphTimer);
  graphTimer = setInterval(fetchTimeline, 2000);
}

/** Schiedsrichterzettel anzeigen (Spec schiedsrichterzettel-druck).
 *
 *  Anders als der Punktverlauf wird NICHT gepollt: Ein Zettel ist ein
 *  Abschluss-Dokument, kein Livebild — und er trägt Sanktionsdaten, die
 *  nicht im 2-Sekunden-Takt über die Leitung sollen.
 *
 *  Der Abruf läuft über denselben Pfad wie am eingebetteten Server
 *  (S-R3), deshalb ist dieser Code in beiden Betriebsarten identisch. */
async function openZettel(matchIds, label, vorab = false) {
  const titel = $("zettel-title");
  const body = $("zettel-body");
  titel.textContent = `Schiedsrichterzettel${vorab ? " (leer)" : ""} — ${label}`;
  body.innerHTML = `<p class="graph-note">Zettel wird erzeugt …</p>`;
  $("zettel-overlay").hidden = false;
  try {
    // `?vorab=1` liefert das leere Blatt eines noch ausstehenden Spiels
    // (Spec schiedsrichterzettel-autodruck). Ohne den Parameter bleibt der
    // Abruf unverändert — ein alter Relay reicht ihn schlicht nicht weiter
    // und antwortet wie bisher.
    const res = await fetch(
      `${API}/scoresheet/${matchIds.join(",")}${vorab ? "?vorab=1" : ""}`,
      {
        headers: { Authorization: "Bearer " + token },
        cache: "no-store",
      },
    );
    if (res.status === 404) {
      body.innerHTML = vorab
        ? `<p class="graph-note">Für dieses Spiel lässt sich kein Blatt erzeugen — ` +
          `steht es noch im aktuellen Turnierstand?</p>`
        : `<p class="graph-note">Zu diesem Spiel liegt keine Aufzeichnung vor — ` +
          `ein Papier-Ergebnis bekommt bewusst keinen Zettel.</p>`;
      return;
    }
    if (!res.ok) {
      body.innerHTML = `<p class="graph-note">Zettel nicht verfügbar (${res.status}).</p>`;
      return;
    }
    const html = await res.text();
    // Das Dokument enthält bewusst kein Skript (ADR 0039); die Sandbox
    // macht das durchsetzbar statt zugesagt. `allow-modals` bleibt nötig,
    // damit print() den Druckdialog öffnen darf.
    const rahmen = document.createElement("iframe");
    rahmen.id = "zettel-frame";
    rahmen.title = "Schiedsrichterzettel";
    rahmen.setAttribute("sandbox", "allow-same-origin allow-modals");
    rahmen.style.cssText = "width:100%;height:70vh;border:1px solid #ccc;background:#fff";
    rahmen.srcdoc = html;
    body.innerHTML = "";
    body.appendChild(rahmen);
  } catch {
    body.innerHTML = `<p class="graph-note">Zettel nicht verfügbar.</p>`;
  }
}

function closeZettel() {
  $("zettel-overlay").hidden = true;
  // Das Dokument nicht im DOM liegen lassen — es trägt Sanktionsdaten.
  $("zettel-body").innerHTML = "";
}

function closeTimeline() {
  $("graph-overlay").hidden = true;
  graphCtx = null;
  if (graphTimer) { clearInterval(graphTimer); graphTimer = null; }
}

/** Spielzeiten-Auswertung (Spec spielzeiten-prognose): Mediane je Klasse ×
 *  Disziplin aus den regulär gemessenen Spielen — Brutto (Feldzuweisung →
 *  Ende), Netto (1. Punkt → Ende) und die Anlaufzeit dazwischen. Reine
 *  Anzeige; das Panel existiert nur, wenn der Host `time_stats` liefert
 *  (`panelAvailable`). */
/**
 * Panel „Spielzeiten" — dieselben Messwerte, vier Schnitte (Spec
 * `tl-sicht-feinschliff`, Punkt 1).
 *
 * Der Host liefert alle vier gemeinsam; gewählt wird hier, weil der
 * Turnier-PC den Zustand seit ADR 0034 einmal ZENTRAL für alle Geräte baut,
 * die Achse aber im Profil je Gerät liegt. Umschalten ist damit ein reiner
 * Client-Vorgang ohne Rückfrage beim Host.
 */
const ZEITEN_ACHSEN = [
  { id: "group", label: "Konkurrenz", spalte: "Klasse" },
  { id: "class", label: "Klasse", spalte: "Klasse" },
  { id: "discipline", label: "Disziplin", spalte: "Disziplin" },
  { id: "hall", label: "Halle", spalte: "Halle" },
];

/** Zeilen der aktiven Achse — mit Rückfall auf „Konkurrenz", wenn die
 *  gewählte Achse gerade nichts hergibt (Hallen-Achse in einem
 *  Ein-Hallen-Turnier: der Host liefert sie leer, A1.6). */
function zeitenAchse(stats) {
  const gewaehlt = aktiveZeitenAchse();
  const listen = {
    group: stats.rows || [],
    class: stats.by_class || [],
    discipline: stats.by_discipline || [],
    hall: stats.by_hall || [],
  };
  if (gewaehlt !== "group" && !listen[gewaehlt].length) {
    return { id: "group", zeilen: listen.group };
  }
  return { id: gewaehlt, zeilen: listen[gewaehlt] || [] };
}

/** Beschriftung einer Zeile je Achse. Der Host schickt nur die Kürzel —
 *  zusammengesetzt wird hier, wie überall auf dieser Seite. */
function zeitenZeilenLabel(achse, r) {
  if (achse === "class") return r.class_label || "ohne Klasse";
  if (achse === "discipline") return disziplin(r.discipline) || "ohne Disziplin";
  if (achse === "hall") return r.hall || "ohne Halle";
  return klasse(r.discipline, r.class_label) || "ohne Klasse";
}

function renderTimes() {
  const stats = state.time_stats;
  const box = $("times-box");
  if (!stats) { setPanelCount("times", 0); return; }
  const { id: achse, zeilen: rows } = zeitenAchse(stats);
  // Fiel die gewählte Achse mangels Daten zurück, wird das GESAGT. Ohne
  // den Hinweis stünde da kommentarlos eine andere Tabelle, und der
  // Turnierleiter schlösse daraus, die Einstellung tue nichts.
  const gewaehlt = aktiveZeitenAchse();
  const rueckfall = achse !== gewaehlt
    ? `<p class="note">Für „${esc((ZEITEN_ACHSEN.find((a) => a.id === gewaehlt) || {}).label || gewaehlt)}" liegen keine Messwerte vor — gezeigt wird „Konkurrenz".</p>`
    : "";
  // Zähler und Vorschau folgen der AKTIVEN Achse (A1.4) — sonst stünde im
  // zugeklappten Kopf eine Zahl, die zur aufgeklappten Tabelle nicht passt.
  setPanelCount("times", rows.length);
  if (!box) return;
  setPanelPreview("times", rows.length
    ? `${rows.length} ${achse === "hall" ? "Halle(n)" : "Gruppe(n)"} gemessen`
    : "noch keine Messwerte");
  const spalte = (ZEITEN_ACHSEN.find((a) => a.id === achse) || ZEITEN_ACHSEN[0]).spalte;
  const fuss = `<p class="meta">${stats.tournament_brutto_mins != null
    ? `Turnier gesamt (Brutto-Median): ${stats.tournament_brutto_mins} min · `
    : ""}Startwert ohne Messwerte: ${stats.default_mins} min — solche Prognosen zeigt die Spielliste als „~hh:mm".</p>`;
  if (!rows.length) {
    setzeHtmlWennNeu(box, `${rueckfall}<p class="note">Noch kein regulär beendetes Spiel gemessen.</p>${fuss}`);
    return;
  }
  const zeilen = rows.map((r) => `<tr>
      <td>${esc(zeitenZeilenLabel(achse, r))}</td>
      <td class="num">${r.count}</td>
      <td class="num">${r.brutto_mins} min</td>
      <td class="num">${r.netto_mins} min</td>
      <td class="num">${r.diff_mins} min</td>
    </tr>`).join("");
  setzeHtmlWennNeu(box, `${rueckfall}<table class="times-table">
      <thead><tr>
        <th>${esc(spalte)}</th>
        <th class="num" title="Anzahl regulär gemessener Spiele">Spiele</th>
        <th class="num" title="Median: Feldzuweisung bis Spielende">Brutto</th>
        <th class="num" title="Median: erster Punkt bis Spielende">Netto</th>
        <th class="num" title="Median: Anlaufzeit von der Feldzuweisung bis zum ersten Punkt">Anlauf</th>
      </tr></thead>
      <tbody>${zeilen}</tbody>
    </table>${fuss}`);
}

/** Panel „Anfangszeiten" (Feldtest 17.08.2026): der heutige
 *  Check-In-Zeitplan — je Klasse Anfangszeit, Anmeldeschluss und der
 *  Stand eingecheckt/gemeldet. Bewusst nur Zähler, nie Namen
 *  (Datensparsamkeit — Namen hat die Desktop-Check-In-Seite).
 *  Durchgelaufene Schlüsse bleiben ausgegraut sichtbar, damit man sieht,
 *  was schon durch ist. Reine Anzeige; das Panel existiert nur, wenn der
 *  Host `checkin_times` liefert (`panelAvailable`). */
/** „Durch" = das Anmeldefenster der Klasse ist zu (geschlossen oder schon
 *  im Spielbetrieb) — EIN Prädikat für Zeilen-Färbung und Vorschau,
 *  nicht zweimal mit gedrehter Polarität (Review 17.08.2026). */
function checkinDurch(z) {
  return z.window_state === "closed" || z.window_state === "live";
}

function renderCheckin() {
  const zeiten = state.checkin_times;
  if (!Array.isArray(zeiten)) return;
  setPanelCount("checkin", zeiten.length);
  const box = $("checkin-box");
  if (!box) return;
  // Gezählt werden KLASSEN, also heißt es auch so — „Anmeldungen" sind im
  // Projekt Spieler-Meldungen (Review 17.08.2026).
  const offen = zeiten.filter((z) => !checkinDurch(z)).length;
  setPanelPreview("checkin", zeiten.length
    ? (offen === 1 ? "1 Anmeldeschluss noch offen"
      : offen ? `${offen} Anmeldeschlüsse noch offen`
      : "alle Anmeldeschlüsse durch")
    : "heute keine Anfangszeiten");
  // Stale-Marke vom Host: badhub seit mehr als fünf Minuten nicht
  // erreicht — der Stand bleibt stehen, wird aber nicht als live verkauft.
  const stale = state.checkin_stale
    ? `<p class="note">⚠ badhub gerade nicht erreichbar — Stand möglicherweise veraltet.</p>`
    : "";
  if (!zeiten.length) {
    setzeHtmlWennNeu(box, `${stale}<p class="note">Heute keine Klassen mit Anfangszeit.</p>`);
    return;
  }
  const zeilen = zeiten.map((z) => {
    const voll = z.entry_count > 0 && z.checked_in_count >= z.entry_count;
    return `<tr${checkinDurch(z) ? ' class="durch"' : ""}>
        <td class="num">${esc(z.starts_hm)}</td>
        <td>${esc(z.name || z.discipline || "")}</td>
        <td class="num">${esc(z.closes_hm)}</td>
        <td class="num${voll ? " voll" : ""}" title="eingecheckt / gemeldet (ohne Abgemeldete)">${Number(z.checked_in_count)}/${Number(z.entry_count)}</td>
      </tr>`;
  }).join("");
  setzeHtmlWennNeu(box, `${stale}<table class="times-table checkin-table">
      <thead><tr>
        <th class="num">Beginn</th>
        <th>Klasse</th>
        <th class="num" title="Anmeldeschluss (ohne eigenen gilt der Beginn)">Schluss</th>
        <th class="num" title="eingecheckt / gemeldet (ohne Abgemeldete)">Stand</th>
      </tr></thead>
      <tbody>${zeilen}</tbody>
    </table>`);
}

// Kein Nachlade-Fenster für die Beendet-Liste — und das ist kein
// Versehen: Der Turnier-PC liefert ohnehin höchstens `FINISHED_LIMIT`
// (30) beendete Spiele (`tablet/tl.rs`), die Liste kann hier also gar
// nicht über den Turniertag wachsen. Ein Fenster wäre toter Code, der
// eine Grenze verspricht, die schon woanders gezogen ist (Review-Fund
// 18.08.2026). Was hier wirklich hilft, ist der Keyed-Abgleich unten:
// Ein neues Ergebnis fügt EINE Zeile ein, statt die Liste neu zu bauen.

/** Eine Zeile der Beendet-Liste. */
function finRow(f) {
  {
    // Sieger zuerst gilt auch für die Satzstände: Sonst läse man bei einem
    // Sieger-2-Spiel "Meier – Müller 15:21 · 18:21" — als hätte der zuerst
    // genannte (der Sieger!) jeden Satz verloren.
    const sets = (f.sets || [])
      .map(([a, b]) => (f.winner === 2 ? `${b}:${a}` : `${a}:${b}`))
      .join(" · ");
    // Info-Stufe (Schritt 10): reine Ergebnis-Kennzeichnung einer bereits
    // abgeschlossenen Partie, kein Handlungsdruck mehr.
    const badge = ERGEBNIS_BADGE[f.result]
      ? `<span class="badge badge-info">${ERGEBNIS_BADGE[f.result]}</span>` : "";
    // Alles Sekundäre einer beendeten Zeile in EINEM Kebab-Menü statt als
    // Knopfreihe: Ergebnis korrigieren, Punktverlauf, Schiedsrichterzettel.
    // Dieselbe Zusammenstellung wie im Kebab der Feldkachel — wer ein
    // laufendes Spiel dort bedient, findet die Beendet-Zeile ohne Umlernen.
    // Punktverlauf UND Zettel stehen unter derselben Schranke: Ohne
    // Aufzeichnung (Papier-Ergebnis) gibt es beides nicht (has_timeline).
    const eintraege = [
      `<button type="button" data-fin-fix="${f.match_id}"
         title="Endstand korrigieren">✎ Ergebnis korrigieren</button>`,
    ];
    if (f.has_timeline) {
      eintraege.push(`<button type="button" data-fin-graph="${f.match_id}"
         title="Punktverlauf anzeigen">📈 Punktverlauf</button>`);
      eintraege.push(`<button type="button" data-fin-zettel="${f.match_id}"
         title="Schiedsrichterzettel drucken">🖨 Zettel</button>`);
    }
    const kebab = `<details class="kebab" data-kebab-fin="${f.match_id}"${
      openKebabFinishedId === f.match_id ? " open" : ""
    }>
        <summary aria-label="Weitere Aktionen" title="Weitere Aktionen">⋮</summary>
        <div class="kebab-menu"><div class="kebab-actions">${eintraege.join("")}</div></div>
      </details>`;
    // Ist-Zeiten (Spec spielzeiten-prognose): Brutto = Feldzuweisung→Ende,
    // Netto = 1. Punkt→Ende. Nur gemessene Spiele tragen sie.
    const zeiten = f.brutto_mins != null
      ? `${f.brutto_mins} min${f.netto_mins != null ? ` (netto ${f.netto_mins})` : ""}`
      : "";
    // Hallen-Kürzel + Farbmarke (Spec hallen-farben): nur wenn der Host
    // die Halle liefert (Mehr-Hallen-Turnier, Spiel lief auf einem Feld).
    const halle = f.hall
      ? `<span class="hall-kuerzel" title="${esc(f.hall)}">${hallMarke(f.hall)}${esc(hallenKuerzel(f.hall))}</span> `
      : "";
    return `<div class="fin-row" data-fin="${f.match_id}">
      <span class="fin-pair">${siegerZuerstHtml(f)}</span>
      <span class="fin-meta">${halle}${esc([klasse(f.discipline, f.class_label), f.round_name, f.court, zeiten].filter(Boolean).join(" · "))}</span>
      <span class="fin-score num">${esc(sets)}${badge}</span>
      ${kebab}
    </div>`;
  }
}

function renderFinished() {
  const list = state.finished || [];
  setPanelCount("finished", list.length);
  const box = $("fin-list");
  if (!box) return; // Panel gerade ausgeblendet oder zugeklappt.
  if (!list.length) {
    setzeHtmlWennNeu(box, `<p class="note">Noch kein Spiel beendet.</p>`);
    return;
  }
  // Je `match_id` abgeglichen: Ein neues Ergebnis fügt EINE Zeile ein,
  // statt die ganze Liste neu zu bauen und neu zu verdrahten.
  reconcileKeyed(box, list, (f) => f.match_id, finRow, (el) => wireFinRow(el));
}

/** Welche Beendet-Zeile ihr Kebab offen hat — eigener Merker neben
 *  `openKebabMatchId`, aus demselben Grund: Ein natives `<details>`
 *  überlebt kein Ersetzen seiner Zeile, und die Liste wird nachgeführt,
 *  während das Menü offen steht. */
let openKebabFinishedId = null;

/** Verdrahtet EINE Zeile der Beendet-Liste (neu/ersetzt). */
function wireFinRow(box) {
  scopeAll(box, ".kebab").forEach((det) => {
    const matchId = Number(det.dataset.kebabFin);
    det.addEventListener("click", (ev) => ev.stopPropagation());
    det.addEventListener("toggle", () => {
      if (det.open) {
        openKebabFinishedId = matchId;
        schliesseAndereKebabs(det);
        platziereKebabMenue(det);
      } else if (openKebabFinishedId === matchId) {
        openKebabFinishedId = null;
      }
    });
    // Über den Redraw gerettetes `<details open>` löst kein `toggle` aus —
    // Platzierung nachholen, wie bei Spielzeile und Feldkachel.
    if (det.open) platziereKebabMenue(det);
  });
  // Jede Aktion schliesst zuerst ihr Menue: Das `.kebab-menu` ist
  // `position: fixed` mit z-index 30, die Overlays liegen auf 70 — ein offen
  // gebliebenes Menue haengt sonst hinter dem Overlay und schwebt nach dem
  // Schliessen ueber fremden Zeilen, wo es Klicks schluckt. Genau dafuer
  // macht es die Feldkachel seit 17.08.2026 ebenso.
  const menueZu = (b) => {
    const det = b.closest("details.kebab");
    if (det) {
      det.open = false;
      openKebabFinishedId = null;
    }
  };
  scopeAll(box, "[data-fin-zettel]").forEach((b) =>
    b.addEventListener("click", () => {
      menueZu(b);
      const f = (state.finished || []).find((x) => String(x.match_id) === b.dataset.finZettel);
      if (!f) return;
      openZettel([f.match_id], siegerZuerstText(f));
    }));
  // Klick-Zeit-Auflösung aus `state.finished` statt der eingefangenen
  // Liste — die Listener überleben seit dem Keyed-Abgleich viele Renders.
  scopeAll(box, "[data-fin-graph]").forEach((b) =>
    b.addEventListener("click", () => {
      menueZu(b);
      const f = (state.finished || []).find((x) => String(x.match_id) === b.dataset.finGraph);
      if (!f) return;
      openTimeline(
        f.match_id,
        `${(f.team1 || []).join(" / ")} vs. ${(f.team2 || []).join(" / ")}`,
        f.sets || [],
      );
    }));
  scopeAll(box, "[data-fin-fix]").forEach((b) =>
    b.addEventListener("click", () => {
      menueZu(b);
      const f = (state.finished || []).find((x) => String(x.match_id) === b.dataset.finFix);
      if (!f) return;
      openResultDialog({
        matchId: f.match_id,
        label: siegerZuerstText(f), // Titel: Sieger zuerst, wie die Zeile.
        sets: f.sets || [],
        bestOf: 3,
        overwrite: true,
        // Spalten-Beschriftung: bewusst ROH in Team1:Team2, nicht die
        // Sieger-Reihenfolge von `label` — sie muss zu den Satzfeldern
        // passen, die ebenfalls roh sind. Sonst wäre die Vertauschungs-
        // Falle nur verschoben, nicht behoben.
        team1: (f.team1 || []).join(" / "),
        team2: (f.team2 || []).join(" / "),
      });
    }));
}

/** Manuell einen Zähltafelbediener in die Warteschlange eintragen. */
async function addScorekeeper(ev) {
  ev.preventDefault();
  const roh = $("sk-name").value.trim();
  if (!roh) return;
  // Doppel: „A / B" — die Turnierleitung trennt die Namen selbst per
  // Schrägstrich, wie an anderer Stelle auf dieser Seite auch (Paarungen).
  const names = roh.split("/").map((s) => s.trim()).filter(Boolean);
  if (!names.length) return;
  // Zeitfenster statt fester Kennung: Anders als bei Vorziehen/Entfernen
  // gibt es hier keinen `key` — derselbe Name könnte auch bewusst zweimal
  // eingetragen werden (zwei Personen mit gleichem Namen). Ein Doppeltipp
  // innerhalb des Fensters gilt als Wiederholung, danach als neue Absicht.
  const ok = await send(
    `sk-add-${roh}-${Math.floor(Date.now() / OP_WINDOW_MS)}`,
    { action: "scorekeeper_add", names },
    "Eingetragen.",
  );
  // Nur bei Erfolg leeren: Schlägt das Eintragen fehl (offline, abgelehnt),
  // bleibt der getippte Name stehen — sonst wäre er nach einem Fehlversuch
  // ohne weiteres Zutun verloren, und die Meldung allein reicht als Hinweis
  // nicht.
  if (ok) $("sk-name").value = "";
}

function renderAutoToggle() {
  const btn = $("auto-toggle");
  const aa = state.auto_assign || {};
  // Nur anbieten, wo er etwas bewirkt: Ist die automatische Vergabe in den
  // Einstellungen gar nicht eingeschaltet, gäbe es hier nichts anzuhalten.
  if (!aa.configured) { btn.hidden = true; return; }
  btn.hidden = false;
  btn.className = "auto " + (aa.enabled ? "on" : "off");
  btn.textContent = aa.enabled ? "Automatik läuft" : "Automatik pausiert";
  btn.setAttribute("aria-pressed", String(!!aa.enabled));
  btn.title = aa.enabled
    ? "Automatische Feldvergabe anhalten, solange von Hand umsortiert wird"
    : "Automatische Feldvergabe wieder laufen lassen";
}

// Fernbefehl „alle Tablets neu laden" (Spec `tablet-version-abgleich`).
//
// Nur zeigen, wenn der Turnier-PC ihn kennt: Der Relay wird bei jedem
// main-Merge deployt, die App erst mit einem Release-Tag — dazwischen spricht
// diese Seite womöglich mit einem älteren Host, der eine unbekannte Aktion
// STILL verwirft. Die Turnierleitung hielte die Tablets für aufgefrischt.
function renderTabletsReload() {
  const btn = $("tablets-reload");
  if (btn) btn.hidden = !state.can_reload_tablets;
}

async function reloadTablets() {
  if (!confirm("Alle Zähltablets ihre Seite neu laden lassen?\n\n"
    + "Das trifft auch Tablets mit laufendem Spiel — deren Bildschirm springt "
    + "kurz. Der Spielstand geht dabei nicht verloren.\n\n"
    + "Nötig ist das selten: Ein Tablet holt sich einen neuen Stand zwischen "
    + "zwei Spielen von selbst.")) {
    return;
  }
  // Zeitstempel statt Zeitfenster in der Vorgangs-Kennung: Ein zweiter,
  // bewusster Druck ist ein zweiter Befehl und darf nicht als Doppeltipp
  // durchfallen — etwa wenn beim ersten Mal ein Tablet offline war.
  await send(
    `reload-tablets-${Date.now()}`,
    { action: "reload_tablets" },
    "Die Tablets laden neu.",
  );
}

async function toggleAuto() {
  const on = !(state.auto_assign && state.auto_assign.enabled);
  await send(
    `auto-${on}-${Math.floor(Date.now() / OP_WINDOW_MS)}`,
    { action: "set_auto_assign", enabled: on },
    on ? "Automatische Vergabe läuft wieder." : "Automatische Vergabe ist angehalten.",
  );
}

// ── Hallen-Vorverteilung (Spec hallen-vorverteilung) ───────────────────
// Zeichnet Schalter + x + Räumen-Knopf im Kopf des Spiele-Panels. Nur bei
// Mehr-Hallen-Turnieren UND wenn der Host das Feature liefert
// (`state.hall_prefill` — Feature-Detection: ein alter Host zeigt so nie
// tote Bedienelemente). Bei gesetzter Tages-Halle (E2) ausgegraut.
function renderHallPrefill() {
  const box = $("prefill-box");
  if (!box) return; // Panel gerade zugeklappt/ausgeblendet
  const hp = state.hall_prefill;
  if (!hp || !state.multi_hall) { box.hidden = true; return; }
  box.hidden = false;
  const toggle = $("prefill-toggle");
  const input = $("prefill-window");
  const clear = $("prefill-clear");
  toggle.textContent = hp.enabled
    ? `Vorverteilung an (${hp.effective_window})`
    : "Vorverteilung aus";
  toggle.setAttribute("aria-pressed", String(!!hp.enabled));
  toggle.title = hp.blocked_by_active_hall
    ? "Die aktive Halle der Feldvergabe ist gesetzt — Vorverteilung und Tages-Halle schließen sich aus."
    : hp.enabled
      ? `Die nächsten ${hp.effective_window} Spiele bekommen automatisch eine Halle im Verhältnis der Felder`
      : "Verteilt die nächsten Spiele automatisch auf die Hallen (Verhältnis der Felder)";
  // Die Tages-Halle blockt nur das EINSCHALTEN (so auch der Host-Guard) —
  // Ausschalten muss immer möglich bleiben, sonst poppte die Verteilung
  // beim Entfernen der Tages-Halle unerwartet wieder an (Review 2026-08-16).
  toggle.disabled = hp.blocked_by_active_hall && !hp.enabled;
  input.disabled = hp.blocked_by_active_hall && !hp.enabled;
  // Den Wert nie unter den Fingern wegschreiben.
  if (document.activeElement !== input) input.value = hp.window || "";
  input.placeholder = `auto (${hp.effective_window})`;
  clear.disabled = false;
}

async function togglePrefill() {
  const hp = state.hall_prefill;
  if (!hp) return;
  const on = !hp.enabled;
  // Runden ist Pflicht: `window` ist auf der Wire-Ebene eine Ganzzahl —
  // ein Dezimalwert (das number-Feld lässt „4.5" zu) ließe die ganze
  // Aktion am Parser abprallen (Review 2026-08-16).
  const raw = Math.round(Number($("prefill-window")?.value));
  const w = Number.isFinite(raw) && raw >= 0 ? Math.min(raw, 120) : hp.window;
  await send(
    `prefill-${on}-${w}-${Math.floor(Date.now() / OP_WINDOW_MS)}`,
    { action: "set_hall_prefill", enabled: on, window: w },
    on ? "Hallen-Vorverteilung läuft." : "Hallen-Vorverteilung ist aus — verteilte Hallen bleiben stehen.",
  );
}

async function sendPrefillWindow() {
  const hp = state.hall_prefill;
  if (!hp) return;
  const raw = Math.round(Number($("prefill-window")?.value));
  const w = Number.isFinite(raw) && raw >= 0 ? Math.min(raw, 120) : 0;
  await send(
    `prefill-x-${w}-${Math.floor(Date.now() / OP_WINDOW_MS)}`,
    { action: "set_hall_prefill", enabled: hp.enabled, window: w },
    "Fenstergröße übernommen.",
  );
}

async function clearAutoHalls() {
  await send(
    `prefill-clear-${Math.floor(Date.now() / OP_WINDOW_MS)}`,
    { action: "clear_auto_halls" },
    "Automatisch verteilte Hallen geräumt — Hand, Regel und Aufruf bleiben.",
  );
}

function render() {
  if (!state) return;
  // Ein gewähltes Spiel, das es so nicht mehr gibt, verschwindet aus der
  // Auswahl. Für die Warteliste heißt das „inzwischen vergeben", für ein
  // Feld „steht dort nicht mehr" — und dieser zweite Fall ist der
  // gefährliche: Ist auf dem Feld längst die nächste Begegnung, träfen
  // „Ergebnis eintragen" und „Feld freigeben" das laufende Spiel.
  // Abschaltbare Messung (Feldtest-Paket „Performance im Blick"): in der
  // Browser-Konsole `localStorage.tlRenderMessen = "1"` setzen, dann
  // protokolliert jeder Render seine Dauer. Bewusst über localStorage
  // statt Config — ein Diagnosewerkzeug, kein Feature.
  const messStart = renderMessen ? performance.now() : 0;
  if (picked && !pickIsStillValid()) picked = null;
  $("tournament").textContent = state.tournament || "";
  renderConnection();
  renderHalls();
  renderAutoToggle();
  renderTabletsReload();
  renderActionBar();
  // Erst das Gerüst (Spalten, Sichtbarkeit/Reihenfolge/Höhe aus dem aktiven
  // Profil), DANACH die einzelnen Panel-Inhalte — die brauchen die frisch
  // gebauten (oder unverändert weiterbestehenden) Container-IDs. Seit dem
  // Mehrspalten-Layout gilt das auch für „Felder": Ohne den Aufbau gäbe es
  // `#courts` gar nicht.
  renderPanels();
  renderCourts();
  renderWalkovers();
  renderScorekeepers();
  renderOfficials();
  renderQueue();
  renderFinished();
  renderTimes();
  renderCheckin();
  // Die Uhrfelder starten seit dem Keyed-Abgleich leer (eingebettete
  // Sekundenwerte machten jedes HTML „anders") — vor dem nächsten
  // Anstrich füllen, nicht erst beim nächsten Sekunden-Tick.
  scheduleTickClocks();
  if (renderMessen) {
    console.log(`[tl] render: ${(performance.now() - messStart).toFixed(1)} ms`);
  }
}

/** Messung eingeschaltet? Einmal beim Laden gelesen (localStorage-Zugriff
 *  in jedem 2-s-Render wäre selbst wieder Arbeit). */
const renderMessen = (() => {
  try { return localStorage.getItem("tlRenderMessen") === "1"; } catch { return false; }
})();

/** Nur die Uhren neu setzen — nicht die ganze Seite, sonst flackert sie
    jede Sekunde und man verliert die Scroll-Position. Läuft sekündlich
    UND direkt nach jedem (Teil-)Render, der Uhrfelder neu baut — der
    Sekundentakt überspringt sich deshalb, wenn gerade getickt wurde
    (Review 17.08.2026: kein Doppellauf direkt nach dem Poll). */
let letzterUhrTick = 0;
/** Uhren-Tick gebündelt über rAF (Muster `scheduleFitCourts`): Felder,
 *  Liste und Render-Ende melden je einmal an, gefüllt wird VOR dem
 *  nächsten Anstrich genau einmal — dokumentweit. */
let uhrTickGeplant = false;
function scheduleTickClocks() {
  if (uhrTickGeplant) return;
  uhrTickGeplant = true;
  requestAnimationFrame(() => {
    uhrTickGeplant = false;
    tickClocks();
    // Und offene ⋯-Menüs nachführen: Umsortierte/entfallene Zeilen
    // verschieben Auslöser ohne Scroll-Ereignis (Review 17.08.2026).
    folgeOffenenKebabs();
  });
}
function tickClocks() {
  if (!state) return;
  letzterUhrTick = performance.now();
  document.querySelectorAll(".clock[data-since]").forEach((el) => {
    const since = Number(el.dataset.since);
    if (!since) return;
    const court = state.courts.find((c) => String(c.court_id) === el.dataset.court);
    const stage = court ? callStage(court, state.call_timer) : 0;
    // Gezielt in das Zeit-Feld schreiben, nicht in „das erste Kind": Seit
    // das Uhr-Sinnbild davorsteht, war das erste Kind der Leerraum vor dem
    // Symbol — die Kachel zeigte zwei Zeiten nebeneinander.
    const zeit = el.querySelector(".zeit");
    if (zeit) zeit.textContent = elapsed(since);
    el.className = `clock num stage${stage}`;
  });
  // Nur die Dauer, ohne das Wort „gerufen": Das steht seit ADR 0026 als
  // Abzeichen direkt davor (`.row-status`), zweimal wäre es Rauschen.
  document.querySelectorAll(".called[data-since]").forEach((el) => {
    const since = Number(el.dataset.since);
    if (since) el.textContent = "seit " + elapsed(since);
  });
  document.querySelectorAll(".sk-wait[data-since]").forEach((el) => {
    const since = Number(el.dataset.since);
    if (since) el.textContent = elapsed(since);
  });
  // Pausen-Eieruhr der Spielliste: der Rest-Countdown tickt sekündlich
  // herunter. Gezielt ins Zeit-Feld schreiben (wie bei der Feld-Uhr) —
  // vor der Zahl steht das Eieruhr-Sinnbild.
  document.querySelectorAll(".wartet[data-until]").forEach((el) => {
    const until = Number(el.dataset.until);
    const zeit = el.querySelector(".zeit");
    if (until && zeit) zeit.textContent = restzeit(until);
  });
  // Pausen-Countdown/Überziehung (Spec spielzeiten-prognose, E9): tickt
  // sekündlich weiter, der Wechsel auf Rot passiert genau bei 0 — nicht
  // erst beim nächsten Poll.
  document.querySelectorAll(".pause-chip[data-pause-ends]").forEach((el) => {
    const ends = Number(el.dataset.pauseEnds);
    if (!ends) return;
    el.textContent = pauseText(ends);
    const over = ends - serverNow() <= 0;
    el.classList.toggle("badge-alarm", over);
    el.classList.toggle("badge-warn", !over);
    if (over) el.title = "Pause überzogen — auf dem Tablet weiterspielen";
  });
  document.querySelectorAll(".pause-chip [data-pause-started]").forEach((el) => {
    const since = Number(el.dataset.pauseStarted);
    if (since) el.textContent = elapsed(since);
  });
  // Der Sprung von „gerufen" auf „überfällig" hängt allein an der Uhr — er
  // käme sonst erst, wenn sich am Turnier sonst irgendetwas ändert. In einer
  // ruhigen Phase wäre das ausgerechnet nie.
  state.courts.forEach((c) => {
    const el = document.querySelector(`.card[data-court="${c.court_id}"]`);
    if (!el) return;
    const soll = "zustand-" + courtState(c);
    if (!el.classList.contains(soll)) {
      el.classList.remove("zustand-frei", "zustand-gerufen", "zustand-ueberfaellig",
        "zustand-laeuft", "zustand-beendet");
      el.classList.add(soll);
    }
  });
}

function start() {
  $("action-cancel").addEventListener("click", cancelPick);
  // Beide Knöpfe arbeiten auf `pickedCourt()`: Steht das gewählte Spiel
  // nicht mehr auf dem Feld, passiert nichts — statt das inzwischen dort
  // laufende Spiel zu treffen.
  $("action-free").addEventListener("click", () => {
    const court = pickedCourt();
    if (court) freeCourt(court);
    else pickVanished();
  });
  $("action-result").addEventListener("click", () => {
    if (!picked) return;
    if (picked.fromCourtId) {
      const court = pickedCourt();
      if (!court) { pickVanished(); return; }
      const t1 = (court.team1 || []).join(" / "), t2 = (court.team2 || []).join(" / ");
      openResultDialog({
        matchId: court.match_id,
        label: `${court.court}: ${t1} vs. ${t2}`,
        sets: court.sets || [],
        bestOf: court.best_of,
        overwrite: false,
        team1: t1, team2: t2,
      });
      return;
    }
    // Spielliste: kein Feld, also auch keine „steht dort nicht mehr"-Prüfung
    // über pickedCourt() — hier zählt nur, ob das Spiel noch ansteht.
    // Derselbe Weg wie der Menüpunkt „Ergebnis eintragen" an der Zeile.
    if (!pickIsStillValid()) { pickVanished(); return; }
    openQueueResultDialog(picked.match);
  });
  // Das Dialog-Formular steht fest im Markup und wird nie neu gezeichnet
  // (siehe die Anmerkung über dem `<dialog>`) — die Verdrahtung gehört
  // deshalb hierher, wie beim Zähltafel-Formular auch.
  $("res-add-set").addEventListener("click", () => {
    const n = $("res-sets").children.length;
    if (n < (resCtx.bestOf || 3)) $("res-sets").insertAdjacentHTML("beforeend", resSetRow(n));
  });
  $("res-cancel").addEventListener("click", () => $("res-dlg").close());
  $("res-form").addEventListener("submit", (ev) => {
    // `method="dialog"` würde sonst sofort schließen, noch bevor der
    // Turnier-PC geantwortet hat — und ein Fehler hätte keinen Dialog mehr,
    // in dem er erscheinen könnte.
    ev.preventDefault();
    if (!resBusy) sendResult();
  });
  $("auto-toggle").addEventListener("click", toggleAuto);
  // `#queue-reset` und `#sk-add` stehen NICHT mehr fest im Markup (Spec
  // tl-web-panelsystem: Panel-Inhalte werden dynamisch aus dem aktiven
  // Profil gebaut) — beide existieren beim Start der Seite noch gar
  // nicht. Ihre Verdrahtung passiert deshalb einmalig direkt in
  // `renderPanels()`, wenn das jeweilige Panel-Gerüst gebaut wird,
  // nicht hier.
  $("toast-close").addEventListener("click", hideToast);
  // Punktverlauf-Overlay: schließen per ×, Klick auf den Hintergrund
  // oder Escape (unten mit den übrigen Escape-Wegen).
  $("graph-close").addEventListener("click", closeTimeline);
  $("zettel-close").addEventListener("click", closeZettel);
  $("zettel-print").addEventListener("click", () => {
    const rahmen = $("zettel-frame");
    if (!rahmen) return;
    rahmen.contentWindow.focus();
    rahmen.contentWindow.print();
  });
  $("zettel-overlay").addEventListener("click", (ev) => {
    if (ev.target === $("zettel-overlay")) closeZettel();
  });
  $("graph-overlay").addEventListener("click", (ev) => {
    if (ev.target === ev.currentTarget) closeTimeline();
  });
  // Abbrechen per Tastatur — auf dem Desktop der schnellste Weg zurück.
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { cancelPick(); hideToast(); closeTimeline(); closeZettel(); closeProfilesOverlay(); }
  });
  // Anzeige-Einstellungen (Spielnummer/Nationen/Vereine/Disziplin/Runde/
  // Gruppe) sind seit dem Panel-System Teil des aktiven Profils
  // (`activeDisplay()`) statt loser `localStorage`-Häkchen —
  // `queueRow()`/`pairOf()` lesen sie direkt aus dem Profil. Auch die
  // Aufteilung der Fläche (Spalten, Breiten, Höhen) kommt seit dem
  // Mehrspalten-Layout ausschließlich von dort, verdrahtet in
  // `renderPanels()`/`wireStegs()`. Nichts hier zu verdrahten; die
  // Profil-Verwaltung selbst (Öffnen/Schließen/Editor) ist weiter oben
  // bereits verdrahtet.

  // Geräte-Zoom VOR der Kopf-Messung und dem ersten Render anwenden —
  // `messeKopf()` misst schriftgrößen-abhängige Maße, und die Schrift
  // soll nicht nach dem ersten Poll sichtbar umspringen.
  wendeGeraeteZoomAn();
  messeKopf();
  scheduleFitCourts();
  // Die Kopfzeile bricht um, sobald das Fenster schmaler wird — dann stimmt
  // auch das Polster nicht mehr, das das Aktionsband oben braucht. Dieselbe
  // Größenänderung kann außerdem die Kompaktstufe der Felder betreffen
  // (mehr/weniger Platz, oder ein Wechsel über die 1100-px-Schwelle) —
  // deshalb hier derselbe Anlass für beides. `orientationchange` zusätzlich,
  // weil manche Tablets beim Drehen kein `resize` feuern, bevor die neue
  // Höhe steht.
  window.addEventListener("resize", messeKopf);
  window.addEventListener("resize", scheduleFitCourts);
  window.addEventListener("orientationchange", scheduleFitCourts);
  poll();
  setInterval(() => {
    if (performance.now() - letzterUhrTick < 900) return;
    tickClocks();
  }, 1000);
  // Push-Kanal aufbauen (Spec tl-web-push) und den Intervall-Poll auf den
  // passenden Takt stellen: 2 s ohne Kanal (wie bisher), 30 s mit Kanal,
  // 10 s im Hintergrund. Gibt es den Kanal nicht, bleibt es beim
  // bisherigen Verhalten — kein Unterschied gegen einen älteren
  // Turnier-PC oder Relay.
  verbindePush();
  setzePollTakt();
  document.addEventListener("visibilitychange", () => {
    setzePollTakt();
    if (!document.hidden) {
      // Beim Aufwecken sofort nachfragen, statt bis zum nächsten Takt
      // einen veralteten Stand zu zeigen — und den Kanal wieder
      // aufbauen, falls der Browser ihn im Hintergrund geschlossen hat.
      poll();
      verbindePush();
    }
  });
}

// Erst hier loslegen — **nach** allen Deklarationen. Weiter oben griff der
// erste Abruf auf noch nicht angelegte Variablen zu und starb; sichtbar
// wurde nur eine Verzögerung, bis der Takt zwei Sekunden später nachlegte.
if (!token) {
  $("gate").hidden = false;
} else {
  $("app").hidden = false;
  start();
}
</script>
</body>
</html>
