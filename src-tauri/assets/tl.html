<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Turnierleitung</title>
<style>
/* ── Grundlagen ────────────────────────────────────────────────────────
   Bewusst HELL, anders als die TV-Anzeigen (monitor/overview): Das hier
   ist ein Arbeitswerkzeug, das stundenlang auf Tablets offen liegt. Ein
   dunkles Design zwingt zu hoher Display-Helligkeit und leert die Akkus —
   genau der Turnier-Befund aus der Roadmap. Farben und Abstände folgen der
   Desktop-Oberfläche (slate-Töne), damit beide wie ein Werkzeug wirken. */
:root {
  --bg: #f1f5f9;
  --card: #ffffff;
  --line: #e2e8f0;
  --ink: #0f172a;
  --ink-soft: #475569;
  --ink-faint: #94a3b8;
  --accent: #1d4ed8;
  --ok: #16a34a;
  --warn: #d97706;
  --alarm: #dc2626;
  --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 1px 3px rgba(15, 23, 42, .1);
  /* Mindesthöhe EINES Panels innerhalb seiner Spalte (Spec
     tl-web-panelsystem) — verhindert, dass ein Panel-Rand (`.panel-steg`)
     ein Panel auf 0/negative Höhe zieht: genug für Kopfzeile plus eine
     Zeile Inhalt. Einziger Ort, an dem diese Zahl steht — `wireStegs()`
     im Skript liest den aufgelösten Pixelwert über `getComputedStyle`
     zurück, statt sie ein zweites Mal im Skript zu duplizieren. */
  --panel-min: 4.5rem;
  /* Dasselbe für die BREITE einer Spalte (Plan tl-liste-vereinfachen F) —
     die Untergrenze, gegen die der Spalten-Steg (`.col-steg`) klammert.
     Bewusst kleiner als die früheren 320px der festen Listen-Spalte: Drei
     Spalten müssen bei 1100px Fensterbreite (dem Breakpoint, ab dem
     überhaupt nebeneinander gestapelt wird) noch nebeneinander passen —
     3 × 16rem + 2 Stege + Polster bleibt darunter. Gelesen wird der
     aufgelöste Pixelwert wie bei `--panel-min`. */
  --spalte-min: 16rem;
  /* Mindest-Trefffläche interaktiver Ziele: skaliert mit dem Geräte-Zoom,
     unterschreitet aber NIE die zugesicherten 40/44px (Touch-Ergonomie,
     Akzeptanzkriterium tl-web-panelsystem) — auch nicht auf der
     85-%-Stufe. Einziger Ort dieser Zahlen, die Aufrufstellen nutzen
     var() (Review 17.08.2026). */
  --touch-min: max(2.5rem, 40px);
  --touch-komf: max(2.75rem, 44px);
}
* { box-sizing: border-box; }
html {
  /* 100 % statt fester 16px: komponiert mit der Browser-/System-
     Schriftgröße des Geräts (Barrierefreiheit) — der Geräte-Zoom legt
     zusätzlich einen Prozentwert als Inline-Stil auf dieses Element
     (`wendeGeraeteZoomAn`, Review-Fund 17.08.2026). */
  font-size: 100%;
}
html, body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.4;
  -webkit-text-size-adjust: 100%;
}
/* `1rem` statt fester px: ERBENDER Text — allen voran die Spielernamen,
   der Kern des Schriftgrößen-Wunsches — muss den Geräte-Zoom mitmachen.
   Eine feste px-Angabe hier nagelte ihn auf die Grundgröße fest
   (Review-Fund 17.08.2026). */
body { font-size: 1rem; }
/* Zahlen, die sich im Sekundentakt ändern, dürfen nicht zappeln. */
.num { font-variant-numeric: tabular-nums; }

/* ── Fester Rahmen ─────────────────────────────────────────────────────
   Wunsch vom 10.08.2026 nach dem Turniertest: „alle Spielfeldkacheln immer
   sichtbar, nur die Spielliste läuft". Dafür rollt die Seite selbst nicht
   mehr — `#app` spannt sich über die ganze sichtbare Höhe und reicht den
   Rest unter Kopf/Störungsband an `main` weiter, das intern in zwei
   eigenständig rollende Bereiche aufteilt (siehe dort). `100dvh` zieht auf
   Mobilgeräten die ein-/ausblendende Adressleiste ab; wo nicht unterstützt,
   bleibt die vorher deklarierte `100vh` gültig (Kaskade, keine Prüfung
   nötig). */
#app {
  display: flex; flex-direction: column;
  height: 100vh; height: 100dvh;
  overflow: hidden;
}
/* Kaskaden-Falle: Ein eigener `display`-Wert schlägt IMMER die
   UA-Regel `[hidden] { display: none; }` — ohne diese Zeile bliebe der
   leere App-Rahmen neben der Sperrseite (`#gate`) sichtbar, sobald
   `$("app").hidden` gesetzt wird (Zugang fehlt, `showGate()` bei 401/429).
   Das `hidden`-Attribut muss also ausdrücklich zurückgewinnen. */
#app[hidden] { display: none; }

/* ── Kopfzeile ─────────────────────────────────────────────────────────
   Kein `position: sticky` mehr nötig: Seit dem festen Rahmen oben rollt die
   Seite nicht mehr selbst, die Kopfzeile steht als erstes Flex-Kind von
   `#app` ohnehin immer oben. */
header {
  flex: none;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--card);
  border-bottom: 1px solid var(--line);
}
.brand { font-weight: 750; letter-spacing: -.01em; }
.tournament {
  color: var(--ink-soft); font-size: .95rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1 1 8rem; min-width: 0;
}
/* Verbindungszustand: Punkt + Text. Drei Stufen, nicht zwei — „läuft",
   „hängt hinterher" und „ist weg" sind für die Turnierleitung drei
   verschiedene Lagen. */
.conn { display: flex; align-items: center; gap: 7px; font-size: .9rem; font-weight: 600; }
.conn .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); }
.conn.delayed { color: var(--warn); } .conn.delayed .dot { background: var(--warn); }
.conn.offline { color: var(--alarm); } .conn.offline .dot { background: var(--alarm); }

/* Hallenfilter: Schaltflächen statt Auswahlliste — im Stehen mit dem
   Daumen zu treffen, und man sieht alle Hallen auf einen Blick. */
.halls { display: flex; gap: 6px; flex-wrap: wrap; }
.halls button {
  font: inherit; font-size: .9rem; font-weight: 600;
  padding: 7px 13px; min-height: var(--touch-min);
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--card); color: var(--ink-soft); cursor: pointer;
}
.halls button[aria-pressed="true"] {
  background: var(--ink); color: #fff; border-color: var(--ink);
}
.halls button:focus-visible, .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Profile (Spec tl-web-panelsystem): ersetzt das frühere Anzeige-Klappmenü
   (neun lose `localStorage`-Häkchen) durch einen Knopf, der die
   Profil-Verwaltung öffnet (`#profiles-overlay`, Muster `.graph-overlay`
   wie Punktverlauf/Schiedsrichter-Pflege). Optik wie der bisherige
   `.anzeige summary`-Knopf, damit die Kopfzeile nicht unruhig wird. */
.profiles-btn {
  font: inherit; font-size: .85rem; font-weight: 650; cursor: pointer;
  padding: 7px 12px; min-height: var(--touch-min); display: flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--card); color: var(--ink-soft);
}
.profiles-btn:hover, .profiles-btn:focus-visible { border-color: var(--accent); color: var(--accent); }

/* Schalter für die automatische Vergabe. Sein Zustand muss auf einen Blick
   erkennbar sein: Läuft sie mit, während jemand von Hand umsortiert, räumt
   sie ihm die Felder um, und niemand versteht, warum. */
.auto {
  font: inherit; font-size: .85rem; font-weight: 650;
  padding: 7px 13px; min-height: var(--touch-min);
  border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
  display: flex; align-items: center; gap: 7px;
}
.auto::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint);
}
.auto.on { border-color: #bbf7d0; background: #f0fdf4; color: #166534; }
.auto.on::before { background: var(--ok); }
.auto.off { border-color: #fed7aa; background: #fffbeb; color: #9a3412; }
.auto.off::before { background: var(--warn); }

/* Störungsband: nimmt die volle Breite, damit es niemand übersieht. */
.banner {
  display: none; flex: none; padding: 10px 16px; font-weight: 650;
  background: #fef2f2; color: #7f1d1d; border-bottom: 1px solid #fecaca;
}
.banner.show { display: block; }

/* ── Hauptbereich: 1 bis 3 Spalten voller Panels ──────────────────────
   `main` nimmt den kompletten Rest der Höhe unter Kopf/Störungsband
   (`flex: 1 1 auto`) und rollt selbst nicht — das tun die Panel-Körper je
   für sich. `padding-top` bekommt den Überstand des Aktionsbands dazu
   (`--band`, von `messeKopf()` gesetzt): Das Band liegt FEST über der
   Kopfzeile — ist es breiter als der Kopf (viele Hallen, Umbruch),
   verdeckte es sonst die oberste Feldreihe.

   Seit dem Mehrspalten-Layout (Plan tl-liste-vereinfachen F) ist `main`
   kein fester Zweiklang „Felder | Liste" mehr, sondern der Behälter für
   ein bis drei gleichrangige Spalten, die `renderPanels()` aus dem aktiven
   Profil baut. „Felder" ist damit ein Panel wie jedes andere und kann in
   jeder Spalte stehen. Kein `gap`: Den Abstand zwischen zwei Spalten
   stellt der Spalten-Steg (`.col-steg`, 16px) — dieselbe Optik wie vorher,
   und die Lücke ist zugleich die Greiffläche zum Ziehen. */
main {
  flex: 1 1 auto; min-height: 0;
  padding: calc(16px + var(--band, 0px)) 16px 16px;
  display: flex; flex-direction: column;
  overflow: hidden;
}
/* Eine Spalte: ein senkrechter Panel-Stapel mit eigenen Höhen-Stegen
   (`.panel-steg`). `min-width: 0` erlaubt das Schrumpfen unter die
   Inhaltsbreite (sonst sprengte eine lange Zeile die Spaltenaufteilung),
   `min-height: 0` dasselbe für die Höhe innerhalb von `main`. */
.tl-column {
  display: flex; flex-direction: column;
  flex: 1 1 0; min-width: 0; min-height: 0;
  /* Notausgang, kein Regelfall: Normalerweise schrumpfen die Panels selbst
     auf den Platz der Spalte. Übersteigt aber schon die Summe ihrer
     Mindesthöhen (`--panel-min`) die Spaltenhöhe — sechs Panels in einer
     Spalte auf einem kleinen Telefon —, rollt die Spalte, statt die
     unteren Panels wortlos abzuschneiden. */
  overflow-y: auto;
}
/* Spalten-Steg: senkrechter Griff zwischen zwei Spalten (zieht die
   BREITE). Bis auf Richtung und Sinnbild identisch zum Panel-Rand
   (`.panel-steg`) — beide laufen im Skript durch DENSELBEN Mechanismus
   (`wireStegs()`). `touch-action: none` GENAU HIER, wie beim Zieh-Griff
   der Kacheln: Eine am Steg beginnende Geste gehört dem Steg, nicht dem
   Scrollen. */
.col-steg {
  flex: none; touch-action: none; user-select: none; -webkit-user-select: none;
  display: flex; align-items: center; justify-content: center;
  width: 1rem; cursor: col-resize;
}
.col-steg::after {
  content: ""; border-radius: 999px; background: var(--line);
  width: 4px; height: 2.75rem;
}
.col-steg:hover::after, .col-steg.zieht::after { background: var(--ink-faint); }
.col-steg:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
@media (min-width: 1100px) {
  /* Ab dem bestehenden Tablet-Breakpoint stehen die Spalten nebeneinander
     und sind alle genauso hoch wie `main` selbst (`align-items: stretch`). */
  main { flex-direction: row; align-items: stretch; }
  /* Untergrenze der Spaltenbreite — zusätzlich zur `flex-basis`, weil der
     `flex-shrink: 1` aus `flex: 1 1 0` eine Spalte sonst beliebig schmal
     zusammendrücken ließe, sobald eine Nachbarspalte mehr Gewicht bekommt.
     Zugleich der Wert, den `wireStegs()` beim Ziehen ausliest. */
  main > .tl-column { min-width: var(--spalte-min); }
}
@media (max-width: 1099.98px) {
  /* Unter dem Breakpoint werden die Spalten IMMER untereinander gestapelt,
     egal was das Profil sagt: Ein Wandmonitor-Profil mit drei Spalten darf
     ein Tablet im Hochformat nicht unbenutzbar machen — Profile gibt es
     gerade dafür, dass dasselbe Turnier auf verschiedenen Geräten
     verschieden aussieht, nicht dafür, dass ein Gerät ausfällt.
     `flex-grow: 1 !important`, weil `applyColumnWidths()` die gezogene
     Gewichtung als Inline-Style setzt — und Inline schlägt jede
     Klassenregel. Gestapelt ist eine BREITEN-Gewichtung sinnlos, hier
     bekommt jede Spalte denselben Höhenanteil. Der Spalten-Steg
     verschwindet mit: Er zöge sonst eine Breite, die es nicht gibt. */
  main > .tl-column { flex-grow: 1 !important; }
  main > .col-steg { display: none; }
}
/* Platz für den Schatten der Feld-Kacheln, den das `overflow` des
   Panel-Körpers sonst abschneidet. Nur Polster, kein Minus-Rand: Der
   Panel-Körper rollt (`overflow-y: auto`, was `overflow-x` auf `auto`
   mitzieht), ein negativer Rand brächte deshalb eine waagerechte
   Bildlaufleiste. */
#courts { padding: 2px; }
h2 {
  margin: 0 0 10px; font-size: .8rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint);
}
h2 .count { color: var(--ink-faint); font-weight: 600; }

/* ── Felder ────────────────────────────────────────────────────────────
   Kacheln statt Tabelle: Ein Feld ist ein Ort, kein Datensatz. */
.courts { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.hall-group + .hall-group { margin-top: 18px; }
.hall-group h3 {
  margin: 0 0 8px; font-size: .95rem; font-weight: 700; color: var(--ink-soft);
}
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px; box-shadow: var(--shadow); min-height: 116px;
  display: flex; flex-direction: column; gap: 6px;
}
.card.free { background: #f8fafc; border-style: dashed; }

/* ── Feldzustand als Farbe ─────────────────────────────────────────────
   Ein breiter Streifen an der Kante statt einer getönten Fläche: Er ist aus
   der Entfernung erkennbar, ohne dass die Namen an Kontrast verlieren — und
   bleibt bei minimaler Display-Helligkeit lesbar. Die Farbe steht nie
   allein: Daneben stehen Satzstand und Uhrbeschriftung („im Spiel seit",
   „auf dem Feld seit"), sodass auch ohne Farbunterscheidung klar ist, was
   los ist. */
.card { border-left-width: 5px; }
.card.zustand-gerufen { border-left-color: var(--accent); }
.card.zustand-ueberfaellig {
  background: #fef2f2; border-color: #fecaca; border-left-color: var(--alarm);
}
.card.zustand-laeuft { border-left-color: var(--ok); }
.card.zustand-beendet { border-left-color: #a855f7; background: #faf5ff; }
.card.zustand-frei { border-left-color: transparent; }
.card.locked { background: #f8fafc; opacity: .65; }
.card.clearing { border-color: #fed7aa; background: #fffbeb; }

/* ── Satz-/Matchball ───────────────────────────────────────────────────
   Zusätzlicher Rahmen (nicht der linke Zustands-Streifen — der bleibt für
   „überfällig" reserviert), Farben an FieldOverviewPage.tsx angeglichen:
   rose für Matchball, amber für Satzball. Nur die Turnierleitung sieht
   das, nie die Hallen-TVs (Scope-Entscheidung 20.07.2026, Plan 16). */
.card.gp-match { box-shadow: 0 0 0 2px #fb7185 inset; }
.card.gp-set   { box-shadow: 0 0 0 2px #fcd34d inset; }
.card-top { display: flex; align-items: baseline; gap: 8px; }
.court-name { font-size: 1.15rem; font-weight: 750; letter-spacing: -.01em; }
.badge {
  font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
  padding: 2px 7px; border-radius: 999px; background: #f1f5f9; color: var(--ink-soft);
}
/* ── Drei-Stufen-Badges (Spec tl-web-panelsystem) ───────────────────────
   Ersetzt fünf frühere, unkoordinierte Klassenfamilien (`.badge.alarm`/
   `.warn`/`.gp`/`.gp-s`, `.excl-badge`, `.manual-badge`, `.warnflag`) PLUS
   das bisher unbenannte `<span class="badge">gesperrt</span>` durch genau
   drei Dringlichkeitsstufen. `.badge` bleibt die GEMEINSAME Basisklasse
   (Form/Größe, inkl. der Kompaktstufen-Anpassungen `#courts.kacheln-*`
   weiter unten) — jedes Badge trägt zusätzlich GENAU eine der drei
   Stufenklassen.
     - `.badge-alarm` — sofort handeln: gesperrt, Verletzung, TL gerufen.
       (Nicht hier: „überfällig" selbst ist kein Badge, sondern der linke
       Zustands-Streifen der Kachel — bleibt unverändert Alarm-Rot.)
     - `.badge-warn` — im Blick behalten: Pause, kein Tablet, n-ter Aufruf
       erfolgt, Feldvergabe-Ausnahme, Schiedsrichter-Konflikt.
     - `.badge-info` — reine Information, kein Handlungsdruck: Matchball,
       Satzball, „Manuell einsortiert", Ergebnis-Kennzeichnung (kampflos/
       Aufgabe/disqualifiziert) in der Beendet-Liste. */
.badge-alarm { background: #fee2e2; color: #991b1b; }
.badge-warn { background: #ffedd5; color: #9a3412; }
/* Info bewusst NICHT als Vollton-Fläche wie Alarm/Warnung: Das
   Akzeptanzkriterium verlangt ausdrücklich, dass die rote, pulsierende
   Matchball-Kennzeichnung nie mit dem alarmroten „überfällig"-Streifen
   verwechselt wird. Statt einer roten Fläche deshalb ein Rahmen um
   hellen/transparenten Grund — andere FORM, nicht nur eine andere
   Textfarbe. Die Wiedererkennungsfarbe bleibt erhalten (rose=Matchball,
   amber=Satzball, wie bisher und wie an FieldOverviewPage.tsx); Grundfarbe
   ohne eigene Modifikator-Klasse (Manuell/Ergebnis-Kennzeichnung) bleibt
   beim Akzent-Blau, das diese Zeilen schon vorher trugen. */
.badge-info { background: #fff; border: 1.5px solid currentColor; color: var(--accent); }
.badge-info.badge-info-match { color: #be123c; animation: gpPuls 1.2s ease-in-out infinite; }
.badge-info.badge-info-set { color: #b45309; }
/* Matchball pulsiert (das Feld wird gleich frei), Satzball bleibt ruhig —
   wie die entsprechenden Badges in der Felderübersicht der App. */
@keyframes gpPuls { 50% { opacity: .5; } }
.pair { font-weight: 600; line-height: 1.25; }

/* ── Die Paarung ───────────────────────────────────────────────────────
   Drei Spalten: eine Partei, das „vs.", die andere Partei. Im Doppel stehen
   die Partner untereinander — bei vier langen Namen war die alte Zeile mit
   Schrägstrichen ein Fließtext, in dem man suchen musste, wo die eine Partei
   endet. Lange Namen brechen innerhalb ihrer Spalte um, statt die Kachel zu
   sprengen (`minmax(0, 1fr)` erlaubt das Schrumpfen unter die Wortbreite). */
.paar {
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center; gap: 4px 8px;
}
.paar .seite { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.paar .seite:last-child { text-align: right; align-items: flex-end; }
/* Ein Spieler ist eine Spalte: oben die Namenszeile, darunter optional die
   Vereinszeile. Die Namenszeile selbst ist eine Reihe — Nation und (nur bei
   reinem Logo) das Wappen stehen neben dem Namen und schrumpfen nie mit.
   Rechts umgekehrt, damit die Zusatzzeichen außen bleiben und die Namen an
   der Mittelachse anliegen. */
.paar .spieler {
  display: flex; flex-direction: column; min-width: 0;
  overflow-wrap: break-word; hyphens: auto;
}
.paar .spieler-haupt {
  display: flex; align-items: baseline; gap: 5px; min-width: 0;
}
.paar .seite:last-child .spieler { align-items: flex-end; }
.paar .seite:last-child .spieler-haupt { flex-direction: row-reverse; }
/* Der Name selbst — als eigenes Element, damit Bereitschafts-Farbe und
   badhub-Link am NAMEN hängen, nicht an Flagge/Wappen daneben. */
.paar .sp-name { min-width: 0; overflow-wrap: break-word; }
/* Bereitschaftslage als Hintergrundfarbe statt Hinweistext (17.08.2026):
   Rot = steht gerade auf einem Feld, Orange = noch in der Mindestpause.
   Farbtöpfe der Badge-Familie (`.badge-alarm`/`.badge-warn`), damit kein
   vierter Farbtopf entsteht; Details im `title` des Namens.
   `.sp-name` steht MIT im Selektor: Er hebt die Spezifität über die
   Link-Grundregel `.paar a.sp-name { color: inherit }` unten — sonst
   verlöre ausgerechnet der verlinkte (= lizenzierte, also fast jeder)
   Name seine Signalfarbe (Review-Fund 17.08.2026). */
.paar .sp-name.sp-spielt { background: #fee2e2; color: #991b1b; border-radius: 5px; padding: 0 4px; }
.paar .sp-name.sp-pause { background: #ffedd5; color: #9a3412; border-radius: 5px; padding: 0 4px; }
/* badhub-Spielerseiten-Link: erbt Farbe und Gewicht, damit die Liste ruhig
   bleibt — dass er klickbar ist, zeigt erst die Berührung (Unterstreichung
   beim Zeigen/Fokussieren, gepunktet als leiser Dauerhinweis).
   `.fin-pair` steht seit 18.08.2026 mit im Selektor: Die Beendet-Zeile
   verlinkt dieselben Namen, und ohne diese Regel fiele sie auf das
   Browser-Blau samt voller Unterstreichung zurück — eine Ergebnisliste,
   die schreit, statt zu berichten. */
.paar a.sp-name, .fin-pair a.sp-name { color: inherit; text-decoration: underline dotted 1px; text-underline-offset: 2px; }
.paar a.sp-name:hover, .paar a.sp-name:focus-visible,
.fin-pair a.sp-name:hover, .fin-pair a.sp-name:focus-visible { text-decoration: underline solid 1.5px; }
/* Vereinsname unter dem Namen — klein und gedämpft, damit er den Namen nicht
   überstrahlt; das Wappen steht davor. */
.paar .verein-unter {
  display: flex; align-items: center; gap: 4px; min-width: 0; max-width: 100%;
  color: var(--ink-faint); font-size: .72rem; line-height: 1.1;
}
.paar .seite:last-child .verein-unter { flex-direction: row-reverse; }

/* Auf der Feldkachel **untereinander**. Eine Kachel ist rund 230 px breit;
   dreispaltig blieben je Partei keine 90 px, und Namen wie „Kushal Renuka
   Prashanth" zerbrachen mitten im Wort. Untereinander steht jeder Name in
   voller Kachelbreite — und die Kachel ist ohnehin die Ansicht, in der man
   *ein* Spiel liest, nicht eine Liste überfliegt. */
.card .paar { grid-template-columns: minmax(0, 1fr); gap: 1px; }
.card .paar .seite:last-child { text-align: left; align-items: flex-start; }
.card .paar .seite:last-child .spieler { align-items: flex-start; }
.card .paar .seite:last-child .spieler-haupt { flex-direction: row; }
.card .paar .seite:last-child .verein-unter { flex-direction: row; }
.card .paar .vs { justify-self: start; }
.vs {
  color: var(--ink-faint); font-weight: 500; font-size: .85em;
  justify-self: center;
}

/* Nation als Kürzel mit eigener Farbe. Der Farbton kommt aus dem Kürzel
   selbst (`--ton`), damit gleiche Nationen ohne gepflegte Länderliste gleich
   aussehen. Blass gehalten: Es ist eine Zusatzinfo, kein Alarm. */
/* Die Flagge: klein, mit feiner Kante (weiße Flaggenteile brauchen sie,
   sonst schwimmt das Bild im Weiß der Kachel). */
.flagge {
  flex: none; width: 1.25rem; height: .875rem; object-fit: cover;
  border: 1px solid var(--line); border-radius: 2px;
  vertical-align: -2px;
}
/* Ersatz, wenn es zu einem Kürzel keine Flagge gibt. */
.nat {
  flex: none; padding: 0 5px;
  border-radius: 4px; font-size: .68rem; font-weight: 700; letter-spacing: .03em;
  background: #f1f5f9; color: var(--ink-soft);
}
/* Verein: Wappen und/oder Name. Blass wie die Nation — eine Zusatzinfo, die
   die Zeile nicht dominieren darf. Das Wappen ist klein und quadratisch; der
   Name wird bei Enge gekürzt, damit er die Zeile nicht auseinanderdrückt. */
.verein-logo {
  flex: none; width: 1rem; height: 1rem; object-fit: contain;
  vertical-align: -3px;
}
.verein-name {
  min-width: 0; max-width: 18ch; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
/* Auf der Feldkachel ist mehr Platz — dort darf der Vereinsname länger sein. */
.card .verein-name { max-width: 20ch; }
.meta { font-size: .85rem; color: var(--ink-soft); }
.card-foot { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
/* Satzstand und Uhr stehen nebeneinander und sehen sonst gleich aus —
   „8:11" (Satzstand) und „5:32" (Minuten) sind im Turnierstress nicht zu
   unterscheiden. Beide tragen deshalb ein Wort darunter, das sagt, was
   die Zahl bedeutet. */
.score { font-size: 1.05rem; font-weight: 700; }
.score small { font-size: .7rem; font-weight: 600; color: var(--ink-faint); display: block; }
.empty-hint { color: var(--ink-faint); font-style: italic; }

/* ── Die Aufruf-Uhr ────────────────────────────────────────────────────
   Das Herzstück dieser Seite. Sie beantwortet die Frage, wegen der man
   überhaupt hinschaut: Wie lange steht das Spiel schon auf dem Feld, ohne
   dass etwas passiert? Die Farbe kippt an genau den Schwellen, die auch
   den 2. und 3. Aufruf auslösen — die Uhr sagt damit nicht nur „wie
   lange", sondern „was jetzt dran ist". */
.clock { font-size: 1.05rem; font-weight: 700; color: var(--ink-soft); }
.clock.stage2 { color: var(--warn); }
.clock.stage3 { color: var(--alarm); }
.clock small { font-size: .7rem; font-weight: 600; color: var(--ink-faint); display: block; }
.clock.stage2 small { color: var(--warn); }
.clock.stage3 small { color: var(--alarm); }

/* Geschätzte Restzeit des laufenden Spiels (Spec spielzeiten-prognose,
   Etappe D) — dieselbe Zahl-plus-Wort-Form wie Satzstand und Uhr, damit die
   drei Fußzeilen-Zahlen auseinanderzuhalten sind. Die Tilde sagt
   „Schätzung", nicht Messwert. */
.restzeit { font-size: 1.05rem; font-weight: 700; color: var(--ink-soft); }
.restzeit small { font-size: .7rem; font-weight: 600; color: var(--ink-faint); display: block; }

/* ── Kompaktstufen der Feld-Kacheln ───────────────────────────────────
   Damit IMMER alle Felder auf einen Blick passen (Wunsch vom 10.08.2026):
   „alle Felder auf einen Blick — die Liste läuft, die Felder nicht".
   `fitCourts()` im Skript misst nach jedem Neuzeichnen und bei jeder
   Größenänderung, ob die Felderbox überläuft, und schaltet dafür erst
   `kacheln-kompakt`, dann `kacheln-mini` auf `#courts` — die erste Stufe,
   die passt. Beide wirken über Abkömmlinge, auch innerhalb gruppierter
   Hallen (`.hall-group`) und eines von Hand hinterlegten Rasters (dessen
   `grid-template-columns` bleibt unangetastet — das ist eine Host-
   Einstellung, keine Anzeigefrage). */
#courts.kacheln-kompakt .courts { gap: 7px; }
#courts.kacheln-kompakt .card { padding: 8px; gap: 4px; min-height: 90px; }
#courts.kacheln-kompakt .court-name { font-size: 1rem; }
#courts.kacheln-kompakt .badge { font-size: .62rem; padding: 1px 5px; }
#courts.kacheln-kompakt .meta, #courts.kacheln-kompakt .pair { font-size: .8rem; }
#courts.kacheln-kompakt .score, #courts.kacheln-kompakt .clock, #courts.kacheln-kompakt .restzeit { font-size: .92rem; }
/* Das Kebab der Kachel schrumpft mit — es sitzt in der Kopfzeile neben dem
   Zieh-Griff und würde die gesparte Höhe sonst gleich wieder auffressen.
   Sein MENÜ bleibt in voller Größe (nur der Auslöser schrumpft): Wer es
   öffnet, bedient danach beschriftete Knöpfe, und die müssen treffbar
   bleiben. */
#courts.kacheln-kompakt .kebab > summary { width: 2.125rem; height: 2.125rem; font-size: 1.1rem; }
#courts.kacheln-kompakt .hall-group h3 { font-size: .82rem; margin-bottom: 5px; }
#courts.kacheln-kompakt .hall-group + .hall-group { margin-top: 10px; }

/* Deutlich kleiner: Abzeichen und die Metazeile (Klasse/Runde) einzeilig
   mit Ellipse statt Umbruch — bei 26 Feldern auf einem Telefon zählt jede
   Zeile. Auto-fill-Raster bekommt zusätzlich eine engere Mindestbreite, ein
   von Hand hinterlegtes Hallenraster (feste Spaltenzahl) nicht — dessen
   Zellen sind über Zeilen-/Spaltenindex platziert, eine andere Spaltenzahl
   würfelte die Anordnung durcheinander. */
#courts.kacheln-mini .courts { gap: 5px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
#courts.kacheln-mini .card { padding: 6px; gap: 2px; min-height: 70px; border-left-width: 4px; }
#courts.kacheln-mini .court-name { font-size: .8rem; }
#courts.kacheln-mini .badge { font-size: .56rem; padding: 1px 4px; white-space: nowrap; }
#courts.kacheln-mini .meta {
  font-size: .66rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#courts.kacheln-mini .pair { font-size: .68rem; }
#courts.kacheln-mini .score, #courts.kacheln-mini .clock, #courts.kacheln-mini .restzeit { font-size: .78rem; }
#courts.kacheln-mini .score small, #courts.kacheln-mini .clock small, #courts.kacheln-mini .restzeit small { font-size: .56rem; }
/* 2rem (bei Grundgröße = 32px) wie der frühere Aufruf-Knopf in dieser
   Stufe (`.callbtn`, damals `min-height: 32px`) — die bewusst in Kauf
   genommene Untergrenze der dichtesten Darstellung, nicht weiter
   unterboten; skaliert seit dem Geräte-Zoom in rem mit. */
#courts.kacheln-mini .kebab > summary { width: 2rem; height: 2rem; font-size: 1rem; }
/* Kleinerer Griff (Vorgabe: „kleinere Grips") — NUR das Sinnbild schrumpft.
   Polsterung/Trefffläche bleiben bei den 8px der Grundregel
   (`.card-top .drag-griff` weiter unten; die negativen Ränder gleichen sie
   im Layout ohnehin aus) — ausgerechnet die kleinste Stufe darf die
   Ziehfläche nicht am stärksten verkleinern. */
#courts.kacheln-mini .drag-griff { font-size: .82rem; }
#courts.kacheln-mini .hall-group h3 { font-size: .74rem; margin-bottom: 3px; }
#courts.kacheln-mini .hall-group + .hall-group { margin-top: 8px; }

/* ── Spielliste ────────────────────────────────────────────────────────
   EINE Liste über alle Hallen und alle Bereitschaftslagen (ADR 0026):
   gerufene Spiele oben angepinnt (das macht bereits die Server-Sortierung),
   alles Übrige in der geplanten Abfolge. Was früher vier Abschnitte waren
   („gerufen"/„spielbereit"/„nicht bereit"/„ohne Hallenzuordnung"), steht
   jetzt als Status an der Zeile — siehe `.row-status` unten. Die
   Bereitschaftslage selbst steht seit 17.08.2026 NICHT mehr als Text da,
   sondern als Farbe am Namen (rot = spielt gerade, orange = pausiert; siehe
   `.sp-spielt`/`.sp-pause` bei der Paarung) plus Eieruhr-Countdown —
   Hinweistexte machten die Liste unübersichtlich (Nutzer-Befund). */
.queue { display: flex; flex-direction: column; gap: 8px; }
/* KEIN `content-visibility` an der Spielzeile — bewusst, und das bleibt
   so (Review-Fund 18.08.2026): Es zieht `contain: paint` nach sich, und
   zwar dauerhaft, nicht nur außerhalb des Bildes. Damit würde die Zeile
   zum Bezugsrahmen für ihr `position: fixed`-Kebab-Menü UND schnitte es
   an ihrer eigenen Kante ab — exakt der Fehler, den der Feldtest am
   17.08.2026 gemeldet hat (siehe `.kebab-menu`). Dasselbe gilt seit
   v0.9.246 für die Beendet-Zeile, seit auch sie ein Kebab-Menü trägt —
   siehe `.fin-row`. */
.row {
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; min-height: 56px;
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
.row .no { font-weight: 700; color: var(--ink-faint); min-width: 2.2rem; }
/* Name und Meta („Disziplin · Runde · Gruppe") zusammen EIN Flex-Kind —
   vorher waren `.who` und `.draw` zwei eigene Top-Level-Elemente der Zeile.
   Die Spielnummer bleibt bewusst ein eigenes Element davor (feste Breite,
   damit die Nummern untereinander fluchten).

   Die 6-Elemente-Grenze der Zeile (Spec tl-web-panelsystem) NEU GERECHNET
   nach dem Umbau auf eine einzige Spielliste (ADR 0026). Ungünstigster Fall:
     1 Zieh-Griff · 2 Spielnummer · 3 Name+Meta (`.who-block`) ·
     4 Statusblock (`.row-status`) · 5 Vorbereitungs-Ruf · 6 Kebab
   — genau sechs.

   Die frühere Rechnung trug über den gegenseitigen Ausschluss von Griff und
   Status („Griff nur im Abschnitt Spielbereit, Status nur in den drei
   anderen"). Dieser Ausschluss existiert seit dem Umbau nicht mehr: Es gibt
   nur noch eine Liste, der Griff hängt allein daran, dass ein Spiel noch
   nicht gerufen ist — und eine nicht gerufene Zeile trägt sehr wohl einen
   Status (z. B. die Pausen-Eieruhr). Tragend ist stattdessen, dass ALLES
   Status-Artige in EINEM Wrapper steckt: Hallen-Kürzel, Pausen-Eieruhr und
   die beiden Abzeichen (Auto-Vergabe-Ausnahme, manuell einsortiert).
   Vorher waren Status und Abzeichen zwei Kinder.
   Wer hier ein weiteres Element ergänzt, muss diese Rechnung neu machen. */
.row .who-block { display: flex; flex-direction: column; gap: 1px; flex: 1 1 10rem; min-width: 0; }
.row .who { font-weight: 600; }
.row .draw { font-size: .85rem; color: var(--ink-soft); }
.row.blocked { background: #f8fafc; }
/* Der Statusblock: EIN Flex-Kind, beliebig viele Marken darin (siehe die
   Rechnung oben). Umbrechend, damit vier Marken auf einem Telefon die Zeile
   nicht sprengen. */
.row .row-status { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; min-width: 0; }
/* „Seit wann gerufen" neben dem Gerufen-Abzeichen — Farbe passend zur
   Info-Stufe, damit Marke und Zeit als eine Aussage lesbar sind. (Den
   früheren Begründungstext `.why` — „X spielt gerade"/„pausiert noch bis"
   — gibt es seit 17.08.2026 nicht mehr: Das sagt jetzt die Farbe am Namen,
   die Restzeit die Eieruhr `.wartet`.) */
.row .called { font-size: .82rem; color: var(--accent); font-weight: 650; }
/* Pausen-Eieruhr: verbleibende Wartezeit nach dem letzten Spiel, tickt
   sekündlich (`tickClocks`). Warn-Farbe wie die orangen Namen daneben —
   Eieruhr und Namens-Färbung sind EINE Aussage. */
.row .wartet { font-size: .82rem; color: var(--warn); font-weight: 650; white-space: nowrap; }
/* Hallen-Kürzel (ADR 0026): ersetzt die frühere Hallen-Gruppierung der
   Liste. Bewusst KEIN Abzeichen der Drei-Stufen-Familie — es ist keine
   Dringlichkeit, sondern eine Ortsangabe, und ein vierter Farbtopf ist
   ausdrücklich unerwünscht. Deshalb dieselbe stumme Chip-Optik wie das
   Nations-Kürzel (`.nat`). Voller Hallenname im `title`. */
.row .hall-kuerzel, .fin-row .hall-kuerzel {
  flex: none; padding: 1px 6px; border-radius: 6px;
  background: #f1f5f9; color: var(--ink-soft);
  font-size: .72rem; font-weight: 700; letter-spacing: .02em;
}
/* Hallen-Farbmarke (Spec hallen-farben): reine Orts-Kennung neben
   Kürzel/Name — bewusst KEINE Umfärbung des Chips und kein Abzeichen der
   Drei-Stufen-Familie; der Text bleibt immer stehen (Farbe ist nie
   einziger Informationsträger). */
.hall-marke {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  flex: none; margin-right: .35em; vertical-align: 0;
}
/* Nachlade-Marke am Listenende (ADR 0026): unsichtbar, aber ausdrücklich
   EINEN Pixel hoch — ein Element ohne Fläche ist für den
   `IntersectionObserver` ein Grenzfall, den nicht jede Engine gleich
   behandelt. Ein Pixel kostet nichts und macht die Messung eindeutig. */
#queue-sentinel { height: 1px; }
.row.dragging-item {
  box-shadow: 0 2px 8px rgba(0, 0, 0, .18);
  border-color: var(--accent);
  background: #eff6ff;
}
/* Globaler Reset-Knopf in der Kopfzeile des Panels „Spiele" — er verwirft
   die manuelle Reihenfolge des ganzen Turniers (seit ADR 0026 gibt es nur
   noch eine). Nur sichtbar, solange irgendein Spiel manuell einsortiert
   ist. */
.panel-head .reset-order {
  font-size: .72rem; font-weight: 600; text-transform: none;
  letter-spacing: normal; color: var(--ink-soft); background: none;
  border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px;
  min-height: 28px; cursor: pointer;
}
.panel-head .reset-order:hover { border-color: var(--accent); color: var(--accent); }
/* Quadratischer Umschalter mit Sinnbild, so groß wie ein Finger, ohne
   Text — der Vorbereitungs-Aufruf bleibt PRIMÄR sichtbar (Spec
   tl-web-panelsystem, Schritt 11: vermutlich die häufigste Einzelaktion an
   einer Zeile). Die Auto-Vergabe-Ausnahme zieht dagegen ins Kebab-Menü
   (siehe dort) — seltener gebraucht, und ihr eigenes Symbol war im
   entschlackten Zeilenbild ohnehin leicht mit dem Vorbereitungs-Knopf zu
   verwechseln. */
.row .prep {
  display: grid; place-items: center;
  width: var(--touch-min); height: var(--touch-min); padding: 0;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--card); color: var(--ink-soft); cursor: pointer;
}
.row .prep:hover { border-color: var(--accent); color: var(--accent); }
.row .prep[aria-pressed="true"] {
  border-color: var(--accent); background: #eff6ff; color: var(--accent);
}
.row[aria-selected="true"] .prep { border-color: #475569; background: #1e293b; color: #e2e8f0; }

/* ── Kebab-Menü: Sekundäres einer Zeile ODER einer Feldkachel ──────────
   Spec tl-web-panelsystem, Schritt 11: eine Zeile zeigt ohne geöffnetes
   Menü höchstens sechs Elemente. Bedienhäufigkeits-Einteilung (im
   Code-Kommentar bei `queueRow()` ausführlicher begründet):
   Vorbereitungs-Ruf bleibt PRIMÄR (siehe `.row .prep` oben); Nachrufe,
   die Auto-Vergabe-Ausnahme und der (nur im Mehr-Hallen-Turnier ohne
   Regel überhaupt sichtbare) Spielort-Wähler sind seltener gebraucht und
   wandern hierher. `<details>` statt eigenem JS-Zustand — der offene
   Zustand wird beim Neuzeichnen über `openKebabMatchId` bzw.
   `openKebabCourtId` (Skript) gezielt wiederhergestellt, sonst schlösse
   sich das Menü alle zwei Sekunden von selbst (Poll-Takt).

   Bewusst NICHT mehr auf `.row` eingeschränkt: Dieselbe Optik und dieselbe
   Mechanik trägt seit ADR 0026/Plan E auch die Feldkachel („einteilen",
   „ansagen", Aufrufe, Ergebnis) — ein zweites, fast gleiches Regelwerk
   dafür wäre genau die Art Doppelung, die diese Seite groß gemacht hat. */
.kebab { position: relative; flex: none; }
.kebab > summary {
  list-style: none; cursor: pointer; user-select: none;
  display: grid; place-items: center;
  width: var(--touch-min); height: var(--touch-min);
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--card); color: var(--ink-soft); font-size: 1.3rem; font-weight: 700;
  line-height: 1;
}
.kebab > summary::-webkit-details-marker { display: none; }
.kebab[open] > summary { border-color: var(--accent); color: var(--accent); }
/* Jedes Kebab-Menü hängt am Ansichtsfenster, nicht an seinem Auslöser:
   Zeile wie Kachel stecken im Körper ihres Panels, und der klemmt
   (`.panel { overflow: hidden }`, `.panel-body` rollt). Ein absolut
   positioniertes Menü kann deshalb nie über die Panel-Kante hinaus über
   das Nachbar-Panel ragen — an einer Zeile am unteren Panel-Rand war es
   nur durch Scrollen erreichbar oder schlicht abgeschnitten (Feldtest
   17.08.2026). z-index hülfe dagegen nicht, `overflow` schneidet auch
   hoch gestapelte Kinder. `platziereKebabMenue()` im Skript setzt Ort
   und Aufklapprichtung — bei jedem Neuzeichnen, beim Rollen des
   Panel-Körpers und bei Fenstergrößen-Wechseln (`folgeOffenenKebabs`).
   z-index über der Action-Bar (25): Ein nach oben aufgeklapptes Menü
   kann jetzt bis in deren Region reichen. */
.kebab-menu {
  position: fixed; z-index: 30;
  display: flex; flex-direction: column; gap: 12px;
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: var(--shadow); padding: 12px; min-width: 15rem;
  max-height: 70vh; overflow-y: auto;
}
/* Kachel-Menüs etwas schmaler: bis zu sieben kurze Aktionsknöpfe
   (inkl. „📈 Punktverlauf"), kein Wähler. */
.card .kebab-menu { min-width: 13rem; }
.kebab-menu .kebab-group { display: flex; flex-direction: column; gap: 6px; }
.kebab-menu .kebab-label {
  font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
  color: var(--ink-faint);
}
.kebab-menu .kebab-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
/* Untereinander stehende, voll beschriftete Aktionsknöpfe — im Menü ist
   Platz, den Zeile und Kachel selbst nicht mehr hergeben. Genutzt von den
   Nachruf-Knöpfen der Zeile UND allen Kachel-Aktionen. */
.kebab-menu .kebab-actions { display: flex; flex-direction: column; gap: 6px; }
.kebab-menu .kebab-actions button {
  font: inherit; font-weight: 650; padding: 8px 12px; min-height: var(--touch-min);
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--card); color: var(--ink-soft); cursor: pointer;
  text-align: left;
}
.kebab-menu .kebab-actions button:hover { border-color: var(--accent); color: var(--accent); }
.kebab-menu .kebab-actions button:disabled { opacity: .5; cursor: default; }
/* Auto-Vergabe-Ausnahme: jetzt beschriftet (im Menü ist Platz), nicht mehr
   nur ein Icon-Quadrat wie vorher auf der Zeile selbst. */
.row .auto-excl {
  font: inherit; font-weight: 650; font-size: .85rem; cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; min-height: var(--touch-min);
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--card); color: var(--ink-soft);
}
.row .auto-excl:hover { border-color: var(--warn); color: var(--warn); }
.row .auto-excl[aria-pressed="true"] {
  border-color: var(--warn); background: #fff7ed; color: var(--warn);
}

/* Nachruf: drei Knöpfe im Menü, mit vollem Text statt gekürzt auf 8rem —
   im Kebab ist genug Platz, das war vorher auf der Zeile selbst nicht der
   Fall. Form und Maße kommen von `.kebab-actions` (oben, geteilt mit der
   Feldkachel); hier nur die abweichende Warn-Färbung beim Überfahren — ein
   Nachruf ist eine Eskalation, keine Routine-Aktion. */
.kebab-menu .recall button:hover { border-color: var(--warn); color: var(--warn); }

/* Spielort ohne Feld. Unauffällig, solange nichts gesetzt ist — es ist eine
   Ausnahme-Handlung, kein Pflichtfeld. Steht ein Ort von Hand fest, sagt der
   Wähler das durch seine Farbe, damit man abgeleitete und gesetzte Hallen
   auseinanderhält. Jetzt im Kebab-Menü mit vollem Namen statt Kürzel — im
   Menü ist Platz, den die Zeile selbst nicht mehr hergibt. */
.row .hallwahl {
  font: inherit; font-size: .85rem; font-weight: 650;
  min-height: var(--touch-min); width: 100%; padding: 6px 8px;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--card); color: var(--ink-soft); cursor: pointer;
}
.row .hallwahl.gesetzt { border-color: var(--accent); color: var(--accent); font-weight: 650; }

/* Walkover-Vorschläge: nach einer Aufgabe entscheidet die Turnierleitung,
   welche Folgespiele kampflos gehen. */
.wo {
  background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px;
  padding: 12px; display: flex; flex-direction: column; gap: 8px;
}
.wo h4 { margin: 0; font-size: .95rem; }
.wo label { display: flex; align-items: center; gap: 8px; min-height: var(--touch-min); font-size: .9rem; }
.wo .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.wo button {
  font: inherit; font-size: .85rem; font-weight: 650; padding: 8px 14px; min-height: var(--touch-komf);
  border-radius: 8px; cursor: pointer; border: 1px solid var(--line); background: var(--card);
}
.wo button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }

/* Zähltafel-Warteschlange: nur sichtbar, wenn diese Installation
   Zähltafelbediener verwaltet — Muster für „Panel verfügbar, aber vom
   Profil trotzdem ausgeblendet" (Spec tl-web-panelsystem, `panelAvailable`
   im Skript). Zeilenstil der Spielliste, aber kompakter — hier geht es um
   Namen und Wartezeit, nicht um eine ganze Paarung. */
#sk-list, #off-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
#off-list li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; }
#off-list li.paused { opacity: .55; }
#off-list .off-name { flex: 1; }
#off-list button { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; cursor: pointer; color: inherit; }
#off-list button:hover { border-color: var(--accent); color: var(--accent); }
#off-list .drag-griff {
  /* Trefffläche vergrößern, wie beim Spielliste-Griff (`.row .drag-griff`) —
     per Minus-Rand aus dem Fluss zurückgerechnet. */
  padding: 9px 8px;
  margin: -9px -4px -9px -8px;
}
/* Während des Ziehens gehoben + hervorgehoben — die Zeile wandert ja schon
   live im DOM, das hier ist nur die Rückmeldung „das ist die gegriffene". */
#off-list li.dragging-item {
  box-shadow: 0 2px 8px rgba(0, 0, 0, .18);
  border-color: var(--accent);
  background: #eff6ff;
}
#sk-list li {
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; min-height: var(--touch-komf);
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.sk-names { font-weight: 600; flex: 1 1 8rem; min-width: 0; }
.sk-wait { font-size: .82rem; color: var(--ink-soft); }
#sk-list button {
  font: inherit; font-weight: 700; min-width: var(--touch-min); min-height: var(--touch-min); padding: 0 10px;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--card); color: var(--ink-soft); cursor: pointer;
}
#sk-list button:hover { border-color: var(--accent); color: var(--accent); }
/* Das Formular bleibt beim Neuzeichnen unangetastet (nur `#sk-list` wird
   ersetzt) — sonst würde ein Name, an dem gerade getippt wird, alle zwei
   Sekunden vom nächsten Abruf gelöscht. */
#sk-add { display: flex; gap: 8px; margin-top: 8px; }
#sk-name {
  flex: 1 1 auto; min-width: 0; font: inherit; padding: 8px 10px; min-height: var(--touch-min);
  border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink);
}
#sk-add button {
  font: inherit; font-weight: 650; padding: 0 14px; min-height: var(--touch-min);
  border-radius: 8px; border: 1px solid var(--line); background: var(--card);
  color: var(--ink-soft); cursor: pointer;
}
#sk-add button:hover { border-color: var(--accent); color: var(--accent); }

/* Beendet: fast reine Rückschau — schmale Zeilen mit Sieger zuerst, Score
   und ggf. Aufgabe-/kampflos-Kennzeichnung. Der Korrektur-Stift ist die
   einzige Bedienung hier. */
#fin-list { display: flex; flex-direction: column; gap: 6px; }
.fin-row {
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; min-height: var(--touch-komf);
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: .85rem;
  /* KEIN `content-visibility` mehr — es stand hier, solange die
     Beendet-Zeile nichts fest Positioniertes enthielt. Seit sie ihr
     eigenes Kebab-Menü trägt (Ergebnis · Punktverlauf · Zettel), gilt
     genau die Falle der Spielzeile auch hier: `content-visibility` zieht
     `contain: paint` nach sich, die Zeile würde zum Bezugsrahmen ihres
     `position: fixed`-Menüs und schnitte es an der eigenen Kante ab
     (Feldtest-Fehler 17.08.2026, siehe `.kebab-menu`).
     Der Verzicht ist wohlfeil: Der Turnier-PC liefert höchstens
     `FINISHED_LIMIT` (30) beendete Spiele, die Liste kann also gar nicht
     über den Turniertag wachsen. */
}
.fin-pair { font-weight: 600; flex: 1 1 12rem; min-width: 0; }
.fin-meta { color: var(--ink-soft); }
.fin-score { color: var(--ink-soft); flex: 0 0 auto; }
.fin-row button {
  font: inherit; font-weight: 700; min-width: var(--touch-min); min-height: var(--touch-min); padding: 0 10px;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--card); color: var(--ink-soft); cursor: pointer;
}
.fin-row button:hover { border-color: var(--accent); color: var(--accent); }

/* ── Spielzeiten-Panel (Spec spielzeiten-prognose) ──────────────────────
   Kompakte Median-Tabelle je Klasse × Disziplin. Zahlen rechtsbündig,
   Kopfzeile bleibt beim Rollen stehen (die Liste kann bei vielen Klassen
   länger werden als das Panel hoch ist). */
.times-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
.times-table th, .times-table td {
  padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: left;
}
.times-table th {
  position: sticky; top: 0; background: var(--card);
  font-size: .75rem; font-weight: 600; color: var(--ink-faint);
}
.times-table .num { text-align: right; font-variant-numeric: tabular-nums; }
/* Anfangszeiten-Panel (Feldtest 17.08.2026), teilt die Tabellen-Optik der
   Spielzeiten: Durchgelaufene Anmeldeschlüsse bleiben sichtbar, treten
   aber zurück; ein vollzähliger Check-In-Stand meldet Grün. */
.checkin-table tr.durch td { color: var(--ink-faint); }
.checkin-table td.voll { color: var(--ok); font-weight: 700; }
/* Prognose-Marke in der Spielliste: dieselbe Info-Stufe wie „gerufen",
   aber mit Uhr-Sinnbild — sie beantwortet „wann bin ich dran?". */
.badge.predicted { white-space: nowrap; }

/* ── Hallen-Vorverteilung (Spec hallen-vorverteilung) ───────────────────
   Kompakter Bedien-Cluster im Kopf des Spiele-Panels: Schalter, x-Feld,
   Räumen-Knopf — dieselbe unaufdringliche Optik wie „Reihenfolge
   zurücksetzen" daneben. */
.prefill-box { display: inline-flex; align-items: center; gap: 6px; }
.prefill-x {
  width: 4.2rem; font: inherit; font-size: .8rem; padding: 3px 6px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--card);
}
.prefill-box button[aria-pressed="true"] {
  border-color: var(--accent); color: var(--accent); background: #eff6ff;
}
.prefill-box button:disabled, .prefill-x:disabled { opacity: .5; cursor: not-allowed; }

/* ── Panel-System (Spec tl-web-panelsystem) ─────────────────────────────
   Alle sechs Abschnitte (Felder, Aufgaben, Zähltafel, Schiedsrichter,
   Spiele, Beendete Spiele) laufen über EINEN Mechanismus statt sechs
   leicht unterschiedlichen Sonderfällen: eine einheitliche Kopfzeile
   (Titel, Zähler, Ein-/Ausblend-Schalter), Sichtbarkeit/Reihenfolge/Höhe/
   Spalte aus dem AKTIVEN PROFIL statt aus `<details open>`/`hidden`-
   Attributen (die einen Redraw nicht überleben — genau der Kritikpunkt der
   Spec). Seit dem Mehrspalten-Layout (Plan tl-liste-vereinfachen F) gilt
   das ohne Ausnahme auch für „Felder": Der frühere Sonderstatus als
   fixierte Ankerposition ist entfallen, das Panel trägt einen ganz
   normalen Reorder-Griff und eine Spaltenzuordnung wie jedes andere. */
/* `flex-basis: 0` ist hier NICHT kosmetisch, sondern die Bedingung dafür,
   dass die Höhenverteilung überhaupt funktioniert (Fehlerbericht
   18.08.2026: „Nachladen vergrößert die Box, danach lässt sie sich nicht
   mehr richtig ziehen").

   Mit dem Vorgabewert `auto` wäre die Flex-Basis eines Panels seine
   INHALTSHÖHE — und die Spielliste lädt beim Scrollen nach (`QUEUE_PAGE`),
   wächst also im Betrieb. Sie verdrängte damit ihre Nachbarn bis auf
   `--panel-min`, obwohl alle denselben `heightFr`-Anteil haben. Schlimmer:
   Übersteigt die Summe der Basis-Höhen die Spaltenhöhe, bleibt kein freier
   Raum — und `flex-grow`, das der Steg (`wireStegs`) beim Ziehen schreibt,
   verteilt NUR freien Raum. Das Ziehen wurde dadurch wirkungslos.

   Mit `flex-basis: 0` zählt allein die `heightFr`-Gewichtung — dieselbe
   Entscheidung, die `.tl-column` mit `flex: 1 1 0` für die Spalten längst
   trifft; die Panels waren beim Mehrspalten-Umbau nur nicht mitgezogen
   worden. Zugeklappte Panels bleiben ausgenommen
   (`.panel.panel-collapsed { flex: none }` weiter unten ist spezifischer
   und setzt die Basis zurück auf `auto`): Sie sollen genau ihre Kopfzeile
   hoch sein, nicht `--panel-min`. */
.panel { display: flex; flex-direction: column; flex-basis: 0; min-height: var(--panel-min); overflow: hidden; }
.panel-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
.panel-head {
  flex: none; display: flex; align-items: center; gap: 8px;
  padding: 6px 0; min-height: var(--touch-komf);
}
.panel-spacer { flex: 1 1 auto; }
.panel-title {
  font-size: .8rem; font-weight: 700; color: var(--ink-faint);
  text-transform: uppercase; letter-spacing: .06em;
}
.panel-count { font-size: .8rem; font-weight: 600; color: var(--ink-faint); }
/* Zwei Kopfzeilen-Schalter mit identischer Form, aber getrennter Bedeutung
   (ADR 0026, Plan D): das Auge blendet das Panel GANZ aus, der Pfeil klappt
   nur seinen Inhalt ein. Beides Sinnbilder statt Text, sonst wirkt die
   Kopfzeile überladen — Beschriftung bleibt für Vorlesehilfen und als
   Tooltip erhalten (wie beim Vorbereitungs-Knopf). */
.panel-vis, .panel-col {
  flex: none; display: grid; place-items: center; width: var(--touch-min); height: var(--touch-min); padding: 0;
  border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
  background: var(--card); color: var(--ink-soft);
}
.panel-vis:hover, .panel-col:hover { border-color: var(--accent); color: var(--accent); }
.panel-vis[aria-pressed="false"] { color: var(--ink-faint); }
/* Gedrückt = zugeklappt. Anders als beim Auge bleibt der Pfeil kräftig
   gefärbt: Ein zugeklapptes Panel ist ein Zustand, den man sofort wieder
   auflösen können muss, kein gedämpfter Randfall. */
.panel-col[aria-pressed="true"] { border-color: var(--accent); background: #eff6ff; color: var(--accent); }
/* Panel-Reorder-Griff: bewusst ein ANDERES Sinnbild als das ⠿-Zeichen der
   Item-Drag-Listen (Queue-Zeilen, Schiedsrichter-Zeilen, Feldkacheln,
   `.drag-griff`) — Akzeptanzkriterium „Verwechslungsgefahr zwischen
   ganzem Panel verschieben und einer Zeile verschieben". Drei gleich
   lange Balken statt eines Punktrasters, deutlich unterscheidbar auch bei
   kleiner Darstellung. `touch-action: none` GENAU HIER, exakt dasselbe
   Muster wie bei `.drag-griff`/`#steg` — nur eine am Griff begonnene
   Touch-Geste darf das native Scrollen der Spalte unterdrücken. */
.panel-griff {
  touch-action: none; cursor: grab; color: var(--ink-faint);
  display: grid; place-items: center; flex: none;
  /* Symbol + Polster ringsum ≈ 40px Trefffläche (Touch-Ergonomie ≥ 40px),
     per Minus-Rand aus dem Fluss zurückgerechnet wie `.row .drag-griff`.
     Polster in rem, damit die Fläche den Geräte-Zoom mitmacht. */
  padding: .6875rem; margin: -.6875rem 0 -.6875rem -.3125rem; border-radius: 6px;
}
.panel-griff:hover { color: var(--ink-soft); background: #f1f5f9; }
.panel-griff:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.panel.dragging-item { box-shadow: 0 2px 8px rgba(0, 0, 0, .18); }
/* Panel-Rand: derselbe Steg-Mechanismus wie der Spalten-Steg
   (`.col-steg`, `wireStegs()` im Skript), nur waagerecht — zwischen zwei
   tatsächlich SICHTBAREN Panels EINER Spalte (ausgeblendete Panels werden
   gar nicht erst gerendert, siehe `renderPanels()`), damit sich der Rand
   automatisch an den nächsten sichtbaren Nachbarn bindet, ohne eigene
   Sonderlogik dafür zu brauchen. */
.panel-steg {
  flex: none; touch-action: none; user-select: none; -webkit-user-select: none;
  display: flex; align-items: center; justify-content: center;
  height: 1rem; cursor: row-resize;
}
.panel-steg::after { content: ""; border-radius: 999px; background: var(--line); width: 2.75rem; height: 4px; }
.panel-steg:hover::after, .panel-steg.zieht::after { background: var(--ink-faint); }
.panel-steg:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
/* ── Zugeklapptes Panel (ADR 0026, Plan D) ─────────────────────────────
   Zweite, von der Sichtbarkeit UNABHÄNGIGE Dimension: ausgeblendet = gar
   nicht im DOM, zugeklappt = Kopfzeile da, Inhalt weg. Ein zugeklapptes
   Panel darf im Steg-Verteilungsmodell KEINE Höhe beanspruchen, sonst
   entstünde unter seiner Kopfzeile ein leerer Block — `flex: none` statt
   des `flex-grow` aus `heightFr` (siehe `applyPanelHeights()`), und die
   Mindesthöhe `--panel-min` (die für ein Panel MIT Inhalt gilt) fällt
   ebenfalls weg. */
.panel.panel-collapsed { flex: none; min-height: 0; }
/* Vorschau im Kopf eines zugeklappten Panels („nächster: …" bzw. das
   nächste Spiel) — sie ist der Grund, warum Zuklappen mehr ist als
   Ausblenden: Man behält die eine Zeile, auf die es ankommt. Einzeilig mit
   Auslassung statt Umbruch: Die Kopfzeile darf nicht wachsen. */
.panel-preview {
  flex: 1 1 8rem; min-width: 0; font-size: .82rem; color: var(--ink-soft);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.note { font-size: .82rem; color: var(--ink-soft); margin: 6px 0 0; }
.note.warn { color: var(--warn); font-weight: 600; }

/* ── Bedienung ─────────────────────────────────────────────────────────
   Antippen–Antippen ist der Hauptweg: Er funktioniert auf jedem Gerät, ist
   einhändig bedienbar (die andere Hand hält das Klemmbrett) und lässt sich
   ansagen. */
.row.pick { cursor: pointer; }
.row.pick:hover { border-color: #cbd5e1; }
.row[aria-selected="true"] {
  background: var(--ink); color: #fff; border-color: var(--ink);
}
.row[aria-selected="true"] .no,
.row[aria-selected="true"] .draw,
.row[aria-selected="true"] .vs { color: #cbd5e1; }
.row:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Das Aktionsband klebt unter der Kopfzeile und verschwindet nicht beim
   Scrollen — sonst weiß man auf einem Tablet nach zwei Wischern nicht mehr,
   was gewählt ist. */
.action-bar {
  /* **Über** der Kopfzeile, nicht darunter und nicht im Fluss. Als Element
     im Fluss schob es beim Erscheinen die ganze Seite nach unten — man
     tippt ein Spiel an, zielt auf ein Feld, und unter dem Finger ist
     plötzlich ein anderes. Es legt sich deshalb über die Kopfzeile: Deren
     Inhalt (Turniername, Hallenfilter, Anzeige-Menü) braucht man während
     einer laufenden Auswahl ohnehin nicht, und so verschiebt sich nichts.
     `min-height` hält es genau so hoch wie den Kopf, den es verdeckt. */
  position: fixed; top: 0; left: 0; right: 0; z-index: 25;
  min-height: var(--kopf, 62px);
  display: none; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--ink); color: #fff;
}
.action-bar.show { display: flex; }
.action-bar .what { font-weight: 650; flex: 1 1 12rem; min-width: 0; }
.action-bar .hint { color: #cbd5e1; font-size: .9rem; }
.action-bar button {
  font: inherit; font-weight: 650; padding: 9px 16px; min-height: var(--touch-komf);
  border-radius: 8px; border: 1px solid #475569;
  background: transparent; color: #fff; cursor: pointer;
}
.action-bar button:hover { background: #1e293b; }

/* Ein Feld, das das gewählte Spiel aufnehmen kann. */
.card.target { cursor: pointer; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(29, 78, 216, .15); }
.card.target:hover { background: #eff6ff; }
/* Nicht erlaubt: gedimmt, aber weiterhin antippbar — der Tipp zeigt den
   Grund. Ins Leere zu tippen erklärt nichts. */
.card.blocked-target { opacity: .55; cursor: pointer; }
/* Unterwegs: sichtbar vorläufig, nicht als Tatsache dargestellt. */
.card.pending { border-style: dashed; border-color: var(--accent); background: #eff6ff; }
.card.pending .empty-hint { color: var(--accent); font-style: normal; font-weight: 600; }

/* Ziehen: Der Klon folgt dem Finger. Bewusst schlicht — er soll zeigen,
   was transportiert wird, nicht die Aufmerksamkeit von den Zielfeldern
   abziehen. */
.drag-ghost {
  position: fixed; z-index: 60; pointer-events: none;
  padding: 8px 12px; border-radius: 8px;
  background: var(--ink); color: #fff; font-weight: 650; font-size: .9rem;
  box-shadow: 0 8px 20px rgba(15,23,42,.28); opacity: .95;
  max-width: 60vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* Während des Ziehens hebt sich das Feld unter dem Finger zusätzlich ab. */
.card.hover-target { background: #dbeafe; border-color: var(--accent); }
/* Nur auf dem Griff selbst das Scrollen unterdrücken — sonst ließe sich die
   Liste auf dem Tablet nicht mehr bewegen. */
.row.pick { touch-action: pan-y; }
/* Bewaffnet/während eines laufenden Zugs zusätzlich visuell markiert — rein
   kosmetisch (Bauklotz-auf-Bauklotz neben dem `.drag-ghost`), NICHT mehr die
   tragende Scroll-Sperre: Die übernimmt seit dem Umbau auf den Zieh-Griff
   (`.drag-griff` unten) das `touch-action: none` DORT, statisch gesetzt statt
   per Klasse mitten in der Geste umgeschaltet. */
.touch-drag-armed { touch-action: none !important; }
/* Zieh-Griff (⠿) statt Long-Press: eigenes kleines Element auf jeder
   ziehbaren Zeile/Kachel, an dem eine Touch-Geste GEZIELT beginnt. Chrome
   legt das erlaubte `touch-action` schon beim allerersten `touchstart` für
   die GESAMTE Geste fest, unabhängig davon, worüber der Finger später
   wandert — deshalb reicht ein einziges, STATISCH gesetztes
   `touch-action: none` GENAU HIER, um natives Scrollen für eine am Griff
   begonnene Geste von Anfang an zuverlässig zu verhindern. Der frühere
   Versuch (Long-Press, `touch-action` per Klasse mitten in der Geste auf
   die ganze Zeile umgeschaltet) verlor auf einem echten Android-Tablet in
   etwa 9 von 10 Versuchen gegen die native Scroll-Erkennung — die reagiert
   schon auf ein Zittern von wenigen Pixeln, oft innerhalb der
   300-ms-Wartezeit, und eine Klassenänderung NACH `touchstart` kommt für
   diese Geste immer zu spät. Der Rest der Zeile/Kachel bleibt normal
   wischbar (`touch-action: pan-y` bzw. Standard) — nur der kleine Griff
   opfert bewusst das Wischen, exakt an der Stelle, an der gezogen wird. */
.drag-griff {
  touch-action: none;
  cursor: grab;
  color: var(--ink-faint);
  font-size: 1rem;
  line-height: 1;
  user-select: none;
  flex: none;
  border-radius: 6px;
}
/* Sichtbarer Fokusring für den Tastaturweg (Pfeiltasten, Code-Review-Fund
   14.08.2026) — ohne das wäre der Griff per Tab erreichbar, aber niemand
   sähe, dass er es gerade ist. */
.drag-griff:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.row .drag-griff {
  /* Trefffläche über Padding auf ~40px vergrößern, per Minus-Rand aus dem
     Fluss zurückrechnen — die übrigen Spalten (Nummer, Namen, Meta) rutschen
     dadurch nicht sichtbar nach rechts. */
  align-self: center;
  padding: .8125rem .625rem;
  margin: -.8125rem -.125rem -.8125rem -.375rem;
}
.card-top .kebab {
  /* Wie der Zieh-Griff daneben: Die 40px-Trefffläche bleibt, ihr Beitrag
     zur Zeilenhöhe wird per Minus-Rand zurückgerechnet — sonst wäre die
     Kopfzeile jeder Kachel plötzlich 40px hoch, und bei 26 Feldern kostet
     das eine ganze Kachelreihe. */
  align-self: center;
  margin: -.4375rem -.25rem -.4375rem 0;
}
.card-top .drag-griff {
  /* An den rechten Rand der Kopfzeile der Kachel drücken (neben Name/
     Abzeichen) statt frei zu positionieren — so weicht er variabel vielen
     Abzeichen von selbst aus, statt sie an einer festen Ecke zu verdecken. */
  margin-left: auto;
  padding: .5rem;
  margin-top: -.5rem; margin-right: -.5rem; margin-bottom: -.5rem;
}

/* Was man zieht oder antippt, markiert man nicht: Ohne das hinterlässt jeder
   Zug eine blau markierte Spur aus Namen und Überschriften, und auf dem
   Tablet springt zusätzlich die Lupe auf. Während eines laufenden Zugs gilt
   es für die ganze Seite — der Zeiger wandert ja über alles. */
.row.pick, .card, .action-bar, .halls, h2, .prep, .kebab-menu {
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
body.dragging { user-select: none; -webkit-user-select: none; cursor: grabbing; }

/* Ohne Verbindung: Alles, was den Turnier-PC bräuchte, sichtbar
   zurücknehmen — Schreib-Aktionen ebenso wie Lese-Abrufe (der
   Punktverlauf wird per HTTP geladen und schlüge offline fehl). */
body.offline .prep,
body.offline .kebab-menu button,
body.offline .wo .actions button,
body.offline .sk #sk-list button,
body.offline #sk-add button,
body.offline .fin-row button { opacity: .45; }

/* Rückmeldung zur letzten Aktion. Bleibt stehen, bis sie weggetippt wird
   oder die nächste Aktion beginnt. */
.toast {
  position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
  z-index: 40; max-width: min(92vw, 40rem);
  display: none; gap: 12px; align-items: flex-start;
  padding: 12px 16px; border-radius: 10px; box-shadow: 0 8px 24px rgba(15,23,42,.18);
  background: var(--ink); color: #fff; font-weight: 600;
}
.toast.show { display: flex; }
.toast.bad { background: #7f1d1d; }
.toast button {
  font: inherit; background: transparent; border: 0; color: #cbd5e1;
  cursor: pointer; padding: 0 4px; min-height: 24px; font-size: 1.1rem;
}

/* Einstieg ohne Zugang: die einzige Stelle, die erklärt statt anzuzeigen. */
.gate { max-width: 34rem; margin: 12vh auto; padding: 24px; text-align: center; }
.gate h1 { font-size: 1.3rem; margin: 0 0 10px; }
.gate p { color: var(--ink-soft); }

/* Ergebnis-Dialog: natives <dialog>, bewusst ohne Polyfill — Escape und
   der Klick auf den Hintergrund kommen dadurch vom Browser mit, auf jedem
   Gerät gleich. Hell und in denselben Formen wie der Rest der Seite, damit
   er nicht wie ein Fremdkörper wirkt. */
dialog#res-dlg {
  border: 0; border-radius: 12px; padding: 0;
  width: min(92vw, 26rem);
  box-shadow: 0 12px 32px rgba(15, 23, 42, .28);
  background: var(--card); color: var(--ink);
}
dialog#res-dlg::backdrop { background: rgba(15, 23, 42, .45); }
dialog#res-dlg form { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
dialog#res-dlg h3 { margin: 0; font-size: 1.05rem; }
dialog#res-dlg .meta { margin: 0; color: var(--ink-soft); font-size: .9rem; }
/* Spalten-Beschriftung, ausgerichtet auf dieselben Maße wie `.res-row`
   darunter (Label-Breite, Eingabe-Breite, „:"-Trenner) — sonst stünde die
   Beschriftung nicht über der Spalte, die sie erklären soll. */
.res-cols { display: flex; align-items: center; gap: 10px; font-size: .78rem; font-weight: 700; color: var(--ink-faint); }
.res-cols .res-cols-spacer { flex: 0 0 4.2rem; }
.res-cols .res-cols-sep { color: var(--ink-faint); }
.res-cols span:not(.res-cols-spacer):not(.res-cols-sep) {
  width: 4.4rem; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#res-sets { display: flex; flex-direction: column; gap: 8px; }
.res-row { display: flex; align-items: center; gap: 10px; }
.res-row label { flex: 0 0 4.2rem; font-weight: 600; font-size: .9rem; color: var(--ink-soft); }
.res-row input {
  width: 4.4rem; font: inherit; font-variant-numeric: tabular-nums; text-align: center;
  padding: 8px 6px; min-height: var(--touch-komf);
  border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink);
}
.res-row span { color: var(--ink-faint); }
#res-add-set {
  align-self: flex-start; font: inherit; font-weight: 650; padding: 8px 14px; min-height: var(--touch-min);
  border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
  cursor: pointer;
}
#res-add-set:hover { border-color: var(--accent); color: var(--accent); }
.fehler { margin: 0; color: var(--alarm); font-weight: 600; font-size: .88rem; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.dlg-foot button {
  font: inherit; font-weight: 650; padding: 9px 16px; min-height: var(--touch-komf);
  border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
  cursor: pointer;
}
#res-save { background: var(--ink); color: #fff; border-color: var(--ink); }
#res-save:disabled { opacity: .6; cursor: default; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
/* ── Punktverlauf-Graph (Spec punktverlauf-graph) ──────────────────────
   Kleiner 📈-Knopf an der Beendet-Zeile (an der Feldkachel seit dem
   Feldtest 17.08.2026 im ⋯-Menü), Overlay mit je Satz einem
   SVG-Liniendiagramm — geladen on-demand, nie im Zustands-Push. */
.fin-row [data-fin-graph] {
  border: 1px solid var(--line); background: var(--card);
  border-radius: 8px; padding: 2px 8px; cursor: pointer; font-size: .85rem;
}
/* Pflege-Ansicht im Overlay: Beschriftung über dem Feld, wie im Setup. */
.off-field { display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; font-size: .85rem; }
.off-field input, .off-field textarea, .off-field select {
  background: var(--card); color: inherit; border: 1px solid var(--line);
  border-radius: 8px; padding: 5px 7px; font: inherit;
}
.off-h3 { margin: 14px 0 6px; font-size: .9rem; }
/* Gewählte Sperren als entfernbare Marken — eine Liste zum Ansehen, nicht
   zum Tippen. */
.off-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
.off-chip {
  display: inline-flex; align-items: center; gap: 4px;
  border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: .8rem;
}
.off-chip button { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0 2px; }
.off-chip button:hover { color: var(--accent); }
.off-hits { list-style: none; margin: 4px 0 0; padding: 0; max-height: 160px; overflow-y: auto; }
.off-hits button {
  display: flex; width: 100%; gap: 8px; align-items: center; text-align: left;
  background: none; border: 0; color: inherit; padding: 4px 6px; cursor: pointer; font: inherit;
}
.off-hits button:hover { background: var(--card); }
#off-seen { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
#off-seen li { display: flex; gap: 8px; align-items: center; }
.graph-overlay {
  position: fixed; inset: 0; z-index: 70;
  display: flex; align-items: center; justify-content: center;
  background: rgba(15, 23, 42, .45); padding: 16px;
}
.graph-overlay[hidden] { display: none; }
.graph-box {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow);
  max-width: 540px; width: 100%; max-height: 90vh;
  display: flex; flex-direction: column;
}
.graph-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line);
  font-weight: 700; font-size: .95rem;
}
.graph-head button {
  border: none; background: none; font-size: 1.4rem; line-height: 1;
  color: var(--ink-faint); cursor: pointer; padding: 2px 6px;
}
.graph-body { padding: 12px 14px; overflow-y: auto; color: var(--ink); }
.graph-body .graph-set-cap {
  font-size: .8rem; font-weight: 700; color: var(--ink-soft);
  margin: 8px 0 2px;
}
.graph-body svg { width: 100%; height: auto; display: block; }
.graph-note { font-size: .78rem; color: var(--ink-faint); margin-top: 8px; }
.graph-note.abweichung { color: var(--warn); font-weight: 600; }

/* ── Profil-Verwaltung (Spec tl-web-panelsystem, ADR 0024/0025) ─────────
   Läuft im selben Overlay-Rahmen wie Punktverlauf/Schiedsrichter-Pflege
   (`.graph-overlay`/`.graph-box`/`.graph-head`/`.graph-body` oben) — zwei
   Ansichten in EINEM Overlay: die Profil-Liste (Katalog, Aktionen je
   Zeile) und der Profil-Editor (Name, Panels, Anzeige-Einstellungen).
   `#profiles-body` wird je nach Ansicht komplett neu gezeichnet
   (`renderProfilesOverlay()`), wie beim Schiedsrichter-Pflege-Overlay. */
.prof-row {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 10px; border: 1px solid var(--line); border-radius: 10px;
  margin-bottom: 8px;
}
.prof-row .prof-name { font-weight: 650; flex: 1 1 8rem; min-width: 0; }
.prof-row .prof-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.prof-row .prof-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.prof-row button, .prof-new button, .prof-editor button {
  font: inherit; font-weight: 650; font-size: .82rem; padding: 7px 11px; min-height: var(--touch-min);
  border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
  cursor: pointer;
}
.prof-row button:hover, .prof-new button:hover, .prof-editor button:hover {
  border-color: var(--accent); color: var(--accent);
}
.prof-row button.primary, .prof-editor button.primary {
  background: var(--ink); color: #fff; border-color: var(--ink);
}
.prof-row button.danger:hover { border-color: var(--alarm); color: var(--alarm); }
.prof-new { display: flex; gap: 8px; margin-top: 4px; }
.prof-new input {
  flex: 1 1 auto; min-width: 0; font: inherit; padding: 8px 10px; min-height: var(--touch-min);
  border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink);
}
.prof-empty-hint { font-size: .85rem; color: var(--ink-soft); margin: 0 0 10px; }
/* Geräte-lokaler Abschnitt der Profil-Liste (Schriftgrößen-Zoom): optisch
   abgetrennt, weil er — anders als alles darüber — NICHT zum geteilten
   Profil gehört, sondern nur zu diesem Gerät. */
.prof-geraet {
  margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 8px;
}
.prof-geraet-label {
  font-size: .72rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .04em; color: var(--ink-faint);
}
.zoom-reihe { display: flex; gap: 6px; flex-wrap: wrap; }
.zoom-reihe button {
  font: inherit; font-weight: 650; padding: 8px 14px; min-height: var(--touch-min);
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--card); color: var(--ink-soft); cursor: pointer;
}
.zoom-reihe button[aria-pressed="true"] {
  border-color: var(--accent); color: var(--accent); font-weight: 700;
}
/* Editor: Name, Panel-Liste (Sichtbarkeit + Reihenfolge), Anzeige-Häkchen
   — bündelt, was vorher auf drei Bedienstellen verstreut war (Spec-Ziel). */
.prof-editor label.prof-field { display: flex; flex-direction: column; gap: 3px; font-size: .85rem; margin-bottom: 10px; }
.prof-editor input[type="text"] {
  font: inherit; padding: 8px 10px; min-height: var(--touch-min);
  border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink);
}
.prof-panels { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.prof-panels li {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--card);
}
/* Kästchen UND Name in einem `label` — die ganze Zeile ist antippbar,
   nicht nur das kleine Kästchen (Touch-Ergonomie ≥ 40px). */
.prof-panels .prof-panel-label {
  flex: 1 1 auto; display: flex; align-items: center; gap: 8px;
  min-height: var(--touch-min); cursor: pointer;
}
.prof-panels .prof-panel-name { font-weight: 600; font-size: .88rem; }
/* Spaltenzuordnung je Panel (Plan tl-liste-vereinfachen F) — nur sichtbar,
   wenn das Profil überhaupt mehr als eine Spalte hat. Beschriftung und
   Auswahl in EINEM `label`, wie die Sichtbarkeits-Zeile daneben. */
.prof-panels .prof-panel-col {
  flex: none; display: flex; align-items: center; gap: 6px;
  min-height: var(--touch-min); font-size: .78rem; color: var(--ink-faint); cursor: pointer;
}
.prof-panels .prof-panel-col select {
  font: inherit; font-size: .85rem; color: var(--ink);
  min-height: var(--touch-min); padding: 4px 6px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--card);
}
/* Dieselbe visuelle Sprache wie das Live-Panel-System — derselbe Griff,
   dieselbe Reorder-Logik (`enableReorderDrag`, gemeinsam genutzt). */
.prof-check {
  width: 22px; height: 22px; flex: none; cursor: pointer; accent-color: var(--accent);
}
/* `label` UMSCHLIESST Kontrollkästchen/Radio UND Text (wie im früheren
   Anzeige-Menü, `.anzeige .menue label`) — die ganze Zeile ist damit
   antippbar, nicht nur das kleine Kästchen selbst (Touch-Ergonomie
   ≥ 40px, Akzeptanzkriterium). */
.prof-editor .checkbox-row, .prof-editor .radio-row {
  display: flex; align-items: center; gap: 9px; padding: 8px 4px; min-height: var(--touch-min);
  font-size: .88rem; cursor: pointer;
}
.prof-editor fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 0 0 12px; }
.prof-editor legend { font-size: .78rem; font-weight: 700; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .05em; padding: 0 4px; }
</style>
</head>
<body>

<div id="gate" class="gate" hidden>
  <h1>Diese Seite braucht einen Zugang</h1>
  <p>Öffne sie über den QR-Code in bts-light unter <b>Turnierleitung → Geräte</b>.
     Der Zugang wird dabei einmalig auf diesem Gerät hinterlegt.</p>
</div>

<div id="app" hidden>
  <header>
    <span class="brand">Turnierleitung</span>
    <span class="tournament" id="tournament"></span>
    <span class="halls" id="halls"></span>
    <button type="button" class="auto" id="auto-toggle" hidden></button>
    <span class="conn" id="conn"><span class="dot"></span><span id="conn-text">verbinde …</span></span>
    <!-- Profile (Spec tl-web-panelsystem) ersetzen das frühere
         Anzeige-Klappmenü — Panel-Sichtbarkeit/-Reihenfolge/-Höhe UND die
         früheren Einzelschalter leben jetzt gebündelt im aktiven Profil,
         verwaltet im Overlay unten (`#profiles-overlay`). -->
    <!-- Fernbefehl „alle Tablets neu laden" (Spec `tablet-version-abgleich`).
         Selten gebraucht, deshalb unauffällig neben den Profilen und nicht
         als eigener Bedien-Cluster — aber mit Rückfrage, denn er trifft auch
         Tablets mit laufendem Spiel. Bleibt verborgen, solange der
         Turnier-PC den Befehl nicht kennt (`can_reload_tablets`). -->
    <button type="button" class="profiles-btn" id="tablets-reload" hidden
            title="Alle Zähltablets ihre Seite neu laden lassen">⟳ Tablets</button>
    <button type="button" class="profiles-btn" id="profiles-open">Profile</button>
  </header>
  <div class="banner" id="banner"></div>
  <div class="action-bar" id="action-bar">
    <span class="what" id="action-what"></span>
    <span class="hint" id="action-hint">jetzt ein Feld antippen</span>
    <button type="button" id="action-result" hidden>Ergebnis eintragen</button>
    <button type="button" id="action-free" hidden>Vom Feld nehmen</button>
    <button type="button" id="action-cancel">Abbrechen</button>
  </div>
  <!-- Der ganze Arbeitsbereich wird dynamisch aus dem aktiven Profil
       gebaut (Plan tl-liste-vereinfachen F): ein bis drei Spalten
       (`.tl-column`), dazwischen Spalten-Stege, in jeder Spalte die ihr
       zugeordneten Panels samt Höhen-Stegen. Kein statisches Markup mehr —
       weder für „Felder" (die frühere fixierte Ankerposition) noch für die
       übrigen Panels: Sichtbarkeit, Reihenfolge, Höhe, Klappzustand UND
       Spalte kommen aus `panels[]`/`columns`, und nichts davon überlebte
       als `<details>`/`hidden`-Attribut den 2-Sekunden-Redraw. -->
  <main id="cols"></main>
</div>

<!-- Außerhalb von #app, wie der Toast: Weder #courts noch #queue noch
     #fin-list dürfen den offenen Dialog beim nächsten Abruf aus dem DOM
     reißen — sie werden alle zwei Sekunden per innerHTML neu gezeichnet. -->
<dialog id="res-dlg">
  <form method="dialog" id="res-form">
    <h3 id="res-title">Ergebnis eintragen</h3>
    <p class="meta" id="res-pair"></p>
    <!-- Nur sichtbar, wenn der Aufrufer Namen mitgibt (Task 7 bleibt ohne
         sie funktionsfähig) — linke Spalte = Team1, rechte = Team2, exakt
         wie die Satzfelder darunter. Verhindert, dass eine plausible, aber
         seitenvertauschte Eingabe unbemerkt den Sieger dreht. -->
    <div class="res-cols" id="res-cols" hidden>
      <span class="res-cols-spacer" aria-hidden="true"></span>
      <span id="res-col-1"></span>
      <span class="res-cols-sep" aria-hidden="true">:</span>
      <span id="res-col-2"></span>
    </div>
    <div id="res-sets"></div>
    <button type="button" id="res-add-set">+ Satz</button>
    <p class="fehler" id="res-error" hidden></p>
    <div class="dlg-foot">
      <button type="button" id="res-cancel">Abbrechen</button>
      <button type="submit" id="res-save">Speichern</button>
    </div>
  </form>
</dialog>

<!-- Punktverlauf-Overlay: Inhalt kommt on-demand von /tl/api/timeline/…
     und wächst bei laufenden Spielen im Poll-Takt mit. -->
<div class="graph-overlay" id="graph-overlay" hidden>
  <div class="graph-box">
    <div class="graph-head">
      <span id="graph-title">Punktverlauf</span>
      <button type="button" id="graph-close" aria-label="Punktverlauf schließen">×</button>
    </div>
    <div class="graph-body" id="graph-body"></div>
  </div>
</div>

<!-- Schiedsrichterzettel (Spec schiedsrichterzettel-druck, ADR 0039):
     Dasselbe Overlay-Muster wie der Punktverlauf. Das Dokument kommt
     fertig vom Turnier-PC und wird in einem iframe gezeigt; gedruckt
     wird über den Browser, „als PDF speichern" über den Systemdialog. -->
<div class="graph-overlay" id="zettel-overlay" hidden>
  <div class="graph-box">
    <div class="graph-head">
      <span id="zettel-title">Schiedsrichterzettel</span>
      <span>
        <button type="button" id="zettel-print">Drucken</button>
        <button type="button" id="zettel-close" aria-label="Zettel schließen">×</button>
      </span>
    </div>
    <div class="graph-body" id="zettel-body"></div>
  </div>
</div>

<!-- Schiedsrichter-Pflege: Sperrlisten, Verein und Einsätze kommen
     on-demand von /tl/api/officials/… — sie stehen bewusst NICHT im
     Zustand, den jedes Gerät bekommt (Personendaten). -->
<div class="graph-overlay" id="off-overlay" hidden>
  <div class="graph-box">
    <div class="graph-head">
      <span id="off-title">Schiedsrichter</span>
      <button type="button" id="off-close" aria-label="schließen">×</button>
    </div>
    <div class="graph-body" id="off-body"></div>
  </div>
</div>

<!-- Profil-Verwaltung (Spec tl-web-panelsystem, ADR 0024/0025): Anlegen,
     Umbenennen, Löschen, Standard markieren, für dieses Gerät wählen.
