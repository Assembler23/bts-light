        // Unter der Schwelle ist es ein Tipp, kein Zug — sonst löste jedes
        // Wackeln beim Antippen einen Zug aus.
        if (Math.hypot(dx, dy) < DRAG_THRESHOLD_PX) return;
        // Auswählen, OHNE die Liste neu zu zeichnen: Sonst verschwände die
        // gegriffene Zeile mitten im Zug unter dem Finger. Nur die Felder
        // müssen sich ändern (sie zeigen jetzt, wer das Spiel aufnehmen
        // kann). Ein Zeigegesten-Fang ist nicht nötig — die Ereignisse
        // hängen ohnehin am Fenster.
        dragging = true;
        // Während des Zugs nirgends Text markieren: Der Zeiger wandert über
        // Überschriften und Namen, und der Browser markiert alles auf dem
        // Weg — die halbe Seite steht dann blau hinterlegt da.
        document.body.classList.add("dragging");
        document.getSelection()?.removeAllRanges();
        picked = { match, fromCourtId: fromCourtId ?? null };
        renderActionBar();
        renderCourts();
        ghost = document.createElement("div");
        ghost.className = "drag-ghost";
        ghost.textContent =
          `${(match.team1 || []).join(" / ")} vs. ${(match.team2 || []).join(" / ")}`;
        document.body.appendChild(ghost);
      }
      ghost.style.left = ev.clientX + 14 + "px";
      ghost.style.top = ev.clientY - 14 + "px";
      // Das Feld unter dem Finger hervorheben. `elementFromPoint` ignoriert
      // den Klon, weil der keine Zeigeereignisse annimmt.
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      const card = under && under.closest(".card[data-court]");
      if (card !== hovered) {
        hovered?.classList.remove("hover-target");
        hovered = card;
        if (hovered && !hovered.classList.contains("blocked-target")) {
          hovered.classList.add("hover-target");
        }
      }
    };

    const finish = (ev, cancelled) => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", cancel);
      document.body.classList.remove("dragging");
      document.getSelection()?.removeAllRanges();
      hovered?.classList.remove("hover-target");
      ghost?.remove();
      if (!ghost) { dragging = false; return; }  // war ein Tipp, der Klick greift
      // Nach einem Zug folgt noch ein Klick-Ereignis. Ohne diese Sperre
      // würde es die gerade getroffene Auswahl gleich wieder aufheben.
      suppressNextClick = true;
      setTimeout(() => { suppressNextClick = false; }, 0);
      // Das Ziel bestimmen, SOLANGE das Layout noch unverschoben ist.
      const card = cancelled
        ? null
        : document.elementFromPoint(ev.clientX, ev.clientY)?.closest(".card[data-court]");
      const court = card && state.courts.find((c) => String(c.court_id) === card.dataset.court);
      dragging = false;
      if (cancelled) {
        // Abgebrochen: Die Auswahl bleibt stehen, und jetzt erscheint das
        // Band — der Rettungsanker greift von selbst, ohne dass jemand
        // merken muss, dass etwas schiefging.
        renderActionBar();
        renderQueue();
        return;
      }
      if (court) {
        assignTo(court);
      } else {
        // Neben ein Feld losgelassen: Auswahl behalten und das Band zeigen,
        // statt die Aktion stillschweigend zu verwerfen.
        renderActionBar();
        renderQueue();
      }
    };
    const up = (ev) => finish(ev, false);
    const cancel = (ev) => finish(ev, true);

    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", cancel);
  });
}

// ── Ziehen auf Touch-Geräten (Zieh-Griff) ────────────────────────────────
// Eigener Automat statt eines Zweigs im Maus-Code oben: Die Zustände
// unterscheiden sich zu sehr (sofortiges statt schwellenwertbasiertes
// Bewaffnen, Zeigegesten-Einfangen), um sie ohne Verrenkungen zu teilen.
// Was gleich bleibt, wird bewusst wiederverwendet: dieselbe
// `picked`-Zuweisung, derselbe Geist (`.drag-ghost`), dasselbe `assignTo`
// beim Loslassen über einem Feld — ein Doppel der Zuweisungslogik wäre die
// eigentliche Fehlerquelle.
//
// KEIN Long-Press mehr, KEINE Bewegungsschwelle vorm Bewaffnen: Die Geste
// beginnt schon gezielt auf dem Griff (siehe `enableDrag` und die
// CSS-Erklärung bei `.drag-griff`) — dort ist jeder Zeigegesten-Start
// automatisch ein gewollter Zug, eine Wartezeit zum Unterscheiden „Wischen
// oder Ziehen" wird nicht mehr gebraucht.
/** Ab dieser Bewegung gilt der Griff als GEZOGEN statt nur angetippt —
 *  entscheidet NICHT, ob bewaffnet wird (das passiert immer sofort),
 *  sondern nur, was beim Loslassen passiert (siehe `teardown`). */
const TOUCH_TAP_PX = 6;

function startTouchDrag(el, match, fromCourtId, down) {
  // Belegt den Wächter oben für die gesamte Lebensdauer dieses Automaten —
  // vom ersten Antippen bis zum letzten `teardown`. Ein zweiter Finger, der
  // in der Zwischenzeit auf irgendeinem Griff `pointerdown` auslöst, wird
  // dort abgewiesen, bevor ein zweiter Automat entstehen kann.
  touchDragPending = true;
  // Der 2-Sekunden-Poll könnte `el` zwischen zwei Ereignissen ersetzt haben
  // (die Liste wird per `innerHTML` neu gezeichnet) — bei einem SOFORT
  // bewaffneten Zug bleibt dafür praktisch kein Zeitfenster mehr (anders als
  // beim verworfenen Long-Press-Anlauf mit seiner 300-ms-Lücke), die Prüfung
  // bleibt trotzdem als billige Absicherung stehen: Ohne sie bliebe der
  // Automat auf „bewaffnet"/„zieht" stehen, ohne `picked` und ohne Geist zu
  // setzen, und der nächste Tipp würde verschluckt (`suppressNextClick`),
  // ohne dass je etwas zugewiesen wurde.
  if (!el.isConnected) { touchDragPending = false; return; }

  const pointerId = down.pointerId;
  let ghost = null;
  let hovered = null;
  let moved = false;

  function updateGhost(x, y) {
    ghost.style.left = x + 14 + "px";
    ghost.style.top = y - 14 + "px";
    // Das Feld unter dem Finger hervorheben. `elementFromPoint` ignoriert
    // den Klon von sich aus (`.drag-ghost` trägt `pointer-events: none`,
    // siehe CSS) — wie beim Maus-Weg.
    const under = document.elementFromPoint(x, y);
    const card = under && under.closest(".card[data-court]");
    if (card !== hovered) {
      hovered?.classList.remove("hover-target");
      hovered = card;
      if (hovered && !hovered.classList.contains("blocked-target")) {
        hovered.classList.add("hover-target");
      }
    }
  }

  dragging = true;
  // Klasse rein kosmetisch (siehe CSS) — die tragende Scroll-Sperre ist das
  // statische `touch-action: none` auf dem Griff selbst, schon von Anfang
  // an gültig, nicht erst ab hier.
  el.classList.add("touch-drag-armed");
  // Nativer `touchmove`-Listener mit `{passive:false}`, NICHT der
  // Pointer-Event: Nur ein `preventDefault` auf dem zugrunde liegenden
  // Touch-Ereignis unterdrückt das Scrollen zuverlässig, auch für den
  // Rest der Geste, sobald der Finger den Griff längst verlassen hat. Als
  // Fenster-Listener zusätzlich immun gegen den 2-Sekunden-Redraw.
  window.addEventListener("touchmove", blockScroll, { passive: false });
  // `setPointerCapture` ist für Touch eigentlich redundant (der Browser
  // fängt die Zeigegesten eines Fingers ohnehin implizit ein) — bleibt
  // trotzdem als zusätzliche Absicherung, damit Ereignisse sicher
  // weiterkommen, falls der Finger über andere Elemente wandert. Im
  // try/catch wie die Freigabe unten: `el` könnte inzwischen doch
  // verschwunden sein.
  try { el.setPointerCapture(pointerId); } catch { /* el bereits weg */ }
  document.body.classList.add("dragging");
  document.getSelection()?.removeAllRanges();
  picked = { match, fromCourtId: fromCourtId ?? null };
  renderActionBar();
  renderCourts();
  ghost = document.createElement("div");
  ghost.className = "drag-ghost";
  ghost.textContent =
    `${(match.team1 || []).join(" / ")} vs. ${(match.team2 || []).join(" / ")}`;
  document.body.appendChild(ghost);
  updateGhost(down.clientX, down.clientY);

  /** Unterdrückt das native Scrollen, solange gezogen wird — siehe oben. */
  function blockScroll(ev) { ev.preventDefault(); }

  function move(ev) {
    if (ev.pointerId !== pointerId) return;
    if (!moved && Math.hypot(ev.clientX - down.clientX, ev.clientY - down.clientY) > TOUCH_TAP_PX) {
      moved = true;
    }
    updateGhost(ev.clientX, ev.clientY);
  }

  function teardown(ev, cancelled) {
    touchDragPending = false;
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    window.removeEventListener("pointercancel", cancel);
    // Auf JEDEM Ausstiegspfad entfernen — ein liegen gebliebener
    // `touchmove`-Blocker wäre der teuerste denkbare Folgefehler: totes
    // Scrollen für die ganze Liste.
    window.removeEventListener("touchmove", blockScroll, { passive: false });
    document.body.classList.remove("dragging");
    document.getSelection()?.removeAllRanges();
    hovered?.classList.remove("hover-target");
    ghost?.remove();
    el.classList.remove("touch-drag-armed");
    try { el.releasePointerCapture(pointerId); } catch { /* Finger schon weg */ }
    dragging = false;
    // Nach einem Zug folgt noch ein Klick-Ereignis. Ohne diese Sperre würde
    // es die gerade getroffene Auswahl gleich wieder aufheben.
    suppressNextClick = true;
    setTimeout(() => { suppressNextClick = false; }, 0);
    if (cancelled) {
      // Abgebrochen (Finger weg, Browser übernimmt die Geste): Die Auswahl
      // bleibt stehen, das Band erscheint — derselbe Rettungsanker wie beim
      // Maus-Weg.
      renderActionBar();
      renderQueue();
      return;
    }
    if (!moved) {
      // Reiner Tipp auf den Griff, ohne zu ziehen: bewusst KEINE Auswahl.
      // Der Griff ist eine Ziehfläche, kein zweiter Antipp-Weg — anders als
      // beim abgebrochenen Zug oben bleibt hier nichts „gewählt" stehen,
      // damit ein versehentliches Antippen des Griffs nicht wie ein Tipp
      // auf die Zeile wirkt (die bleibt dafür über `suppressNextClick`
      // ohnehin stumm, siehe `enableDrag`).
      picked = null;
      renderActionBar();
      renderCourts();
      renderQueue();
      return;
    }
    const card = document.elementFromPoint(ev.clientX, ev.clientY)?.closest(".card[data-court]");
    const court = card && state.courts.find((c) => String(c.court_id) === card.dataset.court);
    if (court) {
      assignTo(court);
    } else {
      renderActionBar();
      renderQueue();
    }
  }

  // Denselben Finger filtern — ein zweiter, versehentlicher Finger (z. B.
  // der Handballen beim Halten) darf den Zug des ersten weder beenden noch
  // abbrechen. Der Wächter oben (`touchDragPending`/`dragging`) verhindert
  // schon, dass ein zweiter Finger einen EIGENEN Automaten startet — dieser
  // Filter verhindert zusätzlich, dass er den LAUFENDEN stört.
  const up = (ev) => { if (ev.pointerId === pointerId) teardown(ev, false); };
  const cancel = (ev) => { if (ev.pointerId === pointerId) teardown(ev, true); };

  window.addEventListener("pointermove", move, { passive: false });
  window.addEventListener("pointerup", up);
  window.addEventListener("pointercancel", cancel);
}

// ── Listen per Drag&Drop umsortieren (wiederverwendbar) ──────────────────
// Eigener, von `enableDrag`/`startTouchDrag` UNABHÄNGIGER Automat (eigene
// Wächter-Variable) — die Geste ist grundverschieden (eine Zeile wandert
// INNERHALB ihrer eigenen Liste, statt auf ein fremdes Ziel fallengelassen
// zu werden), aber dieselben hart erarbeiteten Touch-Lektionen gelten
// unverändert: Zieh-Griff mit statischem `touch-action:none` (`.drag-griff`,
// s. o.), zusätzlich ein nativer `touchmove`-Blocker mit `{passive:false}`
// für den Rest der Geste (der Finger verlässt den Griff ja gerade, wenn
// Zeilen einsortiert werden), `setPointerCapture`, Pointer-ID-Filter gegen
// einen zweiten Finger.
//
// Bewusst OHNE jeden Bezug zur Schiedsrichter-Fachlichkeit — eine künftige
// Liste (geplant: Spielliste) braucht nur `data-id` an den direkten
// Kind-Elementen und je einen `.drag-griff` darin, dann funktioniert sie
// genauso über `enableReorderDrag(container, onReorder)`.
//
// Zieh-Griff-Pflicht für BEIDE Zeigertypen (anders als `enableDrag` oben,
// das für Maus die ganze Zeile/Kachel greifbar lässt): Eine Listenzeile
// trägt hier mehrere eigene Knöpfe (Pause, Sperren, Einsätze …) — ein
// Maus-Zug ab irgendwo auf der Zeile kollidierte damit ständig mit einem
// Klick auf einen dieser Knöpfe.
let reorderDragPending = false;

/**
 * `list`: Container, dessen direkte Kind-Elemente mit `[data-id]` die
 * sortierbaren Zeilen sind (jede braucht innen einen Griff, standardmäßig
 * `.drag-griff`). `onReorder(id, beforeId, zielListe)`: nur aufgerufen,
 * wenn sich die Reihenfolge beim Loslassen tatsächlich geändert hat;
 * `id`/`beforeId` sind die `data-id`-Werte als String, `beforeId === null`
 * heißt „ans Ende". `griffSelector` (Default `.drag-griff`) generalisiert
 * dasselbe Muster auf das Panel-Reorder (Spec tl-web-panelsystem): dort ist
 * der Griff `.panel-griff` — bewusst ein ANDERES Sinnbild, damit „ganzes
 * Panel verschieben" nie mit „eine Zeile verschieben" verwechselt wird,
 * aber dieselbe erprobte Zeigegesten-/Tastatur-Logik dahinter.
 *
 * `geschwister()` (optional) liefert ALLE Container, in die dasselbe
 * Element fallen darf — gebraucht seit dem Mehrspalten-Layout (Plan
 * tl-liste-vereinfachen F): Ein Panel muss auch in eine ANDERE Spalte
 * gezogen werden können, nicht nur innerhalb seiner eigenen. Ohne die
 * Angabe bleibt es beim bisherigen Verhalten (nur die eigene Liste), das
 * für Spielliste, Schiedsrichter und den Profil-Editor genau richtig ist.
 * `zielListe` sagt dem Rückruf, wo das Element gelandet ist.
 */
function enableReorderDrag(list, onReorder, griffSelector, geschwister) {
  Array.from(list.children).forEach((li) =>
    wireReorderGriff(list, li, onReorder, griffSelector, geschwister));
}

/** Die Griff-Verdrahtung EINER Zeile — herausgelöst aus
 *  `enableReorderDrag`, damit der Keyed-Abgleich der Spielliste nur
 *  neue/ersetzte Zeilen verdrahten kann, ohne allen bestehenden Zeilen
 *  doppelte Listener anzuhängen. Die Vorgabewerte leben NUR hier. */
function wireReorderGriff(list, li, onReorder, griffSelector = ".drag-griff", geschwister = null) {
  if (!li.dataset.id) return;
  const griff = li.querySelector(griffSelector);
    griff?.addEventListener("pointerdown", (down) => {
      if (down.pointerType !== "touch" && down.button !== 0) return;
      if (reorderDragPending) return;
      startReorderDrag(list, li, down, onReorder, geschwister);
    });
    // Tastatur-/Screenreader-Weg (Code-Review-Fund 14.08.2026): ohne die
    // frühere Pfeil-Bedienung bräuchte es sonst gar keinen Nicht-Zieh-Weg
    // mehr, die Reihenfolge zu ändern — dieselbe Vor-/Zurück-Formel wie die
    // entfernten Pfeile, jetzt am fokussierten Griff.
    griff?.addEventListener("keydown", (ev) => {
      if (ev.key !== "ArrowUp" && ev.key !== "ArrowDown") return;
      ev.preventDefault();
      const items = Array.from(list.children).filter((el) => el.dataset.id);
      const i = items.indexOf(li);
      if (i === -1) return;
      // Der Tastaturweg bleibt bewusst INNERHALB der eigenen Liste: Ein
      // Spaltenwechsel per Pfeiltaste hätte keine erkennbare Richtung
      // („links/rechts" gibt es im gestapelten Layout gar nicht). Wer die
      // Spalte ohne Zeigegerät ändern will, tut das im Profil-Editor, der
      // dafür eine ausdrückliche Auswahl je Panel hat.
      if (ev.key === "ArrowUp") {
        if (i === 0) return;
        onReorder(li.dataset.id, items[i - 1].dataset.id, list);
      } else {
        if (i >= items.length - 1) return;
        const beforeId = i + 2 < items.length ? items[i + 2].dataset.id : null;
        onReorder(li.dataset.id, beforeId, list);
      }
    });
}

/**
 * Nächster scrollbarer Vorfahre (den Container selbst eingeschlossen) —
 * generisch statt an einen Panel-Klassennamen gebunden, weil
 * `enableReorderDrag` an ganz verschiedenen Containern hängt (Spielliste,
 * Schiedsrichter-Liste, Spalten-Stapel, Profil-Dialog). Der Zieh-Container
 * selbst (z. B. `#queue-list`) trägt oft KEIN eigenes `overflow` — der
 * tatsächliche Rahmen, der die Geste sichtbar begrenzt und scrollen soll,
 * ist `.panel-body`, ein VORFAHRE davon. Ohne diese Suche würde sowohl die
 * „Maus noch im Panel"-Grenze als auch das Auto-Scrollen am falschen
 * (ungeklippten) Element ansetzen.
 */
function findScrollAncestor(el) {
  let node = el;
  while (node && node !== document.documentElement) {
    if (getComputedStyle(node).overflowY === "auto"
      || getComputedStyle(node).overflowY === "scroll") return node;
    node = node.parentElement;
  }
  return el;
}

function startReorderDrag(list, li, down, onReorder, geschwister = null) {
  reorderDragPending = true;
  const pointerId = down.pointerId;
  const isTouch = down.pointerType === "touch";
  /** Alle Container, in die das Element fallen darf — ohne Angabe nur der
   *  eigene (bisheriges Verhalten). */
  const listen = () => (geschwister ? geschwister() : [list]);
  const items = (l) => Array.from(l.children).filter((el) => el.dataset.id);
  const originalParent = li.parentElement;
  // Einmal berechnet, nicht bei jedem `move()` — `getComputedStyle` bei
  // 60 Ereignissen pro Sekunde wäre unnötige Arbeit für einen Wert, der sich
  // während des Zugs nicht ändert.
  const scrollBox = findScrollAncestor(originalParent);
  const originalNext = li.nextElementSibling;
  const before = items(originalParent);
  li.classList.add("dragging-item");
  document.body.classList.add("dragging");
  document.getSelection()?.removeAllRanges();
  try { li.setPointerCapture(pointerId); } catch { /* Finger schon weg */ }

  // Wie bei `startTouchDrag`: Nur ein nativer `touchmove`-Blocker verhindert
  // zuverlässig das Scrollen für die GANZE Geste, sobald der Finger den
  // Griff (dessen `touch-action:none` nur dort gilt) verlassen hat.
  function blockScroll(ev) { ev.preventDefault(); }
  if (isTouch) {
    window.addEventListener("touchmove", blockScroll, { passive: false });
  }

  /** In welchen Container zeigt der Finger gerade? Erst der echte Treffer,
   *  sonst der nächstgelegene — der Finger darf über den Rand einer Spalte
   *  hinausragen (kurze Spalte, Rand des Fensters), ohne dass das Panel
   *  zurückspringt. Bei nur einem Container fällt beides zusammen. */
  function zielListe(ev) {
    const alle = listen();
    if (alle.length === 1) return alle[0];
    for (const l of alle) {
      const r = l.getBoundingClientRect();
      if (ev.clientX >= r.left && ev.clientX <= r.right
        && ev.clientY >= r.top && ev.clientY <= r.bottom) return l;
    }
    let beste = li.parentElement, kleinste = Infinity;
    for (const l of alle) {
      const r = l.getBoundingClientRect();
      const dx = Math.max(r.left - ev.clientX, 0, ev.clientX - r.right);
      const dy = Math.max(r.top - ev.clientY, 0, ev.clientY - r.bottom);
      const d = dx + dy;
      if (d < kleinste) { kleinste = d; beste = l; }
    }
    return beste;
  }

  function move(ev) {
    if (ev.pointerId !== pointerId) return;
    // Umsortierung nur, wenn die Maus im sichtbaren Bereich des scrollbaren
    // Panels bleibt (`scrollBox`, nicht der ungeklippte Zieh-Container) —
    // sonst könnte ein Zug zu den Feldkacheln unbeabsichtigt die Reihenfolge
    // ändern (ADR 0027: Umsortier-Griff nur im eigenen Panel aktiv).
    const r = scrollBox.getBoundingClientRect();
    const mouseInPanel = ev.clientX >= r.left && ev.clientX <= r.right
      && ev.clientY >= r.top && ev.clientY <= r.bottom;
    if (!mouseInPanel) return;

    // Auto-Scroll während des Drag-Vorgangs: Wenn die Maus am oberen oder
    // unteren Rand des sichtbaren Panels ist, wird `scrollBox` (das
    // tatsächlich scrollende Element, siehe `findScrollAncestor`)
    // automatisch gescrollt, damit Zeilen außerhalb des sichtbaren Bereichs
    // erreicht werden können.
    const SCROLL_MARGIN = 40; // px vom oberen/unteren Rand
    const SCROLL_SPEED = 8; // px pro move-Event
    if (ev.clientY < r.top + SCROLL_MARGIN) {
      scrollBox.scrollTop = Math.max(0, scrollBox.scrollTop - SCROLL_SPEED);
    } else if (ev.clientY > r.bottom - SCROLL_MARGIN) {
      const maxScroll = scrollBox.scrollHeight - scrollBox.clientHeight;
      scrollBox.scrollTop = Math.min(maxScroll, scrollBox.scrollTop + SCROLL_SPEED);
    }

    const ziel = zielListe(ev);
    const siblings = items(ziel).filter((el) => el !== li);
    let target = null;
    for (const el of siblings) {
      const r = el.getBoundingClientRect();
      if (ev.clientY < r.top + r.height / 2) { target = el; break; }
    }
    if (target) ziel.insertBefore(li, target);
    else ziel.appendChild(li);
  }

  function teardown(ev, cancelled) {
    reorderDragPending = false;
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    window.removeEventListener("pointercancel", cancel);
    if (isTouch) window.removeEventListener("touchmove", blockScroll, { passive: false });
    document.body.classList.remove("dragging");
    li.classList.remove("dragging-item");
    try { li.releasePointerCapture(pointerId); } catch { /* Finger schon weg */ }
    // Nach einem Zug folgt noch ein Klick-Ereignis — ohne diese Sperre
    // würde es auf der Zeile ungewollt zuschlagen (Muster `enableDrag`).
    suppressNextClick = true;
    setTimeout(() => { suppressNextClick = false; }, 0);
    if (cancelled) {
      originalParent.insertBefore(li, originalNext);
      return;
    }
    // Der Container kann sich geändert haben (Zug in eine andere Spalte) —
    // dann ist die Reihenfolge auf jeden Fall eine andere, auch wenn der
    // Platz INNERHALB der neuen Liste zufällig derselbe wäre.
    const ziel = li.parentElement;
    const after = items(ziel);
    const changed = ziel !== originalParent || after.some((el, i) => el !== before[i]);
    if (!changed) return;
    const i = after.indexOf(li);
    const beforeId = i + 1 < after.length ? after[i + 1].dataset.id : null;
    onReorder(li.dataset.id, beforeId, ziel);
    // Auswahl löschen: Nach einem Umsortier-Zug soll kein Spiel mehr zum
    // Umhängen ausgewählt sein (Muster wie in `assignTo()` nach erfolgreicher
    // Zuweisung). Sonst würde die alte Auswahl störend in der neu aufgebauten
    // Liste sichtbar bleiben.
    picked = null;
    renderActionBar();
    renderQueue();
  }
  const up = (ev) => { if (ev.pointerId === pointerId) teardown(ev, false); };
  const cancel = (ev) => { if (ev.pointerId === pointerId) teardown(ev, true); };
  window.addEventListener("pointermove", move, { passive: false });
  window.addEventListener("pointerup", up);
  window.addEventListener("pointercancel", cancel);
}

// ── Panel-System (Spec tl-web-panelsystem) ─────────────────────────────
// Alle sechs Abschnitte laufen über EINEN Mechanismus: eine einheitliche
// Kopfzeile (`panelHeadHtml`), Sichtbarkeit/Reihenfolge/Spalte aus dem
// aktiven Profil (`renderPanels`), Höhen und Spaltenbreiten über EINEN
// Steg-Griff-Mechanismus (`wireStegs`, waagerecht wie senkrecht).
// „Felder" ist seit dem Mehrspalten-Layout (Plan tl-liste-vereinfachen F)
// ein Panel wie jedes andere: eigener Reorder-Griff, eigene Spalte, eigene
// Steg-Nachbarn — der frühere Sonderstatus als fixierte Ankerposition
// außerhalb des Panel-Stapels ist entfallen.

/** Ist ein Panel bei DIESER Installation überhaupt vorhanden — unabhängig
 *  von der Sichtbarkeits-Einstellung im Profil? Die beiden optionalen
 *  Module (Zähltafel-Verwaltung, Schiedsrichter-Verwaltung) gibt es nur,
 *  wenn die Installation sie eingeschaltet hat — bisher die `hidden`-Regel
 *  auf `#sk-box`/`#off-box`, jetzt hier zentral geprüft. */
function panelAvailable(key) {
  if (key === "scorekeepers") return !!(state && state.scorekeeper_managed);
  if (key === "officials") return !!(state && state.officials_managed);
  // Spielzeiten-Auswertung (Spec spielzeiten-prognose): nur wenn der Host
  // sie liefert — also Prognose eingeschaltet UND Host neu genug.
  if (key === "times") return !!(state && state.time_stats);
  // Check-In-Anfangszeiten (Feldtest 17.08.2026): nur wenn der Host das
  // Feld liefert — also Check-In eingerichtet, badhub erreichbar UND Host
  // neu genug. Eine leere Liste (heute keine Zeiten) zeigt das Panel mit
  // Hinweis, `null` versteckt es.
  if (key === "checkin") return !!(state && Array.isArray(state.checkin_times));
  return true;
}

/** Aktualisiert NUR den Zähler eines bereits gezeichneten Panels — läuft
 *  bei JEDEM Poll (jede `render*()`-Funktion ruft das für ihr Panel auf),
 *  unabhängig davon, ob `renderPanels()` das Gerüst neu gebaut hat.
 *  Fehlt das Element (Panel gerade ausgeblendet), passiert einfach nichts. */
function setPanelCount(key, n) {
  const el = document.getElementById(`panel-count-${key}`);
  if (el) el.textContent = `(${n})`;
}

/** Wie `setPanelCount()`, nur für die Vorschauzeile eines ZUGEKLAPPTEN
 *  Panels (ADR 0026, Plan D): „Schiedsrichter" zeigt den nächsten
 *  Schiedsrichter, „Spiele" das nächste Spiel. Aufgeklappt gibt es das
 *  Element nicht — dann passiert hier nichts, genau wie beim Zähler eines
 *  ausgeblendeten Panels. */
function setPanelPreview(key, text) {
  const el = document.getElementById(`panel-preview-${key}`);
  if (el) el.textContent = text || "";
}

/**
 * Einheitliche Panel-Kopfzeile (Spec tl-web-panelsystem, Akzeptanzkriterium
 * „Titel, Zähler, Ein-/Ausblend-Schalter"; seit ADR 0026 zusätzlich der
 * Auf-/Zuklapp-Schalter). `draggable` fügt den Panel-Reorder-Griff hinzu
 * (nie für „Felder" — die fixierte Ankerposition). `extra` hängt
 * zusätzliches Markup VOR die beiden Schalter (genutzt für den
 * Reihenfolge-zurücksetzen-Knopf bei „Spiele").
 *
 * Sichtbarkeit und Klappzustand sind zwei UNABHÄNGIGE Dimensionen:
 * ausgeblendet = das Panel ist gar nicht da; zugeklappt = die Kopfzeile
 * bleibt, samt Zähler und (bei „Schiedsrichter"/„Spiele") einer Vorschau
 * auf das jeweils Nächste.
 */
function panelHeadHtml(key, visible, draggable, extra = "", collapsed = false) {
  const titel = PANEL_TITLES[key];
  // `key` ist zwar durch `normalizedPanels()` schon auf die feste
  // `PANEL_KEYS`-Liste gefiltert, bevor irgendetwas hier ankommt — trotzdem
  // escaped: sonst hinge die Sicherheit dieser Attribute an einem Filter
  // weit oben im Aufrufpfad, den ein späteres Refactoring lautlos entfernen
  // könnte (`key` reist laut Wire-Vertrag als freier String).
  const k = esc(key);
  const griff = draggable ? `<span class="panel-griff" tabindex="0" role="button" data-id="${k}"
      title="Panel verschieben oder mit Pfeiltasten umsortieren"
      aria-label="${esc(titel)}-Panel in der Reihenfolge verschieben — ziehen oder Pfeiltasten">${PANEL_GRIFF}</span>` : "";
  const visTitel = visible ? "Panel ausblenden" : "Panel einblenden";
  const colTitel = collapsed ? "Panel aufklappen" : "Panel zuklappen";
  // Vorschau nur, wo sie etwas Nützliches sagen kann, und nur zugeklappt.
  // Sie ersetzt dann den Abstandhalter: Zwei wachsende Elemente in einer
  // Zeile teilten sich den Platz und die Vorschau bekäme die Hälfte.
  const mitVorschau = collapsed && (key === "officials" || key === "queue");
  const vorschau = mitVorschau
    ? `<span class="panel-preview" id="panel-preview-${k}"></span>`
    : `<span class="panel-spacer"></span>`;
  return `<header class="panel-head" data-panel="${k}">
      ${griff}
      <span class="panel-title">${esc(titel)}</span>
      <span class="panel-count" id="panel-count-${k}"></span>
      ${vorschau}
      ${extra}
      <button type="button" class="panel-col" data-panel-col="${k}"
        aria-pressed="${collapsed ? "true" : "false"}" title="${colTitel}" aria-label="${colTitel}">
        ${collapsed ? CHEVRON_ZU : CHEVRON_AUF}
      </button>
      <button type="button" class="panel-vis" data-panel-vis="${k}"
        aria-pressed="${visible ? "true" : "false"}" title="${visTitel}" aria-label="${visTitel}">
        ${visible ? AUGE_AUF : AUGE_ZU}
      </button>
    </header>`;
}

/** Innerer Inhalt eines Panels — dieselben stabilen Element-IDs wie vor
 *  dem Panel-System, damit die bestehenden `render*()`-Funktionen (mit
 *  ihren Sonderregeln: Zug-Schutz, „nur bei echter Änderung neu bauen" …)
 *  unverändert weiterarbeiten. Nur die äußere Verpackung ist neu. */
function panelBodySkeleton(key) {
  switch (key) {
    case "courts":
      // Seit dem Mehrspalten-Layout hat auch „Felder" einen ganz normalen
      // Panel-Körper — vorher stand die Kachelbox in einer eigenen,
      // fixierten `<section>` direkt im Markup.
      return `<div id="courts"></div>`;
    case "walkovers":
      return `<div id="walkovers"></div>`;
    case "scorekeepers":
      return `
        <ol id="sk-list"></ol>
        <form id="sk-add">
          <input type="text" id="sk-name" placeholder="Name (Doppel: A / B)" maxlength="80" />
          <button type="submit">Hinzufügen</button>
        </form>`;
    case "officials":
      return `
        <p class="meta" id="off-next"></p>
        <ol id="off-list"></ol>`;
    case "queue":
      // Drei Geschwister statt eines Containers (ADR 0026): `#queue-list`
      // trägt AUSSCHLIESSLICH Zeilen — es ist die Zieh-Liste, und
      // `enableReorderDrag` deutet jedes direkte Kind als möglichen
      // Nachbarn. Nachlade-Marke und Fußnoten stehen deshalb daneben, nicht
      // darin. Die Marke ist leer und unsichtbar; sie existiert nur, damit
      // der `IntersectionObserver` etwas hat, dessen Sichtbarwerden er
      // melden kann (`beobachteQueueEnde`).
      return `
        <div class="queue" id="queue-list"></div>
        <div id="queue-sentinel" aria-hidden="true"></div>
        <div id="queue-foot"></div>`;
    case "finished":
      return `<div id="fin-list"></div>`;
    case "times":
      return `<div id="times-box"></div>`;
    case "checkin":
      return `<div id="checkin-box"></div>`;
    default:
      return "";
  }
}

/** Verdrahtet die beiden Kopfzeilen-Schalter (Sichtbarkeit, Auf-/Zuklappen)
 *  aller Panel-Kopfzeilen innerhalb von `container` (Panel-Stack ODER die
 *  „Felder"-Kopfzeile). Beide Zustände liegen im aktiven Profil und
 *  überstehen damit den Reload — genau wie die Reihenfolge und die Höhen. */
function wirePanelHead(container) {
  container.querySelectorAll("[data-panel-vis]").forEach((btn) => {
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const key = btn.dataset.panelVis;
      mutateActiveProfile((p) => {
        const setting = p.panels.find((x) => x.key === key);
        if (setting) setting.visible = !setting.visible;
      }, null);
    });
  });
  container.querySelectorAll("[data-panel-col]").forEach((btn) => {
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const key = btn.dataset.panelCol;
      mutateActiveProfile((p) => {
        const setting = p.panels.find((x) => x.key === key);
        if (setting) setting.collapsed = !setting.collapsed;
      }, null);
    });
  });
}

/**
 * **Ein** Steg-Mechanismus für beide Achsen (Plan tl-liste-vereinfachen F).
 *
 * `achse === "hoehe"`: `.panel-steg` zwischen zwei `.panel`-Geschwistern
 * EINER Spalte — verteilt `heightFr`.
 * `achse === "breite"`: `.col-steg` zwischen zwei `.tl-column`-Geschwistern
 * in `main` — verteilt `columnWidths`.
 *
 * Beides ist dieselbe Geste auf demselben Flex-Modell, nur um 90° gedreht;
 * der frühere Felder↔Liste-Steg war ein zweiter, halb paralleler
 * Ziehmechanismus mit eigener `localStorage`-Persistenz und ist ersatzlos
 * in dieser Funktion aufgegangen.
 *
 * Der jeweils vorherige/nächste Geschwisterknoten ist IMMER ein sichtbarer
 * Nachbar, weil weder ausgeblendete Panels noch leere Spalten überhaupt
 * gerendert werden (siehe `renderPanels()`) — die „bindet sich automatisch
 * an den nächsten sichtbaren Nachbarn"-Regel (Akzeptanzkriterium) braucht
 * deshalb keine eigene Sonderlogik.
 *
 * Beim Ziehen wird das Verhältnis der beiden Nachbarn aus ihren PIXEL-Maßen
 * umgerechnet (Splitter-Standardmuster) — `heightFr`/`columnWidths` sind
 * relative Gewichtungen, keine Pixelmaße.
 */
/** Läuft gerade ein Steg-Zug? Solange NICHT über `applyPanelHeights()`/
 *  `applyColumnWidths()` neu einpassen — sonst überschriebe der Poll-Takt
 *  (alle 2s) die noch ungespeicherten, live gezogenen `flexGrow`-Werte mit
 *  dem zuletzt GESPEICHERTEN Stand und die Grenze zuckte unter dem Finger
 *  zurück (Muster `reorderDragPending`, dasselbe Problem wie bei Queue-/
 *  Schiedsrichter-Umsortierung). */
let panelStegDragging = false;

function wireStegs(container, achse) {
  const senkrecht = achse === "hoehe";
  const stegWahl = senkrecht ? ".panel-steg" : ".col-steg";
  const nachbarKlasse = senkrecht ? "panel" : "tl-column";
  container.querySelectorAll(`:scope > ${stegWahl}`).forEach((steg) => {
    const prev = steg.previousElementSibling;
    const next = steg.nextElementSibling;
    if (!prev || !next
      || !prev.classList.contains(nachbarKlasse) || !next.classList.contains(nachbarKlasse)) return;
    // Grenzt ein Panel-Rand an ein ZUGEKLAPPTES Panel, gibt es nichts zu
    // verteilen: Das zugeklappte hat keine Inhaltshöhe (`flex: none`), ein
    // Zug würde ihm eine zuweisen und damit genau den leeren Block
    // erzeugen, den das Zuklappen vermeidet. Der Rand bleibt als sichtbare
    // Trennung stehen, nur ohne Griff — und wird auch nicht per Tastatur
    // erreichbar. (Spalten kennen kein Zuklappen, dort entfällt das.)
    if (senkrecht
      && (prev.classList.contains("panel-collapsed") || next.classList.contains("panel-collapsed"))) {
      steg.style.cursor = "default";
      return;
    }
    /** Untergrenze in Pixeln — aufgelöst aus `--panel-min`/`--spalte-min`,
     *  damit die Zahl nur EINMAL im CSS steht. */
    const minPx = () => parseFloat(
      senkrecht ? getComputedStyle(prev).minHeight : getComputedStyle(prev).minWidth,
    ) || 40;
    /** Der gezogene Stand landet im Profil. Höhen schreiben GENAU die
     *  beiden Nachbarn (ein zugeklapptes Panel behält seinen gespeicherten
     *  Anteil, obwohl sein `flexGrow` gerade 0 ist), Breiten schreiben die
     *  ganze, auf die Spaltenzahl normierte Liste. */
    const speichere = (frA, frB) => mutateActiveProfile((p) => {
      if (senkrecht) {
        const a = p.panels.find((x) => x.key === prev.dataset.panel);
        const b = p.panels.find((x) => x.key === next.dataset.panel);
        if (a) a.heightFr = frA;
        if (b) b.heightFr = frB;
        return;
      }
      const breiten = normalizedColumnWidths(p.columnWidths, p.columns).slice();
      breiten[Number(prev.dataset.col) - 1] = frA;
      breiten[Number(next.dataset.col) - 1] = frB;
      p.columnWidths = breiten;
    }, null);
    let bewegt = false;
    steg.addEventListener("pointerdown", (down) => {
      if (!down.isPrimary) return;
      down.preventDefault();
      steg.setPointerCapture(down.pointerId);
      steg.classList.add("zieht");
      document.body.classList.add("dragging");
      panelStegDragging = true;
      // Bedarfs-Deckel der beiden Nachbarn räumen, BEVOR gemessen wird.
      // `fitCourts()` deckelt „Felder" per Inline-`max-height` auf seinen
      // Bedarf; ein Deckel schlägt aber jedes `flex-grow`, das dieser Zug
      // gleich schreibt — das Panel bliebe unter dem Finger stehen und
      // spränge erst beim Loslassen (Review 18.08.2026: 3:1 gezogen blieb
      // es bei 174/174 statt 261/87). Der Zug IST die Ansage „ich verteile
      // von Hand", also endet die Bedarfs-Automatik hier; gespeichert wird
      // gleich ein `heightFr ≠ 1`, womit `fitCourts()` von selbst nicht
      // mehr deckelt. Nur senkrecht — Spalten kennen keinen Deckel.
      if (senkrecht) { prev.style.maxHeight = ""; next.style.maxHeight = ""; }
      const rA = prev.getBoundingClientRect(), rB = next.getBoundingClientRect();
      const massA = senkrecht ? rA.height : rA.width;
      const summe = massA + (senkrecht ? rB.height : rB.width);
      const frA = parseFloat(prev.style.flexGrow) || 1;
      const frB = parseFloat(next.style.flexGrow) || 1;
      const frSumme = frA + frB;
      const start = senkrecht ? down.clientY : down.clientX;
      bewegt = false;
      const min = minPx();
      const move = (ev) => {
        const delta = (senkrecht ? ev.clientY : ev.clientX) - start;
        if (!bewegt && Math.abs(delta) < 3) return;
        bewegt = true;
        const neuA = Math.min(Math.max(massA + delta, min), Math.max(min, summe - min));
        const neuFrA = frSumme * (neuA / summe);
        prev.style.flexGrow = String(neuFrA);
        next.style.flexGrow = String(Math.max(0.05, frSumme - neuFrA));
      };
      const done = () => {
        steg.removeEventListener("pointermove", move);
        steg.removeEventListener("pointerup", done);
        steg.removeEventListener("pointercancel", done);
        steg.classList.remove("zieht");
        document.body.classList.remove("dragging");
        panelStegDragging = false;
        if (!bewegt) return;
        speichere(parseFloat(prev.style.flexGrow), parseFloat(next.style.flexGrow));
      };
      steg.addEventListener("pointermove", move);
      steg.addEventListener("pointerup", done);
      steg.addEventListener("pointercancel", done);
    });
    // Doppeltipp/Doppelklick: gleichmäßige Verteilung wiederherstellen —
    // dasselbe Verhalten wie beim alten Felder/Liste-Steg, nur jetzt für
    // ALLE Höhen bzw. ALLE Spaltenbreiten des aktiven Profils auf einmal
    // (Akzeptanzkriterium: „stellt die automatische Verteilung zurück").
    steg.addEventListener("dblclick", () => {
      mutateActiveProfile((p) => {
        // Leer heißt „gleichmäßig" (`normalizedColumnWidths`) — kein
        // ausgerechnetes Array nötig.
        if (senkrecht) p.panels.forEach((x) => { x.heightFr = 1; });
        else p.columnWidths = [];
      }, senkrecht ? "Höhen gleichmäßig verteilt." : "Spalten gleichmäßig verteilt.");
    });
    // Pfeiltasten-Fallback (Akzeptanzkriterium: für JEDE Drag-Interaktion).
    const vor = senkrecht ? "ArrowUp" : "ArrowLeft";
    const zurueck = senkrecht ? "ArrowDown" : "ArrowRight";
    const name = (el) => (senkrecht
      ? PANEL_TITLES[el.dataset.panel] || ""
      : `Spalte ${el.dataset.col}`);
    steg.setAttribute("tabindex", "0");
    steg.setAttribute("role", "separator");
    steg.setAttribute("aria-label",
      `${senkrecht ? "Höhe" : "Breite"} zwischen ${esc(name(prev))} und ${esc(name(next))} ziehen`);
    steg.addEventListener("keydown", (ev) => {
      if (ev.key !== vor && ev.key !== zurueck) return;
      ev.preventDefault();
      // Auf der Gewichtung gerechnet statt auf Pixeln: Die Tastatur kennt
      // keine Zeigerposition, und 0.2 als Untergrenze hält beide Nachbarn
      // sichtbar — dasselbe Ziel wie `minPx()` beim Ziehen.
      const frA = parseFloat(prev.style.flexGrow) || 1;
      const frB = parseFloat(next.style.flexGrow) || 1;
      const summe = frA + frB;
      let neuA = frA + (ev.key === vor ? 0.1 : -0.1);
      neuA = Math.min(Math.max(neuA, 0.2), summe - 0.2);
      speichere(neuA, summe - neuA);
    });
  });
}

/** `flex-grow` aller sichtbaren Panels EINER Spalte aus dem aktiven Profil
 *  anwenden — unabhängig davon, ob das Gerüst gerade neu gebaut wurde
 *  (läuft bei JEDEM `renderPanels()`-Aufruf, damit ein reiner Höhen-Wechsel
 *  ohne Sichtbarkeits-/Reihenfolge-Änderung nicht das ganze Gerüst neu
 *  bauen muss — das würde offene Kebab-Menüs und Scroll-Positionen
 *  zerstören). */
function applyPanelHeights(spalte, panels) {
  const byKey = new Map(panels.map((p) => [p.key, p]));
  spalte.querySelectorAll(":scope > .panel").forEach((el) => {
    const setting = byKey.get(el.dataset.panel);
    // Ein zugeklapptes Panel nimmt am Verteilungsmodell NICHT teil (ADR
    // 0026, Plan D): Sein `heightFr` bliebe sonst als Anteil reserviert und
    // hinterließe unter der Kopfzeile genau den leeren Block, den das
    // Zuklappen loswerden soll. `flexGrow: 0` statt eines eigenen
    // Rechenwegs — die übrigen Panels teilen sich den Rest dadurch von
    // selbst im bisherigen Verhältnis. Der gespeicherte `heightFr` bleibt
    // unangetastet und gilt sofort wieder, sobald aufgeklappt wird.
    if (el.classList.contains("panel-collapsed")) { el.style.flexGrow = "0"; return; }
    el.style.flexGrow = String((setting && setting.heightFr) || 1);
  });
}

/** Dasselbe für die Spaltenbreiten (Plan tl-liste-vereinfachen F). Eine
 *  leere Spalte gibt es im DOM gar nicht — die verbliebenen teilen sich den
 *  Platz dadurch von selbst, ohne leeren Streifen zu hinterlassen. */
function applyColumnWidths(main, widths) {
  main.querySelectorAll(":scope > .tl-column").forEach((el) => {
    el.style.flexGrow = String(widths[Number(el.dataset.col) - 1] || 1);
  });
}

/**
 * Ein Panel an eine neue Stelle setzen — Reihenfolge UND Spalte in einem
 * Zug (das Ergebnis einer Ziehgeste über Spaltengrenzen hinweg). Verändert
 * `panels` in place.
 *
 * `beforeId` = Schlüssel des Panels, VOR das gesetzt wird; `null` heißt
 * „ans Ende der Zielspalte" — ausdrücklich nicht „ans Ende der ganzen
 * Liste": Die Panel-Reihenfolge ist EIN flaches Array über alle Spalten,
 * „unten in Spalte 1" steht darin also vor „oben in Spalte 2". Ohne diese
 * Unterscheidung landete ein ans Spaltenende gezogenes Panel hinter allen
 * Panels aller folgenden Spalten und wäre beim nächsten Spaltenwechsel an
 * einer überraschenden Stelle.
 *
 * Eigene, reine Funktion (statt einer Closure im Zug-Rückruf), damit genau
 * dieser Fall ohne Zeigegerät prüfbar bleibt.
 */
function movePanel(panels, id, beforeId, spalte) {
  const from = panels.findIndex((x) => x.key === id);
  if (from === -1) return panels;
  const [moved] = panels.splice(from, 1);
  moved.column = spalte;
  const to = beforeId ? panels.findIndex((x) => x.key === beforeId) : -1;
  if (to !== -1) { panels.splice(to, 0, moved); return panels; }
  let letzte = -1;
  panels.forEach((x, i) => { if (x.column === spalte) letzte = i; });
  panels.splice(letzte + 1, 0, moved);
  return panels;
}

/**
 * Baut den kompletten Arbeitsbereich (`main`) aus dem aktiven Profil: ein
 * bis drei Spalten, in jeder die ihr zugeordneten sichtbaren Panels, dazu
 * die Stege dazwischen.
 *
 * Das DOM-Gerüst wird NUR neu gezeichnet, wenn sich Spaltenzahl,
 * Spaltenzuordnung, Sichtbarkeit, Reihenfolge, Klappzustand ODER die
 * Verfügbarkeit (Zähltafel/Schiedsrichter erst gerade ein-/ausgeschaltet)
 * wirklich geändert haben — sonst rissen alle zwei Sekunden (Poll-Takt) ein
 * offenes Kebab-Menü, eine Scroll-Position oder ein laufender Zug ab
 * (Muster `renderWalkovers`/`renderOfficials`: „nur bei echter Änderung neu
 * bauen"). Reine Höhen-/Breiten-Wechsel laufen separat über
 * `applyPanelHeights()`/`applyColumnWidths()`, ausdrücklich AUSSERHALB der
 * Signatur — sonst baute jeder Steg-Zug das Gerüst neu.
 */
function renderPanels() {
  const main = $("cols");
  if (!main || !state) return;
  // Während eines laufenden Steg-Zugs NICHT neu einpassen (siehe
  // `panelStegDragging`-Kommentar) — der Zug selbst schreibt beim
  // Loslassen (`mutateActiveProfile`), das löst denselben Poll-getriebenen
  // Re-Render aus; dann ist er wieder erlaubt.
  if (panelStegDragging) return;
  const layout = normalizedLayout(resolveActiveProfile());
  const sichtbar = layout.panels.filter((p) => p.visible && panelAvailable(p.key));
  // Nur Spalten, in denen wirklich etwas steht — eine leere Spalte
  // hinterließe sonst einen leeren Streifen (Akzeptanzkriterium). Preis
  // dafür: In eine noch leere Spalte lässt sich nichts HINEINZIEHEN (es
  // gibt kein Ziel im DOM); dafür gibt es die ausdrückliche Spaltenauswahl
  // je Panel im Profil-Editor.
  const spalten = [];
  for (let i = 1; i <= layout.columns; i += 1) {
    const drin = sichtbar.filter((p) => p.column === i);
    if (drin.length) spalten.push({ nr: i, panels: drin });
  }
  const signatur = `${layout.columns}|` + spalten
    .map((s) => `${s.nr}:${s.panels.map((p) => (p.collapsed ? `${p.key}~zu` : p.key)).join("+")}`)
    .join("|");
  if (main.dataset.shape !== signatur) {
    main.dataset.shape = signatur;
    main.innerHTML = spalten.map((s, i) => {
      const stegDavor = i > 0
        ? `<div class="col-steg" role="separator" tabindex="-1"
             title="Ziehen: Spaltenbreite ändern · Doppeltipp: gleichmäßig verteilen"></div>`
        : "";
      const inhalt = s.panels.map((p, j) => {
        const stegOben = j > 0
          ? `<div class="panel-steg" role="separator" tabindex="-1"
               title="Ziehen: Höhe ändern · Doppeltipp: gleichmäßig verteilen"></div>`
          : "";
        // Zugeklappt bleibt der Reset-Knopf weg: Der Kopf trägt dann schon
        // Titel, Zähler, Vorschau und zwei Schalter — und wer die
        // Reihenfolge zurücksetzen will, schaut ohnehin auf die Liste.
        const extra = p.key === "queue" && !p.collapsed
          ? `<button type="button" id="queue-reset" class="reset-order" hidden
               title="Verwirft die manuelle Spielreihenfolge des ganzen Turniers — danach gilt wieder BTPs eigene Reihenfolge">
               Reihenfolge zurücksetzen</button>
             <span class="prefill-box" id="prefill-box" hidden>
               <button type="button" id="prefill-toggle" class="reset-order"></button>
               <input type="number" id="prefill-window" class="prefill-x" min="0" max="120"
                 title="Fenstergröße x — so viele Spiele stehen im Voraus fest; 0 = automatisch (Feldzahl)">
               <button type="button" id="prefill-clear" class="reset-order"
                 title="Räumt NUR die automatisch verteilten Hallen — Hand, Regel und Aufruf bleiben">
                 Auto-Hallen räumen</button>
             </span>`
          : "";
        // Zugeklappt: nur die Kopfzeile, kein `.panel-body`. Die Klasse macht
        // das Panel im Flex-Modell höhenlos (CSS `.panel.panel-collapsed`).
        return stegOben + `<section class="panel${p.collapsed ? " panel-collapsed" : ""}"
            data-panel="${esc(p.key)}" data-id="${esc(p.key)}">
            ${panelHeadHtml(p.key, true, true, extra, p.collapsed)}
            ${p.collapsed ? "" : `<div class="panel-body">${panelBodySkeleton(p.key)}</div>`}
          </section>`;
      }).join("");
      return `${stegDavor}<div class="tl-column" data-col="${s.nr}">${inhalt}</div>`;
    }).join("");
    wirePanelHead(main);
    const spaltenEl = () => Array.from(main.querySelectorAll(":scope > .tl-column"));
    spaltenEl().forEach((el) => {
      // Panel-Reorder: innerhalb der Spalte UND über Spaltengrenzen hinweg
      // (`spaltenEl` als Zielmenge). Landet das Panel in einer anderen
      // Spalte, ändert derselbe Zug zusätzlich seine `column` — eine Geste,
      // zwei Wirkungen, kein zweiter Bedienweg.
      enableReorderDrag(el, (id, beforeId, ziel) => {
        const spalte = Number(ziel.dataset.col) || 1;
        mutateActiveProfile(
          (p) => { movePanel(p.panels, id, beforeId, spalte); },
          "Panel verschoben.",
        );
      }, ".panel-griff", spaltenEl);
      wireStegs(el, "hoehe");
    });
    wireStegs(main, "breite");
    // `#queue-reset`/`#sk-add` existieren erst seit diesem Aufbau — anders
    // als früher (fest im Markup) müssen sie HIER verdrahtet werden, nicht
    // in `start()` (das läuft VOR dem ersten Zustand, die Elemente gäbe es
    // noch gar nicht). Genau einmal je Neubau, kein Mehrfach-Zuhörer bei
    // unverändertem Gerüst — `renderQueue()`/`renderScorekeepers()` selbst
    // ersetzen nur die inneren Listen, nie diese Container.
    main.querySelector("#queue-reset")?.addEventListener("click", resetQueueOrder);
    main.querySelector("#sk-add")?.addEventListener("submit", addScorekeeper);
    // Hallen-Vorverteilung (Spec hallen-vorverteilung): Schalter, x und
    // Räumen-Knopf leben im Kopf des Spiele-Panels — wie #queue-reset erst
    // seit diesem Aufbau vorhanden, deshalb HIER verdrahtet.
    main.querySelector("#prefill-toggle")?.addEventListener("click", togglePrefill);
    main.querySelector("#prefill-clear")?.addEventListener("click", clearAutoHalls);
    main.querySelector("#prefill-window")?.addEventListener("change", sendPrefillWindow);
    // Die frisch angelegten Container-IDs sind hier noch leer — `render()`
    // ruft `renderPanels()` bewusst VOR den einzelnen `render*()`-
    // Funktionen auf, die füllen sie im selben Durchlauf. Kein erneuter
    // Aufruf hier nötig (und keiner, der eine Signatur-Prüfung umgehen
    // könnte, die z. B. `renderWalkovers()` gegen Checkbox-Reset absichert).
  }
  applyColumnWidths(main, layout.widths);
  main.querySelectorAll(":scope > .tl-column")
    .forEach((el) => applyPanelHeights(el, layout.panels));
}

/**
 * Die eine Spielliste (ADR 0026) — alle angesetzten Spiele, in genau der
 * Reihenfolge, die der Turnier-PC liefert.
 *
 * **Bewusst ohne clientseitiges Nachsortieren.** Die Sortierung ist
 * serverseitig verbindlich (`assign::sort_key_with_manual_order`): `!called`
 * ist die erste Tupel-Komponente, gerufene Spiele stehen damit immer oben
 * angepinnt, alles Übrige folgt dem manuellen Präfix bzw. BTPs eigener
 * Reihenfolge. Würde die Seite hier ein zweites Mal sortieren, zeigten
 * Turnierleitung und automatische Vergabe zwei verschiedene Abfolgen — genau
 * die Inkonsistenz, gegen die ADR 0023 den gemeinsamen Sortier-Helfer
 * eingeführt hat.
 *
 * Gefiltert wird nur nach Halle: Ein Spiel OHNE Hallenzuordnung bleibt auch
 * bei gesetztem Filter sichtbar — es wird sonst nirgends vergeben und
 * blockiert am Ende den Zeitplan (Verhalten des früheren Panels „Ohne
 * Hallenzuordnung", jetzt als Zeilen-Status in derselben Liste).
 */
function visibleQueue() {
  if (!state) return [];
  return state.queue.filter((m) => !hallFilter || m.hall === hallFilter || !m.hall);
}

/** Kennung der ersten UMSORTIERBAREN Zeile der gerade gezeigten Liste — das
 *  Ziel von „nach oben schieben". Gerufene Spiele stehen zwar oben, gehören
 *  aber nicht zur manuellen Reihenfolge (`assign::ready_queue` lässt sie
 *  aus); vor sie zu ziehen wäre serverseitig ein stilles No-Op. */
function queueTopMatchId() {
  const erste = visibleQueue().find((m) => !m.prep_call);
  return erste ? erste.match_id : null;
}

// ── Nachladen beim Scrollen (ADR 0026) ────────────────────────────────
// Die Liste zeigt ALLE angesetzten Spiele — nichts wird weggelassen, nichts
// gekürzt. Gegen die Länge (mehrere hundert Zeilen sind in großen Turnieren
// normal) hilft nicht Weglassen, sondern schrittweises Nachladen: erst
// `QUEUE_PAGE` Zeilen zeichnen, beim Erreichen des Listenendes die nächsten.
// `queueShown` lebt bewusst AUSSERHALB von `renderQueue()` — genau wie
// `openKebabMatchId` muss der Wert den 2-Sekunden-Redraw überleben, sonst
// spränge die Liste alle zwei Sekunden auf die ersten 40 Zeilen zurück und
// nähme die Scroll-Position mit.
const QUEUE_PAGE = 40;
let queueShown = QUEUE_PAGE;

/**
 * Beobachtet das Ende der Liste und lädt nach, sobald es in Sicht kommt.
 *
 * Bei JEDEM Zeichnen neu aufgesetzt statt einmalig: Ein Beobachter meldet
 * sich nur bei einem WECHSEL von „nicht sichtbar" zu „sichtbar". Bleibt das
 * Listenende nach dem Nachladen weiterhin sichtbar (hohes Panel, kurze
 * Nachlade-Schritte), käme nie eine zweite Meldung — die Liste bliebe
 * stehen, obwohl unten noch Platz ist. Ein frischer Beobachter meldet
 * dagegen den aktuellen Stand sofort noch einmal und lädt so lange nach, bis
 * das Ende wirklich unten aus dem Bild gewandert oder alles gezeigt ist.
 */
let queueObserver = null;
function beobachteQueueEnde(gesamt) {
  if (queueObserver) { queueObserver.disconnect(); queueObserver = null; }
  const sentinel = $("queue-sentinel");
  const wurzel = sentinel && sentinel.closest(".panel-body");
  if (!sentinel || !wurzel || queueShown >= gesamt) return;
  queueObserver = new IntersectionObserver((eintraege) => {
    if (!eintraege.some((e) => e.isIntersecting)) return;
    if (queueShown >= visibleQueue().length) return;
    queueShown += QUEUE_PAGE;
    renderQueue();
  }, { root: wurzel, rootMargin: "300px" });
  queueObserver.observe(sentinel);
}

function renderQueue() {
  if (!state) return;
  const liste = visibleQueue();
  setPanelCount("queue", liste.length);
  renderHallPrefill();
  // Vorschau für den zugeklappten Zustand: das nächste Spiel. VOR dem
  // Ausstieg unten — der Kopf ist auch dann da, wenn es keinen Inhalt gibt.
  const naechstes = liste[0];
  setPanelPreview("queue", naechstes
    ? `${naechstes.match_num != null ? `Nr. ${naechstes.match_num} · ` : ""}`
      + `${(naechstes.team1 || []).join(" / ")} vs. ${(naechstes.team2 || []).join(" / ")}`
    : "keine Spiele");

  const box = $("queue-list");
  if (!box) {
    // Panel gerade ausgeblendet oder zugeklappt. Den Beobachter dabei
    // abräumen — er hinge sonst an einem längst entfernten Knoten und
    // meldete nie wieder etwas, auch nicht nach dem Wiederaufklappen.
    if (queueObserver) { queueObserver.disconnect(); queueObserver = null; }
    return;
  }
  // Während eines laufenden Zugs NICHT neu bauen (Muster `renderOfficials`,
  // Code-Review-Fund 14.08.2026 dort übernommen) — sonst risse `innerHTML`
  // die gerade gezogene Zeile aus dem DOM.
  if (reorderDragPending) return;

  // Nie schrumpfen, aber auch nie über das Vorhandene hinaus zählen: Werden
  // Spiele vergeben, rutscht die Liste kürzer — das Fenster darf dann nicht
  // als „hundert nachgeladen" stehen bleiben, sonst wächst es beim nächsten
  // Zuwachs sprunghaft mit.
  queueShown = Math.max(QUEUE_PAGE, Math.min(queueShown, Math.max(liste.length, QUEUE_PAGE)));
  const fenster = liste.slice(0, queueShown);
  const top = queueTopMatchId();
  // EIN Zieh-Container für die ganze Liste (ADR 0026) — die Reihenfolge
  // ist global, also auch die Ziehfläche. Seit dem Keyed-Abgleich wird der
  // Griff je Zeile verdrahtet (`wireReorderGriff`), nur für neue/ersetzte
  // Zeilen — `enableReorderDrag` über alle Kinder hängte bestehenden
  // Zeilen bei jedem Render doppelte Listener an.
  const reorder = (id, beforeId) => {
    const matchId = Number(id);
    const ziel = queueReorderTarget(beforeId);
    if (ziel === matchId) { renderQueue(); return; }
    send(
      `queue-reorder-${matchId}-${ziel ?? "end"}-${Math.floor(Date.now() / OP_WINDOW_MS)}`,
      { action: "queue_reorder", matchId, beforeMatchId: ziel },
      "Reihenfolge geändert.",
    );
  };
  if (!fenster.length) {
    setzeHtmlWennNeu(box, `<p class="note">Kein angesetztes Spiel${hallFilter ? " in dieser Halle" : ""}.</p>`);
  } else {
    // Je `match_id` abgeglichen: Ein Punktgewinn anderswo lässt die Liste
    // komplett stehen; ändert sich EINE Zeile (Aufruf, Prognose, Pause),
    // wird genau die ersetzt und neu verdrahtet.
    reconcileKeyed(box, fenster, (m) => m.match_id, (m) => queueRow(m, top), (row) => {
      wireQueue(row);
      wireReorderGriff(box, row, reorder);
    });
  }

  // Fuß der Liste: das Nachlade-Ziel und — falls der Turnier-PC selbst
  // gekürzt hat (Cloud-Weg, sehr große Turniere) — der ehrliche Hinweis
  // darauf. Beides außerhalb von `#queue-list`, damit der Zieh-Container
  // ausschließlich Zeilen enthält.
  const fuss = $("queue-foot");
  if (fuss) {
    const rest = liste.length - fenster.length;
    const gekappt = gekuerzteSpiele();
    setzeHtmlWennNeu(fuss,
      (rest > 0
        ? `<p class="note">Noch ${rest} weitere${rest === 1 ? "s" : ""} Spiel${rest === 1 ? "" : "e"} — beim Scrollen laden sie nach.</p>`
        : "")
      + (gekappt !== 0
        ? `<p class="note warn">Der Turnier-PC hat die Liste gekürzt${gekappt > 0 ? ` (${gekappt} Spiele fehlen am Ende)` : ""} — im Hallennetz steht die volle Liste.</p>`
        : ""));
  }
  beobachteQueueEnde(liste.length);
  // Frisch gebaute Zeilen tragen leere Zeitfelder („gerufen seit",
  // Eieruhr) — vor dem nächsten Anstrich füllen, auch beim Nachladen
  // per Scroll (ruft renderQueue direkt; Review 17.08.2026).
  scheduleTickClocks();

  // Reset-Knopf (im Kopf des Spiele-Panels) nur zeigen, solange irgendein
  // Spiel manuell einsortiert ist — sonst gäbe es nichts zurückzusetzen.
  const resetBtn = $("queue-reset");
  if (resetBtn) resetBtn.hidden = !state.queue.some((m) => m.manual);
}

/**
 * Übersetzt das Ziel einer Ziehgeste in das `beforeMatchId` des
 * Wire-Aufrufs. Zwei Fälle, in denen das, was man SIEHT, nicht das ist, was
 * „davor" serverseitig bedeutet:
 *
 * 1. **Ans Ende einer nur teilweise geladenen Liste.** Die Geste meint das
 *    Ende dessen, was auf dem Bildschirm steht — `null` (= ans echte Ende
 *    der Gesamtliste) zöge dagegen ALLE noch nicht geladenen Spiele mit in
 *    den manuellen Präfix, die niemand gesehen hat. Solange noch etwas
 *    nachzuladen ist, wird deshalb „vor das erste noch nicht geladene Spiel"
 *    daraus. Erst wenn die ganze Liste geladen ist, heißt „ans Ende"
 *    tatsächlich `null`.
 * 2. **Vor eine gerufene Zeile.** Gerufene Spiele sind oben angepinnt,
 *    gehören aber nicht zur manuellen Reihenfolge — der Turnier-PC kennt sie
 *    dort nicht und verwürfe den Zug stillschweigend. Die Geste meint
 *    offensichtlich „ganz nach vorn", also vor die erste umsortierbare
 *    Zeile.
 */
function queueReorderTarget(beforeId) {
  const liste = visibleQueue();
  if (beforeId === null || beforeId === undefined) {
    if (queueShown >= liste.length) return null; // alles geladen: echtes Ende
    const naechstes = liste.slice(queueShown).find((m) => !m.prep_call);
    return naechstes ? naechstes.match_id : null;
  }
  const ziel = Number(beforeId);
  const zielMatch = liste.find((m) => m.match_id === ziel);
  if (zielMatch && zielMatch.prep_call) return queueTopMatchId();
  return ziel;
}

/**
 * Wie viele wartende Spiele hat der Turnier-PC selbst weggelassen?
 *
 * `queue_truncated` (ADR 0026) ist die Zahl der gekappten Spiele; `0` heißt
 * „vollständig". Sie ersetzt das frühere `truncated_halls` (Namen der
 * betroffenen Hallen) — mit einer turnierweiten Kappung gibt es keine
 * betroffene Halle mehr, sondern nur noch ein Ende, das fehlt.
 *
 * Das alte Feld wird trotzdem noch gelesen: Im Cloud-Betrieb liefert der
 * **Relay** diese Seite aus, der Zustand kommt aber vom Turnier-PC — beide
 * werden unabhängig voneinander aktualisiert (`docs/cloud-relay.md`). Eine
 * neue Seite an einem älteren Host würde sonst schweigen, obwohl gekürzt
 * wurde. Die Stückzahl kennt sie in dem Fall nicht; `-1` steht für
 * „gekürzt, Umfang unbekannt".
 */
function gekuerzteSpiele() {
  if (!state) return 0;
  if (typeof state.queue_truncated === "number") return state.queue_truncated;
  if (Array.isArray(state.truncated_halls) && state.truncated_halls.length) return -1;
  return 0;
}

/** Verwirft die manuelle Reihenfolge des ganzen Turniers — es gibt seit
 *  ADR 0026 nur noch eine, kein Reset je Halle mehr. */
function resetQueueOrder() {
  send(
    `queue-order-reset-${Math.floor(Date.now() / OP_WINDOW_MS)}`,
    { action: "queue_order_reset" },
    "Manuelle Reihenfolge zurückgesetzt.",
  );
}

/**
 * Walkover-Vorschläge.
 *
 * Nach einer Aufgabe schlägt der Turnier-PC vor, die Folgespiele derselben
 * Mannschaft kampflos zu werten. Welche das sein sollen, entscheidet die
 * Turnierleitung — deshalb Kästchen zum Ankreuzen und keine Sammelaktion.
 */
// Bewusst abgewählte Kandidaten, als "vorschlagId:matchId". Der Zustand lebt
// hier und nicht im DOM, weil der Abschnitt neu gebaut wird, sobald sich die
// Kandidatenliste ändert — die Entscheidung der Turnierleitung darf das nicht
// mitreißen.
const woUnticked = new Set();

function renderWalkovers() {
  const box = $("walkovers");
  const list = (state.walkovers || []);
  setPanelCount("walkovers", list.length);
  if (!box) return; // Panel gerade ausgeblendet — nichts zu zeichnen.
  if (!list.length) {
    box.innerHTML = `<p class="note">Keine offenen Vorschläge.</p>`;
    box.dataset.shape = "";
    return;
  }
  // Der Abschnitt wird nur neu gebaut, wenn er sich wirklich geändert hat.
  // Sonst setzte jede Abfrage die Kästchen auf „angekreuzt" zurück — wer ein
  // Spiel bewusst abwählt und zwei Sekunden zögert, wertete es kampflos,
  // ohne es zu merken. Zurücknehmen geht nicht: Die Wertung steht in BTP.
  const shape = list.map((w) => w.id + ":" + w.candidates.map((c) => c.match_id).join(",")).join("|");
  if (box.dataset.shape === shape) return;
  box.dataset.shape = shape;
  box.innerHTML =
    list.map((w) => `
      <div class="wo" data-wo="${esc(w.id)}">
        <h4>${esc(w.retired_team)} hat aufgegeben <span class="meta">· ${esc(w.draw_name)}</span></h4>
        <div class="meta">Welche Spiele sollen kampflos gewertet werden?</div>
        ${w.candidates.map((c) => `
          <label><input type="checkbox" value="${c.match_id}"
                   ${woUnticked.has(w.id + ":" + c.match_id) ? "" : "checked"} />
            ${esc(c.round_name)} — ${esc(c.opponent)} kommt weiter</label>`).join("")}
        <div class="actions">
          <button type="button" class="primary" data-confirm="${esc(w.id)}">Kampflos werten</button>
          <button type="button" data-dismiss="${esc(w.id)}">Verwerfen</button>
        </div>
      </div>`).join("");

  // Abgewählte Spiele merken, damit sie ein Neuaufbau nicht wieder ankreuzt.
  scopeAll(box, ".wo input[type=checkbox]").forEach((cb) => {
    const key = cb.closest(".wo").dataset.wo + ":" + cb.value;
    cb.addEventListener("change", () => {
      if (cb.checked) woUnticked.delete(key); else woUnticked.add(key);
    });
  });

  scopeAll(box, "[data-confirm]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const card = btn.closest(".wo");
      const ids = [...card.querySelectorAll("input:checked")].map((i) => Number(i.value));
      if (!ids.length) { toast("Kein Spiel angekreuzt.", true); return; }
      await send(
        `wo-${btn.dataset.confirm}-${ids.join("_")}`,
        { action: "confirm_walkover", proposalId: btn.dataset.confirm, matchIds: ids },
        `${ids.length} Spiel(e) kampflos gewertet.`,
      );
    });
  });
  scopeAll(box, "[data-dismiss]").forEach((btn) => {
    btn.addEventListener("click", () => send(
      `wo-dismiss-${btn.dataset.dismiss}`,
      { action: "dismiss_walkover", proposalId: btn.dataset.dismiss },
      "Vorschlag verworfen.",
    ));
  });
}

/**
 * Zähltafel-Warteschlange.
 *
 * Sichtbar nur, wenn dieser Turnier-PC Zähltafelbediener verwaltet
 * (`scorekeeper_managed`) — sonst gäbe es hier nichts zu bedienen. Die
 * Aktionen laufen über dieselben Vorgangskennungen wie am Turnier-PC.
 *
 * **Entfernen** braucht kein Zeitfenster: `key` existiert nur, solange der
 * Eintrag in der Schlange steht, ein entfernter Schlüssel taucht nie wieder
 * auf — ein Doppeltipp trifft also immer dieselbe, längst erledigte
 * Absicht.
 *
 * **Vorziehen** dagegen braucht eines, obwohl `key` genauso stabil ist: Der
 * Host merkt sich das Ergebnis eines Vorgangs 60 Sekunden lang
 * (`OP_MEMORY_MS`). Ohne Zeitfenster träfe ein zweites, **bewusst neues**
 * Vorziehen desselben Wartenden — er ist inzwischen wieder zurückgerutscht,
 * weil ein anderes Gerät jemand anderen vorgezogen hat — innerhalb dieser
 * Minute dieselbe Kennung wie das erste: Der Host antwortet aus dem
 * Zwischenspeicher mit „erledigt", ohne den Wartenden wirklich zu bewegen,
 * und die Seite zeigt trotzdem eine Erfolgsmeldung. Das Zeitfenster
 * (`OP_WINDOW_MS`, dasselbe Muster wie bei Aufruf/Freigeben) lässt einen
 * Doppeltipp **innerhalb** des Fensters weiter als Wiederholung durchgehen,
 * öffnet aber nach zwanzig Sekunden wieder für eine neue, ernst gemeinte
 * Absicht.
 *
 * Nur `#sk-list` wird neu gezeichnet, nicht das umgebende `<details>` samt
 * Formular — sonst würde ein Name, an dem gerade getippt wird, beim
 * nächsten Abruf (alle zwei Sekunden) mitten im Tippen gelöscht.
 */
function renderScorekeepers() {
  if (!state.scorekeeper_managed) return; // Panel gar nicht verfügbar (Installation verwaltet keine Zähltafeln).
  const list = state.scorekeepers || [];
  setPanelCount("scorekeepers", list.length);
  const box = $("sk-list");
  if (!box) return; // Panel gerade ausgeblendet — nichts zu zeichnen.
  // Zeittext leer, `tickClocks()` füllt — und `setzeHtmlWennNeu` lässt
  // die Liste (samt Listener) stehen, solange sich nichts geändert hat.
  const html = list.length ? list.map((e, i) => `<li>
      <span class="sk-names">${esc(e.names.join(" / "))}</span>
      <span class="sk-wait num" data-since="${e.enqueued_ms}" title="wartet seit"></span>
      ${i > 0 ? `<button type="button" data-sk-adv="${esc(e.key)}"
          title="an den Anfang der Warteschlange" aria-label="vorziehen">▲</button>` : ""}
      <button type="button" data-sk-del="${esc(e.key)}"
        title="aus der Warteschlange nehmen" aria-label="aus der Warteschlange nehmen">×</button>
    </li>`).join("") : `<li class="meta">niemand wartet</li>`;
  if (!setzeHtmlWennNeu(box, html)) return;
  scopeAll(box, "[data-sk-adv]").forEach((b) =>
    b.addEventListener("click", () =>
      send(
        `sk-adv-${b.dataset.skAdv}-${Math.floor(Date.now() / OP_WINDOW_MS)}`,
        { action: "scorekeeper_advance", key: b.dataset.skAdv },
        "Vorgezogen.",
      )));
  scopeAll(box, "[data-sk-del]").forEach((b) =>
    b.addEventListener("click", () =>
      send(`sk-del-${b.dataset.skDel}`, { action: "scorekeeper_remove", key: b.dataset.skDel }, "Aus der Warteschlange entfernt.")));
}

/**
 * Sieger-zuerst-Paarung für die Beendet-Liste — so liest man ein Ergebnis
 * vor. Gilt NIE für das Draht-Format an den Turnier-PC (das bleibt roh
 * Team1:Team2, siehe `openResultDialog`-Kommentar).
 *
 * Zwei Fassungen, seit die Namen Links tragen (18.08.2026): Der
 * **Dialog-Titel** braucht reinen Text — er wird vom Aufrufer escapt und
 * dürfte kein Markup enthalten. Die **Zeile** braucht Markup, damit der
 * Name auf die badhub-Spielerseite verlinkt. Ein gemeinsamer Rückgabewert
 * für beides ginge nur, indem eine der beiden Seiten HTML durchreicht, wo
 * sie Text erwartet — genau die Verwechslung, die eine Lücke aufreißt.
 */
function siegerZuerstText(f) {
  const team1 = (f.team1 || []).join(" / "), team2 = (f.team2 || []).join(" / ");
  return f.winner === 2 ? `${team2} – ${team1}` : `${team1} – ${team2}`;
}

/** Wie `siegerZuerstText`, aber mit den badhub-Links (Spec
 *  `tl-sicht-feinschliff` A4.2). Escaping liegt in `spielerNameHtml` — die
 *  Trennzeichen hier sind eigener, fester Text. */
function siegerZuerstHtml(f) {
  const seite = (namen, nummern) => ((namen || []).length ? namen : ["?"])
    .map((n, i) => spielerNameHtml(n, (nummern || [])[i], "sp-name", ""))
    .join(" / ");
  const team1 = seite(f.team1, f.team1_ids), team2 = seite(f.team2, f.team2_ids);
  return f.winner === 2 ? `${team2} – ${team1}` : `${team1} – ${team2}`;
}

/**
 * Beendete Spiele.
 *
 * Reine Rückschau, neueste zuerst (die Reihenfolge liefert bereits der
 * Turnier-PC in `state.finished`) — deshalb zugeklappt, ohne die Kachel-
 * Optik der Warteliste. Der Sieger steht zuerst, wie man ein Ergebnis
 * vorliest; die Kennzeichnung Aufgabe/kampflos/disqualifiziert sitzt neben
 * dem Satzstand.
 *
 * Der Stift öffnet denselben Dialog wie „Ergebnis eintragen" (`overwrite:
 * true`) — die Grenze liegt beim Turnier-PC (`correction_blocker`, R5):
 * Steht der Sieger schon im nächsten Spiel, lehnt er ab und die Meldung
 * erscheint im Dialog, nicht als Toast. Für den Dialog bleiben die Sätze in
 * Team1:Team2-Reihenfolge — die Drehung auf „Sieger zuerst" ist reine
 * Anzeigesache dieser Zeile und würde als Draht-Format falsch beim
 * Turnier-PC ankommen.
 */
const ERGEBNIS_BADGE = { walkover: "kampflos", retired: "Aufgabe", disqualified: "disqualifiziert" };
// ── Punktverlauf-Overlay (Spec punktverlauf-graph) ────────────────────

// INLINE-KOPIE von timelineSetSvg aus tablet.html (tl.html kann keine
// Module laden, etabliertes Duplikationsmuster wie bei gamePoint/
// hallGrid). Die kanonische Fassung liegt DORT — Änderungen dort auch
// hier nachziehen.
function timelineSetSvg(set, opts) {
  const o = opts || {};
  const colorA = o.colorA || '#3b82f6';
  const colorB = o.colorB || '#ef4444';
  let a = set.startA || 0;
  let b = set.startB || 0;
  const ptsA = [[0, a]];
  const ptsB = [[0, b]];
  const seq = String(set.points || '');
  for (let i = 0; i < seq.length; i++) {
    if (seq[i] === 'A') a++;
    else if (seq[i] === 'B') b++;
    ptsA.push([i + 1, a]);
    ptsB.push([i + 1, b]);
  }
  const n = seq.length;
  // Deckel gegen kaputte/bösartige Daten: ohne ihn liefe die
  // Gitter-Schleife bei einem absurden Stand endlos (Defense in Depth —
  // die Wire-Ebene deckelt bereits über MAX_START_SCORE).
  const maxY = Math.min(Math.max(a, b, 5), 300);
  const W = 420, H = 190, L = 30, R = 12, T = 10, B = 22;
  const sx = (x) => L + (W - L - R) * (n ? x / n : 0);
  const sy = (y) => H - B - (H - B - T) * (y / maxY);
  const line = (pts) => pts.map((p) => `${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join(' ');
  let grid = '';
  for (let y = 0; y <= maxY; y += 5) {
    grid += `<line x1="${L}" y1="${sy(y).toFixed(1)}" x2="${W - R}" y2="${sy(y).toFixed(1)}"`
      + ` stroke="currentColor" stroke-opacity=".14" stroke-width="1"/>`
      + `<text x="${L - 4}" y="${(sy(y) + 3).toFixed(1)}" text-anchor="end"`
      + ` font-size="9" fill="currentColor" fill-opacity=".55">${y}</text>`;
  }
  const dots = n === 0
    ? `<circle cx="${sx(0).toFixed(1)}" cy="${sy(set.startA || 0).toFixed(1)}" r="3.5" fill="${colorA}"/>`
      + `<circle cx="${sx(0).toFixed(1)}" cy="${sy(set.startB || 0).toFixed(1)}" r="3.5" fill="${colorB}"/>`
    : '';
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${grid}`
    + `<text x="${W - R}" y="${H - 6}" text-anchor="end" font-size="9"`
    + ` fill="currentColor" fill-opacity=".55">${n} Ballwechsel</text>`
    + `<polyline points="${line(ptsA)}" fill="none" stroke="${colorA}" stroke-width="2"/>`
    + `<polyline points="${line(ptsB)}" fill="none" stroke="${colorB}" stroke-width="2"/>`
    + dots
    + `</svg>`;
}

/** Endstand eines Verlaufs-Satzes (A, B) aus Startstand + Punktfolge. */
function timelineSetFinal(set) {
  let a = set.startA || 0;
  let b = set.startB || 0;
  for (const c of String(set.points || '')) {
    if (c === 'A') a++;
    else if (c === 'B') b++;
  }
  return { a, b };
}

// Zustand des offenen Overlays: welches Match, welches Etikett, die
// gewerteten Sätze (nur aus der Beendet-Liste, für den Abweichungs-
// Hinweis) und der Poll-Timer fürs Mitwachsen laufender Spiele.
let graphCtx = null;
// ── Schiedsrichter (Spec schiedsrichter-management) ───────────────────
// Die Liste steht im Zustand (Name, Pause, Dienst, Einsatz-Zähler).
// Sperrlisten, Verein und die Einsatz-Liste kommen NUR auf gezielte
// Anfrage über /tl/api/officials/… — sie kodieren persönliche Beziehungen
// und haben im Broadcast-Zustand nichts zu suchen.
function renderOfficials() {
  if (!state.officials_managed) return; // Panel gar nicht verfügbar (Turnier spielt ohne Schiedsrichter-Verwaltung).
  const list = state.officials || [];
  setPanelCount("officials", list.length);
  // Wer als Nächstes zugeteilt würde (erster weder pausierter noch schon im
  // Dienst befindlicher Eintrag) — ohne Konflikt-Prüfung, die braucht ein
  // konkretes Spiel als Bezug. Diese eine Zeile ist zugleich die Vorschau im
  // Kopf des ZUGEKLAPPTEN Panels (ADR 0026, Plan D): Sie stand schon immer
  // im Panel-Inhalt, wird jetzt zusätzlich hochgezogen. Deshalb VOR dem
  // Ausstieg unten — die Kopfzeile gibt es auch ohne Inhalt.
  const next = list.find((o) => !o.paused && !o.on_duty_court_id);
  setPanelPreview("officials", next ? `nächster: ${next.name}` : "niemand frei");
  const box = $("off-list");
  if (!box) return; // Panel gerade ausgeblendet oder zugeklappt.
  const naechsterEl = $("off-next");
  if (naechsterEl) naechsterEl.textContent = next ? `nächster: ${next.name}` : "";
  // Während eines laufenden Zugs die Liste NICHT neu bauen (Code-Review-Fund
  // 14.08.2026): `innerHTML` ersetzt jede Zeile durch einen neuen Knoten —
  // die gerade gezogene würde dabei aus dem DOM gerissen, `move()` mischte
  // sie danach mit frisch gerenderten Geschwistern, und `beforeId` beim
  // Loslassen bezöge sich auf einen falschen Stand. Der Zug selbst schreibt
  // beim Loslassen (`onReorder`), das löst denselben Poll-getriebenen
  // Re-Render aus — dann ist er wieder erlaubt.
  if (reorderDragPending) return;
  const html = list.length ? list.map((o, i) => `<li class="${o.paused ? "paused" : ""}" data-id="${o.id}">
      <span class="drag-griff" tabindex="0" role="button"
        title="Zum Umsortieren greifen oder mit Pfeiltasten verschieben"
        aria-label="${esc(o.name)} in der Reihenfolge verschieben — ziehen oder Pfeiltasten">⠿</span>
      <span class="num">${i + 1}.</span>
      <span class="off-name">${esc(o.name)}</span>
      ${o.on_duty_court_id ? `<span class="meta">im Dienst</span>` : ""}
      <button type="button" data-off-detail="${o.id}" title="Sperren, Verein und Einsätze">${o.appearances}×</button>
      <button type="button" data-off-pause="${o.id}" data-paused="${o.paused ? "1" : ""}"
        title="${o.paused ? "wieder einteilen" : "pausieren"}">${o.paused ? "▶" : "❚❚"}</button>
    </li>`).join("") : `<li class="meta">keine Schiedsrichter eingetragen</li>`;
  // Unverändert → Liste (samt Listener und Zieh-Griffen) stehen lassen —
  // ABER nur, wenn auch die DOM-Reihenfolge noch stimmt: Ein
  // fehlgeschlagener Zug (Write abgelehnt oder Verbindung weg) hat die
  // <li> physisch verschoben; der HTML-String wäre trotzdem gleich, und
  // die Anzeige zeigte dauerhaft eine Reihenfolge, die der Host nie
  // übernommen hat (Review-Fund 17.08.2026 — die Spielliste heilt sich
  // über den Keyed-Abgleich selbst, diese Liste braucht die Prüfung).
  if (!setzeHtmlWennNeu(box, html)) {
    const sollIds = list.map((o) => String(o.id)).join(",");
    const istIds = Array.from(box.children)
      .map((li) => li.dataset.id || "")
      .filter(Boolean)
      .join(",");
    if (istIds === sollIds) return;
    box.innerHTML = html;
  }
  scopeAll(box, "[data-off-pause]").forEach((b) =>
    b.addEventListener("click", () => send(
      `off-pause-${b.dataset.offPause}-${Math.floor(Date.now() / OP_WINDOW_MS)}`,
      { action: "official_pause", officialId: Number(b.dataset.offPause), paused: !b.dataset.paused },
      b.dataset.paused ? "Wieder eingeteilt." : "Pausiert.",
    )));
  scopeAll(box, "[data-off-detail]").forEach((b) =>
    b.addEventListener("click", () => openOfficialDetail(Number(b.dataset.offDetail))));
  enableReorderDrag(box, (id, beforeId) => send(
    `off-reorder-${id}-${beforeId ?? "end"}-${Math.floor(Date.now() / OP_WINDOW_MS)}`,
    { action: "official_reorder", officialId: Number(id), beforeOfficialId: beforeId === null ? null : Number(beforeId) },
    "Reihenfolge geändert.",
  ));
}

/** Offener Pflege-Dialog: `{ id, name }` oder null. */
let offCtx = null;

async function openOfficialDetail(id) {
  const o = (state.officials || []).find((x) => x.id === id);
  offCtx = { id, name: o ? o.name : "" };
  $("off-title").textContent = offCtx.name || "Schiedsrichter";
  $("off-body").innerHTML = `<p class="graph-note">Wird geladen …</p>`;
  $("off-overlay").hidden = false;
  try {
    const res = await fetch(`${API}/officials/${id}`, {
      headers: { Authorization: "Bearer " + token },
      cache: "no-store",
    });
    if (!offCtx || offCtx.id !== id) return; // Overlay inzwischen gewechselt
    if (!res.ok) throw new Error("HTTP " + res.status);
    renderOfficialDetail(await res.json());
  } catch {
    if (offCtx && offCtx.id === id) {
      $("off-body").innerHTML = `<p class="graph-note">Die Angaben sind gerade nicht
        abrufbar — die Version des Turnier-PCs kennt das Schiedsrichter-Modul
        möglicherweise noch nicht, oder die Verbindung fehlt.</p>`;
    }
  }
}

function renderOfficialDetail(d) {
  const einsaetze = (d.appearances || []).map((a) => `<li>
      <span class="num">${a.role === "ar" ? "AR" : "SR"}</span>
      <span class="off-name">${esc(a.match_name || "")}</span>
      <span class="meta">${esc(a.court || "")}</span>
      <span class="meta">${a.finished_at ? new Date(a.finished_at).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) : ""}</span>
    </li>`).join("");
  // Auswahllisten des Turniers (kommen mit derselben Antwort). Gepflegt
  // wird per Auswahl, nicht per Tipperei: Eine BTP-Spieler-ID kennt niemand
  // auswendig, und ein vertippter Verein warnt einfach nie.
  offPick = {
    players: d.pick_players || [],
    clubs: d.pick_clubs || [],
    // Gewählte Spieler mit Namen; wer nicht mehr in der Meldeliste steht,
    // behält seine Sperre (dann ohne Namen) statt still herauszufallen.
    gewaehltePlayers: (d.blocked_players || []).map((id) =>
      (d.pick_players || []).find((p) => p.id === id) || { id, name: `Spieler ${id}`, club: "" }),
    gewaehlteClubs: (d.blocked_clubs || []).slice(),
  };
  $("off-body").innerHTML = `
    <label class="off-field">Verein
      <input type="text" id="off-club" maxlength="80" list="off-club-list" value="${esc(d.club || "")}" />
      <datalist id="off-club-list">
        ${offPick.clubs.map((c) => `<option value="${esc(c)}"></option>`).join("")}
      </datalist>
    </label>
    <div class="off-field">Gesperrte Vereine
      <div id="off-club-chips" class="off-chips"></div>
      <input type="text" id="off-club-add" list="off-club-list"
             placeholder="Verein wählen oder eingeben, dann Enter" />
    </div>
    <div class="off-field">Gesperrte Spieler
      <div id="off-player-chips" class="off-chips"></div>
      <input type="text" id="off-player-search" placeholder="Spieler suchen …" />
      <ul id="off-player-hits" class="off-hits"></ul>
    </div>
    <button type="button" id="off-save">Speichern</button>
    <p class="graph-note">Diese Angaben bleiben auf dem Turnier-PC und werden
      beim Turnierwechsel verworfen.</p>
    <h3 class="off-h3">Einsätze</h3>
    <ol id="off-seen">${einsaetze || '<li class="meta">noch keiner</li>'}</ol>`;

  renderOffChips();
  $("off-club-add").addEventListener("keydown", (ev) => {
    if (ev.key !== "Enter") return;
    ev.preventDefault();
    const wert = ev.target.value.trim();
    if (wert && !offPick.gewaehlteClubs.includes(wert)) {
      offPick.gewaehlteClubs.push(wert);
      renderOffChips();
    }
    ev.target.value = "";
  });
  $("off-player-search").addEventListener("input", (ev) => {
    const q = ev.target.value.trim().toLowerCase();
    const treffer = q.length < 2 ? [] : offPick.players
      .filter((p) => !offPick.gewaehltePlayers.some((x) => x.id === p.id))
      .filter((p) => `${p.name} ${p.club}`.toLowerCase().includes(q))
      .slice(0, 25);
    $("off-player-hits").innerHTML = treffer.map((p) =>
      `<li><button type="button" data-pick="${p.id}">${esc(p.name)}
         <span class="meta">${esc(p.club || "")}</span></button></li>`).join("");
    $("off-player-hits").querySelectorAll("[data-pick]").forEach((b) =>
      b.addEventListener("click", () => {
        const p = offPick.players.find((x) => x.id === Number(b.dataset.pick));
        if (p) offPick.gewaehltePlayers.push(p);
        $("off-player-search").value = "";
        $("off-player-hits").innerHTML = "";
        renderOffChips();
      }));
  });

  $("off-save").addEventListener("click", () => {
    const id = offCtx && offCtx.id;
    if (!id) return;
    const clubs = offPick.gewaehlteClubs.slice();
