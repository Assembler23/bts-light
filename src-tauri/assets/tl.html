     Zwei Ansichten in einem Overlay — Katalog-Liste und Editor — beide von
     `renderProfilesOverlay()` in `#profiles-body` gezeichnet. -->
<div class="graph-overlay" id="profiles-overlay" hidden>
  <div class="graph-box">
    <div class="graph-head">
      <span id="profiles-title">Profile</span>
      <button type="button" id="profiles-close" aria-label="schließen">×</button>
    </div>
    <div class="graph-body" id="profiles-body"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toast-text"></span>
  <button type="button" id="toast-close" aria-label="Meldung schließen">×</button>
</div>

<script type="module">
// ── Zugang ────────────────────────────────────────────────────────────
// Der Zugang steht im Fragment der Adresse (`…/tl#t=…`). Ein Fragment wird
// NIE an den Server gesendet — es landet also in keinem Zugriffsprotokoll.
// Von dort wandert es einmalig in den lokalen Speicher des Geräts, und die
// Adresszeile wird sofort bereinigt.
const STORE_KEY = "bts-tl-token";
function readToken() {
  const m = location.hash.match(/(?:^|[#&])t=([^&]+)/);
  if (m) {
    localStorage.setItem(STORE_KEY, decodeURIComponent(m[1]));
    history.replaceState(null, "", location.pathname + location.search);
  }
  return localStorage.getItem(STORE_KEY) || "";
}
const token = readToken();

// Basis der Schnittstelle aus dem eigenen Pfad ableiten, damit dieselbe
// Seite im Hallennetz (`/tl`) und hinter dem Cloud-Präfix
// (`/bts-relay/tl`) ohne Anpassung läuft.
const API = location.pathname.replace(/\/+$/, "") + "/api";
// Die Flaggen liegen neben der Seite (`/flags/GER.svg`), im Hallennetz wie
// hinter dem Cloud-Präfix.
const FLAGGEN_BASIS = location.pathname.replace(/\/tl\/?$/, "") + "/flags/";
// Vereinslogos: im Hallennetz vom Turnier-PC (`/info/club-logo`) — der holt
// das Bild aus dem badhub-Bestand und liefert es lokal aus, funktioniert also
// auch ohne Internet am Anzeigegerät und matcht Vereinsnamen unscharf. Im
// Cloud-Modus kennt das Relay diesen Pfad nicht; dort zeigt die Seite direkt
// auf den öffentlichen badhub-Resolver (`/api/v1/club-logo`, exakter Name).
// Fehlt ein Logo, greift in beiden Fällen der `onerror`-Rückfall (nur Name).
const TL_PRAEFIX = location.pathname.replace(/\/tl\/?$/, "");
const LOGO_BASIS = TL_PRAEFIX === ""
  ? "/info/club-logo?name="
  : "https://badhub.de/api/v1/club-logo?name=";

const $ = (id) => document.getElementById(id);

// ── Zeit ──────────────────────────────────────────────────────────────
// Alle Zeitstempel kommen vom Turnier-PC. Die Geräte rechnen den Versatz
// zur eigenen Uhr aus und zählen lokal hoch — so zeigen alle dieselbe
// verstrichene Zeit, egal wie falsch ein Tablet gestellt ist.
let clockOffset = 0;
function syncClock(serverNowMs) {
  const fresh = serverNowMs - Date.now();
  // Kleine Schwankungen ignorieren, sonst zappelt die Anzeige bei jedem
  // Abruf um Zehntelsekunden.
  if (Math.abs(fresh - clockOffset) > 2000) clockOffset = fresh;
}
const serverNow = () => Date.now() + clockOffset;

/** Sekunden als „3:07" bzw. „1:02:11" — der EINE Formatierer aller Uhren
 *  dieser Seite, verstrichene wie verbleibende (Review-Fund 17.08.2026:
 *  drei Kopien desselben m:ss-Bausteins drifteten auseinander). */
function zeitspanne(s) {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const two = (n) => String(n).padStart(2, "0");
  return h > 0 ? `${h}:${two(m)}:${two(sec)}` : `${m}:${two(sec)}`;
}

/** Verstrichene Zeit seit `sinceMs`. Nie negativ. */
function elapsed(sinceMs) {
  return zeitspanne(Math.max(0, Math.floor((serverNow() - sinceMs) / 1000)));
}

/** Verbleibende Zeit bis `untilMs` — das Gegenstück zu `elapsed`, für die
 *  Pausen-Eieruhr der Spielliste. Nie negativ; bei 0 bleibt „0:00" stehen,
 *  bis der nächste Poll die Sperre aufhebt. Aufgerundet wie `pauseText`,
 *  damit zwei Countdowns aufs selbe Ziel nie verschiedene Sekunden zeigen. */
function restzeit(untilMs) {
  return zeitspanne(Math.max(0, Math.ceil((untilMs - serverNow()) / 1000)));
}

/** Sind auf diesem Feld schon Punkte gefallen? Dann läuft das Spiel. */
const isPlaying = (court) =>
  court.match_id > 0 && (court.sets || []).some(([a, b]) => a > 0 || b > 0);

/**
 * Welche Aufruf-Stufe ist **fällig**? Dieselben Schwellen wie am Turnier-PC.
 *
 * Nicht zu verwechseln mit `court.call_stage`: Das ist die Zahl der
 * **erfolgten** Aufrufe, die der Turnier-PC zählt und die auf jedem Gerät
 * gleich ist. Hier geht es um die Uhr — wann der nächste dran wäre.
 *
 * `0` heißt: keine Stufe anzeigen. Der Aufruf-Timer zählt die Zeit, bis die
 * Spieler ans Feld kommen — sobald gespielt wird, ist er gegenstandslos.
 * Ohne diese Regel stünde an einem Spiel, das seit 47 Minuten läuft,
 * „3. Aufruf fällig". (Dieselbe Regel wie in der Desktop-Übersicht.)
 */
function callStage(court, timer) {
  const since = court.on_court_since_ms;
  if (!timer || !timer.enabled || !since || isPlaying(court)) return 0;
  const min = (serverNow() - since) / 60000;
  if (min >= timer.third_call_minutes) return 3;
  if (min >= timer.second_call_minutes) return 2;
  return 1;
}

// ── Disziplin ─────────────────────────────────────────────────────────
// Die Kurzform, wie sie auf jedem Aushang und in jedem Papierplan steht.
// Turniere benennen ihre Auslosungen frei („Gruppe 6"); ohne dieses Kürzel
// ist am Bildschirm nicht zu sehen, ob ein Einzel oder ein Doppel aufs Feld
// soll.
const DISZIPLIN = {
  mens_singles: "HE",
  womens_singles: "DE",
  mens_doubles: "HD",
  womens_doubles: "DD",
  mixed: "GD",
};
const disziplin = (key) => DISZIPLIN[key] || "";

/**
 * Die Klassenbezeichnung, wie sie im Turnier gesprochen wird: „HE-C",
 * „HD-D". Beides in einem Wort — die Disziplin steckt ohnehin darin, und
 * getrennt („HE · C") liest es sich wie zwei Angaben, die nichts
 * miteinander zu tun haben. Fehlt eine der beiden Hälften, bleibt die
 * andere für sich stehen.
 */
function klasse(discipline, classLabel) {
  const d = disziplin(discipline);
  const k = (classLabel || "").trim();
  if (d && k) return `${d}-${k}`;
  return d || k;
}

// Sinnbild für die Zeit auf dem Feld. Es ersetzt die Beschriftung „auf dem
// Feld seit", die auf dem Tablet je Kachel eine ganze Zeile kostete — ohne

// und genau diese Verwechslung soll die Beschriftung ja verhindern.

</svg>`;

</svg>`;

// ── Panel-Profile (Spec tl-web-panelsystem, ADR 0024/0025) ─────────────
// Ersetzt die früheren, lose in `localStorage` verstreuten Anzeige-
// Einzelschalter: „Profil" bündelt Panel-Sichtbarkeit/-Reihenfolge/-Höhe
// UND die Anzeige-Einstellungen an einem Ort, geräteweit über den
// bestehenden `TlAction`-Kanal verwaltet (ADR 0024 — zweite bewusste
// Ausnahme von „kein Setup aus dem Web"). Das gewählte Profil ist ab jetzt
// VERBINDLICH — keine geräte-lokale Override-Ebene mehr darüber (Spec
// Nicht-Ziele: „wer abweichende Einstellungen will, wechselt/erstellt ein
// eigenes Profil").
// Sechs Panels statt neun (ADR 0026): Die vier Wartelisten-Untergruppen
// („In Vorbereitung gerufen"/„Spielbereit"/„Noch nicht bereit"/„Ohne
// Hallenzuordnung") sind zu EINEM Panel „Spiele" verschmolzen — sie zerlegten
// dieselbe Menge ein zweites Mal, zusammen mit der Hallen-Gruppierung entstanden
// bis zu acht Blöcke für die eine Frage „was kommt als Nächstes?".
// Alte Profile brauchen KEINE Migration: `normalizedPanels()` filtert gegen
// diese Whitelist (die vier alten Schlüssel fliegen raus) und ergänzt Fehlendes
// sichtbar am Ende (`queue` kommt so dazu).
const PANEL_KEYS = [
  "courts", "walkovers", "scorekeepers", "officials", "queue", "finished",
  "times", "checkin",
];
const PANEL_TITLES = {
  courts: "Felder",
  walkovers: "Aufgaben",
  scorekeepers: "Zähltafel-Warteschlange",
  officials: "Schiedsrichter",
  queue: "Spiele",
  finished: "Beendete Spiele",
  times: "Spielzeiten",
  checkin: "Anfangszeiten",
};

// Panel-Reorder-Griff: bewusst ein ANDERES Sinnbild als das ⠿-Zeichen der
// Item-Drag-Listen (Queue-Zeilen, Schiedsrichter-Zeilen, Feldkacheln) —
// Verwechslungsgefahr „ganzes Panel verschieben" vs. „eine Zeile
// verschieben" ist ein explizites Akzeptanzkriterium. Drei gleich lange
// Balken statt eines Punktrasters, klar unterscheidbar auch klein.
const PANEL_GRIFF = `<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="currentColor">
  <rect x="2" y="3.7" width="16" height="2.6" rx="1.3"/>
  <rect x="2" y="8.7" width="16" height="2.6" rx="1.3"/>
  <rect x="2" y="13.7" width="16" height="2.6" rx="1.3"/>
</svg>`;
const AUGE_AUF = `<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"
  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/>
</svg>`;
const AUGE_ZU = `<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"
  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3 3l18 18"/>
  <path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c7 0 10.5 7 10.5 7a17 17 0 0 1-3.4 4.3M6.7 6.7C3.9 8.6 1.5 12 1.5 12s3.5 7 10.5 7c1.4 0 2.7-.27 3.9-.73"/>
  <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
</svg>`;
// Auf-/Zuklappen (ADR 0026, Plan D): Pfeil nach unten = aufgeklappt (der
// Inhalt hängt darunter), Pfeil nach rechts = zugeklappt (der Inhalt steckt
// hinter der Kopfzeile). Bewusst ein anderes Sinnbild-Feld als Auge
// (Sichtbarkeit) und Balken (Panel verschieben) — drei Schalter in einer
// Kopfzeile dürfen sich nicht ähneln.
const CHEVRON_AUF = `<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"
  fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
  <path d="M5 9l7 7 7-7"/>
</svg>`;
const CHEVRON_ZU = `<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"
  fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
  <path d="M9 5l7 7-7 7"/>
</svg>`;

/** Eingebautes Standardprofil (Spec: heutige Default-Werte). Wird NIE dem
 *  Server gemeldet, solange niemand es aktiv anlegt/ändert — bleibt
 *  `state.profiles` leer, liefert `resolveActiveProfile()` schlicht dieses
 *  Objekt zur Anzeige, ohne je einen Schreibvorgang auszulösen. */
function builtInProfile() {
  return {
    id: "",
    name: "Standard",
    // Zwei Spalten mit „Felder" links und allem Übrigen rechts — genau das
    // Bild, das die Seite vor dem Mehrspalten-Layout hatte („Spielliste
    // rechts"). Hier bewusst AUSGESCHRIEBEN statt über die
    // `listPosition`-Ableitung: Die gilt Bestandsprofilen aus der Zeit vor
    // `columns`; das eingebaute Standardprofil soll seine Aufteilung selbst
    // sagen, nicht aus einem Altfeld herleiten müssen.
    panels: PANEL_KEYS.map((key) => ({
      key, visible: true, heightFr: 1, collapsed: false,
      column: key === "courts" ? 1 : 2,
    })),
    columns: 2,
    columnWidths: [],
    display: {
      showNumbers: true, showNations: false,
      showClubNames: false, showClubLogos: false,
      showDiscipline: true, showRound: true, showGroup: true,
      showCourtRemaining: false,
      unlimitedCourtCalls: false,
      // Abgelöst durch `columns`/`column` (Plan tl-liste-vereinfachen F),
      // aber weiter mitgeführt: Ein Profil, das eine ältere App-Version
      // wieder liest, soll dort unverändert aussehen.
      listPosition: "right",
      // Voreinstellung des Panels „Spielzeiten": die ursprüngliche Ansicht
      // (Klasse x Disziplin). Ein Profil ohne das Feld landet über den
      // Serde-Default auf demselben Wert — für niemanden ändert sich etwas,
      // der nichts umstellt (A1.2).
      timeStatsAxis: "group",
    },
    updatedAtMs: 0,
  };
}

/** Tiefe Kopie eines Profils — jede Änderung arbeitet auf einer Kopie, nie
 *  direkt am zuletzt vom Server erhaltenen Objekt (`state.profiles`). */
function cloneProfile(p) {
  return {
    id: p.id, name: p.name, updatedAtMs: p.updatedAtMs,
    panels: (p.panels || []).map((x) => ({
      key: x.key, visible: x.visible, heightFr: x.heightFr, collapsed: !!x.collapsed,
      column: Number(x.column) || 0,
    })),
    columns: Number(p.columns) || 0,
    columnWidths: (p.columnWidths || []).map(Number),
    display: { ...p.display },
  };
}

/** `profile.panels`, ergänzt um fehlende Panel-Schlüssel (künftige Panels,
 *  oder ein Profil von vor deren Einführung) — fehlende werden sichtbar
 *  ans Ende angehängt, nie mehr als die sechs bekannten Schlüssel behalten.
 *  Zugleich die Migration alter Profile (ADR 0026): Die vier entfallenen
 *  Wartelisten-Schlüssel stehen nicht mehr in `PANEL_KEYS` und fallen hier
 *  heraus, `queue` kommt sichtbar dazu. `collapsed` fehlt in Profilen von
 *  vor Plan D — `!!` macht daraus „aufgeklappt", die harmlose Lesart. */
function normalizedPanels(profile) {
  const bekannt = (profile.panels || [])
    .filter((p) => PANEL_KEYS.includes(p.key))
    .map((p) => ({ ...p, collapsed: !!p.collapsed, column: Number(p.column) || 0 }));
  const vorhanden = new Set(bekannt.map((p) => p.key));
  // Neue Panels landen in der LETZTEN belegten Spalte, nicht über den
  // 0→1-Klammergriff in Spalte 1: Die ist in fast jedem Mehrspalten-Profil
  // die Felder-Spalte, und ein per Update materialisierendes Panel würde
  // dort alle Feldkacheln schrumpfen (Review 17.08.2026).
  const letzteSpalte = Math.max(1, ...bekannt.map((p) => Number(p.column) || 1));
  for (const key of PANEL_KEYS) {
    if (!vorhanden.has(key)) {
      bekannt.push({ key, visible: true, heightFr: 1, collapsed: false, column: letzteSpalte });
    }
  }
  return bekannt;
}

/** Höchste anbietbare Spaltenzahl — feste Presets (1/2/3), kein freies
 *  Dashboard (Plan tl-liste-vereinfachen F). */
const MAX_SPALTEN = 3;

/**
 * Die vollständige, aufgelöste Layout-Aufteilung eines Profils:
 * Spaltenzahl, Spaltenbreiten und die Panels mit einer garantiert gültigen
 * Spaltennummer (1…`columns`).
 *
 * **Hier — und NUR hier — sitzt die Ableitung aus `listPosition`.** Ein
 * Profil aus der Zeit vor dem Mehrspalten-Layout hat `columns === 0`; dann
 * gilt „Spielliste rechts" = zwei Spalten mit Felder links und allem
 * Übrigen rechts, „Spielliste darunter" = eine Spalte. Bestandsprofile
 * sehen dadurch unverändert aus, ohne dass `listPosition` aus Config oder
 * Wire entfernt werden müsste.
 *
 * Die Ableitung steht bewusst **clientseitig**: Der Host kennt weder
 * Panel-Schlüssel noch ihre Bedeutung — er reicht Zahlen durch (siehe
 * `tablet/tl.rs::profile_save`). Sie serverseitig zu spiegeln hieße, die
 * Regel an zwei Orten zu führen, die auseinanderlaufen können; und weil
 * `profileContentEquals()` und `mutateActiveProfile()` durch DIESELBE
 * Funktion gehen, vergleicht und schreibt die Seite immer denselben
 * aufgelösten Stand. Die erste Änderung an einem Bestandsprofil
 * materialisiert die Ableitung einmalig (siehe `mutateActiveProfile()`),
 * danach steht die Aufteilung ausgeschrieben im Profil.
 */
function normalizedLayout(profile) {
  const panels = normalizedPanels(profile);
  const roh = Math.round(Number(profile.columns) || 0);
  if (roh >= 1) {
    const columns = Math.min(MAX_SPALTEN, roh);
    return {
      columns,
      // Eine Spalte jenseits der Spaltenzahl (Profil von 3 auf 2 Spalten
      // verkleinert) rutscht in die letzte — ein Panel darf nie in eine
      // Spalte fallen, die es nicht gibt, und damit unsichtbar werden.
      panels: panels.map((p) => ({
        ...p, column: Math.min(Math.max(Math.round(p.column) || 1, 1), columns),
      })),
      widths: normalizedColumnWidths(profile.columnWidths, columns),
    };
  }
  const unten = (profile.display || {}).listPosition === "bottom";
  const columns = unten ? 1 : 2;
  return {
    columns,
    panels: panels.map((p) => ({
      ...p, column: unten || p.key === "courts" ? 1 : 2,
    })),
    widths: normalizedColumnWidths(profile.columnWidths, columns),
  };
}

/** Spaltenbreiten auf genau `columns` brauchbare Gewichte bringen: falsche
 *  Länge oder unbrauchbare Zahlen (0, negativ, NaN — z. B. aus einem
 *  handgeschriebenen Profil) heißen „gleichmäßig". Analog zur Klammerung
 *  der Panel-Höhen; die harte Untergrenze in Pixeln setzt zusätzlich das
 *  CSS (`--spalte-min`). */
function normalizedColumnWidths(widths, columns) {
  const arr = (widths || []).map(Number);
  const gueltig = arr.length === columns && arr.every((w) => Number.isFinite(w) && w > 0);
  return gueltig ? arr : Array(columns).fill(1);
}

/**
 * Das für DIESES Gerät „aktive" Profil. Auflösungsreihenfolge (ADR 0025):
 * 1) `pendingProfile` — lokale, optimistische Fassung nach einer eigenen
 *    Änderung, bis der Katalog sie bestätigt (siehe `mutateActiveProfile`).
 * 2) das per `X-Tl-Active-Profile`-Antwortkopf zugeordnete Profil.
 * 3) das turnierweite Standardprofil (`state.default_profile_id`).
 * 4) das eingebaute Standardprofil.
 *
 * Zeigt (2) oder (3) auf eine Kennung, die es im Katalog nicht (mehr) gibt
 * — gelöscht, oder ein Zugang ohne Header —, fällt die Kette automatisch
 * bis zum eingebauten Standard durch: genau das Akzeptanzkriterium „ein
 * gelöschtes, zugewiesenes Profil fällt beim nächsten Poll ohne
 * Fehlermeldung auf das Standardprofil zurück".
 */
let activeProfileHeaderId = "";
let pendingProfile = null;
/** Stand des Katalog-Eintrags, als die laufende Änderungskette begann —
 *  Ausstiegskriterium, falls unsere Fassung nie inhaltlich ankommt. */
let pendingBaseUpdatedAtMs = 0;
/** Wie viele `profile_save`-Rufe gerade unterwegs sind. Solange >0 darf ein
 *  fremder Katalog-Stand die eigene Fassung nicht verdrängen. */
let pendingInFlight = 0;

/** Vergleicht die FACHLICHEN Felder zweier Profile (Name, Panels, Anzeige) —
 *  bewusst ohne `updatedAtMs`: Den Zeitstempel vergibt der Host beim
 *  Speichern selbst neu (`tablet/tl.rs::profile_save`), der Client kennt ihn
 *  also nie im Voraus und kann nicht darauf warten. */
function profileContentEquals(a, b) {
  if (!a || !b) return false;
  const fachlich = (p) => {
    // Über `normalizedLayout()` verglichen, nicht über die Rohwerte: Ein
    // Bestandsprofil (`columns: 0`) und die daraus materialisierte Fassung
    // (`columns: 2`) sehen identisch aus und sollen deshalb auch als gleich
    // gelten. Fehlt hier ein Feld, springt die eigene, optimistische
    // Änderung beim nächsten Poll sichtbar zurück — genau der Fehler, der
    // beim Panel-System schon einmal als Critical gemeldet wurde.
    const l = normalizedLayout(p);
    return JSON.stringify({
      name: p.name || "",
      panels: l.panels.map((x) =>
        [x.key, !!x.visible, Number(x.heightFr) || 1, !!x.collapsed, x.column]),
      columns: l.columns,
      columnWidths: l.widths,
      display: { ...builtInProfile().display, ...(p.display || {}) },
    });
  };
  return fachlich(a) === fachlich(b);
}

function resolveActiveProfile() {
  const katalog = (state && state.profiles) || [];
  const findById = (id) => (id ? katalog.find((p) => p.id === id) : null);
  if (pendingProfile) {
    const eintrag = findById(pendingProfile.id);
    // Ein reiner ID-Vergleich reichte hier NICHT: Bei jedem bereits
    // eingerichteten Profil stehen Kennung und Geräte-Zuordnung schon VOR
    // der Änderung im Katalog — die Prüfung hätte die eigene, gerade erst
    // gezogene Panel-Höhe sofort wieder verworfen und das Panel beim
    // Loslassen sichtbar zurückspringen lassen, bis der nächste Poll (bis
    // zu 2 s) den gespeicherten Wert brachte. Bestätigt ist erst, was
    // INHALTLICH angekommen ist.
    const bestaetigt = eintrag
      && activeProfileHeaderId === pendingProfile.id
      && (profileContentEquals(eintrag, pendingProfile)
        // Ausstieg: Ein fremdes Gerät hat dasselbe Profil zwischenzeitlich
        // überschrieben (Last-Write-Wins laut Spec) — sobald nichts mehr
        // von uns unterwegs ist, gewinnt der Server, sonst hinge unsere
        // Fassung für immer fest.
        || (pendingInFlight === 0 && (eintrag.updatedAtMs || 0) > pendingBaseUpdatedAtMs));
    if (!bestaetigt) return pendingProfile;
    pendingProfile = null;
  }
  return findById(activeProfileHeaderId) || findById(state && state.default_profile_id) || builtInProfile();
}

function activeDisplay() { return resolveActiveProfile().display || builtInProfile().display; }
function zeigeNummern() { return !!activeDisplay().showNumbers; }
function zeigeNationen() { return !!activeDisplay().showNations; }
function zeigeVereinsnamenAktiv() { return !!activeDisplay().showClubNames; }
function zeigeVereinslogosAktiv() { return !!activeDisplay().showClubLogos; }
function zeigeDisziplinAktiv() { return !!activeDisplay().showDiscipline; }
function zeigeRundeAktiv() { return !!activeDisplay().showRound; }
function zeigeGruppeAktiv() { return !!activeDisplay().showGroup; }
function zeigeRestzeitAktiv() { return !!activeDisplay().showCourtRemaining; }
function aufrufeUnbegrenzt() { return !!activeDisplay().unlimitedCourtCalls; }
/** Achse des Panels „Spielzeiten" (Spec `tl-sicht-feinschliff`). Ein
 *  unbekannter Wert fällt auf die ursprüngliche Ansicht zurück — ein Profil
 *  aus einer NEUEREN App-Version darf diese Seite nicht ratlos machen. */
function aktiveZeitenAchse() {
  const gewaehlt = activeDisplay().timeStatsAxis;
  return ZEITEN_ACHSEN.some((a) => a.id === gewaehlt) ? gewaehlt : "group";
}

// `applyListPosition()` gibt es nicht mehr: „Spielliste rechts/darunter"
// ist seit dem Mehrspalten-Layout (Plan tl-liste-vereinfachen F) nur noch
// eines von drei Spalten-Presets. Das Feld `display.listPosition` bleibt in
// Config und Wire erhalten und wird für Bestandsprofile weiterhin gelesen —
// aber ausschließlich in `normalizedLayout()`, wo aus ihm die Spaltenzahl
// abgeleitet wird. Eine zweite, davon unabhängige `body`-Klasse wäre genau
// die Doppelspurigkeit, die dieser Umbau beseitigt.

/** Frische, client-seitig vergebene Profil-Kennung — siehe ausführliche
 *  Begründung bei `mutateActiveProfile()`. */
function genProfileId() {
  return `profile-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
}

/**
 * Zentrale Schreibstelle für JEDE Änderung am aktiven Profil DIESES
 * Geräts — Panel-Sichtbarkeit, -Reihenfolge, -Höhe, Anzeige-Häkchen,
 * Listen-Position. `mutator(profilKopie)` verändert die Kopie in place.
 *
 * Läuft das Gerät noch auf dem eingebauten Standardprofil (`id === ""`,
 * nie dem Server gemeldet), MATERIALISIERT die erste Änderung es zu einem
 * echten, eigenen Profil. Bewusst mit einer selbst vergebenen `id`
 * (`genProfileId()`) statt leer zu senden: Leer heißt laut Wire-Vertrag
 * „Host vergibt bei JEDEM Aufruf eine NEUE Kennung" — bei mehreren
 * schnellen Änderungen (z. B. einen Panel-Rand ziehen und gleich danach
 * ein Panel ausblenden, bevor die erste Antwort zurück ist) entstünden so
 * mehrere Profile statt eines. Mit einer selbst vergebenen, stabilen ID
 * ist jeder weitere Aufruf ein normales Upsert auf dieselbe ID — der Host
 * behandelt eine nicht-leere `id` ohnehin identisch, ob vom Client oder
 * von ihm selbst vergeben (`tablet/tl.rs::profile_save`). Direkt danach
 * `profile_select`, damit dieses Gerät ab dem nächsten Poll über den
 * Header an sein neues Profil gebunden bleibt — sonst entstünde ein
 * Karteileichen-Profil im Katalog, das dieses Gerät selbst nie wieder
 * sieht. `pendingProfile` hält die Änderung bis zur Bestätigung lokal
 * sichtbar (siehe `resolveActiveProfile()`), unabhängig vom Netz-Timing.
 */
async function mutateActiveProfile(mutator, okMessage) {
  const basis = pendingProfile || resolveActiveProfile();
  const kopie = cloneProfile(basis);
  // Die Ableitung aus `listPosition` EINMALIG festschreiben: Ab der ersten
  // Änderung trägt das Profil seine Aufteilung ausgeschrieben (Spaltenzahl,
  // Breiten, Spalte je Panel), statt sie bei jeder Anzeige neu herzuleiten.
  // Danach ist `columns` die einzige Wahrheit — `listPosition` fasst
  // niemand mehr an.
  const layout = normalizedLayout(kopie);
  kopie.panels = layout.panels;
  kopie.columns = layout.columns;
  kopie.columnWidths = layout.widths;
  mutator(kopie);
  kopie.updatedAtMs = Date.now();
  const warBuiltIn = !kopie.id;
  if (warBuiltIn) {
    kopie.id = genProfileId();
    kopie.name = kopie.name && kopie.name !== "Standard" ? kopie.name : "Eigenes Profil";
  }
  // Nur beim START einer Änderungskette merken: Folgeänderungen, die auf
  // einer noch unbestätigten Fassung aufsetzen, behalten denselben
  // Ausgangsstand als Vergleichsmaß.
  if (!pendingProfile) {
    const eintrag = ((state && state.profiles) || []).find((p) => p.id === kopie.id);
    pendingBaseUpdatedAtMs = (eintrag && eintrag.updatedAtMs) || 0;
  }
  pendingProfile = kopie;
  render();
  pendingInFlight += 1;
  let ok = false;
  try {
    ok = await send(
      `profile-save-${kopie.id}-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
      { action: "profile_save", profile: kopie },
      okMessage,
    );
  } finally {
    pendingInFlight -= 1;
  }
  if (!ok) {
    // Abgelehnt (z. B. Profil-Obergrenze erreicht) — die optimistische
    // Fassung zurücknehmen, der nächste Render zeigt wieder den echten
    // Stand aus `state`.
    pendingProfile = null;
    render();
    return;
  }
  if (warBuiltIn) {
    await send(`profile-select-${kopie.id}`, { action: "profile_select", profileId: kopie.id }, null);
  }
}

// ── Bedienzustand ─────────────────────────────────────────────────────
// Drei Lagen, mehr braucht es nicht: nichts gewählt · ein Spiel gewählt ·
// eine Zuweisung unterwegs. Der Drag später setzt denselben Automaten, statt
// einen zweiten Weg zu eröffnen.
// `picked` trägt seine Herkunft mit: aus der Warteliste (dann ist es eine
// Zuweisung) oder von einem Feld (dann ein Umhängen). Damit deckt EIN
// Automat und EINE Geste beide Fälle ab, statt zwei getrennte Wege zu
// eröffnen, die man auseinanderhalten müsste.
let picked = null;   // { match, fromCourtId }
let pending = null;  // { matchId, courtId } — unterwegs zum Turnier-PC

function pick(match, fromCourtId) {
  const same = picked && picked.match.match_id === match.match_id;
  picked = same ? null : { match, fromCourtId: fromCourtId ?? null };
  renderActionBar();
  renderCourts();
  renderQueue();
}
function cancelPick() {
  picked = null;
  renderActionBar();
  renderCourts();
  renderQueue();
}

/** Die Auswahl ist unter der Hand weggelaufen — sagen statt schweigen. */
function pickVanished() {
  cancelPick();
  toast("Das Spiel steht nicht mehr auf diesem Feld — bitte neu auswählen.", true);
}

/** Gibt es das gewählte Spiel dort, wo es gewählt wurde, überhaupt noch? */
function pickIsStillValid() {
  if (!picked) return false;
  if (!picked.fromCourtId) {
    return state.queue.some((m) => m.match_id === picked.match.match_id);
  }
  return !!pickedCourt();
}

/**
 * Das Feld der aktuellen Auswahl — aber nur, solange **dieses** Spiel noch
 * darauf steht.
 *
 * Zwischen zwei Abfragen kann das Spiel geendet haben und die nächste
 * Begegnung schon aufgerufen sein. Wer dann auf „Ergebnis eintragen" tippt,
 * meint das eine Spiel und träfe das andere: ein Endstand für eine Partie,
 * die gerade erst angefangen hat. Darum zählt hier nicht das Feld allein,
 * sondern Feld **und** Spiel.
 */
function pickedCourt() {
  if (!picked || !picked.fromCourtId) return null;
  return state.courts.find((c) => c.court_id === picked.fromCourtId
    && c.match_id === picked.match.match_id) || null;
}

/**
 * Misst Kopfzeile und Aktionsband und legt sie als CSS-Variablen ab.
 *
 * `--kopf` bemisst die Höhe des über der Kopfzeile liegenden Aktionsbands
 * (`min-height`). `--band` ist der Überstand des Bands über den Kopf hinaus
 * (meist 0) — `main` schlägt ihn oben als zusätzliches Polster auf, sonst
 * verdeckte ein umgebrochenes, höheres Band die oberste Feldreihe. Gemessen
 * statt geschätzt, weil die Kopfzeile umbricht, sobald ein Turnier viele
 * Hallen hat, und das Aktionsband nur zeitweise da ist.
 */
function messeKopf() {
  const kopf = document.querySelector("header");
  const band = $("action-bar");
  const s = document.documentElement.style;
  s.setProperty("--kopf", (kopf?.offsetHeight || 62) + "px");
  // Wie weit das Band über die Kopfzeile hinausragt — meist gar nicht. Nur
  // wenn es auf schmalen Geräten umbricht, rückt die Felderspalte nach, statt
  // dass ihre oberste Reihe unter dem Band verschwindet.
  const ueberstand = band?.classList.contains("show")
    ? Math.max(0, band.offsetHeight - (kopf?.offsetHeight || 62))
    : 0;
  s.setProperty("--band", ueberstand + "px");
}

function renderActionBar() {
  const bar = $("action-bar");
  // Vorher/nachher vergleichen: Nur ein tatsächlicher Wechsel des Bands
  // ändert `--band` und damit den Platz, den die Felder-Sektion oben
  // abgeben muss — ein `scheduleFitCourts()` bei jedem Aufruf (die Aktions-
  // leiste wird oft neu gezeichnet, ohne dass sich ihre Sichtbarkeit
  // ändert) wäre ein sinnloses zusätzliches `requestAnimationFrame`.
  const warSichtbar = bar.classList.contains("show");
  // Während eines Zuges bleibt das Band aus: Es würde beim Erscheinen das
  // ganze Layout nach unten schieben, und der Finger träfe ein anderes Feld
  // als das anvisierte. Beim Ziehen sagt ohnehin der Klon am Finger, was
  // transportiert wird — das Band ist für den Antipp-Weg da, wo man nach
  // zwei Wischern sonst nicht mehr weiß, was gewählt ist.
  if (!picked || dragging) {
    bar.classList.remove("show");
    messeKopf();
    // Band weg → `--band` zurück auf 0 → die Felder haben wieder mehr
    // Höhe zur Verfügung und könnten eine Kompaktstufe zurückschalten.
    if (warSichtbar) scheduleFitCourts();
    return;
  }
  const m = picked.match;
  const wer = [(m.team1 || []).join(" / "), (m.team2 || []).join(" / ")]
    .filter(Boolean).join(" vs. ");
  const woher = picked.fromCourtId
    ? (state.courts.find((c) => c.court_id === picked.fromCourtId)?.court || "")
    : "";
  $("action-what").textContent = woher
    ? `${woher}: ${wer}`
    : `${[klasse(m.discipline, m.class_label), m.draw_name, m.round_name].filter(Boolean).join(" · ")} — ${wer}`;
  // Beim Umhängen ist „vom Feld nehmen" die zweite sinnvolle Handlung —
  // sie steht deshalb direkt neben dem Abbrechen, statt in einem Menü.
  // „Vom Feld nehmen" ergibt nur für ein Feld-Spiel einen Sinn; ein Ergebnis
  // lässt sich dagegen für JEDES gewählte Spiel eintragen — auch für eines,
  // das noch in der Warteliste steht und nie auf einem Feld war.
  $("action-free").hidden = !picked.fromCourtId;
  $("action-result").hidden = false;
  $("action-hint").textContent = picked.fromCourtId
    ? "auf ein anderes Feld tippen"
    : "jetzt ein Feld antippen";
  bar.classList.add("show");
  messeKopf();
  // Band neu da → könnte (bei Umbruch, viele Hallen) die oberste Feldreihe
  // verdecken (siehe `--band`-Erklärung bei `messeKopf()`) — die Felderbox
  // muss den neuen, kleineren Platz neu beurteilen.
  if (!warSichtbar) scheduleFitCourts();
}

/**
 * Stabile Vorgangskennung für eine Absicht.
 *
 * Innerhalb desselben Zeitfensters ergibt derselbe Wunsch dieselbe Kennung —
 * ein Doppeltipp wird damit als Wiederholung erkannt und schreibt nicht
 * zweimal nach BTP. Nach dem Fenster entsteht eine neue: Wer dasselbe Spiel
 * eine Minute später bewusst noch einmal auf dasselbe Feld legt, meint es
 * auch so.
 */
const OP_WINDOW_MS = 20000;
function opIdFor(matchId, courtId) {
  return `assign-${matchId}-${courtId}-${Math.floor(Date.now() / OP_WINDOW_MS)}`;
}

function toast(text, bad) {
  $("toast-text").textContent = text;
  $("toast").className = "toast show" + (bad ? " bad" : "");
}
function hideToast() { $("toast").className = "toast"; }

/**
 * Darf das gewählte Spiel auf dieses Feld?
 *
 * Nur die Gründe, die das Gerät selbst sicher kennt. Alles Weitere
 * entscheidet der Turnier-PC — er hat den maßgeblichen Stand, und seine
 * Ablehnung ist die Wahrheit. Hier geht es darum, offensichtlich Sinnloses
 * gar nicht erst anzubieten.
 */
function targetProblem(court) {
  if (!picked) return null;
  if (picked.fromCourtId === court.court_id) return "Das Spiel steht schon auf diesem Feld.";
  if (court.locked) return "Dieses Feld ist gesperrt.";
  if (court.clearing) return "Dieses Feld wird noch geräumt — BTP hat es noch nicht freigegeben.";
  if (court.match_id) return "Auf diesem Feld läuft ein Spiel.";
  // Die andere Halle ist seit dem 11.08.2026 KEIN Blocker mehr: Manchmal
  // muss ein Spiel bewusst in die andere Halle geholt werden (eine Halle
  // läuft voll). Ein Tipp daneben bleibt aber wahrscheinlicher als die
  // Absicht — deshalb fragt assignTo() vor dem Schreiben ausdrücklich
  // nach, statt hier hart zu verbieten. Seit dem 22.08.2026 gilt dasselbe
  // für die Mindestpause: Auch sie darf die Turnierleitung übergehen.
  return null;
}

/**
 * Ein Kommando senden und die Antwort verständlich anzeigen.
 *
 * Fehler laufen normalerweise als Toast — flüchtig, das reicht für „Feld
 * wurde gerade belegt" & Co. Der Ergebnis-Dialog braucht seine Fehlermeldung
 * aber STEHEND, direkt neben den Feldern, in denen die Turnierleitung gerade
 * tippt: Ein Toast wäre nach ein paar Sekunden wieder weg, während der
 * Dialog noch offen ist. `opts.onError` ersetzt dafür nur den Fehlerpfad,
 * ohne den Erfolgs-Toast anzutasten — bestehende Aufrufer ohne `opts`
 * verhalten sich unverändert.
 */
async function send(opId, action, onOk, opts) {
  const onError = opts && opts.onError;
  const fail = (text) => {
    if (onError) onError(text);
    else toast(text, true);
    return false;
  };
  if (connectionLevel() === "offline") {
    return fail("Keine Verbindung zum Turnier-PC — nichts wurde gesendet.");
  }
  try {
    const res = await fetch(API + "/command", {
      method: "POST",
      headers: { "content-type": "application/json", Authorization: "Bearer " + token },
      // `viewRev` ist der Stand, auf dem diese Entscheidung beruht. Ohne ihn
      // könnte der Turnier-PC nicht erkennen, dass jemand nach zehn Minuten
      // Standby auf einen überholten Plan getippt hat.
      body: JSON.stringify({ opId, action, viewRev: (state && state.rev) || 0 }),
    });
    // Nicht jede Antwort ist eine Antwort: Abgewiesene Anfragen kommen als
    // Klartext, und `res.json()` darauf wirft. Der Fehlerzweig sagt dann
    // „nicht bestätigt — bitte wiederholen", und der Helfer hämmert auf einen
    // Knopf, der nie durchkommt.
    if (res.status === 429) {
      return fail("Zu viele Turnierleitungs-Geräte — bitte eines schließen und erneut versuchen.");
    }
    if (res.status === 401) {
      return fail("Dieses Gerät ist nicht mehr freigegeben.");
    }
    if (!res.ok) {
      return fail("Der Turnier-PC hat die Anfrage abgewiesen (" + res.status + ").");
    }
    const answer = await res.json();
    if (answer.ok) {
      // Erfolg und Einschränkung in EINER Meldung: Zwei nacheinander
      // gesetzte Meldungen überschreiben einander sofort — die erste wäre
      // nur ein Aufblitzen. Gibt es eine Einschränkung, ist sie das
      // Wichtigere und färbt die Meldung.
      //
      // `onOk` darf FEHLEN (`null`) — für hochfrequente, stille Aktionen
      // wie einen Panel-Rand ziehen oder ein Panel per Drag umsortieren
      // (Spec tl-web-panelsystem): Ein Toast bei JEDEM Loslassen wäre dort
      // reine Ablenkung, kein neuer Erfolg, den man bestätigt sehen muss.
      // Eine echte Einschränkung (`answer.warning`) bleibt trotzdem immer
      // sichtbar, auch ohne eigenen Erfolgstext.
      if (answer.warning) toast(`${onOk || "Erledigt."} ${answer.warning}`, true);
      else if (onOk) toast(onOk);
      return true;
    }
    return fail(answer.error || "Die Aktion wurde abgelehnt.");
  } catch (e) {
    return fail("Nicht bestätigt — bitte den Stand prüfen und gegebenenfalls wiederholen.");
  } finally {
    // Sofort nachfragen statt auf den nächsten Takt zu warten: Die Anzeige
    // soll den echten Stand zeigen, nicht unsere Vermutung.
    poll();
  }
}

/** Ein Spiel in die Vorbereitung rufen (oder den Aufruf zurücknehmen). */
async function togglePrepCall(match) {
  const called = !!match.prep_call;
  // In welche Halle? Bei einem Hallenfilter ist die Antwort klar, sonst
  // nimmt der Aufruf die Halle des Spiels — und ohne beides bleibt er
  // ohne Hallenangabe (Ein-Hallen-Turnier).
  const hall = hallFilter || match.hall || "";
  const locationId = hall ? hallIdFor(hall) : null;
  await send(
    `prep-${match.match_id}-${called}-${Math.floor(Date.now() / OP_WINDOW_MS)}`,
    called
      ? { action: "retract_preparation", matchId: match.match_id }
      : { action: "call_preparation", matchIds: [match.match_id], locationId },
    called ? "Aufruf zurückgenommen." : `In Vorbereitung gerufen${hall ? ` (${hall})` : ""}.`,
  );
}


/**
 * Kurzform eines Hallennamens für die Spielliste (ADR 0026).
 *
 * Seit die Liste nicht mehr nach Hallen gruppiert ist, trägt JEDE Zeile ihre
 * Halle selbst — und dafür ist kein Platz für „Kyritzer Sporthalle". So kurz
 * wie möglich, aber eindeutig: „Kyritzer"/„Luckenwalder" werden zu „Ky"/„Lu",
 * zwei Hallen mit gleichem Anfang bekommen so viele Buchstaben, wie sie zum
 * Unterscheiden brauchen. Eine Abkürzung, unter der zwei Hallen gleich
 * aussehen, wäre schlimmer als ein langer Name — deshalb im Zweifel der
 * volle Name. (Wiederbelebt aus `68c3052`; der volle Name steht in jeder
 * Zeile zusätzlich im `title`.)
 */
function hallenKuerzel(name) {
  const alle = (state.halls || []).map((h) => h.name);
  for (let n = 2; n <= 12; n++) {
    const kurz = (s) => s.trim().slice(0, n);
    const menge = new Set(alle.map(kurz));
    if (menge.size === alle.length) return kurz(name);
  }
  return name;
}

/** Die BTP-Kennung zu einem Hallennamen; `null`, wenn unbekannt. */
function hallIdFor(hall) {
  return state.halls.find((h) => h.name === hall)?.id ?? null;
}

/**
 * Hallen-Farbe aus dem Zustand (Spec hallen-farben); "" bei unbekannter
 * Halle, Ein-Hallen-Turnier oder altem Host ohne `color`-Feld — die Seite
 * bleibt dann schlicht farblos (Feature-Detection statt toter Elemente).
 */
function hallFarbe(name) {
  if (!state || !name) return "";
  const gesucht = String(name).trim().toLowerCase();
  const h = (state.halls || []).find((x) => x.name.toLowerCase() === gesucht);
  const farbe = (h && h.color) || "";
  // Selbstverteidigung der Seite (Review 2026-08-16): Der Wert landet in
  // einem style-Attribut — esc() verhindert dort nur den Attribut-Ausbruch,
  // nicht CSS-Injektion. Deshalb dieselbe strikte Form wie am Host
  // (ist_hex_farbe): alles außer #rrggbb wird farblos.
  return /^#[0-9a-f]{6}$/.test(farbe) ? farbe : "";
}

/** Die kleine Farbmarke vor Kürzel/Name; "" ohne Farbe. */
function hallMarke(name) {
  const farbe = hallFarbe(name);
  return farbe
    ? `<span class="hall-marke" style="background:${esc(farbe)}" aria-hidden="true"></span>`
    : "";
}

/**
 * Endstand nachtragen, wenn niemand gezählt hat — als Formular mit
 * Satzfeldern statt Freitext, und auch für Spiele, die nie auf einem Feld
 * standen (Warteliste): Die Zähltafel ist nicht die einzige Quelle für
 * einen Endstand, ein Zettel oder eine mündliche Ansage sind es genauso.
 *
 * Geprüft wird hier nur, was das Gerät sicher weiß (Zahlen, mindestens ein
 * Satz) — die verbindliche Satzplausibilität hat der Turnier-PC (R5), und
 * seine Ablehnung erscheint IM Dialog statt als Toast: Ein Toast wäre nach
 * ein paar Sekunden wieder weg, während die Turnierleitung noch am
 * Formular sitzt und die Meldung sonst verpasst.
 *
 * `openResultDialog` ist die Schnittstelle für Schritt 8 (Korrektur aus der
 * Beendet-Liste) — dieselbe Funktion, nur mit `overwrite: true` und dem
 * bereits eingetragenen Stand vorbelegt.
 *
 * Bei der Korrektur steht im Titel „Sieger zuerst" (wie in der
 * Beendet-Zeile), die Satzfelder darunter aber bleiben roh in
 * Team1:Team2 — das ist das Draht-Format. Ohne weiteren Hinweis wüsste
 * niemand, welche Spalte welches Team ist: Eine plausible, aber
 * seitenvertauschte Eingabe (z. B. 21:15/21:18 mit getauschten Spalten)
 * validiert der Turnier-PC anstandslos durch — er prüft Satzplausibilität,
 * nicht Zuordnung — und dreht den Sieger unbemerkt um. `ctx.team1`/
 * `ctx.team2` (optional, roh, nicht Sieger-gedreht) blenden deshalb eine
 * Spalten-Beschriftung über den Feldern ein; ohne die beiden Angaben
 * verhält sich der Dialog wie zuvor (Task 7 bleibt kompatibel).
 */
let resCtx = null;   // { matchId, label, sets, bestOf, overwrite, team1?, team2? }
let resBusy = false; // ein Schreibvorgang ist unterwegs — kein zweiter, solange er läuft

function openResultDialog(ctx) {
  resCtx = ctx;
  resBusy = false;
  $("res-title").textContent = ctx.overwrite ? "Ergebnis korrigieren" : "Ergebnis eintragen";
  $("res-pair").textContent = ctx.label;
  const zeigeSpalten = ctx.team1 != null && ctx.team2 != null;
  $("res-cols").hidden = !zeigeSpalten;
  if (zeigeSpalten) {
    $("res-col-1").textContent = ctx.team1;
    $("res-col-2").textContent = ctx.team2;
  }
  $("res-error").hidden = true;
  $("res-save").disabled = false;
  // Mindestens zwei Zeilen, auch bei einem noch leeren Spiel — ein Satz
  // allein wäre der Regelfall selten. Steht schon mehr auf dem Zettel (ein
  // laufendes Best-of-5 zum Beispiel), zeigt der Dialog genau so viele.
  const rows = Math.max(ctx.sets.length, Math.min(ctx.bestOf || 3, 2));
  $("res-sets").innerHTML = Array.from({ length: rows }, (_, i) => resSetRow(i, ctx.sets[i])).join("");
  $("res-dlg").showModal();
}

/**
 * Ergebnis-Dialog für ein Spiel aus der Spielliste — eines also, das (noch)
 * auf keinem Feld steht und für das es folglich keinen Live-Satzstand gibt.
 *
 * Ein Ort für zwei Zugänge: das Aktionsband oben (Spiel wählen → „Ergebnis
 * eintragen") und der gleichnamige Eintrag im ⋮-Menü der Zeile (ADR 0026).
 * Bewusst gemeinsam statt zweimal gebaut — sonst driften Titelzeile,
 * Spalten-Beschriftung und `bestOf` zwischen beiden Wegen auseinander.
 */
function openQueueResultDialog(m) {
  const t1 = (m.team1 || []).join(" / "), t2 = (m.team2 || []).join(" / ");
  openResultDialog({
    matchId: m.match_id,
    label: `${[klasse(m.discipline, m.class_label), m.draw_name, m.round_name].filter(Boolean).join(" · ")} — ${t1} vs. ${t2}`,
    sets: [],
    bestOf: 3,
    overwrite: false,
    team1: t1, team2: t2,
  });
}

/** Eine Satzzeile: zwei Zahlenfelder, leer oder mit dem Live-Stand vorbelegt. */
function resSetRow(i, satz) {
  const [a, b] = satz || ["", ""];
  return `<div class="res-row">
    <label>Satz ${i + 1}</label>
    <input type="number" min="0" max="99" inputmode="numeric" value="${a}" data-res-a="${i}" />
    <span>:</span>
    <input type="number" min="0" max="99" inputmode="numeric" value="${b}" data-res-b="${i}" />
  </div>`;
}

function showResError(text) {
  $("res-error").textContent = text;
  $("res-error").hidden = false;
}

/** Aus dem Formular die Sätze bauen und an den Turnier-PC schicken. */
async function sendResult() {
  const sets = [];
  for (const row of $("res-sets").children) {
    const a = row.querySelector("[data-res-a]").value;
    const b = row.querySelector("[data-res-b]").value;
    if (a === "" && b === "") continue; // leere Zeile = weggelassener Satz
    sets.push({ a: Number(a || 0), b: Number(b || 0) });
  }
  if (!sets.length) { showResError("Mindestens ein Satz."); return; }
  resBusy = true;
  $("res-save").disabled = true;
  const ok = await send(
    // Innerhalb desselben Zeitfensters bleibt die Kennung stabil — ein
    // Doppeltipp auf „Speichern" (oder zweimal Enter) schreibt nicht
    // zweimal nach BTP.
    `res-${resCtx.matchId}-${Math.floor(Date.now() / OP_WINDOW_MS)}`,
    { action: "enter_result", matchId: resCtx.matchId, sets, retired: false, overwrite: resCtx.overwrite },
    `Ergebnis für ${resCtx.label} eingetragen.`,
    { onError: showResError },
  );
  resBusy = false;
  $("res-save").disabled = false;
  if (ok) {
    picked = null;
    renderActionBar();
    $("res-dlg").close();
  }
}

/** Ein Feld räumen — das Spiel geht zurück in die Warteliste. */
async function freeCourt(court) {
  const running = court.match_id
    ? `${(court.team1 || []).join(" / ")} vs. ${(court.team2 || []).join(" / ")}`
    : "";
  // Ein laufender Spielstand geht dabei verloren — dafür lohnt die Rückfrage.
  const hasScore = (court.sets || []).some(([a, b]) => a > 0 || b > 0);
  if (hasScore && !confirm(
    `${court.court}: ${running}\n\nDas Spiel läuft bereits. Beim Freigeben geht der `
    + `Spielstand verloren. Wirklich vom Feld nehmen?`)) {
    return;
  }
  picked = null;
  renderActionBar();
  await send(
    `free-${court.court_id}-${Math.floor(Date.now() / OP_WINDOW_MS)}`,
    {
      action: "free_court",
      courtId: court.court_id,
      expect: court.match_id
        ? { kind: "match", matchId: court.match_id }
        : { kind: "any" },
    },
    `${court.court} ist frei.`,
  );
}

async function assignTo(court) {
  if (!picked) return;
  const problem = targetProblem(court);
  if (problem) { toast(problem, true); return; }

  // Erlaubt, aber nur mit ausdrücklicher Bestätigung (Muster wie beim
  // Feld-Freigeben mit laufendem Spielstand): eine andere Halle und eine
  // noch laufende Mindestpause. Beide Gründe kommen in EINE Rückfrage —
  // zwei Dialoge hintereinander liest niemand zu Ende, und der zweite käme
  // ausgerechnet dann, wenn der erste schon bestätigt ist. Bricht die
  // Turnierleitung ab, bleibt die Auswahl bestehen — vermutlich war nur
  // das Zielfeld daneben.
  const bedenken = [];
  const ruht = picked.match.blocked;
  if (ruht && ruht.reason === "pause" && Date.now() < ruht.until_ms) {
    const namen = ruht.players || [];
    const bis = new Date(ruht.until_ms).toLocaleTimeString("de-DE",
      { hour: "2-digit", minute: "2-digit" });
    bedenken.push(`${namen.join(" und ")} ${namen.length > 1 ? "pausieren" : "pausiert"} `
      + `noch bis ${bis}.`);
  }
  const zielHalle = picked.match.hall;
  if (zielHalle && court.location && zielHalle !== court.location) {
    bedenken.push(`Das Spiel gehört nach ${zielHalle}.`);
  }
  // Wunschfeld (Spec `tl-wunschfeld`): Von Hand darf man überall hinlegen —
  // aber wer ein Wunschfeld gesetzt hat, hat sich etwas dabei gedacht, und
  // ein Tipp daneben ist wahrscheinlicher als die Absicht.
  const wunsch = picked.match.wish_court;
  if (wunsch && wunsch !== court.court_id) {
    const wf = (state.courts || []).find((c) => c.court_id === wunsch);
    bedenken.push(`Für dieses Spiel ist ${wf ? wf.court : wunsch} als Wunschfeld gesetzt.`);
  }
  if (bedenken.length) {
    const paarung = `${(picked.match.team1 || []).join(" / ")} vs. ${(picked.match.team2 || []).join(" / ")}`;
    const wohin = `Feld ${court.court}${court.location ? " in " + court.location : ""}`;
    if (!confirm(`${paarung}\n\n${bedenken.map((b) => "• " + b).join("\n")}`
      + `\n\nWirklich auf ${wohin} legen?`)) {
      return;
    }
  }

  const { match, fromCourtId } = picked;
  const wer = `${(match.team1 || []).join(" / ")} vs. ${(match.team2 || []).join(" / ")}`;
  pending = { matchId: match.match_id, courtId: court.court_id };
  picked = null;
  hideToast();
  renderActionBar();
  renderCourts();
  renderQueue();

  // Umhängen ist eine eigene Handlung, kein Freigeben mit anschließendem
  // Zuweisen: Nur so wird es ein einziger Schreibvorgang, und dazwischen ist
  // kein Zustand sichtbar, in dem das Spiel auf keinem Feld steht.
  const action = fromCourtId
    ? {
        action: "move_match",
        fromCourtId,
        toCourtId: court.court_id,
        matchId: match.match_id,
        expectFrom: { kind: "match", matchId: match.match_id },
        expectTo: { kind: "free" },
      }
    : {
        action: "assign_court",
        courtId: court.court_id,
        matchId: match.match_id,
        // Was wir vorgefunden haben. Stimmt es nicht mehr, lehnt der
        // Turnier-PC ab, statt jemandes Zuweisung zu überschreiben.
        expect: { kind: "free" },
      };

  const ok = await send(
    // Die Vorgangskennung muss für dieselbe Absicht STABIL sein, sonst wäre
    // der Schutz gegen Doppelausführung wirkungslos.
    opIdFor(match.match_id, court.court_id),
    action,
    fromCourtId ? `${wer} steht jetzt auf ${court.court}.` : `${court.court} bekommt ${wer}.`,
  );
  pending = null;
  if (!ok) {
    // Die Auswahl kommt zurück — meist will man das Spiel dann auf ein
    // anderes Feld legen.
    picked = { match, fromCourtId };
    renderActionBar();
    renderCourts();
    renderQueue();
  }
}

// ── Zustand ───────────────────────────────────────────────────────────
let state = null;
let hallFilter = new URLSearchParams(location.search).get("halle")
  || localStorage.getItem("bts-tl-halle") || "";
let failures = 0;
let lastOkMs = 0;
/// Mitschnitt der zuletzt erhaltenen Fassung — leer, solange keiner kam.
let etag = "";

function setHall(hall) {
  hallFilter = hall;
  // Andere Halle = andere Liste: Das Nachlade-Fenster beginnt wieder vorn.
  // Ohne das behielte eine schmale Hallenliste die 200 Zeilen, die vorher
  // über alle Hallen nachgeladen wurden.
  queueShown = QUEUE_PAGE;
  localStorage.setItem("bts-tl-halle", hall);
  const url = new URL(location.href);
  if (hall) url.searchParams.set("halle", hall); else url.searchParams.delete("halle");
  history.replaceState(null, "", url);
  render();
}

/** Läuft gerade ein Abruf? Anstöße aus dem Push-Kanal können dicht
 *  aufeinander folgen (Punkteregen auf mehreren Feldern) — sie sollen
 *  sich zu EINEM Abruf bündeln statt sich gegenseitig zu überholen. Ein
 *  Anstoß während eines laufenden Abrufs setzt deshalb nur eine Marke,
 *  die am Ende genau einen Nachschlag auslöst. */
let pollLaeuft = null;
let pollNachfolge = null;
function poll() {
  // Läuft schon einer, hängt dieser Aufruf einen NACHFOLGE-Abruf an und
  // gibt dessen Versprechen zurück. Zwei Dinge fallen damit zusammen:
  //
  // - Anstöße bündeln sich (alle Wartenden teilen sich einen Nachfolger,
  //   statt sich gegenseitig zu überholen), und
  // - wer `await poll()` schreibt, bekommt Daten, die NACH seinem Aufruf
  //   geholt wurden. Gäbe man den laufenden Abruf zurück, zeichnete die
  //   Profil-Verwaltung nach einem `send()` noch den alten Stand — ein
  //   gerade gelöschtes Profil stünde weiter in der Liste (Review-Fund
  //   18.08.2026).
  if (pollLaeuft) {
    if (!pollNachfolge) {
      pollNachfolge = pollLaeuft.then(() => { pollNachfolge = null; return poll(); });
    }
    return pollNachfolge;
  }
  pollLaeuft = (async () => {
    try {
      return await pollEinmal();
    } finally {
      pollLaeuft = null;
    }
  })();
  return pollLaeuft;
}

async function pollEinmal() {
  try {
    // Der Mitschnitt der letzten Fassung spart die Übertragung, solange sich
    // nichts geändert hat: Bei einer Seite, die alle zwei Sekunden fragt, ist
    // das über ein Turnier hinweg der Unterschied zwischen sparsam und
    // lästig — besonders über Mobilfunk. Der Turnier-PC im Hallennetz
    // beantwortet das nicht und schickt einfach den vollen Stand.
    const kopf = { Authorization: "Bearer " + token };
    if (etag) kopf["If-None-Match"] = etag;
    const res = await fetch(API + "/state", { headers: kopf, cache: "no-store" });
    if (res.status === 304) {
      // Unverändert: Die Verbindung ist gesund, es gibt nur nichts Neues.
      // Die Uhr trotzdem nachziehen: In einer ruhigen Phase ist **jede**
      // Antwort ein 304, und ein Gerät, dessen Uhr inzwischen gestellt
      // wurde (Zeitumstellung, Funkzeit nach dem Aufwachen), zeigte sonst
      // bis zur nächsten Änderung überall die falsche Dauer — ausgerechnet
      // in der Phase, in der man auf „seit wann aufgerufen" schaut.
      const serverzeit = headerNow(res);
      if (serverzeit) syncClock(serverzeit);
      failures = 0;
      lastOkMs = Date.now();
      // Panel-Profil-Zuordnung (Spec tl-web-panelsystem, ADR 0025): Der
      // Header kommt auf JEDER Antwort, auch bei 304 — der große,
      // geteilte Zustand bleibt cachebar, die geräte-individuelle
      // Zuordnung ist trotzdem immer aktuell. Ändert sich der Header ohne
      // Zustandswechsel (z. B. direkt nach der eigenen Profil-Auswahl,
      // bevor sich sonst am Turnier etwas ändert), muss trotzdem neu
      // gezeichnet werden — `resolveActiveProfile()` hängt an ihm.
      const vorherProfil = activeProfileHeaderId;
      readActiveProfileHeader(res);
      renderConnection();
      if (activeProfileHeaderId !== vorherProfil) render();
      return;
    }
    if (res.status === 429) {
      // Mehr Geräte als das Turnier bedient. Ehrlich benennen — sonst
      // erschiene es als Netzproblem und jemand lädt endlos neu. Die Sperre
      // löst sich von selbst, sobald ein Platz frei wird.
      showGate("Zu viele Geräte",
        "In diesem Turnier sind bereits acht Turnierleitungs-Geräte aktiv. "
        + "Ein nicht mehr benutztes Gerät schließen — der Platz wird nach "
        + "einer Minute frei. Diese Seite versucht es weiter.");
      return;
    }
    if (res.status === 401) {
      // Der Zugang gilt nicht mehr. **Ohne ihn zu löschen**: Ein
      // weggeworfener Zugang lässt sich nur am Turnier-PC neu vergeben —
      // quer durch die Halle, mitten im Turnier. Und der Grund kann auch
      // ein Missverständnis sein. Wer wirklich entzogen wurde, sieht die
      // Meldung dauerhaft; alle anderen kommen von selbst zurück.
      showGate("Zugang gilt nicht mehr",
        "Dieses Gerät ist in bts-light nicht mehr freigegeben. "
        + "Falls das ein Irrtum ist: Die Seite versucht es weiter. "
        + "Sonst neu koppeln über Turnierleitung → Geräte.");
      return;
    }
    if (res.status === 503) {
      // Der Turnier-PC ist (gerade) nicht verbunden. Das ist ein
      // Verbindungs-, kein Zugangsproblem — die Seite bleibt stehen und
      // zeigt es an, statt einen leeren Stand als „alle Felder frei" zu
      // deuten.
      throw new Error("Turnier-PC nicht verbunden");
    }
    if (!res.ok) throw new Error("HTTP " + res.status);
    etag = res.headers.get("etag") || "";
    readActiveProfileHeader(res);
    state = await res.json();
    // Die Serverzeit bevorzugt aus dem Kopf der Antwort: Über den Relay ist
    // der Stand zwischengespeichert, sein `server_now_ms` also der Zeitpunkt
    // des letzten Pushs. Nach einer ruhigen Viertelstunde gingen alle Uhren
    // eine Viertelstunde nach — und die Seite meldete keinen einzigen
    // fälligen Aufruf mehr.
    syncClock(headerNow(res) || state.server_now_ms);
    failures = 0;
    lastOkMs = Date.now();
    hideGate();
    render();
  } catch (e) {
    failures++;
    // Der Mitschnitt gilt nur zu einem lebenden Gegenüber: Startet der
    // Turnier-PC neu, beginnt seine Revision wieder klein, und ein alter
    // Mitschnitt bekäme „unverändert" auf einen völlig anderen Stand.
    etag = "";
    renderConnection();
  }
}

/** Serverzeit aus dem Antwortkopf (ms), 0 wenn keiner mitkam. */
function headerNow(res) {
  const d = res.headers.get("date");
  if (!d) return 0;
  const t = Date.parse(d);
  return Number.isFinite(t) ? t : 0;
}

/**
 * Panel-Profil-Zuordnung dieses Geräts aus dem Antwortkopf übernehmen
 * (Spec tl-web-panelsystem, ADR 0025) — `X-Tl-Active-Profile`, auf JEDER
 * `/tl/api/state`-Antwort gesetzt, auch bei 304. `Headers.get` ist
 * case-insensitiv, die genaue Schreibweise hier ist egal. Leer/fehlend =
 * kein Profil gewählt = eingebautes Standardprofil (`resolveActiveProfile`
 * fällt dann automatisch weiter auf `default_profile_id` bzw. den
 * eingebauten Standard zurück).
 */
function readActiveProfileHeader(res) {
  activeProfileHeaderId = res.headers.get("X-Tl-Active-Profile") || "";
}

/** Die Seite gegen eine Erklärung tauschen. */
function showGate(titel, text) {
  $("app").hidden = true;
  $("gate").hidden = false;
  $("gate").querySelector("h1").textContent = titel;
  $("gate").querySelector("p").textContent = text;
}

/** Und wieder zurück, sobald es weitergeht. */
function hideGate() {
  if (!$("gate").hidden) {
    $("gate").hidden = true;
    $("app").hidden = false;
  }
}

// ── Push-Kanal (Spec tl-web-push) ─────────────────────────────────────
// Statt alle zwei Sekunden zu fragen, lässt sich die Seite wecken: Der
// Kanal `/tl-ws` schickt nur `{"rev":n}` — die Daten holt weiterhin
// `poll()` über den bestehenden GET-Pfad (eine Wahrheit für Auth, ETag,
// Kürzung und Profil-Header; Muster ADR 0016 / Court-Monitore). Steht
// der Kanal, fragt der Intervall-Poll nur noch alle 30 s nach — das
// hält zugleich den Geräteplatz im Relay frisch (TTL 60 s). Fällt er
// weg oder gibt es ihn nicht (älterer Turnier-PC/Relay, Proxy ohne
// WebSocket), läuft alles wie vorher mit 2 s weiter.
const POLL_SCHNELL_MS = 2000;
const POLL_LANGSAM_MS = 30000;
const POLL_HINTERGRUND_MS = 10000;
let pushSocket = null;
/** Verbindungsversuche in Folge — staffelt den Wiederaufbau (1→2→5→10 s)
 *  und, wenn es den Kanal gar nicht gibt, auf einen sparsamen 60-s-Takt. */
let pushFehler = 0;
let pushTimer = null;
/** Steht der Kanal — und trägt er auch?
 *
 *  `readyState` allein genügt nicht: Bricht das WLAN weg (Roaming,
 *  NAT-Timeout, stiller Funkloch-Abriss), bleibt die Verbindung im
 *  Browser minutenlang „offen". Die Seite bliebe dann beim 30-s-Takt und
 *  merkte den Ausfall erst nach einer Minute — mit „aktuell" im Kopf,
 *  während der Feldplan einfriert (Review-Fund 18.08.2026). Deshalb
 *  gilt der Kanal nur als tragend, solange auch die Abrufe durchkommen:
 *  Schon EIN misslungener Abruf schaltet zurück auf den schnellen Takt,
 *  und der bringt die Lage binnen zwei Sekunden ans Licht. */
function pushAktiv() {
  return !!pushSocket && pushSocket.readyState === WebSocket.OPEN && failures === 0;
}
function tlWsUrl() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  // Neben der Seite selbst, nicht unter `/api`: `/tl` → `/tl-ws`
  // (LAN wie Cloud, dort mit dem `/bts-relay`-Präfix davor).
  return proto + "//" + location.host + location.pathname.replace(/\/+$/, "") + "-ws";
}
function verbindePush() {
  if (!token || pushSocket) return;
  let sock;
  try {
    sock = new WebSocket(tlWsUrl());
  } catch {
    planePushWiederaufbau();
    return;
  }
  pushSocket = sock;
  sock.addEventListener("open", () => {
    // In-Band-Auth: WebSockets aus dem Browser tragen keine Kopfzeilen,
    // und in die Adresse gehört der Zugang nicht (Adressen landen in
    // Zugriffsprotokollen). Der Server antwortet auf einen falschen
    // Zugang mit dem Schließen der Verbindung — ohne Begründung.
    //
    // Den Fehlerzähler hier NICHT zurücksetzen: Ein abgewiesener Zugang
    // und ein voller Zuhörer-Deckel öffnen erst und schließen danach —
    // der Zähler stünde bei jedem Versuch wieder auf null und die Seite
    // klopfte im Sekundentakt für den Rest des Tages an (Review-Fund
    // 18.08.2026). Zurückgesetzt wird erst, wenn wirklich ein Anstoß
    // ankam (siehe „message").
    sock.send(JSON.stringify({ token }));
    setzePollTakt();
  });
  sock.addEventListener("message", (ev) => {
    // Der Anstoß trägt nur die Revision. Ist sie neu, holt der Poll den
    // Stand; ist sie schon bekannt, antwortet der Server mit 304 — auch
    // ein überflüssiger Anstoß kostet also fast nichts. Mehrere Anstöße
    // in Folge fasst der laufende Abruf von selbst zusammen.
    let rev = 0;
    try { rev = Number(JSON.parse(ev.data).rev) || 0; } catch { return; }
    if (!rev) return;
    // Erst ein echter Anstoß beweist, dass der Kanal trägt (der Server
    // schickt die aktuelle Revision sofort nach erfolgreicher Prüfung) —
    // deshalb hier der Rückstellpunkt des Backoffs.
    pushFehler = 0;
    poll();
  });
  const weg = () => {
    if (pushSocket === sock) {
      pushSocket = null;
      setzePollTakt();
      planePushWiederaufbau();
    }
  };
  sock.addEventListener("close", weg);
  sock.addEventListener("error", weg);
}
function planePushWiederaufbau() {
  if (pushTimer) return;
  pushFehler++;
  // 1 → 2 → 5 → 10 s, danach sparsam alle 60 s: Gibt es den Kanal gar
  // nicht (alter Turnier-PC, Proxy ohne WebSocket), soll die Seite nicht
  // dauernd erfolglos anklopfen — der Poll trägt sie ja vollständig.
  const stufen = [1000, 2000, 5000, 10000];
  const wartezeit = stufen[Math.min(pushFehler - 1, stufen.length - 1)] || 10000;
  const dauer = pushFehler > 6 ? 60000 : wartezeit;
  pushTimer = setTimeout(() => { pushTimer = null; verbindePush(); }, dauer);
}
/** Setzt den Intervall-Poll auf den Takt, der zur Lage passt. */
let pollTimer = null;
let pollTaktMs = 0;
function setzePollTakt() {
  const ms = document.hidden
    ? POLL_HINTERGRUND_MS
    : (pushAktiv() ? POLL_LANGSAM_MS : POLL_SCHNELL_MS);
  if (ms === pollTaktMs && pollTimer) return;
  pollTaktMs = ms;
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(poll, ms);
}

/** Live / verzögert / offline — drei Lagen, nicht zwei.
 *
 *  `failures` zählt fehlgeschlagene Abrufe, nicht verstrichene Zeit —
 *  deshalb gilt die Staffelung unverändert für beide Takte: Im
 *  Push-Betrieb (30-s-Poll) heißt „ein Fehlversuch" nur später, aber
 *  genauso zuverlässig „verzögert". Ein stehender Kanal allein macht
 *  die Seite nicht „aktuell" — gemeldet wird, was zuletzt wirklich
 *  abgerufen wurde. */
function connectionLevel() {
  if (failures === 0) return "live";
  if (failures === 1) return "delayed";
  return "offline";
}

/**
 * Sieht dieses Feld nach „fertig, aber kein Ergebnis" aus — und zwar schon
 * lange genug? (Spec `tl-warnung-fertiges-spiel`.)
 *
 * Der Turnier-PC schickt nur den Zeitstempel „seit wann sieht es fertig aus"
 * und die Frist; gerechnet wird hier. Das ist Absicht: Ein fertig
 * ausgewerteter Schalter hinge an der Uhr, und der Fingerabdruck des
 * TL-Zustands nullt zeitabgeleitete Felder — die Warnung käme per Push nie an.
 *
 * `0` als Frist heißt „Warnung aus" (Rückzugsweg im laufenden Turnier).
 */
function fertigOhneErgebnis(c) {
  const frist = (state && state.finished_warning_seconds) || 0;
  if (!frist || !c || !c.decided_since_ms) return false;
  return serverNow() - c.decided_since_ms >= frist * 1000;
}

/** Alle Felder, die gerade so aussehen — ältester Fall zuerst. */
function fertigOhneErgebnisAlle() {
  return ((state && state.courts) || [])
    .filter(fertigOhneErgebnis)
    .sort((a, b) => a.decided_since_ms - b.decided_since_ms);
}

function renderConnection() {
  const level = connectionLevel();
  const conn = $("conn");
  conn.className = "conn " + (level === "live" ? "" : level);
  const age = lastOkMs ? Math.floor((Date.now() - lastOkMs) / 1000) : 0;
  $("conn-text").textContent =
    level === "live" ? "aktuell"
    : level === "delayed" ? `Daten sind ${age} s alt`
    : "keine Verbindung";

  // Ohne Verbindung sendet `send()` ohnehin nichts. Das muss man aber auch
  // sehen können, bevor man tippt: Die Schreibknöpfe werden gedämpft, der
  // Griff bleibt trotzdem anklickbar — wer doch tippt, bekommt die
  // Begründung statt eines toten Knopfes.
  document.body.classList.toggle("offline", level === "offline");

  const banner = $("banner");
  // Vorher/nachher vergleichen: Das Störungsband nimmt als Flex-Kind von
  // `#app` selbst Höhe weg von `main` — erscheint oder verschwindet es,
  // ändert sich der Platz, den die Felderbox zur Verfügung hat, und eine
  // vorher passende (oder gerade noch überlaufende) Kompaktstufe kann
  // falsch geworden sein. Nur beim tatsächlichen Wechsel neu einpassen,
  // nicht bei jedem `renderConnection()` (das läuft bei jedem Abruf, auch
  // wenn sich am Banner gar nichts ändert — inklusive der reinen
  // 304-„unverändert"-Antwort, die sonst ohne Neupassung bliebe).
  const warSichtbar = banner.classList.contains("show");
  // Das Störungsband trägt beides — mit klarem Vorrang: Ohne Verbindung ist
  // jede andere Meldung wertlos, weil der gezeigte Stand alt sein kann.
  //
  // Bewusst hier und nicht in einem eigenen Panel: Ein Panel lässt sich per
  // Profil ausblenden und einklappen — und dann fehlte die Meldung genau in
  // der Lage, für die sie gedacht ist. Das Band ist immer da.
  const fertig = level === "offline" ? [] : fertigOhneErgebnisAlle();
  if (level === "offline") {
    // Genau sein: Die Uhren laufen weiter, sie messen echte Zeit. Stehen
    // geblieben sind Felder, Spielstände und Liste. „Die Anzeige ist
    // eingefroren" wäre falsch und würde beim Blick auf die laufende Uhr
    // sofort unglaubwürdig.
    banner.textContent =
      "Keine Verbindung zum Turnier-PC — Felder, Spielstände und Liste stehen auf dem letzten bekannten Stand.";
    banner.classList.add("show");
  } else if (fertig.length) {
    // Die Halle steht im Text, nicht im Filter: Diese Zeile ignoriert den
    // Hallenfilter ausdrücklich — sonst verschwiege sie genau den Fall, für
    // den sie gebaut wurde (Gerät auf die andere Halle gestellt).
    const nenne = (c) => (c.hall ? `${c.court} (${c.hall})` : c.court);
    const kopf = fertig.length === 1
      ? `${nenne(fertig[0])}: Spiel sieht fertig aus, aber es kam kein Ergebnis.`
      : `${fertig.length} Felder ohne Ergebnis: ${fertig.map(nenne).join(", ")}.`;
    banner.textContent = `${kopf} Bitte am Feld nachsehen.`;
    banner.classList.add("show");
  } else {
    banner.classList.remove("show");
  }
  if (banner.classList.contains("show") !== warSichtbar) scheduleFitCourts();
  // Der Poll-Takt hängt auch am Erfolg: Sobald ein Abruf misslingt, gilt
  // der Push-Kanal als nicht mehr tragend (`pushAktiv`) und die Seite
  // fragt wieder alle zwei Sekunden — sonst dauerte das Erkennen einer
  // toten Leitung bis zu einer Minute (Review 18.08.2026).
  setzePollTakt();
}

// ── Zeichnen ──────────────────────────────────────────────────────────
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/**
 * Eine Paarung: links die eine Partei, rechts die andere, das „vs." in der
 * Mitte. Im Doppel stehen die Partner **untereinander** — nebeneinander mit
 * Schrägstrich ergab bei vier langen Namen einen Fließtext, in dem man erst
 * suchen musste, wo die eine Partei aufhört.
 *
 * Die Nation steht als Kürzel vor dem Namen, wenn sie eingeschaltet ist.
 * Verein (Logo und/oder Name) ist je Gerät zuschaltbar (Default = zentrale
 * Einstellung). Wird der **Vereinsname** gezeigt, steht er (mit Logo davor)
 * in einer Zeile **unter** dem Spielernamen. Ist **nur das Logo** an (ohne
 * Name), steht es kompakt **vor** dem Namen, direkt hinter der Nation.
 */
/** Spieler-Schlüssel wie `assign::player_key` im Rust-Kern: Lizenznummer,
 *  sonst Name — getrimmt und NUR ASCII-kleingeschrieben (Rust nutzt
 *  `to_ascii_lowercase`; ein volles `toLowerCase()` wiche z. B. bei
 *  „Özdemir" ab, und der Abgleich mit `blocked.player_keys` liefe leer). */
function spielerKey(nummer, name) {
  return (nummer || name || "").trim().replace(/[A-Z]/g, (c) => c.toLowerCase());
}

/**
 * Ein Spielername als HTML: mit Lizenznummer ein Link auf die öffentliche
 * badhub-Spielerseite, ohne Nummer schlichter Text.
 *
 * **Die einzige Stelle, die aus Name + Nummer Markup macht** — Name durch
 * `esc()`, Nummer durch `encodeURIComponent()`. Beides kommt aus BTP, also
 * aus einer Quelle, die diese Seite nicht kontrolliert; zwei Kopien dieser
 * Logik wären zwei Gelegenheiten, eine der beiden Absicherungen zu
 * vergessen. Nutzer sind `pairOf` (Spielliste + Feldkachel) und
 * `siegerZuerstHtml` (Beendet-Liste).
 */
function spielerNameHtml(name, nummer, klassen, titel) {
  const nr = (nummer || "").trim();
  const attr = `class="${klassen}"${titel || ""}`;
  return nr
    ? `<a ${attr} href="https://badhub.de/spieler/${encodeURIComponent(nr)}/live"
         target="_blank" rel="noopener">${esc(name)}</a>`
    : `<span ${attr}>${esc(name)}</span>`;
}

function pairOf(t1, t2, nat1, nat2, club1, club2, extra) {
  const zeigeVereinsnamen = zeigeVereinsnamenAktiv();
  const zeigeVereinslogos = zeigeVereinslogosAktiv();
  const nationenAn = zeigeNationen();
  const seite = (namen, nationen, vereine, nummern) => {
    const liste = (namen || []).length ? namen : ["?"];
    return liste.map((n, i) => {
      const land = nationenAn ? (nationen || [])[i] : "";
      const verein = (vereine || [])[i] || "";
      const willName = zeigeVereinsnamen && verein;
      const willLogo = zeigeVereinslogos && verein;
      // Nur-Logo (ohne Name) → inline vor den Namen, hinter die Nation.
      const inlineLogo = (willLogo && !willName) ? vereinsLogo(verein) : "";
      // `extra` ist optional: `lage` färbt den Namen nach Bereitschaft
      // (rot = spielt gerade, orange = pausiert; der `title` sagt es in
      // Worten) — das reicht nur die Spielliste herein. Die Lizenznummer
      // macht den Namen zum Link auf die badhub-Spielerseite; die geben
      // seit 18.08.2026 Spielliste UND Feldkachel mit. Ohne Nummer bleibt
      // es ein `<span>`.
      // Der Abgleich läuft über den Spieler-SCHLÜSSEL, nicht den Namen —
      // sonst färbten zwei gleichnamige Spieler einer Paarung gemeinsam.
      const nummer = ((nummern || [])[i] || "").trim();
      const lage = extra && extra.lage ? extra.lage(spielerKey(nummer, n)) : null;
      const klassen = `sp-name${lage ? " " + lage.cls : ""}`;
      const titel = lage ? ` title="${esc(lage.titel)}"` : "";
      const nameHtml = spielerNameHtml(n, nummer, klassen, titel);
      const haupt = `<span class="spieler-haupt">${nationBadge(land)}${inlineLogo}${nameHtml}</span>`;
      // Vereinsname → eigene Zeile unter dem Namen (Logo davor, falls an).
      const unter = willName
        ? `<span class="verein-unter" title="${esc(verein)}">${willLogo ? vereinsLogo(verein) : ""}<span class="verein-name">${esc(verein)}</span></span>`
        : "";
      return `<span class="spieler">${haupt}${unter}</span>`;
    }).join("");
  };
  return `<span class="paar">
    <span class="seite">${seite(t1, nat1, club1, extra && extra.ids1)}</span>
    <span class="vs">vs.</span>
    <span class="seite">${seite(t2, nat2, club2, extra && extra.ids2)}</span>
  </span>`;
}

// Vereins-Wappen aus dem badhub-Bestand — dieselbe Quelle wie Winner-Seite
// und Court-Monitor, aufgelöst vom Host über `/info/club-logo?name=`. Fehlt
// ein Wappen (404), wird das `<img>` einmalig entfernt, damit die Zeile nicht
// mit einem kaputten Bild springt (gleiche Mechanik wie bei den Flaggen).
const vereinsLogoFehlt = new Set();
window.vereinsLogoFehlgeschlagen = (img) => {
  const key = img.getAttribute("data-club") || "";
  vereinsLogoFehlt.add(key);
  img.remove();
};
function vereinsLogo(name) {
  const key = (name || "").trim();
  if (!key || vereinsLogoFehlt.has(key)) return "";
  const url = LOGO_BASIS + encodeURIComponent(key);
  return `<img class="verein-logo" src="${url}" alt="" loading="lazy"
    data-club="${esc(key)}" onerror="window.vereinsLogoFehlgeschlagen(this)">`;
}

/**
 * Die Nation als **Flagge** — dieselben 205 SVGs, die auch der Court-Monitor
 * zeigt (`/flags/GER.svg`).
 *
 * Eine Flagge erkennt man schneller als drei Buchstaben, und bei einem
 * internationalen Turnier ist genau das der Zweck. Das Kürzel bleibt als
 * `title` und als Ersatz, wenn es die Datei nicht gibt: Zu einer unbekannten
 * Nation lädt der Browser sonst ein kaputtes Bild, und die Zeile verrutscht.
 */
// Kürzel, deren Flaggen-Datei fehlt (404): einmal gemerkt, rendert jeder
// weitere Zyklus sofort den Text-Ersatz. Ohne den Merker setzte jeder
// Poll-Neuaufbau erneut ein scheiterndes `<img>` ein, dessen
// nachträglicher `onerror`-Tausch die Zeilen alle zwei Sekunden sichtbar
// springen ließ. Bewusster Tradeoff: `onerror` unterscheidet 404 nicht
// von einem kurzen Netz-Aussetzer — ein dabei gemerktes Kürzel bleibt bis
// zum Neuladen der Seite Text. Ruhige Zeilen wiegen schwerer als eine
// einzelne Flagge, die erst nach einem Reload zurückkehrt.
const flaggenFehlt = new Set();
window.flaggeFehlgeschlagen = (img, code) => {
  flaggenFehlt.add(code);
  img.replaceWith(Object.assign(document.createElement("span"),
    { className: "nat", textContent: code }));
};
function nationBadge(code) {
  const c = (code || "").trim().toUpperCase();
  if (!c) return "";
  // Nur was wie ein ISO-Kürzel aussieht — der Wert kommt aus BTP und landet
  // hier in einer URL (und unten uneingepackt im Inline-`onerror`).
  if (!/^[A-Z]{2,3}$/.test(c)) return "";
  if (flaggenFehlt.has(c)) return `<span class="nat">${esc(c)}</span>`;
  return `<img class="flagge" src="${FLAGGEN_BASIS}${c}.svg" alt="${esc(c)}"
    title="${esc(c)}" loading="lazy" width="20" height="14"
    onerror="window.flaggeFehlgeschlagen(this, '${c}')">`;
}

/**
 * Kurzform einer Partei für die Nachruf-Knöpfe.
 *
 * Nur der Nachname des ersten Spielers — auf dem Knopf ist kein Platz für
 * eine ganze Doppelpaarung, und die Turnierleitung erkennt daran, wen sie
 * ruft. Der volle Name steht in derselben Zeile.
 */
function shortSide(team) {
  const first = (team || [])[0] || "?";
  const teile = String(first).trim().split(/\s+/);
  return teile[teile.length - 1] || "?";
}

function renderHalls() {
  const box = $("halls");
  if (!state || !state.multi_hall) { box.innerHTML = ""; return; }
  const options = ["", ...state.halls.map((h) => h.name)];
  box.innerHTML = options.map((h) =>
    `<button type="button" data-hall="${esc(h)}" aria-pressed="${h === hallFilter}">${h ? hallMarke(h) + esc(h) : "Alle Hallen"}</button>`
  ).join("");
  scopeAll(box, "button").forEach((b) =>
    b.addEventListener("click", () => setHall(b.dataset.hall)));
}

/**
 * In welchem Zustand ist dieses Feld? Vier Lagen, die sich im Betrieb
 * unterscheiden — und die man aus zehn Metern Entfernung auseinanderhalten
 * können muss:
 *
 * - `frei` — nichts drauf
 * - `gerufen` — aufgerufen, noch kein Punkt gefallen, im Rahmen
 * - `ueberfaellig` — aufgerufen, kein Punkt, und die eingestellte Zeit ist
 *   um. Das ist die Kachel, zu der jemand hingehen muss.
 * - `laeuft` — es wird gezählt
 * - `beendet` — fertig, BTP hat das Feld nur noch nicht abgeräumt
 */
function courtState(c) {
  if (c.clearing) return "beendet";
  if (!c.match_id) return "frei";
  if (isPlaying(c)) return "laeuft";
  const grenze = (state.call_timer && state.call_timer.not_started_minutes) || 5;
  if (c.on_court_since_ms && serverNow() - c.on_court_since_ms > grenze * 60000) {
    return "ueberfaellig";
  }
  return "gerufen";
}

// ── Satz-/Matchball ───────────────────────────────────────────────────
// INLINE-KOPIE von src/io/gamePoint.mjs (tl.html kann keine Module laden).
// Die kanonische Fassung samt Test (scripts/test-gamepoint.mjs) liegt dort —
// Änderungen IMMER zuerst dort machen und hierher spiegeln.

/** Ist der laufende Satz bereits entschieden (Zielpunkt mit 2 Vorsprung oder
 *  Cap erreicht)? Dann ist es kein „Ball" mehr. */
function setDecided(a, b, target, cap) {
  const hi = Math.max(a, b),
    lo = Math.min(a, b);
  if (cap > 0 && hi >= cap) return true;
  return hi >= target && hi - lo >= 2;
}

/** Wie viele Gewinnsätze bis zum Matchsieg (Best-of → Mehrheit). */
function setsToWin(bestOf) {
  const bo = bestOf && bestOf > 0 ? bestOf : 3;
  return Math.floor(bo / 2) + 1;
}

/**
 * Liefert `"match"`, `"set"` oder `null` für ein Feld.
 * @param {{sets:[number,number][], best_of:number, target_score:number, cap_score:number, match_id:number}} c
 */
function gamePointKind(c) {
  const target = c && c.target_score;
  if (!c || c.match_id <= 0 || !target || target >= 99) return null;
  const sets = Array.isArray(c.sets) ? c.sets : [];
  if (sets.length === 0) return null;
  const last = sets[sets.length - 1] || [0, 0];
  const l = last[0] || 0,
    r = last[1] || 0;
  const cap = c.cap_score || 0;
  // Aktueller Satz schon entschieden → kein Ball (verhindert „Matchball" auf
  // einem gerade gewonnenen/beendeten Satz).
  if (setDecided(l, r, target, cap)) return null;
  const lead = Math.max(l, r),
    trail = Math.min(l, r);
  // Ball, wenn der Führende einen Punkt vom Satzgewinn entfernt ist ODER der
  // Stand direkt vor dem Cap steht (dann entscheidet der nächste Punkt den
  // Satz für den Punktgewinner — auch bei Gleichstand, z. B. 29:29 bei Cap 30).
  const capBall = cap > 0 && lead === cap - 1;
  const normalBall = lead - trail >= 1 && lead >= target - 1;
  if (!capBall && !normalBall) return null;
  const need = setsToWin(c.best_of);
  const completed = sets.slice(0, -1);
  const leftWins = completed.filter((s) => (s[0] || 0) > (s[1] || 0)).length;
  const rightWins = completed.filter((s) => (s[1] || 0) > (s[0] || 0)).length;
  // Bei Gleichstand (Cap-Patt) können BEIDE Seiten den Satz mit dem nächsten
  // Punkt gewinnen → Matchball, sobald EINE Seite damit das Match gewinnt.
  if (l === r) {
    return leftWins === need - 1 || rightWins === need - 1 ? "match" : "set";
  }
  const leaderWins = l > r ? leftWins : rightWins;
  return leaderWins === need - 1 ? "match" : "set";
}

// ── Hallen-Raster ─────────────────────────────────────────────────────
// INLINE-KOPIE von src/io/hallGrid.mjs (tl.html kann keine Module laden).
// Die kanonische Fassung samt Test (scripts/test-hallgrid.mjs) liegt dort —
// Änderungen IMMER zuerst dort machen und hierher spiegeln.

// Bildet die Feld-Reihenfolge einer Halle auf Raster-Zellen ab.
// Bildschirm-Koordinaten: row 0 = oben, col 0 = links. Die Start-Ecke
// beschreibt, wo Feld 1 aus Sicht der Turnierleitung liegt.
//
// `vertical` (Default aus) wählt spaltenweise statt reihenweise Zählung:
// Feld 1 an der Start-Ecke, Feld 2 in derselben Spalte eine Zelle weiter
// weg von der Start-Reihe, bis die Spalte voll ist, dann die nächste
// Spalte. Die Spaltenzahl (`columns`) bleibt in beiden Modi die
// Breitenvorgabe des Rasters — nur die Zählrichtung dreht sich.
function gridPositions(count, { columns, origin, serpentine, vertical = false }) {
  const cols = Math.max(1, columns | 0);
  const rows = Math.max(1, Math.ceil(count / cols));
  const fromBottom = origin === "bottom_left" || origin === "bottom_right";
  const fromRight = origin === "bottom_right" || origin === "top_right";
  const out = [];
  if (vertical) {
    for (let i = 0; i < count; i++) {
      let c = Math.floor(i / rows);
      let r = i % rows;
      // Schlange: jede zweite Nummerierungs-SPALTE läuft rückwärts —
      // das vertikale Gegenstück zur reihenweisen Schlange unten.
      if (serpentine && c % 2 === 1) r = rows - 1 - r;
      if (fromRight) c = cols - 1 - c;
      out.push({ col: c, row: fromBottom ? rows - 1 - r : r });
    }
    return out;
  }
  for (let i = 0; i < count; i++) {
    const r = Math.floor(i / cols);
    let c = i % cols;
    // Schlange: jede zweite Reihe läuft rückwärts — gezählt in
    // Nummerierungs-Reihen, nicht in Bildschirm-Reihen.
    if (serpentine && r % 2 === 1) c = cols - 1 - c;
    if (fromRight) c = cols - 1 - c;
    out.push({ col: c, row: fromBottom ? rows - 1 - r : r });
  }
  return out;
}

// Bestehende Anordnung einer Halle finden — Vergleich getrimmt +
// groß-/kleinschreibungsunabhängig, spiegelt die Host-Normalisierung
// (dieselbe Regel wie FieldOverviewPage.tsx `findHallLayout`).
function findHallLayout(hall) {
  const key = (hall || "").trim().toLowerCase();
  return (state.layouts || []).find((l) => l.hall.trim().toLowerCase() === key) || null;
}

function courtCard(c, cellStyle) {
  const stage = callStage(c, state.call_timer);
  const classes = ["card", "zustand-" + courtState(c)];
  if (c.clearing) classes.push("clearing");
  else if (!c.match_id) classes.push("free");
  if (c.locked) classes.push("locked");
  // Ist ein Spiel gewählt, zeigt jede Kachel, ob sie es aufnehmen kann.
  if (picked) classes.push(targetProblem(c) ? "blocked-target" : "target");
