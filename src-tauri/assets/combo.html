<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Kombi-Anzeige</title>
<style>
/* Gleiche Palette wie monitor.html / overview.html: dunkles Marine,
   gelbe Akzente. Mehrere Felder als horizontale Bänder übereinander —
   jedes Band flex:1, teilt sich die Höhe gleichmäßig (1 Feld = voll,
   3 Felder = je ein Drittel). */
html, body {
  margin: 0; height: 100%; width: 100%;
  background: #0b1120; color: #f8fafc;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  cursor: none; overflow: hidden;
}
body.rotate-90  { transform: rotate(90deg);  transform-origin: 50vh 50vh; width: 100vh; height: 100vw; }
body.rotate-180 { transform: rotate(180deg); }
body.rotate-270 { transform: rotate(270deg); transform-origin: 50vh 50vh; width: 100vh; height: 100vw; }

#board {
  height: 100%; display: flex; flex-direction: column;
  gap: .6vh; padding: .6vh; box-sizing: border-box;
}

/* Ein Band = ein Feld. */
.band {
  flex: 1 1 0; min-height: 0;
  display: flex; flex-direction: column; justify-content: center;
  gap: 1vh;
  padding: 1.6vh 2.4vw;
  background: linear-gradient(180deg, #1a2842, #0f1a30);
  border: .25vmin solid #334155; border-radius: 1.6vmin;
  overflow: hidden;
}
.band.live   { border-color: #1f6f4a; }
.band.pause  { border-color: #b08400; }
.band.empty  { opacity: .5; }

/* Kopfzeile: Feldnummer + Disziplin links, Status rechts. */
.band__head {
  display: flex; align-items: baseline; gap: 1.6vw;
}
.band__field {
  /* Feldnummer als hervorgehobenes Badge — aus der Ferne sofort erkennbar:
     großer Schrift, dunkler Text auf gelbem Block. */
  font-size: 6vh; font-weight: 900; color: #0b1220;
  line-height: 1; font-variant-numeric: tabular-nums;
  white-space: nowrap;
  background: #fbbf24; border-radius: 1vh;
  padding: .3vh 1.4vw;
}
.band__disc {
  font-size: 2.6vh; font-weight: 700; color: #94a3b8;
  text-transform: uppercase; letter-spacing: .04em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.band__status {
  margin-left: auto; font-size: 2.6vh; font-weight: 800;
  letter-spacing: .05em; text-transform: uppercase;
  display: inline-flex; align-items: center; gap: .8vw;
  white-space: nowrap;
}
.band__status.live  { color: #34d399; }
.band__status.pause { color: #fbbf24; }
.band__status.free  { color: #64748b; }
/* Pausen-Countdown im Bandstatus: große, gut lesbare Restzeit direkt an dem
   Feld (= „der Seite"), das gerade pausiert. Server-zeit-relativ berechnet. */
.band__status .pause-count {
  font-variant-numeric: tabular-nums; font-weight: 900;
  font-size: 3.4vh; margin-left: .6vw;
}
.dot {
  width: 1.4vh; height: 1.4vh; border-radius: 50%;
  background: currentColor; box-shadow: 0 0 1.4vh currentColor;
}
.band__status.live .dot { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

/* Spieler-Zeilen: Name links (flex), Sätze rechts (tabellarisch). */
.row {
  display: flex; align-items: center; gap: 1.4vw;
}
/* Aufschlag-Indikator: gelber Punkt vor dem aufschlagenden Team. */
.serve-dot {
  flex: 0 0 auto; width: 1.8vh; height: 1.8vh; border-radius: 50%;
  background: #fbbf24; box-shadow: 0 0 1.4vh rgba(251,191,36,.7);
}
.serve-dot.hidden { visibility: hidden; }
.row__name {
  flex: 1 1 auto; min-width: 0;
  display: flex; flex-direction: column; justify-content: center; gap: .2vh;
}
.row__name .pname {
  /* --name-size wird per JS nach Feldzahl gesetzt (analog --set-size), damit
     die Namen die Bandhöhe nutzen statt winzig zu wirken. */
  font-size: var(--name-size, 4vh); font-weight: 700; color: #e2e8f0; line-height: 1.15;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  display: flex; align-items: center; gap: 1vw;
}
.row__name .pname .flag {
  /* Einheitliche Größe für alle Flaggen (manche Seitenverhältnisse sind
     breiter): feste Box + object-fit:cover, wie auf der Einzel-Ansicht. */
  flex: 0 0 auto; width: 4vh; height: 2.6vh; object-fit: cover;
  border-radius: .3vh; box-shadow: 0 0 .4vh rgba(0,0,0,.5);
}
.row__name .pname .flag.hidden { display: none; }
.row__name .pname .pname-text {
  min-width: 0; overflow: hidden; text-overflow: ellipsis;
}
/* Setzplatz [1]/[3/4] hinter dem letzten Spieler (Spec setzplaetze-anzeigen):
   wird nie gekürzt — bei langen Namen weicht zuerst der Name (dafür das
   min-width:0 am Namen). */
.pname .seed { flex: 0 0 auto; white-space: nowrap; color: #94a3b8; font-weight: 600; }
.row.winner .row__name .pname { color: #34d399; }
.row__sets {
  flex: 0 0 auto; display: flex; align-items: center; gap: 1.6vw;
  font-variant-numeric: tabular-nums;
}
/* Ergebnis-Zahlen so gross wie moeglich — Hauptinformation auf Distanz.
   --set-size wird per JS nach Feldzahl gesetzt (nutzt die Bandhoehe):
   1 Feld riesig, 3 Felder kleiner aber weiterhin gross lesbar. */
.set {
  min-width: 1.6ch; text-align: center;
  font-size: var(--set-size, 12vh); font-weight: 900; color: #64748b; line-height: 1;
  border-radius: .8vh; padding: 0 .25ch;
}
/* Gewonnener Satz: nicht nur weiß/grau, sondern als grüner Block HINTERLEGT —
   aus der Ferne sofort als Sieger erkennbar (Feld-Wunsch 2026-06-15). */
.set.won {
  color: #052e16; background: #34d399;
  box-shadow: 0 0 1.2vh rgba(52,211,153,.45);
}
/* Laufender Satz: nur farblich hervorgehoben (gelb), kein Unterstrich. */
.set.current {
  color: #fbbf24;
}

.idle {
  height: 100%; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2vh;
  color: #94a3b8; text-align: center; padding: 6vmin;
}
.idle h1 { font-size: 5vmin; color: #fbbf24; margin: 0; }

#offline {
  position: fixed; top: 1vh; right: 2vw;
  background: rgba(244,63,94,.18); color: #fda4af;
  border: .2vmin solid #b91c1c; border-radius: 1vmin;
  padding: .5vh 1.4vw; font-size: 2.2vh; font-weight: 700;
  display: none;
}
#offline.show { display: block; }
/* ─── Identifizieren-Overlay (Fernbefehl) — wie monitor.html ─────────── */
#identify-overlay {
  position: fixed; inset: 0; display: none; z-index: 100;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 2vh; background: #fbbf24; color: #1a1206;
  animation: identify-flash 1s ease-in-out infinite;
}
#identify-overlay.show { display: flex; }
@keyframes identify-flash { 0%, 100% { opacity: 1; } 50% { opacity: .65; } }
#identify-overlay .i-code {
  font-size: 26vmin; font-weight: 900; line-height: 1; letter-spacing: .08em;
}
#identify-overlay .i-court { font-size: 7vmin; font-weight: 800; }

/* ─── Vertikale Kombi (?dir=v): Felder NEBENEINANDER, je Feld Hochformat —
   Team 1 oben, Spielstand (Satz-Paare) mittig, Team 2 unten. So mappt ein
   TV zwischen zwei Feldern räumlich auf links/rechts. ─────────────────── */
body.vertical #board { flex-direction: row; }
body.vertical .band {
  justify-content: space-evenly; align-items: stretch; text-align: center;
  padding: 2vh 1.2vw; gap: 1.4vh;
}
body.vertical .band__head { justify-content: center; }
body.vertical .vnames {
  display: flex; flex-direction: column; align-items: center; gap: .5vh;
}
/* Flex wie im waagerechten Modus: Erst so wirken `gap` und das Kürzen NUR
   des Namens — als Block kürzte die Ellipsis die ganze Zeile samt
   Setzplatz-Marke (Sichtprüfung setzplaetze-anzeigen, 12.10.2026). */
body.vertical .vnames .pname {
  display: flex; align-items: center;
  justify-content: center; font-size: 5.6vh; font-weight: 700; color: #e2e8f0;
  line-height: 1.15; max-width: 100%; gap: 1.4vw;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
body.vertical .vnames .pname .flag {
  flex: 0 0 auto; width: 5.8vh; height: 3.8vh; object-fit: cover;
  border-radius: .3vh; box-shadow: 0 0 .4vh rgba(0,0,0,.5);
}
body.vertical .vnames .pname .flag.hidden { display: none; }
/* Aufschlag-Punkt im Vertikal-Modus deutlich größer (neben den großen
   Namen/Zahlen sonst kaum sichtbar). Erscheint beim aufschlagenden Spieler,
   sobald das Tablet die Aufschlag-Info meldet. */
body.vertical .vnames .serve-dot { width: 3vh; height: 3vh; }
/* Verborgen ganz weg statt nur unsichtbar: Die Zeilen sind zentriert, ein
   Platzhalter schöbe jeden Namen aus der Mitte. */
body.vertical .vnames .serve-dot.hidden { display: none; }
body.vertical .vnames .pname .pname-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
/* Spielstand: je Team eine Zeile mit den Satzzahlen (groß), Team 1 oben,
   Team 2 darunter — zwischen den Namen. Mehrere Sätze = mehrere Zahlen
   nebeneinander je Zeile. */
body.vertical .vsetrow {
  display: flex; justify-content: center; gap: 3vw;
  font-variant-numeric: tabular-nums; line-height: 1;
}
body.vertical .vset { font-size: 15vh; font-weight: 900; color: #64748b; border-radius: .8vh; padding: 0 .25ch; }
/* Gewonnener Satz auch im Vertikal-Modus als grüner Block hinterlegt. */
body.vertical .vset.won {
  color: #052e16; background: #34d399;
  box-shadow: 0 0 1.2vh rgba(52,211,153,.45);
}
body.vertical .vset.current { color: #fbbf24; }
</style>
</head>
<body>
<main id="board"></main>
<div id="offline">Keine Verbindung zum Turnier-PC</div>
<div id="identify-overlay">
  <div class="i-code" id="identify-code">····</div>
  <div class="i-court" id="identify-court">Kombi</div>
</div>

<script>
(function () {
  'use strict';

  // ── Inline-Kopie von src/io/comboAnsicht.mjs ────────────────────────────
  // Kanonische Fassung: src/io/comboAnsicht.mjs (dort steht die Begruendung,
  // getestet in scripts/test-combo-ansicht.mjs). Die Assets durchlaufen keinen
  // Build und koennen keine Module laden — Aenderungen hier und dort gemeinsam.
  var IGNORIERTE_PARAMS = ['device', 'rotate', 'dir', 'ansage'];

  /** Zeigt die Seite schon das, worauf `redirectTo` verweist? */
  function urlPasst(hierHref, zielPfad, origin) {
    try {
      var hier = new URL(hierHref);
      var dort = new URL(zielPfad, origin);
      for (var i = 0; i < IGNORIERTE_PARAMS.length; i++) {
        hier.searchParams.delete(IGNORIERTE_PARAMS[i]);
        dort.searchParams.delete(IGNORIERTE_PARAMS[i]);
      }
      return hier.pathname === dort.pathname &&
             hier.searchParams.toString() === dort.searchParams.toString();
    } catch (e) { return false; }
  }

  /** Ausrichtung fuer diesen Render-Durchlauf: Server schlaegt Startwert —
   *  aber nur, wenn er sich aeussert. */
  function ausrichtungVertikal(state, startVertikal) {
    if (state && typeof state.vertical === 'boolean') return state.vertical;
    return !!startVertikal;
  }
  // ── Ende Inline-Kopie ───────────────────────────────────────────────────

  var params = new URLSearchParams(location.search);

  // Pivot-Rotation per URL-Parameter.
  var rotate = (params.get('rotate') || '0').replace(/[^0-9]/g, '');
  if (rotate === '90' || rotate === '180' || rotate === '270') {
    document.body.classList.add('rotate-' + rotate);
  }

  // Gewünschte CourtIDs (Reihenfolge wird beibehalten) + Geräte-Code.
  var courtsParam = (params.get('courts') || '').trim();
  var deviceId = (params.get('device') || '').trim();

  // ?dir=v → Felder NEBENEINANDER (Hochformat je Feld) statt übereinander.
  // Seit ADR 0049 nur noch der STARTWERT: Sobald der Host im /combo/state
  // eine Ausrichtung nennt (er kennt das Gerät über ?device=), gewinnt die.
  // Eine hand-getippte Kiosk-URL ohne ?device= bleibt bei diesem Wert.
  var START_VERTIKAL = /^(v|vertical)$/i.test(params.get('dir') || '');
  if (START_VERTIKAL) {
    document.body.classList.add('vertical');
  }

  // ── Diagnose-Mini-Logger ──────────────────────────────────────────────
  // Fängt JS-Fehler + Schlüsselereignisse (z. B. „keine Daten", Deassign) und
  // schickt sie best-effort an den Turnier-PC: POST /pi-log → lokal ablegen +
  // (online) an die Cloud weiterleiten (Datei mon-<device>.log). Nur LAN; im
  // reinen Cloud-Modus (Relay ohne /pi-log) scheitert der Post still. Kein
  // Dauer-Upload — nur bei Fehler, „keine Daten" und beim Schließen der Seite.
  var MLOG = [], MLOG_MAX = 200;
  var wasEmpty = false; // „keine Daten" nur beim Übergang loggen (nicht je Poll)
  function mlog(level, event, detail) {
    var e = { t: Date.now(), level: level, event: event };
    if (detail !== undefined) e.d = detail;
    MLOG.push(e); while (MLOG.length > MLOG_MAX) MLOG.shift();
    try { console.log('[' + new Date(e.t).toISOString() + '] ' + level + ' ' + event, detail || ''); } catch (x) {}
  }
  function mlogDevice() {
    var id = (deviceId || '').replace(/[^a-z0-9_-]/gi, '').slice(0, 56);
    return 'mon-' + (id || 'unbekannt');
  }
  function uploadMonitorLog() {
    try {
      var body = 'Monitor combo · device=' + mlogDevice() + '\nUA: ' + navigator.userAgent
        + '\nGeneriert: ' + new Date().toISOString() + '\n\n'
        + MLOG.map(function (e) {
            return '[' + new Date(e.t).toISOString() + '] ' + e.level + ' ' + e.event
              + (e.d !== undefined ? ' ' + JSON.stringify(e.d) : '');
          }).join('\n') + '\n';
      fetch('/pi-log?device=' + encodeURIComponent(mlogDevice()), {
        method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: body, keepalive: true,
      }).catch(function () {});
    } catch (x) {}
  }
  window.addEventListener('error', function (ev) {
    try { mlog('error', 'js_error', { msg: String((ev && ev.message) || ev), src: (ev && ev.filename) || '', line: (ev && ev.lineno) || 0 }); uploadMonitorLog(); } catch (x) {}
  });
  window.addEventListener('unhandledrejection', function (ev) {
    try { var r = ev && ev.reason; mlog('error', 'unhandled_rejection', { msg: r != null ? (r.message || String(r)) : 'unknown' }); uploadMonitorLog(); } catch (x) {}
  });
  window.addEventListener('pagehide', uploadMonitorLog);
  mlog('info', 'monitor_boot', { courts: courtsParam, dir: document.body.classList.contains('vertical') ? 'v' : 'h' });

  var POLL_OK_MS = 1000;
  var POLL_FAIL_MS = 2000;
  var errorCount = 0;

  function h(tag, cls, text) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text != null) el.textContent = text;
    return el;
  }

  // Server-Zeit (ms) aus dem letzten Poll. Der Pausen-Countdown wird relativ
  // dazu berechnet — die Pi hat evtl. keine synchrone Uhr (kein NTP im
  // Turnier-WLAN), das zählende Tablet hat `endsAt` aber in SERVER-Zeit gesetzt.
  // SERVER_NOW_WALL hält die lokale Monotonuhr (performance.now()) zum
  // Empfangszeitpunkt, damit der Countdown auch zwischen Polls weiterläuft und
  // nicht systematisch um die Poll-Latenz zu hoch steht.
  var SERVER_NOW = 0;
  var SERVER_NOW_WALL = 0;
  // Pausen-Beschriftung wie monitor.html (Einzelmonitor): gleicher Wortlaut.
  var PAUSE_LABEL = { eleven: 'Pause', game: 'Satzpause', injury: 'Behandlung' };

  // Restzeit einer Pause als „m:ss". null, wenn kein Countdown (Behandlung
  // ohne Ende oder kein gültiges `endsAt`).
  function pauseCountdown(pause) {
    if (!pause || pause.kind === 'injury' || typeof pause.endsAt !== 'number') return null;
    var nowMs;
    if (SERVER_NOW > 0) {
      // Seit dem Poll vergangene lokale Zeit aufaddieren (Monotonuhr).
      nowMs = SERVER_NOW + Math.max(0, performance.now() - SERVER_NOW_WALL);
    } else {
      nowMs = Date.now();
    }
    var secs = Math.max(0, Math.round((pause.endsAt - nowMs) / 1000));
    var m = Math.floor(secs / 60);
    var s = secs % 60;
    return m + ':' + (s < 10 ? '0' + s : s);
  }

  function setVal(s, idx) {
    // sets-Eintrag ist [a,b] (serde-Tuple) oder {a,b}. Fallback 0 statt
    // "undefined" in der Zelle, falls das Schema je abweicht.
    if (Array.isArray(s)) return s[idx] != null ? s[idx] : 0;
    return idx === 0
      ? (s.a != null ? s.a : (s[0] != null ? s[0] : 0))
      : (s.b != null ? s.b : (s[1] != null ? s[1] : 0));
  }

  function renderBand(c) {
    var isLive = c.match_id && c.match_id > 0 && c.team1 && c.team1.length > 0;
    // Offizielle Pause vom Tablet (eleven/game/injury). Hat Vorrang vor dem
    // älteren injury-Flag, weil sie die Restzeit (endsAt) mitbringt.
    var pause = (c.pause && c.pause.kind) ? c.pause : null;
    var isPause = isLive && (!!pause || c.injury || c.official_call);

    var band = h('div', 'band' + (!isLive ? ' empty' : isPause ? ' pause' : ' live'));

    // Kopfzeile
    var head = h('div', 'band__head');
    head.appendChild(h('span', 'band__field', c.court || ('Feld ' + c.court_id)));
    if (isLive) head.appendChild(h('span', 'band__disc', c.match_name || ''));
    // Status nur bei AbweichungEN vom Normalfall zeigen — „läuft" ist
    // redundant (sieht man am Spielstand) und kostet Platz. Frei/Pause/
    // TL/Behandlung bleiben sichtbar. Bei einer laufenden Pause steht der
    // Countdown direkt an diesem Feld (= „der Seite, wo die Pause ist").
    if (!isLive) {
      var sFree = h('span', 'band__status free');
      sFree.appendChild(h('span', null, 'frei'));
      head.appendChild(sFree);
    } else if (pause) {
      var sP = h('span', 'band__status pause');
      sP.appendChild(h('span', null, PAUSE_LABEL[pause.kind] || 'Pause'));
      var cd = pauseCountdown(pause);
      if (cd) sP.appendChild(h('span', 'pause-count', cd));
      head.appendChild(sP);
    } else if (c.injury) {
      var sInj = h('span', 'band__status pause');
      sInj.appendChild(h('span', null, 'Behandlung'));
      head.appendChild(sInj);
    } else if (c.official_call) {
      var sTl = h('span', 'band__status pause');
      sTl.appendChild(h('span', null, 'TL'));
      head.appendChild(sTl);
    }
    band.appendChild(head);

    if (!isLive) return band;

    // Sätze-Anzahl + Index des laufenden Satzes (letzter, solange live).
    var sets = Array.isArray(c.sets) ? c.sets : [];
    var lastIdx = sets.length - 1;
    var running = !isPause; // bei Pause kein "laufender" Satz markieren

    // Vertikaler Modus (?dir=v): Team 1 oben, Spielstand (Satz-Paare) mittig,
    // Team 2 unten — je Feld ein Hochformat-Scoreboard, Felder nebeneinander.
    if (document.body.classList.contains('vertical')) {
      var vname = function (names, nats, seed, isServing, servePlayerIdx) {
        var box = h('div', 'vnames');
        var list = (names && names.length) ? names : ['—'];
        list.forEach(function (n, i) {
          var line = h('div', 'pname');
          var dotHere = isServing && (servePlayerIdx == null ? i === 0 : i === servePlayerIdx);
          line.appendChild(h('span', 'serve-dot' + (dotHere ? '' : ' hidden')));
          line.appendChild(flagEl(nats && nats[i]));
          line.appendChild(h('span', 'pname-text', n));
          if (seed && i === list.length - 1) line.appendChild(h('span', 'seed', '[' + seed + ']'));
          box.appendChild(line);
        });
        return box;
      };
      // Satzzahlen-Zeile eines Teams (selfIdx 0/1), gleiche Gewinn-/Laufend-
      // Färbung wie der horizontale Modus.
      var vsetRow = function (selfIdx, otherIdx) {
        var row = h('div', 'vsetrow');
        sets.forEach(function (s, i) {
          var mine = setVal(s, selfIdx);
          var theirs = setVal(s, otherIdx);
          var cls = 'vset';
          if (i === lastIdx && running) cls += ' current';
          else if (mine > theirs) cls += ' won';
          row.appendChild(h('span', cls, String(mine)));
        });
        return row;
      };
      var spv = (typeof c.serving_player === 'number') ? c.serving_player : null;
      band.appendChild(vname(c.team1, c.team1_nationalities, c.team1_seed, c.serving_team === 1, spv));
      band.appendChild(vsetRow(0, 1)); // Team 1 Punkte (oben)
      band.appendChild(vsetRow(1, 0)); // Team 2 Punkte (darunter)
      band.appendChild(vname(c.team2, c.team2_nationalities, c.team2_seed, c.serving_team === 2, spv));
      return band;
    }

    function teamRow(names, nats, seed, selfIdx, otherIdx, isServing, servePlayerIdx) {
      var row = h('div', 'row');
      // Namen: im Doppel jeder Spieler in einer eigenen Zeile untereinander,
      // jeweils mit Flagge + Aufschlag-Punkt beim konkret aufschlagenden
      // Spieler (BWF-Doppelregel). servePlayerIdx = Index im Team, der
      // aufschlägt; null → Team-Level-Fallback (Punkt beim ersten Namen).
      var nameBox = h('div', 'row__name');
      var list = (names && names.length) ? names : ['—'];
      list.forEach(function (n, i) {
        var line = h('div', 'pname');
        var dotHere = isServing &&
          (servePlayerIdx == null ? i === 0 : i === servePlayerIdx);
        line.appendChild(h('span', 'serve-dot' + (dotHere ? '' : ' hidden')));
        line.appendChild(flagEl(nats && nats[i]));
        line.appendChild(h('span', 'pname-text', n));
        // Setzplatz einmal je Seite, hinter dem letzten Spieler.
        if (seed && i === list.length - 1) line.appendChild(h('span', 'seed', '[' + seed + ']'));
        nameBox.appendChild(line);
      });
      row.appendChild(nameBox);
      var setsEl = h('div', 'row__sets');
      sets.forEach(function (s, i) {
        var mine = setVal(s, selfIdx);
        var theirs = setVal(s, otherIdx);
        var cls = 'set';
        if (i === lastIdx && running) cls += ' current';
        else if (mine > theirs) cls += ' won';

      function (fehler) { clearTimeout(timer); throw fehler; }

    // sonst verstummte ein Pi beim ersten Zielwechsel.
    var hereParams = new URLSearchParams(location.search);
    if (hereParams.has('ansage') && !/[?&]ansage(=|&|$)/.test(href)) {

        // Reihenfolge wie monitor.html: navigieren wir weg, wird KEIN Befehl
        // mehr ausgeführt (sonst bräche ein gleichzeitiges „Neu laden" die

        if (s.redirectTo) {

          if (!currentUrlMatches(s.redirectTo)) {
            var sep = s.redirectTo.indexOf('?') >= 0 ? '&' : '?';
            navigateWithRotate(s.redirectTo + sep + 'device=' + encodeURIComponent(deviceId));

          }

          // normalen Monitor-Seite. Entprellt: erst nach mehreren Polls, damit
          // ein einzelnes transientes Leer-Lesen die Kombi nicht strandet.
          if (++noRedirectPolls < DEASSIGN_AFTER) return;
          mlog('info', 'deassign_to_monitor', { polls: noRedirectPolls });
          uploadMonitorLog();
          navigateWithRotate('/monitor?device=' + encodeURIComponent(deviceId));
          return;

        // … wir bleiben auf dieser Seite → Fernbefehl behandeln. Dieser Poll
        // konsumiert den Command ohnehin; ohne das ginge „Identifizieren"
        // für die Kombi-Anzeige verloren (der bisherige Bug).
        handleCommand(s.command);

      .catch(function () { checkLaeuft = false; });
  }
  setInterval(checkReassignment, 1000);

  // ─── Fernbefehle (Identifizieren/Neu laden) — Logik wie monitor.html ──
  var lastDeviceCode = '';
  var lastCmdId = 0;
  try { lastCmdId = parseInt(localStorage.getItem('bts-monitor-cmd-id') || '0', 10) || 0; }
  catch (e) {}
  var cmdBaselineSet = false;
  var identifyTimer = null;
  function saveCmdId() {
    try { localStorage.setItem('bts-monitor-cmd-id', String(lastCmdId)); } catch (e) {}
  }
  function handleCommand(cmd) {
    var id = (cmd && typeof cmd.id === 'number') ? cmd.id : 0;
    if (!cmdBaselineSet) {
      cmdBaselineSet = true;
      if (id > lastCmdId) { lastCmdId = id; saveCmdId(); }
      return;
    }
    if (!cmd || id <= lastCmdId) return;
    lastCmdId = id;
    saveCmdId();
    if (cmd.kind === 'reload') {
      location.reload();
    } else if (cmd.kind === 'identify') {
      showIdentify();
    }
  }
  function showIdentify() {
    var el = document.getElementById('identify-code');
    if (el) {
      el.textContent = lastDeviceCode
        || (deviceId.replace(/[^a-z0-9]/gi, '').slice(-4).toUpperCase());
    }
    var ov = document.getElementById('identify-overlay');
    if (!ov) return;
    ov.classList.add('show');
    if (identifyTimer) clearTimeout(identifyTimer);
    identifyTimer = setTimeout(function () { ov.classList.remove('show'); }, 10000);
  }
})();

    if (stand.bestand && ANSAGE_ARTEN.indexOf(e.art) >= 0) neu.push(e);

      g.gain.exponentialRampToValueAtTime(0.32, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
      g.connect(ctx.destination);
      const o = ctx.createOscillator();
      o.type = "triangle";
      o.frequency.value = notes[i];
      o.connect(g);
      o.start(t);
      const stopAt = t + 0.38;
      o.stop(stopAt);
      letzter = o;
      endeSec = stopAt;

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.4, now + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
  gain.connect(ctx.destination);

  o1.type = "sine";
  o1.frequency.value = 880;
  o1.connect(gain);
  o1.start(now);
  o1.stop(now + 0.6);

  const o2 = ctx.createOscillator();
  o2.type = "sine";
  o2.frequency.value = 587.33;
  o2.connect(gain);
  o2.start(now + 0.18);
  o2.stop(now + 1.1);

  // danach wirkungslos. 1,2 s dient nur der konservativen Fallback-Frist.
  return { letzter: o2, endeSec: now + 1.2 };

 * `window`). `beiAenderung()` meldet jeden neuen Stand an die Anzeige,
 * `beiHallen(halls)` eine geänderte Hallenliste. `verlauf` = die Seite führt
 * einen Verlauf der letzten gespielten Ansagen samt geladenem Audio zum
 * Wiederholen (nur `/ansage`; die Monitor-Seiten halten kein Audio vor).
 */
function ansageKern(opt) {
  var w = opt.welt;
  var base = opt.base;
  var halleFest = !!opt.halleFest;
  var melden = opt.beiAenderung || function () {};
  var hallenMelden = opt.beiHallen || function () {};
  var mitVerlauf = !!opt.verlauf;
  var jetzt = function () { return w.Date.now(); };

  var z = {
    halle: String(opt.halle || ""),
    halls: [],
    hallenGesehen: false,
    feed: null,
    stand: { lastId: 0, bestand: false },
    verbunden: false,
    // Der Server kennt den Feed nicht (404) — seit wann.
    fehltSeit: 0,
    // Gescheiterte Abrufe in Folge — ein einzelner Aussetzer ist kein
    // Grund für einen Hinweis am TV.
    fehlversuche: 0,
    abrufLaeuft: false,
    warteschlange: [],
    spielt: false,
    ctx: null,
    tonFrei: false,
    // Zuletzt gespielte Ansage: `{ ms, text }`.
    letzte: null,
    // Die letzten gespielten Ansagen, neueste vorn (nur mit `verlauf`):
    // `{ id, ms, text, e, puffer }` — `puffer` ist das geladene Audio, das
    // auf dem Turnier-PC nach einer Minute verfällt. Lebt nur im Speicher
    // der offenen Seite (Spielernamen gehören nicht in den Gerätespeicher).
    verlauf: [],
    // Kennung der Ansage, die gerade erklingt (Original oder Wiederholung).
    spieltId: null,
  };

  /* ── Stimme des Geräts ─────────────────────────────────────────── */
  function geraeteStimmen(lang) {
    try {
      if (!w.speechSynthesis) return [];
      var praefix = lang === "en" ? "en" : "de";
      return w.speechSynthesis.getVoices().filter(function (v) {
        return String(v.lang || "").toLowerCase().indexOf(praefix) === 0;
      });
    } catch (e) { return []; }
  }
  function hatGeraeteStimme() { return geraeteStimmen("de").length > 0; }

  /* ── Ton ───────────────────────────────────────────────────────── */
  function audioKontext() {
    if (!z.ctx) {
      var AC = w.AudioContext || w.webkitAudioContext;
      if (!AC) return null;
      try { z.ctx = new AC(); } catch (e) { return null; }
    }
    return z.ctx;
  }
  function tonPruefen() {
    var ctx = audioKontext();
    z.tonFrei = !!ctx && ctx.state === "running";
    return z.tonFrei;
  }
  function freischalten() {
    var ctx = audioKontext();
    if (ctx && ctx.state !== "running") {
      try { ctx.resume().then(melden, melden); } catch (e) { /* egal */ }
    }
    // Manche Browser geben die Sprachausgabe erst nach einer Äußerung in
    // einer Nutzergeste frei — eine leere tut es.
    try {
      if (w.speechSynthesis && w.SpeechSynthesisUtterance) {
        var u = new w.SpeechSynthesisUtterance(" ");
        u.volume = 0;
        w.speechSynthesis.speak(u);
      }
    } catch (e) { /* egal */ }
  }

  function gongSpielen(art) {
    var ctx = audioKontext();
    if (!ctx || ctx.state !== "running") return Promise.resolve();
    return new Promise(function (fertig) {
      var erledigt = false;
      var ende = function () {
        if (erledigt) return;
        erledigt = true;
        w.setTimeout(fertig, 150);
      };
      try {
        var g = gongPlanen(ctx, art);
        g.letzter.onended = ende;
        w.setTimeout(ende, Math.max(0, (g.endeSec - ctx.currentTime) * 1000) + 250);
      } catch (e) { ende(); }
    });
  }

  function audioLaden(e) {
    var ctx = audioKontext();
    if (!ctx || !e.audio) return Promise.reject(new Error("kein Audio"));
    var abbruch = w.AbortController ? new w.AbortController() : null;
    var ladeFrist = null;
    var geladen = new Promise(function (ok, fehler) {
      ladeFrist = w.setTimeout(function () {
        if (abbruch) abbruch.abort();
        fehler(new Error("Audio-Frist"));
      }, AUDIO_LADE_FRIST_MS);
      w.fetch(base + "ansage/audio/" + e.id, { cache: "no-store", signal: abbruch ? abbruch.signal : undefined })
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.arrayBuffer();
        })
        .then(function (buf) {
          return new Promise(function (dok, dfehler) { ctx.decodeAudioData(buf, dok, dfehler); });
        })
        .then(ok, fehler);
    });
    return geladen.then(function (puffer) {
      w.clearTimeout(ladeFrist);
      return puffer;
    }, function (err) {
      w.clearTimeout(ladeFrist);
      throw err;
    });
  }

  function pufferSpielen(puffer) {
    var ctx = audioKontext();
    if (!ctx) return Promise.reject(new Error("kein Ton"));
    return new Promise(function (fertig) {
      var erledigt = false;
      var ende = function () { if (!erledigt) { erledigt = true; fertig(); } };
      var quelle = ctx.createBufferSource();
      quelle.buffer = puffer;
      quelle.connect(ctx.destination);
      quelle.onended = ende;
      w.setTimeout(ende, puffer.duration * 1000 + AUDIO_NACHLAUF_MS);
      quelle.start();
    });
  }

  /* Audio vom Turnier-PC — für eine Wiederholung das schon geladene aus dem
     Verlauf (das auf dem PC nach einer Minute verfällt). Das frisch geladene
     landet am Verlaufseintrag, damit ↻ es später ohne Abruf spielen kann. */
  function audioSpielen(e, v) {
    if (v && v.puffer) return pufferSpielen(v.puffer);
    return audioLaden(e).then(function (puffer) {
      if (v) v.puffer = puffer;
      return pufferSpielen(puffer);
    });
  }

  function segmenteSprechen(e) {
    if (!w.speechSynthesis || !w.SpeechSynthesisUtterance) return Promise.resolve();
    var stimmen = geraeteStimmen(e.lang);
    var kette = Promise.resolve();
    (e.segmente || []).forEach(function (text) {
      kette = kette.then(function () {
        return new Promise(function (fertig) {
          var t = String(text || "").trim();
          if (!t) { fertig(); return; }
          var u = new w.SpeechSynthesisUtterance(t);
          u.lang = e.lang === "en" ? "en-US" : "de-DE";
          u.rate = e.rate || 0.8;
          if (stimmen.length) u.voice = stimmen[0];
          var fertigGemeldet = false;
          var ende = function () { if (!fertigGemeldet) { fertigGemeldet = true; fertig(); } };
          u.onend = ende;
          u.onerror = ende;
          w.setTimeout(ende, 2000 + t.length * 140);
          w.speechSynthesis.speak(u);
        });
      });
    });
    return kette;
  }

  /* ── Warteschlange: strikt nacheinander, nichts überlappt ──────── */
  function naechste() {
    if (z.spielt) return;
    var stueck = z.warteschlange.shift();
    if (!stueck) return;
    var belegung = (z.feed && z.feed.belegung) || [];
    // Eine Wiederholung hat der Nutzer selbst angefordert — sie verfällt
    // nicht und wird nicht gegen die Belegung geprüft.
    if (!stueck.wiederholung && !nochAbspielbar(stueck.e, belegung, stueck.empfangen, jetzt())) {
      naechste();
      return;
    }
    z.spielt = true;
    var e = stueck.e;
    var v = stueck.verlauf || null;
    // Ein Original kommt in den Verlauf, sobald es erklingt — wer nicht hört,
    // liest mit, während gesprochen wird. Eine Wiederholung ist kein neuer
    // Eintrag.
    if (mitVerlauf && !stueck.wiederholung) {
      v = { id: e.id, ms: jetzt(), text: ansageText(e), e: e, puffer: null };
      z.verlauf = verlaufAufnehmen(z.verlauf, v, ANSAGE_VERLAUF_MAX);
    }
    z.spieltId = e.id;
    melden();
    (e.gong ? gongSpielen(e.gong) : Promise.resolve())
      .then(function () {
        return audioSpielen(e, v).catch(function () { return segmenteSprechen(e); });
      })
      .catch(function () { /* weiter mit der nächsten */ })
      .then(function () {
        z.spielt = false;
        z.spieltId = null;
        if (!stueck.wiederholung) {
          z.letzte = { ms: jetzt(), text: String((e.segmente || []).join(" ")).slice(0, 140) };
        }
        melden();
        naechste();
      });
  }

  /* Die Halle, mit der die Seite fragt. Eine leere Liste heißt entweder „nur
     eine Halle" oder „noch kein BTP-Stand" (Turnier-PC startet gerade neu).
     Hat die Seite schon Hallen gesehen, ist es Letzteres: Dann bleibt sie bei
     ihrer Halle — sonst stünde ein Pi nach jedem Neustart des PCs stumm da
     oder hörte kurz fremde Hallen. Nur ohne je gesehene Hallen (Turnier mit
     einer Halle) fragt sie ohne. */
  function wirksameHalle() {
    return z.halls.length || z.hallenGesehen ? z.halle : "";
  }

  /* Darf die Seite mit ihrer Halle spielen und sich melden? Eine fest
     vorgegebene Halle muss es im Turnier geben, sobald es Hallen gibt. */
  function halleOk() {
    if (!halleGueltig(z.halls, z.halle)) return false;
    if (!halleFest || !z.halls.length || String(z.halle).trim() === "") return true;
    return z.halls.some(function (h) { return hallePasst(h, z.halle) && String(h).trim() !== ""; });
  }

  /* Neue Hallenliste übernehmen. Gemerkte oder per Link vorgegebene Halle
     nur übernehmen, wenn es sie gibt; eine leere Liste ändert an der Wahl
     nichts. */
  function hallenUebernehmen(halls) {
    if (JSON.stringify(halls) === JSON.stringify(z.halls)) return;
    z.halls = halls;
    if (halls.length) {
      z.hallenGesehen = true;
      var passend = halls.filter(function (h) { return hallePasst(h, z.halle) && z.halle !== ""; })[0];
      z.halle = passend || (halleFest ? z.halle : "");
    }
    hallenMelden(halls);
  }

  /* Spielt eine Ansage aus dem Verlauf noch einmal — nur auf diesem Gerät,
     hinten in derselben strikten Schlange (nie über eine laufende Ansage).
     Der Tipp auf ↻ ist eine Nutzergeste: Er gibt den Ton frei, falls nötig —
     und die Schlange läuft erst weiter, wenn der Ton wieder läuft, sonst
     fiele der Gong weg (Kontext nach Anruf/Bildschirm aus angehalten).
     Mehrfaches Tippen stapelt nichts: Liegt dieselbe Ansage schon als
     Wiederholung in der Schlange, bleibt es bei der einen. */
  function wiederholen(id) {
    var auftrag = wiederholungsAuftrag(z.verlauf, id);
    if (!auftrag) return false;
    var schonDa = z.warteschlange.some(function (s) { return s.wiederholung && s.e.id === id; });
    if (schonDa) return true;
    z.warteschlange.push(auftrag);
    var ctx = audioKontext();
    if (ctx && ctx.state !== "running") {
      freischalten();
      var weiter = function () { naechste(); };
      try { ctx.resume().then(weiter, weiter); } catch (e) { weiter(); }
      return true;
    }
    naechste();
    return true;
  }

  function halleWaehlen(halle) {
    var vorher = z.halle;
    z.halle = String(halle || "");
    // Neue Halle: Was schon in der Schlange liegt, gehört zur alten — bis auf
    // Wiederholungen, die der Nutzer selbst angefordert hat. Der Verlauf
    // bleibt stehen: Er ist das, was dieses Gerät gespielt hat.
    if (vorher !== z.halle) {
      z.warteschlange = z.warteschlange.filter(function (s) { return s.wiederholung; });
    }
    melden();
  }

  /* ── Abfrage ───────────────────────────────────────────────────── */
  function abfragen() {
    if (z.abrufLaeuft) return;
    if (z.fehltSeit && jetzt() - z.fehltSeit < ANSAGE_FEHLT_PAUSE_MS) return;
    var hoert = meldetPraesenz(z.feed, hatGeraeteStimme(), tonPruefen()) && halleOk();
    var abbruch = w.AbortController ? new w.AbortController() : null;
    var abruf;
    // Ein synchroner Wurf darf die Sperre nie setzen, ohne sie zu lösen —
    // sonst fragte die Seite nie wieder (Review E1b).
    try {
      abruf = w.fetch(feedAdresse(base, wirksameHalle(), z.stand.lastId, hoert),
        { cache: "no-store", signal: abbruch ? abbruch.signal : undefined });
    } catch (e) {
      abruf = Promise.reject(e);
    }
    var frist = w.setTimeout(function () { if (abbruch) abbruch.abort(); }, ANSAGE_FEED_FRIST_MS);
    z.abrufLaeuft = true;
    abruf
      .then(function (r) {
        if (r.status === 404) {
          z.fehltSeit = jetzt();
          throw new Error("kein Feed");
        }
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (feed) {
        z.verbunden = true;
        z.fehltSeit = 0;
        z.fehlversuche = 0;
        z.feed = feed;
        hallenUebernehmen(feed.halls || []);
        var r = neueEintraege(z.stand, feed);
        z.stand = r.stand;
        // Nur abspielen, wenn diese Seite wirklich bereit ist — sonst liefen
        // Aufrufe einer fremden Halle oder ohne Ton in die Schlange.
        if (z.tonFrei && halleOk()) {
          var empfangen = jetzt();
          r.neu.forEach(function (e) { z.warteschlange.push({ e: e, empfangen: empfangen }); });
          naechste();
        }
      })
      .catch(function () { z.verbunden = false; z.fehlversuche += 1; })
      .then(function () {
        w.clearTimeout(frist);
        z.abrufLaeuft = false;
        melden();
      });
  }

  function starten() {
    // Läuft der Ton schon (Pi mit Autoplay-Freigabe, Kiosk-App), ist die
    // Seite ohne Tippen bereit.
    audioKontext();
    melden();
    abfragen();
    w.setInterval(abfragen, ANSAGE_TAKT_MS);
  }

  return {
    zustand: z,
    starten: starten,
    abfragen: abfragen,
    freischalten: freischalten,
    halleWaehlen: halleWaehlen,
    wiederholen: wiederholen,
    halleOk: halleOk,
    tonPruefen: tonPruefen,
    hatGeraeteStimme: hatGeraeteStimme,
    stimmeArt: function () { return stimme(z.feed && z.feed.hostAudio, hatGeraeteStimme()); },
  };
}

/* ── Ansage-Modus der Monitor-Seiten (E1b) ───────────────────────────── */

/** Liest den Modus aus der Adresse: `?ansage=<Halle>` schaltet ihn ein,
 *  auch mit leerem Wert (Turnier mit einer Halle). */
function ansageModusAusQuery(search) {
  var such;
  try { such = new URLSearchParams(search || ""); } catch (e) { return null; }
  if (!such.has("ansage")) return null;
  return { halle: String(such.get("ansage") || "").trim() };
}

/** Den Ansage-Feed gibt es in E1b nur am Turnier-PC im Hallennetz (Basis
 *  `/`); über das Relay (`/bts-relay/<ns>/`) kommt er erst mit E4. */
function ansageImLan(base) {
  return base === "/";
}

/**
 * Was der Monitor im Ansage-Modus als kleinen Hinweis zeigt — leer, wenn
 * alles läuft (dann bleibt die Anzeige unverändert). `lage`: `{ lan, fehlt,
 * verbunden, feed, tonFrei, halleOk, halle, stimme }`.
 */
function monitorHinweis(lage) {
  if (!lage.lan) return "Ansage: nur im Hallennetz (LAN) am Turnier-PC — über die Cloud noch nicht.";
  if (lage.fehlt) return "Ansage: Der Turnier-PC bietet hier keine Ansagen an (bts-light zu alt oder Slave-Brücke).";
  if (!lage.verbunden || !lage.feed) return "Ansage: keine Verbindung zum Turnier-PC.";
  if (!lage.feed.aktiv) return "Ansage: " + grundText(lage.feed.grund);
  if (!lage.halleOk) {
    return lage.halle
      ? "Ansage: Die Halle „" + lage.halle + "“ gibt es in diesem Turnier nicht."
      : "Ansage: Bitte die Halle angeben (?ansage=<Halle>).";
  }
  if (!lage.tonFrei) return "Ansage: Ton gesperrt — der Browser braucht die Autoplay-Freigabe (Pi-Einrichtung aktualisieren).";
  if (lage.stimme === "keine") return "Ansage: Dieses Gerät kann nicht sprechen (kein Audio vom Turnier-PC, keine Gerätestimme).";
  return "";
}

/**
 * Startet den Ansage-Modus einer Monitor-Seite, wenn die Adresse ihn
 * verlangt. Die Anzeige selbst bleibt unberührt; nur bei einem Problem
 * erscheint unten links ein kleiner Hinweis. Ohne freigegebenen Ton meldet
 * sich die Seite nicht als Ansage-Gerät (das regelt der Kern).
 */
function ansageMonitorStarten(base, welt, dokument) {
  var modus = ansageModusAusQuery(welt.location && welt.location.search);
  if (!modus) return null;
  var hinweis = dokument.createElement("div");
  hinweis.id = "ansage-hinweis";
  hinweis.setAttribute("role", "status");
  hinweis.style.cssText = "position:fixed;left:.6vmin;bottom:.6vmin;z-index:2147483000;" +
    "max-width:60vw;padding:.4vmin .9vmin;border-radius:.6vmin;font:1.6vmin/1.3 system-ui,sans-serif;" +
    "background:rgba(15,23,42,.82);color:#fbbf24;pointer-events:none;display:none";
  dokument.body.appendChild(hinweis);
  function zeigen(text) {
    hinweis.textContent = text;
    hinweis.style.display = text ? "block" : "none";
  }
  if (!ansageImLan(base)) {
    // Kein Abruf, keine Fehlerschleife: Im Cloud-Pfad gibt es den Feed noch nicht.
    zeigen(monitorHinweis({ lan: false }));
    return null;
  }
  var kern = ansageKern({
    base: base,
    halle: modus.halle,
    halleFest: true,
    welt: welt,
    beiAenderung: function () {
      var z = kern ? kern.zustand : null;
      if (!z) return;
      zeigen(monitorHinweis({
        lan: true,
        fehlt: !!z.fehltSeit,
        // Erst nach drei Fehlschlägen in Folge (≈ 5 s) — ein WLAN-Wackler
        // soll nicht jedes Mal einen Hinweis in die Halle blitzen lassen.
        verbunden: z.verbunden || (!!z.feed && z.fehlversuche < 3),
        feed: z.feed,
        tonFrei: kern.tonPruefen(),
        halleOk: kern.halleOk(),
        halle: z.halle,
        stimme: kern.stimmeArt(),
      }));
    },
  });
  // Kein Freischalt-Knopf am TV — aber eine zufällige Geste (Maus, Taste)
  // gibt den Ton frei, falls die Autoplay-Freigabe fehlt.
  ["pointerdown", "keydown"].forEach(function (art) {
    dokument.addEventListener(art, kern.freischalten, { passive: true });
  });
  kern.starten();
  return kern;
}
/* </ansageKern.mjs> */

ansageMonitorStarten(ANSAGE_BASIS, window, document);
})();
</script>
</body>
