    <div id="offline">Verbindung unterbrochen</div>
  </div>

  <script>
  "use strict";
  // Betriebsmodus + Basis-Pfad – vom Server eingesetzt. `device` = Gerät,
  // das sein Feld erst über die Zuweisung im Tool bekommt; `fixed` = fest
  // auf ein Feld verdrahtet. BASE ist der URL-Präfix (z. B. "/" oder
  // "/<namespace>/") für Flaggen, Werbung und die State-Abfrage.
  var MODE = "__MODE__";
  var BASE = "__BASE__";

  // ?ansage=… (Ansage-Modus, Spec ansage-im-browser E1b) über jede Umleitung
  // mitnehmen — sonst verstummte ein Pi beim ersten Zielwechsel.
  function mitAnsage(href) {
    var hier = new URLSearchParams(location.search);
    if (!hier.has("ansage") || /[?&]ansage(=|&|$)/.test(href)) return href;
    return href + (href.indexOf("?") >= 0 ? "&" : "?") + "ansage=" + encodeURIComponent(hier.get("ansage") || "");
  }
  // Feldname – wird vom ersten /state-Poll gesetzt. Bewusst NICHT als
  // Platzhalter in dieses JS-Literal gebacken (nur in den HTML-Span oben,
  // dort HTML-escaped), damit kein Court-Name den String-Literal-Kontext
  // aufbrechen kann.
  var COURT_LABEL = "";

  // Monitor-Stile (ADR 0068) — Inline-Kopie von src/io/monitorStil.mjs,
  // wortgleich gehalten von scripts/test-monitor-stil.mjs.
/* <monitorStil.mjs> */
var STILE = ["standard", "international", "riesen", "spieler", "hell", "stand"];

/** Ein beliebiger Wert als bekannter Stil, sonst `standard`. */
function stilAusWert(roh) {
  return typeof roh === "string" && STILE.indexOf(roh) >= 0 ? roh : "standard";
}

/** Der Stil, den die Seite zeigt: Gerät → Zustand, feste URL → `?stil=`. */
function wirksamerStil(modus, stateStil, urlStil) {
  return stilAusWert(modus === "device" ? stateStil : urlStil);
}

/** Feld-Ziel mit Stil fürs Panel. Standard wird weggelassen (bytegleiche
 *  Zuweisung wie vor den Stilen); andere Ziele kennen keinen Stil. */
function zielMitStil(ziel, stil) {
  if (!ziel || ziel.kind !== "court") return ziel;
  var s = stilAusWert(stil);
  return s === "standard"
    ? { kind: "court", court_id: ziel.court_id }
    : { kind: "court", court_id: ziel.court_id, stil: s };
}

/** Kurzname eines Spielers: Nachname, sonst aus `name` abgeleitet
 *  („Nachname, Vorname" → vor dem Komma, sonst das letzte Wort), sonst
 *  der volle Name. Die Cloud liefert `given`/`family` leer. */
function kurzname(name, given, family) {
  var f = typeof family === "string" ? family.trim() : "";
  if (f) return f;
  var n = typeof name === "string" ? name.trim() : "";
  var komma = n.indexOf(",");
  var k = komma >= 0 ? n.slice(0, komma).trim() : n.split(/\s+/).pop() || "";
  return k || n;
}

/** Plätze am Namen (ADR 0070) aus der Anzeige-Konfiguration: was vor und
 *  was unter dem Namen steht. Nur Werte der Allowlist; ein älterer Absender
 *  ohne `nameDavor`/`nameDarunter` wird aus seinen Datenschaltern
 *  abgeleitet (Flagge davor, Verein darunter). */
function namenPlaetze(cfg) {
  var c = cfg || {};
  var davor = ["flagge", "logo", "ohne"].indexOf(c.nameDavor) >= 0
    ? c.nameDavor : (c.showNations === false ? "ohne" : "flagge");
  var darunter = ["verein", "nation", "ohne"].indexOf(c.nameDarunter) >= 0
    ? c.nameDarunter : (c.showClubs ? "verein" : "ohne");
  return { davor: davor, darunter: darunter };
}
/* </monitorStil.mjs> */
  // `?stil=` gilt nur für feste URLs; im Geräte-Modus entscheidet die
  // Zuweisung im Panel (wirksamerStil).
  var URL_STIL = (function () {
    try { return new URLSearchParams(location.search).get("stil"); } catch (e) { return null; }
  })();

  // Geräte-ID (nur Geräte-Modus). Bevorzugt aus dem URL-Parameter
  // `?device=` – der Pi-Kiosk setzt dort seine Hardware-Seriennummer ein,
  // damit eine geklonte SD-Karte trotzdem je Pi eindeutig bleibt. Fehlt
  // der Parameter (z. B. Aufruf direkt im Browser), eine zufällige,
  // dauerhafte ID in localStorage.
  function resolveDeviceId() {
    try {
      var fromUrl = new URLSearchParams(window.location.search).get("device");
      if (fromUrl) return fromUrl;
    } catch (e) {}
    var k = "bts-monitor-device-id";
    var id = "";
    try { id = localStorage.getItem(k) || ""; } catch (e) {}
    if (!id) {
      id = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : (Date.now().toString(16) + Math.random().toString(16).slice(2));
      try { localStorage.setItem(k, id); } catch (e) {}
    }
    return id;
  }
  var DEVICE_ID = MODE === "device" ? resolveDeviceId() : "";

  // ── Diagnose-Mini-Logger ──────────────────────────────────────────────
  // Wie combo/overview: JS-Fehler (z. B. HDMI-/Render-Crash) + Offline-Wechsel
  // best-effort an /pi-log (lokal + Cloud, Datei mon-<device>.log). Nur LAN;
  // im Cloud-Modus scheitert der Post still.
  var MLOG = [], MLOG_MAX = 200;
  function mlog(level, event, detail) {
    var e = { t: Date.now(), level: level, event: event };
    if (detail !== undefined) e.d = detail;
    MLOG.push(e); while (MLOG.length > MLOG_MAX) MLOG.shift();
    try { console.log("[" + new Date(e.t).toISOString() + "] " + level + " " + event, detail || ""); } catch (x) {}
  }
  function mlogDevice() {
    var id = (DEVICE_ID || "").replace(/[^a-z0-9_-]/gi, "").slice(0, 56);
    return "mon-" + (id || "unbekannt");
  }
  function uploadMonitorLog() {
    try {
      var body = "Monitor monitor · device=" + mlogDevice() + "\nUA: " + navigator.userAgent
        + "\nGeneriert: " + new Date().toISOString() + "\n\n"
        + MLOG.map(function (e) {
            return "[" + new Date(e.t).toISOString() + "] " + e.level + " " + e.event
              + (e.d !== undefined ? " " + JSON.stringify(e.d) : "");
          }).join("\n") + "\n";
      fetch("/pi-log?device=" + encodeURIComponent(mlogDevice()), {
        method: "POST", headers: { "Content-Type": "text/plain" }, body: body, keepalive: true,
      }).catch(function () {});
    } catch (x) {}
  }
  window.addEventListener("error", function (ev) {
    try { mlog("error", "js_error", { msg: String((ev && ev.message) || ev), src: (ev && ev.filename) || "", line: (ev && ev.lineno) || 0 }); uploadMonitorLog(); } catch (x) {}
  });
  window.addEventListener("unhandledrejection", function (ev) {
    try { var r = ev && ev.reason; mlog("error", "unhandled_rejection", { msg: r != null ? (r.message || String(r)) : "unknown" }); uploadMonitorLog(); } catch (x) {}
  });
  window.addEventListener("pagehide", uploadMonitorLog);
  mlog("info", "monitor_boot", { mode: MODE });

  // Adresse der State-Abfrage: Geräte-Modus fragt mit der Geräte-ID,
  // der feste Modus leitet sie aus dem eigenen Pfad ab (…/display → …/state).
  var STATE_URL = MODE === "device"
    ? BASE + "monitor/state?device=" + encodeURIComponent(DEVICE_ID)
    : window.location.pathname.replace(/\/display\/?$/, "/state");

  // Jugendklassen („U15") heißen Jungen-/Mädchen-Disziplin — BTP kennt nur
  // Herren/Damen. Inline-Kopie von `src/io/disziplinName.mjs` (wortgleich,
  // `scripts/test-disziplin-name.mjs`).
  function disziplinName(key, klasse) {
    var jugend = /^U\d{1,2}$/i.test(String(klasse || "").trim());
    var t = {
      mens_singles: ["HE", "Herreneinzel", "Men's Singles", "JE", "Jungeneinzel", "Boys' Singles"],
      womens_singles: ["DE", "Dameneinzel", "Women's Singles", "ME", "Mädcheneinzel", "Girls' Singles"],
      mens_doubles: ["HD", "Herrendoppel", "Men's Doubles", "JD", "Jungendoppel", "Boys' Doubles"],
      womens_doubles: ["DD", "Damendoppel", "Women's Doubles", "MD", "Mädchendoppel", "Girls' Doubles"],
      mixed: ["GD", "Mixed", "Mixed", "MX", "Mixed", "Mixed"]
    }[key];
    if (!t) return { kurz: "", de: "", en: "" };
    var o = jugend ? 3 : 0;
    return { kurz: t[o], de: t[o + 1], en: t[o + 2] };
  }

  var els = {
    root: document.getElementById("root"),
    adView: document.getElementById("ad-view"),
    adImg: document.getElementById("ad-img"),
    adFallback: document.getElementById("ad-fallback"),
    adCourt: document.getElementById("ad-court"),
    fallbackTn: document.getElementById("fallback-tn"),
    fallbackCourt: document.getElementById("fallback-court"),
    matchView: document.getElementById("match-view"),
    courtLabel: document.getElementById("court-label"),
    discipline: document.getElementById("discipline"),
    matchClock: document.getElementById("match-clock"),
    callTimer: document.getElementById("call-timer"),
    half1: document.getElementById("half1"),
    half2: document.getElementById("half2"),
    rName1: document.getElementById("r-name1"),
    rName2: document.getElementById("r-name2"),
    rSaetze: document.getElementById("r-saetze"),
    rA: document.getElementById("r-a"),
    rB: document.getElementById("r-b"),
    footer: document.getElementById("footer"),
    timerOverlay: document.getElementById("timer-overlay"),
    timerLabel: document.getElementById("timer-label"),
    timerFlaps: document.getElementById("timer-flaps"),
    pairingView: document.getElementById("pairing-view"),
    identifyOverlay: document.getElementById("identify-overlay"),
    identifyCode: document.getElementById("identify-code"),
    identifyCourt: document.getElementById("identify-court"),
    offline: document.getElementById("offline")
  };

  // ─── Werbe-Rotation ──────────────────────────────────────────────────
  var adState = { urls: [], stile: [], idx: 0, intervalS: 10, timer: null, key: "" };

  // Nur echte Hex-Farben duerfen in ein `style`-Attribut — dieselbe Huerde
  // wie bei den Hallen-Farben. Der Host prueft schon, hier steht die zweite
  // Wand (Spec werbung-hintergrund-und-feld).
  function adFarbe(wert, ersatz) {
    return /^#[0-9a-f]{6}$/.test(String(wert || "")) ? wert : ersatz;
  }

  // Asset-URLs werden absolut aus BASE gebaut – unabhängig von der
  // Verschachtelungstiefe der Seite (LAN vs. Cloud-Namespace).
  function adUrl(id) { return BASE + "ads/" + encodeURIComponent(id); }

  function applyAds(adIds, intervalS, stile) {
    stile = Array.isArray(stile) ? stile : [];
    // Der Stil gehoert IN den Schluessel: Sonst bliebe eine reine
    // Farbaenderung liegen, bis sich zufaellig die Bildliste aendert — der
    // Fruehausstieg unten sieht ja nur den Schluessel.
    var stilKey = stile.map(function (s) {
      s = s || {};
      return (s.bg || "") + "/" + (s.fg || "") + "/" + (s.showCourt ? "1" : "0");
    }).join(",");
    var key = adIds.join("|") + "@" + intervalS + "#" + stilKey;
    if (key === adState.key) return; // unverändert – Rotation nicht stören
    adState.key = key;
    adState.urls = adIds.map(adUrl);
    adState.stile = stile;
    // Die Feldbezeichnung bleibt ueber die GANZE Rotation stehen, sobald sie
    // auch nur ein Bild verlangt — und dann werden alle Bilder gleich
    // verkleinert. Sonst spraenge die Bildgroesse im 10-Sekunden-Takt und die
    // Bezeichnung flackerte (Spec werbung-hintergrund-und-feld).
    adState.zeigtFeld = stile.some(function (s) { return s && s.showCourt; });
    adState.intervalS = intervalS > 0 ? intervalS : 10;
    adState.idx = 0;
    if (adState.timer) { clearInterval(adState.timer); adState.timer = null; }
    if (adState.urls.length > 1) {
      adState.timer = setInterval(rotateAd, adState.intervalS * 1000);
    }
    renderAd();
  }

  // Ob der Rand fuer die Feldbezeichnung freigehalten wird. Bewusst eine
  // eigene Funktion und NICHT nur im `renderAd`: Die Bezeichnung kommt aus dem
  // Zustand und kann SPAETER eintreffen als die Bildliste — im Cloud ist das
  // sogar der Normalfall, denn der Relay kennt das Feld-Label erst ab der
  // ersten Zuweisung. Haengte die Entscheidung allein am Render, bliebe sie
  // bei genau einem Werbebild fuer immer aus: Dann laeuft kein Rotations-
  // Timer, und `applyAds` steigt beim unveraenderten Schluessel frueh aus.
  // Ohne Bezeichnung wird auch NICHT verkleinert — ein leerer Rand waere
  // schlechter als das volle Bild.
  function feldMarke() {
    var hat = adState.zeigtFeld && (els.adCourt.textContent || "") !== "";
    els.adView.classList.toggle("mit-feld", hat);
  }

  function rotateAd() {
    if (adState.urls.length === 0) return;
    adState.idx = (adState.idx + 1) % adState.urls.length;
    renderAd();
  }

  function renderAd() {
    if (adState.urls.length > 0) {
      els.adImg.src = adState.urls[adState.idx];
      els.adImg.style.display = "";
      els.adFallback.classList.remove("show");
      var stil = adState.stile[adState.idx] || {};
      els.adView.style.backgroundColor = adFarbe(stil.bg, "#000000");
      els.adCourt.style.color = adFarbe(stil.fg, "#ffffff");
      feldMarke();
    } else {
      els.adImg.style.display = "none";
      els.adImg.removeAttribute("src");
      els.adFallback.classList.add("show");
      els.adView.style.backgroundColor = "";
      els.adView.classList.remove("mit-feld");
    }
  }

  // ─── Helfer ──────────────────────────────────────────────────────────
  // Parst den vom Tablet gespiegelten courtState (JSON-String) zu einem
  // Objekt – oder null, wenn keiner vorliegt oder er beschädigt ist.
  function parseCourtState(json) {
    if (!json) return null;
    try { return JSON.parse(json); } catch (e) { return null; }
  }

  // Zerlegt einen Namen in Vorname(n) + Nachname. Der letzte Namensteil
  // ist der Nachname, alles davor der Vorname. Ein einteiliger Name hat
  // keinen Vornamen (given = ""), ein leerer Name fällt auf „—" zurück.
  function splitName(full) {
    var parts = (full || "").trim().split(/\s+/).filter(Boolean);
    if (parts.length === 0) return { given: "", family: "—" };
    if (parts.length === 1) return { given: "", family: parts[0] };
    return {
      given: parts.slice(0, -1).join(" "),
      family: parts[parts.length - 1],
    };
  }

  function flagEl(nat) {
    var img = document.createElement("img");
    img.className = "flag";
    var code = (nat || "").trim().toUpperCase();
    if (code) {
      img.src = BASE + "flags/" + encodeURIComponent(code) + ".svg";
      img.onerror = function () { img.classList.add("hidden"); };
    } else {
      img.classList.add("hidden");
    }
    return img;
  }

  // Vereinslogo im Platz vor dem Namen, gleich groß wie die Flagge. Fehlt
  // das Logo, bleibt der Platz leer stehen, damit die Namen fluchten.
  function logoEl(club) {
    var img = document.createElement("img");
    img.className = "flag logo";
    img.alt = "";
    if (club) {
      img.src = BASE + "info/club-logo?name=" + encodeURIComponent(club);
      img.onerror = function () { img.classList.add("hidden"); };
    } else {
      img.classList.add("hidden");
    }
    return img;
  }

  // Baut eine Bildschirmhälfte für ein Team. `players` = [{name,nationality}],
  // `done` = abgeschlossene Sätze als [{v,won}], `current` = laufender
  // Satzwert (oder null, wenn das Match feststeht), `serving` = schlägt
  // dieses Team auf?, `isWinner` = dieses Team hat das Match gewonnen.
  // `servePlayerIdx` = Index des konkret aufschlagenden Spielers im Team
  // (BWF-Doppelregel); null → Team-Level-Fallback (Punkt beim ersten Namen).
  // `recvPlayerIdx` = Index des Annehmers, wenn dieses Team annimmt und das
  // Tablet ihn liefert; sonst null (keine Marke, kein Raten).
  // `plaetze` = { davor, darunter } aus namenPlaetze (ADR 0070).
  function renderHalf(host, players, seed, done, current, serving, isWinner, servePlayerIdx, recvPlayerIdx, plaetze) {
    host.textContent = "";
    host.classList.toggle("serving", !!serving);
    host.classList.toggle("winner", !!isWinner);
    var pBox = document.createElement("div");
    pBox.className = "players" + (players.length > 1 ? " doubles" : "");
    players.forEach(function (p, i) {
      var row = document.createElement("div");
      row.className = "player";

      // Reihenfolge wie auf der Kombi-Anzeige: Aufschlag-Punkt → Flagge →
      // Name. Der Punkt sitzt nur beim konkret aufschlagenden Spieler. Im
      // Doppel mit Spieler-Info beim richtigen Namen, sonst (Einzel oder
      // altes Tablet ohne Info) beim ersten Spieler des aufschlagenden Teams.
      var dotHere = serving &&
        (servePlayerIdx == null ? i === 0 : i === servePlayerIdx);
      var recvHere = !serving && recvPlayerIdx != null && i === recvPlayerIdx;
      var dot = document.createElement("span");
      dot.className = "serve-dot" + (dotHere ? " on" : recvHere ? " recv" : "");
      dot.textContent = recvHere ? "○" : "●";
      row.appendChild(dot);
      if (plaetze.davor === "flagge") row.appendChild(flagEl(p.nationality));
      else if (plaetze.davor === "logo") row.appendChild(logoEl(p.club));

      // Name im Broadcast-Stil: Vorname klein, Nachname groß. Trägt der
      // Spieler die getrennten BTP-Felder (family nicht leer), werden sie
      // direkt verwendet – das ist 100 % korrekt auch bei mehrteiligen
      // Nachnamen wie „van der Berg". Ältere Wire-Daten ohne die Felder
      // fallen auf das Zerlegen von `name` zurück.
      var parts = (p.family && p.family.length > 0)
        ? { given: p.given || "", family: p.family }
        : splitName(p.name);
      var name = document.createElement("span");
      name.className = "name";
      var given = document.createElement("span");
      given.className = "given";
      given.textContent = parts.given;
      var family = document.createElement("span");
      family.className = "family";
      family.textContent = parts.family;
      name.appendChild(given);
      name.appendChild(family);
      // Zeile unter dem Namen (ADR 0070): Vereinsname oder Nation als
      // Kürzel — nur, was der Server liefert.
      var unten = plaetze.darunter === "verein" ? (p.club || "")
        : plaetze.darunter === "nation" ? (p.nationality || "").trim().toUpperCase()
        : "";
      if (unten) {
        name.classList.add("mit-verein");
        var club = document.createElement("span");
        club.className = "club";
        club.textContent = unten;
        name.appendChild(club);
      }
      row.appendChild(name);
      // Setzplatz einmal je Seite, hinter dem letzten Spieler.
      if (seed && i === players.length - 1) {
        var sd = document.createElement("span");
        sd.className = "seed";
        sd.textContent = "[" + seed + "]";
        row.appendChild(sd);
      }
      pBox.appendChild(row);
    });
    host.appendChild(pBox);

    var scores = document.createElement("div");
    // `current === null` → Match steht fest: Endergebnis größer setzen.
    scores.className = "scores" + (current === null ? " decided" : "");
    var doneBox = document.createElement("div");
    doneBox.className = "sets-done";
    done.forEach(function (s) {
      var d = document.createElement("div");
      d.className = "set-done" + (s.won ? " won" : "");
      d.textContent = String(s.v);
      doneBox.appendChild(d);
    });
    scores.appendChild(doneBox);
    // Laufender Satz nur, solange das Match nicht entschieden ist.
    if (current !== null) {
      var cur = document.createElement("div");
      cur.className = "set-current" + (serving ? " serving" : "");
      cur.textContent = String(current);
      scores.appendChild(cur);
    }
    // Steht der Sieger fest, eine klare Markierung an der Gewinner-Hälfte.
    if (isWinner) {
      var mark = document.createElement("div");
      mark.className = "winner-mark";
      mark.textContent = "🏆";
      scores.appendChild(mark);
    }
    host.appendChild(scores);
  }

  // ─── Match-Ansicht ───────────────────────────────────────────────────
  // Aufruf-Timer: hochzählende Uhr seit dem 1. Aufruf (Spiel kam aufs Feld)
  // plus Ampel-Chip „1. Aufruf → 2. Aufruf → Letzter Aufruf". Rechnet relativ
  // zur Server-Zeit (Pi-Uhr oft nicht synchron). Leer, wenn aus/kein Spiel.
  function renderCallTimer(state) {
    var el = els.callTimer;
    if (!el) return;
    var ct = state.callTimer || {};
    if (!ct.enabled || !state.match ||
        typeof state.onCourtSinceMs !== "number" || state.onCourtSinceMs <= 0) {
      el.textContent = "";
      el.className = "call-timer";
      return;
    }
    // Relative zur Server-Uhr rechnen (1c): `nowServerMs()` hält den
    // Offset aus 200-Abruf UND Herzschlag — läuft also auch in einer
    // 304-Serie korrekt weiter, statt einzufrieren.
    var now = nowServerMs();
    var sec = Math.max(0, Math.floor((now - state.onCourtSinceMs) / 1000));
    var clock = Math.floor(sec / 60) + ":" + ("0" + (sec % 60)).slice(-2);
    var min = sec / 60;
    var label = "1. Aufruf", tone = "ok";
    var third = ct.thirdCallMinutes, second = ct.secondCallMinutes;
    if (typeof third === "number" && third > 0 && min >= third) {
      label = "Letzter Aufruf"; tone = "due";
    } else if (typeof second === "number" && second > 0 && min >= second) {
      label = "2. Aufruf"; tone = "warn";
    }
    // Kein Emoji (Pi OS hat keine Emoji-Schrift) – Uhr + Klartext genügen.
    el.textContent = clock + " · " + label;
    el.className = "call-timer " + tone;
  }

  // Spieldauer in der Kopfzeile (Stoppuhr + Minuten) — als eigene Funktion,
  // damit sie auch im 1-s-Takt neu rechnen kann (Review R2): In einer
  // 304-Serie käme sonst bis zum nächsten vollen 200 kein frischer Wert,
  // und die Minute stünde still.
  function renderMatchClock(state) {
    var cfg = state.config || {};
    var cs = parseCourtState(state.courtState);
    // Ohne zaehlendes Tablet bleibt das Element leer und wird per CSS
    // ausgeblendet.
    els.matchClock.textContent = "";
    if (cfg.showMatchClock !== false && cs &&
        typeof cs.startedAt === "number" && cs.startedAt > 0) {
      // Wie beim Pausen-Countdown: relativ zur Server-Zeit rechnen (1c),
      // damit die Pi-Uhr (oft nicht synchron) die Spieldauer nicht
      // verfaelscht.
      var mins = Math.max(0, Math.floor((nowServerMs() - cs.startedAt) / 60000));
      els.matchClock.textContent = mins + " min";
    }
  }

  function renderMatch(state) {
    var m = state.match;
    var cfg = state.config || {};
    var cs = parseCourtState(state.courtState);

    els.courtLabel.textContent = "";
    // Hallen-Farbmarke (Spec hallen-farben) vor dem Feld-Label — strikte
    // #rrggbb-Form, der Wert landet in einem Style. Alte Hosts/Relays
    // liefern kein hallColor → Label wie bisher.
    if (state.hallColor && /^#[0-9a-f]{6}$/.test(state.hallColor)) {
      var hallenDot = document.createElement("span");
      hallenDot.setAttribute("aria-hidden", "true");
      hallenDot.style.cssText = "display:inline-block;width:.45em;height:.45em;border-radius:50%;margin-right:.3em;vertical-align:.06em;background:" + state.hallColor;
      els.courtLabel.appendChild(hallenDot);
    }
    els.courtLabel.appendChild(
      document.createTextNode(state.courtLabel || COURT_LABEL));

    renderMatchClock(state);
    renderCallTimer(state);

    var discKey = m.discipline || "";
    els.discipline.textContent =
      cfg.showDiscipline !== false ? disziplinName(discKey, m.classLabel).de : "";

    // Satzstand aufteilen. Steht das Match fest (das Tablet meldet
    // `finished`), gibt es keinen laufenden Satz mehr: alle gespielten
    // Sätze sind „fertig", ein etwaiger leerer 0:0-Geistersatz am Ende
    // fällt weg, und der Sieger wird hervorgehoben.
    var rawSets = Array.isArray(m.sets) ? m.sets : [];
    var decided = !!(cs && cs.finished);
    var winnerTeam = null;
    var current, doneSets;
    if (decided) {
      var played = rawSets.slice();
      while (played.length > 0) {
        var ls = played[played.length - 1];
        if ((ls.a || 0) === 0 && (ls.b || 0) === 0) { played.pop(); }
        else { break; }
      }
      doneSets = played;
      current = null;
      winnerTeam = matchWinner(cs, played);
    } else {
      current = rawSets.length > 0 ? rawSets[rawSets.length - 1] : { a: 0, b: 0 };
      doneSets = rawSets.slice(0, Math.max(0, rawSets.length - 1));
    }
    // Pro abgeschlossenem Satz den Sieger hell (weiß) hervorheben – wie auf
    // der Kombi-Anzeige, auch während des laufenden Spiels (die `doneSets`
    // sind dann bereits beendete Sätze; der laufende Satz ist `current` und
    // nicht dabei). Ausnahme: bei einer Aufgabe ist der letzte Satz
    // unvollständig, eine Hervorhebung nach Punktzahl wäre dort irreführend.
    // Der Match-Sieger selbst (🏆 + Hälfte) bleibt auch bei Aufgabe korrekt.
    var highlightSets = !(cs && cs.retired);
    var done1 = doneSets.map(function (s) {
      return { v: s.a, won: highlightSets && (s.a || 0) > (s.b || 0) };
    });
    var done2 = doneSets.map(function (s) {
      return { v: s.b, won: highlightSets && (s.b || 0) > (s.a || 0) };
    });

    // Aufschlag aus dem gespiegelten Tablet-Zustand – nur im laufenden Spiel.
    // Spieler-genau (BWF-Doppelregel), wenn das Tablet die Info liefert.
    var serveInfo = decided ? null : servingInfo(cs);
    var serving = serveInfo ? serveInfo.team : null;
    var servePlayerIdx = serveInfo ? serveInfo.playerIdx : null;
    var recvInfo = decided ? null : receivingInfo(cs);
    var plaetze = namenPlaetze(cfg);

    renderRiesen(m, current, doneSets, serving, decided);

    renderHalf(els.half1, m.team1 || [], m.team1Seed, done1,
               current ? current.a : null, serving === 1, winnerTeam === 1,
               serving === 1 ? servePlayerIdx : null,
               recvInfo && recvInfo.team === 1 ? recvInfo.playerIdx : null, plaetze);
    renderHalf(els.half2, m.team2 || [], m.team2Seed, done2,
               current ? current.b : null, serving === 2, winnerTeam === 2,
               serving === 2 ? servePlayerIdx : null,
               recvInfo && recvInfo.team === 2 ? recvInfo.playerIdx : null, plaetze);

    // Fußzeile: Runde + Spielnummer (je nach Konfiguration).
    els.footer.textContent = "";
    var parts = [];
    if (cfg.showRound !== false && m.eventLabel) parts.push(m.eventLabel);
    if (cfg.showMatchNumber !== false && m.matchNumber) {
      parts.push("Spiel " + m.matchNumber);
    }
    parts.forEach(function (txt, i) {
      if (i > 0) {
        var sep = document.createElement("span");
        sep.className = "dot-sep";
        sep.textContent = "·";
        els.footer.appendChild(sep);
      }
      var span = document.createElement("span");
      span.textContent = txt;
      els.footer.appendChild(span);
    });
  }

  // Riesen-Stand (ADR 0068): läuft das Spiel, steht der laufende Satz groß
  // und darüber klein der Satzstand; steht es fest, groß die gewonnenen
  // Sätze und klein die Satzergebnisse. Wird bei jedem Stil befüllt, damit
  // ein Stilwechsel sofort etwas zeigt.
  function renderRiesen(m, current, doneSets, serving, decided) {
    function namen(team) {
      return (team || []).map(function (p) {
        return kurzname(p.name, p.given, p.family);
      }).join(" / ");
    }
    els.rName1.textContent = namen(m.team1);
    els.rName2.textContent = namen(m.team2);
    var gewA = 0, gewB = 0;
    doneSets.forEach(function (s) {
      if ((s.a || 0) > (s.b || 0)) gewA++;
      else if ((s.b || 0) > (s.a || 0)) gewB++;
    });
    if (decided || !current) {
      els.rA.textContent = String(gewA);
      els.rB.textContent = String(gewB);
      els.rSaetze.textContent = doneSets.map(function (s) {
        return (s.a || 0) + ":" + (s.b || 0);
      }).join("  ");
    } else {
      els.rA.textContent = String(current.a || 0);
      els.rB.textContent = String(current.b || 0);
      els.rSaetze.textContent = gewA + " : " + gewB;
    }
    els.rA.classList.toggle("auf", serving === 1);
    els.rB.classList.toggle("auf", serving === 2);
  }

  // Liefert 1 (Team 1), 2 (Team 2) oder null aus dem geparsten courtState.
  function servingTeam(cs) {
    if (!cs || !cs.servingSide || !cs.teamOnSide) return null;
    return cs.teamOnSide.a === cs.servingSide ? 1 : 2;
  }

  // Spieler-genauer Aufschlag: { team:1|2, playerIdx:0|1|null } oder null.
  // Bevorzugt das vom Tablet berechnete `serving:{team,index}` (BWF-
  // Doppelregel, kennt Positionen + Spieler-IDs); fällt sonst auf die
  // Team-Ableitung zurück (Punkt beim ersten Spieler). Spiegelt die
  // Server-Logik in state.rs (overview()).
  function servingInfo(cs) {
    if (!cs) return null;
    if (cs.serving && cs.serving.team) {
      var team = cs.serving.team === "a" ? 1 : 2;
      var idx = (typeof cs.serving.index === "number") ? cs.serving.index : null;
      return { team: team, playerIdx: idx };
    }
    var t = servingTeam(cs);
    return t == null ? null : { team: t, playerIdx: null };
  }

  // Annehmer: { team:1|2, playerIdx:0|1 } oder null. Nur aus dem vom
  // Tablet gelieferten `receiving` — ältere Tablets schicken ihn nicht,
  // dann bleibt die Marke weg.
  function receivingInfo(cs) {
    if (!cs || !cs.receiving || !cs.receiving.team) return null;
    if (typeof cs.receiving.index !== "number") return null;
    return { team: cs.receiving.team === "a" ? 1 : 2, playerIdx: cs.receiving.index };
  }

  // Sieger-Team (1 oder 2) eines feststehenden Matches, sonst null. Bei
  // Aufgabe steht der Sieger im gespiegelten Tablet-Zustand; sonst zählt,
  // wer mehr Sätze gewonnen hat.
  function matchWinner(cs, sets) {
    if (cs && cs.retired) {
      return cs.retiredWinner === "a" ? 1
           : cs.retiredWinner === "b" ? 2 : null;
    }
    var w1 = 0, w2 = 0;
    sets.forEach(function (s) {
      if ((s.a || 0) > (s.b || 0)) w1++;
      else if ((s.b || 0) > (s.a || 0)) w2++;
    });
    if (w1 > w2) return 1;
    if (w2 > w1) return 2;
    return null;
  }

  // ─── Retro-Pausen-Timer ──────────────────────────────────────────────
  var PAUSE_LABEL = { eleven: "Pause", game: "Satzpause", injury: "Behandlung" };
  var lastFlapText = "";

  function renderTimer(state) {
    var cfg = state.config || {};
    if (cfg.showTimer === false) { hideTimer(); return; }
    var cs = parseCourtState(state.courtState);
    var pause = cs && cs.pause;
    if (!pause) { hideTimer(); return; }

    els.timerOverlay.classList.add("show");
    els.timerLabel.textContent = PAUSE_LABEL[pause.kind] || "Pause";
    var text;
    if (typeof pause.endsAt === "number") {
      // `endsAt` ist mit der Uhr des zaehlenden Tablets gesetzt. Der Pi
      // (TV) hat oft keine synchrone Uhr → `Date.now()` weicht ab und der
      // Countdown ist um den Drift verschoben (z.B. +1 min). Wir rechnen
      // daher relativ zur Server-Zeit (1c): `nowServerMs()` läuft auch
      // durch eine 304-Serie korrekt weiter.
      var nowMs = nowServerMs();
      // Seit ADR 0028 endet die Pause NICHT mehr automatisch bei 0 — das
      // Tablet hält sie, bis weitergespielt wird. Statt eines eingefrorenen
      // „0:00" zählt der TV die Überziehung mit „+m:ss" hoch (wie das
      // Tablet-Overlay und die TL-Sicht).
      var rest = Math.round((pause.endsAt - nowMs) / 1000);
      var secs = Math.abs(rest);
      var mm = Math.floor(secs / 60);
      var ss = secs % 60;
      text = (rest < 0 ? "+" : "") + mm + ":" + (ss < 10 ? "0" + ss : ss);
    } else {
      // Behandlungspause ohne Countdown.
      text = "——";
    }
    renderFlaps(text);
  }

  function hideTimer() {
    els.timerOverlay.classList.remove("show");
    lastFlapText = "";
  }

  // Zeichnet die Klappanzeige; geänderte Stellen bekommen die Flip-Animation.
  function renderFlaps(text) {
    var rebuild = text.length !== els.timerFlaps.children.length;
    if (rebuild) {
      els.timerFlaps.textContent = "";
      for (var i = 0; i < text.length; i++) {
        var flap = document.createElement("div");
        flap.className = "flap" + (text[i] === ":" ? " colon" : "");
        flap.textContent = text[i];
        els.timerFlaps.appendChild(flap);
      }
    } else {
      for (var j = 0; j < text.length; j++) {
        var el = els.timerFlaps.children[j];
        if (el.textContent !== text[j]) {
          el.textContent = text[j];
          if (text[j] !== ":") {
            el.classList.remove("flip");
            void el.offsetWidth; // Reflow → Animation neu starten
            el.classList.add("flip");
          }
        }
      }
    }
    lastFlapText = text;
  }

  // ─── Fernbefehle (Geräte-Modus) ──────────────────────────────────────
  var lastCmdId = 0;
  try { lastCmdId = parseInt(localStorage.getItem("bts-monitor-cmd-id") || "0", 10) || 0; }
  catch (e) {}
  var cmdBaselineSet = false;
  var identifyTimer = null;

  function saveCmdId() {
    try { localStorage.setItem("bts-monitor-cmd-id", String(lastCmdId)); } catch (e) {}
  }

  // Führt einen Fernbefehl genau einmal aus. Der erste Poll setzt nur die
  // Basis – ein beim Laden bereits offener Befehl wird nicht nachgeholt
  // (auch nach einem „Neu laden" kein Endlos-Reload).
  function handleCommand(cmd) {
    var id = (cmd && typeof cmd.id === "number") ? cmd.id : 0;
    if (!cmdBaselineSet) {
      cmdBaselineSet = true;
      if (id > lastCmdId) { lastCmdId = id; saveCmdId(); }
      return;
    }
    if (!cmd || id <= lastCmdId) return;
    lastCmdId = id;
    saveCmdId();
    if (cmd.kind === "reload") {
      location.reload();
    } else if (cmd.kind === "identify") {
      showIdentify();
    }
  }

  // Blendet Code + Feld groß ein, damit man Gerät und TV zuordnen kann.
  function showIdentify() {
    // Fallback (noch kein Server-State): die LETZTEN vier alphanumerischen
    // Zeichen der ID – konsistent mit device_code() im Server. (Pi-Serials
    // teilen sich das Präfix, die ersten vier wären für alle Pis "PI00".)
    els.identifyCode.textContent =
      (lastState && lastState.deviceCode) ||
      DEVICE_ID.replace(/[^a-z0-9]/gi, "").slice(-4).toUpperCase();
    els.identifyCourt.textContent = (lastState && lastState.courtLabel) || "";
    els.identifyOverlay.classList.add("show");
    if (identifyTimer) clearTimeout(identifyTimer);
    identifyTimer = setTimeout(function () {
      els.identifyOverlay.classList.remove("show");
    }, 10000);
  }

  // ─── Poll-Schleife ───────────────────────────────────────────────────
  var lastState = null;

  // Default-Anzeige fuer unzugewiesene Pis: Badhub-Logo Vollbild.
  // Den Device-Code blendet das Identifizieren-Overlay on-demand ein.
  function showPairing(_state) {
    els.pairingView.classList.add("show");
    els.matchView.classList.remove("show");
    els.adView.classList.remove("show");
    hideTimer();
  }

  function applyState(state) {
    // Überholte Antwort verwerfen (Spec monitor-livestand-push, S4): Zwei
    // Abrufe können sich überholen — der langsamere trägt dann den älteren
    // Stand und würde die Anzeige zurückwerfen. Ein Voll-Abruf mit
    // GLEICHER Ordnungszahl gilt dagegen: Er darf denselben Stand
    // berichtigen, etwa wenn BTP einen Satzstand von Hand zurücknimmt.
    //
    // Nur für das eigene Feld — ein Wechsel des Felds (Reassignment) bringt
    // eine fremde Zählung mit und darf nicht blockiert werden.
    var feld = typeof state.courtId === "number" ? state.courtId : 0;
    if (feld && feld === knownCourtId) {
      if (!seqAnwenden(lastSeqByCourt[feld] || 0, state.seq || 0, "fetch")) {
        // Genau hier friert die Anzeige ein, wenn `lastSeqByCourt` je zu hoch
        // steht: Der Poll läuft weiter, aber nichts kommt mehr durch. Der
        // Zähler ist die aussagekräftigste Zahl im Stillstands-Bericht.
        verworfeneStaende++;
        letzterStandVerworfen = true;
        return;
      }
      if (state.seq) lastSeqByCourt[feld] = state.seq;
    }
    // Ab hier wird der Stand wirklich übernommen — der Beleg dafür, dass die
    // Strecke bis zum Schirm durchlässig ist.
    letzterStandMs = Date.now();
    letzterStandVerworfen = false;
    lastState = state;
    // Feld-Identität für den Nudge-Filter nachziehen (Geräte-Monitor kennt sie
    // erst hier; bei Reassignment wechselt sie). 0 = unbelegt → ignorieren.
    if (typeof state.courtId === "number" && state.courtId) knownCourtId = state.courtId;
    if (state.courtLabel) {
      COURT_LABEL = state.courtLabel;
      document.title = "Court-Monitor – " + state.courtLabel;
    }
    var cfg = state.config || {};
    els.fallbackTn.textContent = state.tournamentName || "bts-light";
    // Feldnummer groß auf der Leerlauf-Seite, damit erkennbar bleibt, welches
    // Feld dieser Monitor zeigt (auch ohne Spiel/Werbung).
    els.fallbackCourt.textContent = state.courtLabel || COURT_LABEL || "";

    // Layout am Wurzelelement markieren (veraltet, nur noch `split`).
    els.root.dataset.layout = cfg.layout || "split";
    // Darstellung (ADR 0068): nur Werte aus der Allowlist erreichen CSS.
    els.root.dataset.stil = wirksamerStil(MODE, state.stil, URL_STIL);

    // Darf der Sicherheits-Poll langsamer laufen (Spec
    // monitor-livestand-push, S6)? Fehlt das Feld (älterer Server), bleibt
    // es beim schnellen Takt — der Schalter kann nur entlasten.
    langsamErlaubt = !!cfg.pushFallbackSlow;

    // Info-Monitor-Zuweisung: bts-light schickt redirectTo, wir wechseln
    // sofort auf die zugehoerige Info-HTML. Geraete-Code als Query
    // weiterreichen, damit die Info-Seite die Identitaet kennt.
    //
    // Vor handleCommand pruefen (Code-Review v0.9.19 HIGH): ein anstehender
    // reload-/identify-Command darf nicht auf einer Seite zuenden, die im
    // gleichen Tick wegnavigiert — sonst zerstoert der reload den Wechsel.
    if (state.redirectTo && typeof state.redirectTo === "string") {
      // BASE-relativ auflösen: im LAN ist BASE "/", im Cloud
      // "/bts-relay/{ns}/". Der Server liefert `redirectTo` als absoluten
      // Info-Pfad ("/info/preparation") — den hängen wir hinter BASE, damit die
      // Umleitung im Cloud unter dem Namespace-Präfix landet (sonst 404).
      var dest = BASE + state.redirectTo.replace(/^\//, "");
      if (location.pathname !== dest) {
        var sep = dest.indexOf("?") >= 0 ? "&" : "?";
        location.href = mitAnsage(dest + sep + "device=" + encodeURIComponent(DEVICE_ID));
        return;
      }
    }

    if (MODE === "device") handleCommand(state.command);

    if (state.unassigned) {
      showPairing(state);
      return;
    }
    els.pairingView.classList.remove("show");

    if (state.match) {
      // Spiel auf dem Feld → Match-Ansicht.
      els.matchView.classList.add("show");
      els.adView.classList.remove("show");
      if (adState.timer) { clearInterval(adState.timer); adState.timer = null; }
      adState.key = "";
      renderMatch(state);
      renderTimer(state);
    } else {
      // Leeres Feld → Werbung. Ist die Werbung abgeschaltet (showAds),
      // bleibt die Liste leer → neutrale Leerlauf-Seite.
      els.adView.classList.add("show");
      els.matchView.classList.remove("show");
      hideTimer();
      var ads = (cfg.showAds !== false && Array.isArray(state.ads))
        ? state.ads : [];
      // Die Feldbezeichnung fuer die Werbe-Ecke kommt aus derselben Quelle
      // wie die des Leerlauf-Fallbacks.
      els.adCourt.textContent = state.courtLabel || "";
      applyAds(ads, cfg.adIntervalS || 10, state.adStyles);
      // Auch dann nachziehen, wenn `applyAds` frueh ausgestiegen ist: Das
      // Label kann sich geaendert haben, ohne dass die Bildliste es tat.
      feldMarke();
    }
  }

  // ── Push/Poll-Ordnung (A1, ADR 0016) ─────────────────────────────────
  // Der Voll-Stand kommt IMMER über denselben `fetch(STATE_URL)` – egal ob
  // ein Nudge ihn auslöst oder der Fallback-Poll. Eine Datenquelle, ein
  // Renderpfad → kein Flackern/Rückwärtsspringen. Der Push (Monitor-WS) löst
  // den Fetch niedrig-latent aus; der 250-ms-Poll ist nur noch der Stille-/
  // Ausfall-Fallback und pausiert, solange frische Nudges fürs eigene Feld
  // kommen.
  var COALESCE_MS = 60;       // Nudge-Bursts bündeln: höchstens ~1 Fetch/60 ms
  var mwsOpen = false;
  var mwsOffenSeitMs = 0;     // seit wann die aktuelle Leitung steht (S6)        // Monitor-WS gerade offen?

  // ── Gesundheit des Push-Kanals (Spec monitor-livestand-push, S6) ────────
  //
  // Die alte Regel verwechselte „der Kanal lebt" mit „es passiert gerade
  // etwas": Ein Feld ohne Ballwechsel sah aus wie ein toter Kanal, und ein
  // halbtoter Socket meldet umgekehrt minutenlang OPEN, ohne dass je etwas
  // ankommt. Jetzt zählt JEDES Frame vom Server, auch der Herzschlag.
  //
  // **Inline-Kopie von `src/io/pushHealth.mjs`** — dort steht die kanonische
  // Fassung samt Test (`scripts/test-push-health.mjs`, eigener CI-Schritt).
  // Änderungen hier und dort gemeinsam; dieselbe Kopie liegt in
  // `overview.html`.
  var HERZSCHLAG_STILL_MS = 25000;
  var FALLBACK_LANGSAM_MS = 4000;
  var FALLBACK_SCHNELL_MS = 250;
  var lastServerFrameAt = 0;  // letztes Frame: Anstoß ODER Herzschlag
  var lastFetchOk = true;
  var fetchFehler = 0;
  var langsamErlaubt = false; // aus `config.pushFallbackSlow`
  var letzterAbrufMs = 0;     // Beginn des letzten losgeschickten Abrufs
  // ── Stillstands-Wächter (siehe `lagePruefen` unten) ──────────────────
  var letzterAbrufOkMs = 0;   // letzter Abruf, der ohne Fehler zurückkam
  var letzterStandMs = 0;     // letzter angewendete ODER bestätigte Stand
  var verworfeneStaende = 0;  // wie oft der seq-Guard eine Antwort abwies
  var bestaetigungen = 0;     // 304 „nichts Neues" seit dem Laden
  // Wurde der letzte volle Stand vom seq-Guard verworfen? Dann trägt
  // `lastEtag` die Marke eines nie gezeigten Standes, und ein folgendes 304
  // bestätigt NICHT das Gezeigte — es darf `letzterStandMs` nicht stempeln,
  // sonst wäre `verworfen` am Court-Monitor nie mehr feststellbar
  // (Review-Fund 15.09.2026).
  var letzterStandVerworfen = false;
  var seitStartMs = Date.now();
  var gemeldeteStillstandsArt = null;
  function pushGesund(z, nowMs) {
    if (!z || !z.wsOpen) return false;
    if (z.lastFetchOk === false) return false;
    if ((z.failures || 0) > 0) return false;
    var letztes = z.lastServerFrameMs || 0;
    if (letztes <= 0) return false;
    return nowMs - letztes < HERZSCHLAG_STILL_MS;
  }
  function fallbackTakt(gesund, erlaubt) {
    return gesund && erlaubt ? FALLBACK_LANGSAM_MS : FALLBACK_SCHNELL_MS;
  }
  function kanalIstTot(wsOffen, letztesFrame, nowMs) {
    if (!wsOffen) return false;
    var letztes = letztesFrame || 0;
    if (letztes <= 0) return false;
    return nowMs - letztes >= HERZSCHLAG_STILL_MS;
  }
  function kanalZustand() {
    return {
      wsOpen: mwsOpen,
      lastServerFrameMs: lastServerFrameAt,
      lastFetchOk: lastFetchOk,
      failures: fetchFehler,
    };
  }

  // ── Server-Uhr (Etappe ETag, 1c) ──────────────────────────────────────
  // Seit dem ETag/304-Umbau liefert der Server nur noch bei einem VOLLEN
  // 200-Abruf ein frisches `serverNowMs`; die meiste Zeit kommt 304 (kein
  // Body). Damit Pausen-/Aufruf-Uhren trotzdem weiterlaufen, halten wir
  // einen laufenden Offset zur lokalen Uhr: `nowServerMs() = Date.now() +
  // offset`. Gespeist aus zwei Quellen — jedem 200-Abruf und dem
  // WS-Herzschlag (`{"hb":<nowMs>}`) — überlebt der Offset eine 304-Serie
  // und einen WS-Abriss (U12).
  //
  // **Inline-Kopie von `src/io/monitorClock.mjs`** — dort steht die
  // kanonische Fassung samt Test (`scripts/test-monitor-clock.mjs`,
  // eigener CI-Schritt). Änderungen hier und dort gemeinsam.
  var clockOffset = null;
  function clockFeed(serverNowMs) {
    if (typeof serverNowMs !== "number" || serverNowMs <= 0) return false;
    clockOffset = serverNowMs - Date.now();
    return true;
  }
  function nowServerMs() {
    return typeof clockOffset === "number" ? Date.now() + clockOffset : Date.now();
  }

  // ── ETag/304 (Etappe ETag, 1b) ─────────────────────────────────────────
  // `lastEtag` ist die zuletzt gesehene Marke des SERVERS; sie wird beim
  // nächsten Abruf als `If-None-Match` mitgeschickt. Der Refetch-Cap
  // (keine neue Schwellen-Konstante, sondern aus `pushGesund` abgeleitet)
  // erzwischt trotz ETag regelmäßig einen vollen 200, damit der Uhr-Offset
  // nie veraltet: gesunder Kanal → alle 10 min, sonst → alle 60 s.
  var lastEtag = null;
  var letzterVollerAbrufMs = 0;
  function refetchCap(gesund) {
    return gesund ? 600000 : 60000;
  }

  var fetching = false, refetchQueued = false;
  var coalesceTimer = null, lastFetchStart = 0;

  // Feld-Identität für WS-Abo/Filter. Fester Monitor: aus dem Pfad
  // (/court/{id}/display) – sofort bekannt. Geräte-Monitor: erst nach dem
  // ersten /state-Poll (state.courtId), kann per Reassignment wechseln.
  function courtIdFromPath() {
    var m = location.pathname.match(/\/court\/(\d+)(?:\/|$)/);
    return m ? parseInt(m[1], 10) : null;
  }
  var fixedCourtId = MODE !== "device" ? courtIdFromPath() : null;
  var knownCourtId = fixedCourtId;   // wird in applyState nachgezogen
  var lastSeqByCourt = {};           // zuletzt gezeigte Ordnungszahl je Feld

  /** Soll ein eintreffender Stand angewendet werden? (Spec
   *  monitor-livestand-push, S4)
   *
   *  Push nur bei echt neuerer Ordnungszahl; ein Voll-Abruf darf gleichziehen
   *  — er trägt denselben Stand, den der Nudge angekündigt hat, und darf ihn
   *  auch dann noch berichtigen (BTP-Rückfall). `0` heißt „keine Ordnung
   *  bekannt" (älterer Server) und blockiert nie: Eine eingefrorene Anzeige
   *  wäre der schlimmere Fehler.
   *
   *  **Inline-Kopie von `src/io/monitorSeq.mjs`** — dort steht die kanonische
   *  Fassung samt Test (`scripts/test-monitor-seq.mjs`, eigener CI-Schritt).
   *  Änderungen hier und dort gemeinsam; dieselbe Kopie liegt in
   *  `overview.html`. */
  function seqAnwenden(gezeigtSeq, seq, quelle) {
    var gezeigt = Number.isFinite(gezeigtSeq) ? gezeigtSeq : 0;
    var neu = Number.isFinite(seq) ? seq : 0;
    if (neu <= 0) return true;
    if (gezeigt <= 0) return true;
    return quelle === "push" ? neu > gezeigt : neu >= gezeigt;
  }

  /** Steht die Anzeige still, ohne es zu merken?
   *
   *  **Inline-Kopie von `src/io/standstill.mjs`** — dort steht die kanonische
   *  Fassung samt Begründung und Test (`scripts/test-standstill.mjs`, eigener
   *  CI-Schritt). Änderungen hier und dort gemeinsam; dieselbe Kopie liegt in
   *  `overview.html`. */
  var STILLSTAND_MS = 60000;
  function lagePruefen(zustand, nowMs) {
    var z = zustand || {};
    var gemeldet = z.gemeldeteArt || null;
    var gesund = { art: null, stillMs: 0, melden: false, erholt: gemeldet !== null };
    var start = stillZahl(z.startMs);
    if (!start) return { art: null, stillMs: 0, melden: false, erholt: false };
    var abruf = stillZahl(z.letzterAbrufOkMs) || start;
    var stand = stillZahl(z.letzterStandMs) || start;
    var ohneAbruf = nowMs - abruf;
    var ohneStand = nowMs - stand;
    if (ohneAbruf < 0 || ohneStand < 0) return gesund;
    if (ohneAbruf >= STILLSTAND_MS) return stillLage("keine_abrufe", ohneAbruf, gemeldet);
    if (ohneStand >= STILLSTAND_MS) return stillLage("verworfen", ohneStand, gemeldet);
    return gesund;
  }
  function stillLage(art, stillMs, gemeldet) {
    return { art: art, stillMs: stillMs, melden: art !== gemeldet, erholt: false };
  }
  function stillZahl(v) {
    return typeof v === "number" && isFinite(v) && v > 0 ? v : 0;
  }

  // Was den nächsten Abruf ausgelöst hat (Spec monitor-livestand-push, S0).
  // Fallen Nudge und Fallback-Takt zusammen, gewinnt "push": Der Abruf wäre
  // durch den Nudge ohnehin gekommen.
  //
  // Zurückgesetzt wird beim **Start** des Fetchs, nicht an seinem Ende —
  // sonst ginge ausgerechnet der vom Nudge angeforderte Nachschlag als
  // "poll" hinaus (Review-Fund 19.08.2026, gleiche Stelle in overview.html).
  var naechsteQuelle = "poll";
  function stateUrl(quelle) {
    return STATE_URL + (STATE_URL.indexOf("?") >= 0 ? "&" : "?") + "src=" + quelle;
  }

  // Abruf-Optionen für den STATE_URL-Fetch (Etappe ETag, 1b/1c): `cache`
  // bleibt `no-store` (wir steuern das Caching selbst über die Marke). Mit
  // gespeicherter Marke geht `If-None-Match` mit; der Refetch-Cap schickt
  // ihn regelmäßig WEG, damit binnen 10 min (gesund) bzw. 60 s (ungesund)
  // sicher ein voller 200 mit frischem `serverNowMs` kommt.
  function abrufOptionen() {
    var opt = { cache: "no-store" };
    if (lastEtag && Date.now() - letzterVollerAbrufMs < refetchCap(pushGesund(kanalZustand(), Date.now()))) {
      opt.headers = { "If-None-Match": lastEtag };
    }
    return opt;
  }

  // Frist des Stand-Abrufs: Kopfzeilen 5 s, Rumpf danach 15 s. Ein Abruf,
  // der weder scheitert noch antwortet, blockierte sonst alle folgenden
  // (Turnier 05./06.09.2026). **Inline-Kopie von `src/io/abrufFrist.mjs`**
  // — dort die kanonische Fassung mit Begründung und Test
  // (`scripts/test-abruf-frist.mjs`, eigener CI-Schritt); hier ohne
  // `fetchFn`-Parameter. Änderungen hier und dort gemeinsam.
  var KOPF_FRIST_MS = 5000, RUMPF_FRIST_MS = 15000;
  function abrufMitFrist(url, opt, lesen) {
    var ctrl = (typeof AbortController === "function") ? new AbortController() : null;
    var o = Object.assign({}, opt);
    if (ctrl) o.signal = ctrl.signal;
    var timer = null, abgelaufen = false, abbrechen = null;
    var abbruch = new Promise(function (_, reject) {
      abbrechen = function (was) {
        abgelaufen = true;
        if (ctrl) ctrl.abort();
        reject(new Error("Abruf-Frist überschritten (" + was + ")"));
      };
      timer = setTimeout(function () { abbrechen("Kopfzeilen " + KOPF_FRIST_MS + " ms"); }, KOPF_FRIST_MS);
    });
    var abruf = fetch(url, o).then(function (r) {
      // Nur ohne AbortController erreichbar: Der Wettlauf ist entschieden,
      // der Leser darf seine Nebenwirkungen nicht mehr entfalten.
      if (abgelaufen) throw new Error("Antwort nach Ablauf der Frist verworfen");
      clearTimeout(timer);
      timer = setTimeout(function () { abbrechen("Rumpf " + RUMPF_FRIST_MS + " ms"); }, RUMPF_FRIST_MS);
      return lesen ? lesen(r) : r;
    });
    return Promise.race([abruf, abbruch]).then(
      function (wert) { clearTimeout(timer); return wert; },
      function (fehler) { clearTimeout(timer); throw fehler; }
    );
  }

  function poll() {
    // In-Flight-Schutz: Nudge und Fallback teilen sich denselben Fetch. Läuft
    // schon einer, merken wir EINEN Nachschlag, damit am Ende sicher der
    // neueste Stand geholt wird (kein verpasstes Update).
    if (fetching) { refetchQueued = true; return; }
    fetching = true;
    // Beginn des tatsächlich losgeschickten Abrufs — daran misst der
    // Sicherheits-Poll seinen Abstand (S6), damit ein angestoßener Abruf ihn
    // mitzählt und in einer regen Halle kein zusätzlicher anfällt.
    letzterAbrufMs = Date.now();
    var quelle = naechsteQuelle;
    naechsteQuelle = "poll";
    abrufMitFrist(stateUrl(quelle), abrufOptionen(), function (r) {
        if (r.status === 304) {
          // Nichts Neues: letzten Stand behalten. Der Uhr-Offset wird aus dem
          // 304 NICHT abgeleitet (kein Body) — frische Werte kommen über den
          // Refetch-Cap und den Herzschlag (1c). Das Lebenszeichen läuft über
          // den Abruf selbst und ist damit auch hier frisch.
          return null;
        }
        if (!r.ok) throw new Error("HTTP " + r.status);
        // Der Leser bleibt frei von Nebenwirkungen und reicht Stand und Marke
        // nur durch. Die Buchführung steht in der äußeren Kette — und die
        // läuft nur, wenn die Frist gehalten hat. Ein Rumpf, der erst nach
        // der Frist eintrifft, darf nichts mehr bewirken (Review-Fund
        // 08.09.2026).
        var etag = r.headers.get("ETag");
        return r.json().then(function (state) { return { state: state, etag: etag }; });
      })
      .then(function (paket) {
        // Marke erst hier, NACH dem Rumpf: Bricht die Frist den Rumpf ab,
        // fragte der nächste Abruf sonst mit der Marke eines nie gezeigten
        // Standes — bekäme ein 304, räumte die Blende ab und zeigte den alten
        // Stand bis zur nächsten Änderung.
        var state = paket === null ? null : paket.state;
        if (paket && paket.etag) { lastEtag = paket.etag; letzterVollerAbrufMs = Date.now(); }
        abrufGeglueckt();
        if (state === null) {
          // 304: nichts Neues. Der gezeigte Stand bleibt gültig, es gibt
          // nichts zu rendern. Für den Stillstands-Wächter zählt das wie ein
          // angewendeter Stand: Der Server bestätigt gerade ausdrücklich,
          // dass das Gezeigte stimmt (Spec monitor-livestand-push, S8).
          // Ohne diese Zeile meldete jeder Court-Monitor in jeder Spielpause
          // `keine_abrufe` — bei gesundem Push-Kanal kommt ein voller 200
          // nur alle 10 min (Refetch-Cap), und 60 s danach schlug der
          // Wächter an (Turnier 12./13.09.2026: ~50 Fehlalarme je Gerät
          // und Tag, jeder mit Log-Upload). Ausnahme: Wurde der letzte volle
          // Stand verworfen, bestätigt das 304 einen nie gezeigten Stand —
          // dann bleibt der Stempel aus, damit `verworfen` auffliegt.
          if (!letzterStandVerworfen) letzterStandMs = Date.now();
          bestaetigungen++;
          pollDone();
          return;
        }
        applyState(state);
        clockFeed(state.serverNowMs);
        pollDone();
      })
      .catch(function () {
        // Aussetzer tolerieren: letzten Stand halten, nur Hinweis zeigen.
        // Ein EINZIGER Fehlversuch macht den Kanal ungesund und schaltet
        // sofort auf den schnellen Takt zurück (S6).
        lastFetchOk = false; fetchFehler++;
        if (!wasOffline) { wasOffline = true; mlog("warn", "offline"); uploadMonitorLog(); }
        els.offline.classList.add("show");
        pollDone();
      });
  }
  function pollDone() {
    fetching = false;
    if (refetchQueued) { refetchQueued = false; requestFetch(); }
  }
  var wasOffline = false; // Offline-Wechsel nur einmal loggen (nicht je Poll)

  // Ein Abruf ist geglückt — Kopfzeilen UND Rumpf. Ein Ort für beide Zweige
  // (304 und voller Stand), damit die Entwarnung nirgends vor dem Rumpf steht
  // und der Stillstands-Wächter beide als Lebenszeichen zählt. Gleiche
  // Funktion wie in `overview.html`.
  function abrufGeglueckt() {
    if (wasOffline) { wasOffline = false; mlog("info", "online"); uploadMonitorLog(); }
    lastFetchOk = true; fetchFehler = 0;
    letzterAbrufOkMs = Date.now();
    els.offline.classList.remove("show");
  }

  // Fetch coalescen: höchstens ~1 Fetch je COALESCE_MS, egal wie viele Nudges
  // einschlagen. Nudge und In-Flight-Nachschlag laufen hierüber.
  function requestFetch() {
    var now = Date.now();
    var wait = COALESCE_MS - (now - lastFetchStart);
    if (wait <= 0) { lastFetchStart = now; poll(); }
    else if (!coalesceTimer) {
      coalesceTimer = setTimeout(function () {
        coalesceTimer = null; lastFetchStart = Date.now(); poll();
      }, wait);
    }
  }
  // Solange der Kanal gesund ist, pausiert der Sicherheits-Poll bzw. läuft
  // langsam. Siehe `pushGesund` oben.
  function pushHealthy() {
    return pushGesund(kanalZustand(), Date.now());
  }

  // Pausen-Countdown, Aufruf-Uhr UND Kopf-Spieldauer jede Sekunde unabhängig
  // vom Poll aktualisieren (sonst zählten die Uhren nur im Poll-Takt hoch,
  // und in einer 304-Serie stünde die Spieldauer still — Review R2).
  setInterval(function () {
    if (lastState && lastState.match) {
      renderTimer(lastState);
      renderCallTimer(lastState);
      renderMatchClock(lastState);
    }
  }, 1000);

  poll();

  // Stillstands-Wächter: Stellt fest, was bisher niemand sehen konnte — eine
  // Anzeige, die weiterläuft und trotzdem nichts Neues mehr übernimmt. Sie
  // wirft dabei keinen Fehler und wird nicht geschlossen, fällt also durch
  // alle drei Auslöser des Log-Uploads (JS-Fehler, unhandledrejection,
  // pagehide). Erst dieser Takt macht den Zustand bezeugbar.
  //
  // Er HEILT nichts: kein Reload, kein Zurücksetzen der Ordnungszahl. Eine
  // Ursache ist seit v0.9.287 bekannt und behoben — der Stand-Abruf ohne
  // Frist (`abrufMitFrist`), der nach einem WLAN-Roaming alle folgenden
  // blockierte. Ein `keine_abrufe` mit `fetchOk=true` wäre seither ein NEUER
  // Befund; für den bleibt der Wächter stumm heilend, damit die Spur steht.
  //
  // 10-s-Takt gegen eine 60-s-Schwelle: fein genug, um den Beginn auf zehn
  // Sekunden genau zu datieren, und billig genug, um nicht ins Gewicht zu
  // fallen.
  setInterval(function () {
    var jetzt = Date.now();
    var lage = lagePruefen({
      startMs: seitStartMs,
      letzterAbrufOkMs: letzterAbrufOkMs,
      letzterStandMs: letzterStandMs,
      gemeldeteArt: gemeldeteStillstandsArt,
    }, jetzt);
    if (lage.melden) {
      gemeldeteStillstandsArt = lage.art;
      // Alles, was zur Eingrenzung taugt, in EINER Zeile — wer das Log liest,
      // hat kein zweites Gerät daneben.
      mlog("error", "stillstand", {
        art: lage.art,
        stillMs: lage.stillMs,
        verworfen: verworfeneStaende,
        bestaetigungen: bestaetigungen,
        wsOpen: mwsOpen,
        frameAltMs: lastServerFrameAt ? jetzt - lastServerFrameAt : null,
        fetchOk: lastFetchOk,
        fetchFehler: fetchFehler,
        taktMs: fallbackTakt(pushHealthy(), langsamErlaubt),
        feld: knownCourtId,
        gezeigteSeq: (knownCourtId && lastSeqByCourt[knownCourtId]) || 0,
        modus: MODE,
      });
      uploadMonitorLog();
    } else if (lage.erholt) {
      gemeldeteStillstandsArt = null;
      mlog("info", "stillstand_vorbei", { verworfen: verworfeneStaende });
      uploadMonitorLog();
    }
  }, 10000);

  // Sicherheits-Poll (Spec monitor-livestand-push, S6). 250-ms-Raster, bei
  // jedem Tick neu entschieden, wie lange die Seite ohne eigenen Abruf
  // auskommen darf: Kanal ungesund → 250 ms wie bisher; gesund und Schalter
  // gesetzt → 4 s; gesund ohne Schalter → weiterhin 250 ms.
  //
  // **Er hört nie ganz auf.** An diesem einen Abruf hängt hier alles: das
  // Lebenszeichen des Geräts (`record_monitor_poll`, 20-s-Fenster), die
  // Fernbefehle, `redirectTo` und die Geräte→Feld-Zuweisung. Nichts davon
  // wird angestoßen. Setzte die Seite bei gesundem Kanal aus, erschiene ein
  // Gerät nach 20 s offline, erführe eine Umzuweisung nie und käme in einer
  // ruhigen Halle nicht einmal von der Kopplungs-Seite herunter
  // (Review-Fund 19.08.2026).
  //
  // Bleibt der Herzschlag länger als 25 s aus, gilt der Kanal als tot und
  // die Verbindung wird aktiv getrennt, damit der Reconnect greift.
  setInterval(function () {
    var jetzt = Date.now();
    // `|| mwsOffenSeitMs`: Eine Leitung, die seit dem Verbinden NIE etwas
    // geliefert hat (WLAN-Roam direkt nach dem Handschlag), stünde sonst für
    // immer auf 0 — und 0 heißt „hat sich noch nicht bewährt", also
    // niemals tot. Sie bliebe dauerhaft im schnellen Takt hängen
    // (Review-Fund 19.08.2026).
    if (kanalIstTot(mwsOpen, lastServerFrameAt || mwsOffenSeitMs, jetzt)) {
      mlog("warn", "mws_stale_close", { stillMs: jetzt - (lastServerFrameAt || mwsOffenSeitMs) });
      mwsTrennen();
    }
    var takt = fallbackTakt(pushGesund(kanalZustand(), jetzt), langsamErlaubt);
    if (jetzt - letzterAbrufMs >= takt) poll();
  }, FALLBACK_SCHNELL_MS);

  // ── Monitor-WS-Nudge-Client (A1, ADR 0016) ────────────────────────────
  // Der Server schickt nur „Feld X geändert, seq N" (keine Score-Daten); wir
  // lösen daraufhin den bestehenden STATE_URL-Fetch aus. WS-URL wie beim
  // Tablet aus BASE + location.protocol (ws/wss laufen durch den Proxy):
  //   LAN   ws://host/monitor-ws
  //   Cloud wss://badhub.de/bts-relay/{ns}/monitor-ws
  // Fester Monitor abonniert nur sein Feld (?court=), der Geräte-Monitor
  // alle Felder und filtert clientseitig (Feld kann per Reassignment wechseln
  // und ist anfangs unbekannt).
  function monitorWsUrl() {
    var proto = location.protocol === "https:" ? "wss://" : "ws://";
    var q = (MODE !== "device" && fixedCourtId != null)
      ? "?court=" + fixedCourtId : "";
    return proto + location.host + BASE + "monitor-ws" + q;
  }
  var mws = null;
  var mwsBackoff = 1000, MWS_BACKOFF_MAX = 15000, mwsNextAt = 0;
  function mwsConnect() {
    if (mws && mws.readyState !== WebSocket.CLOSED) return; // verbindet/verbunden
    try { mws = new WebSocket(monitorWsUrl()); }
    catch (e) { mwsSchedule(); return; }
    mws.onopen = function () {
      mwsOpen = true; mwsBackoff = 1000;
      // Nach Server-/Relay-Neustart springt die seq wieder auf 0. Der alte
      // lastSeq-Höchstwert würde dann JEDEN neuen Nudge als „veraltet"
      // verwerfen, bis der Server den alten Wert überholt → Anzeige hängt.
      // Darum je frischer Verbindung zurücksetzen (innerhalb einer Verbindung
      // ist der Guard dank TCP-Ordnung ohnehin redundant).
      lastSeqByCourt = {};
      // Die frische Verbindung hat sich noch nicht bewährt: 0 heißt „noch
      // kein Frame" — nicht gesund, aber auch nicht tot. Bliebe der alte,
      // über 25 s alte Zeitpunkt stehen, erklärte der nächste Tick den eben
      // verbundenen Socket sofort wieder für tot (Review-Fund 19.08.2026).
      lastServerFrameAt = 0;
      mwsOffenSeitMs = Date.now();
      mlog("info", "mws_open");
    };
    mws.onmessage = function (ev) {
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      // **Jedes** Frame vom Server beweist, dass der Kanal lebt — auch der

  function segmenteSprechen(e) {
    if (!w.speechSynthesis || !w.SpeechSynthesisUtterance) return Promise.resolve();
    var stimmen = geraeteStimmen(e.lang);
    var kette = Promise.resolve();
    (e.segmente || []).forEach(function (text) {
      kette = kette.then(function () {
        return new Promise(function (fertig) {
          var t = String(text || "").trim();
          if (!t) { fertig(); return; }
          var u = new w.SpeechSynthesisUtterance(t);
          u.lang = e.lang === "en" ? "en-US" : "de-DE";
          u.rate = e.rate || 0.8;
          if (stimmen.length) u.voice = stimmen[0];
          var fertigGemeldet = false;
          var ende = function () { if (!fertigGemeldet) { fertigGemeldet = true; fertig(); } };
          u.onend = ende;
          u.onerror = ende;
          w.setTimeout(ende, 2000 + t.length * 140);
          w.speechSynthesis.speak(u);
        });
      });
    });
    return kette;
  }

  /* ── Warteschlange: strikt nacheinander, nichts überlappt ──────── */
  function naechste() {
    if (z.spielt) return;
    var stueck = z.warteschlange.shift();
    if (!stueck) return;
    var belegung = (z.feed && z.feed.belegung) || [];
    // Eine Wiederholung hat der Nutzer selbst angefordert — sie verfällt
    // nicht und wird nicht gegen die Belegung geprüft.
    if (!stueck.wiederholung && !nochAbspielbar(stueck.e, belegung, stueck.empfangen, jetzt())) {
      naechste();
      return;
    }
    z.spielt = true;
    var e = stueck.e;
    var v = stueck.verlauf || null;
    // Ein Original kommt in den Verlauf, sobald es erklingt — wer nicht hört,
    // liest mit, während gesprochen wird. Eine Wiederholung ist kein neuer
    // Eintrag.
    if (mitVerlauf && !stueck.wiederholung) {
      v = { id: e.id, ms: jetzt(), text: ansageText(e), e: e, puffer: null };
      z.verlauf = verlaufAufnehmen(z.verlauf, v, ANSAGE_VERLAUF_MAX);
    }
    z.spieltId = e.id;
    melden();
    (e.gong ? gongSpielen(e.gong) : Promise.resolve())
      .then(function () {
        return audioSpielen(e, v).catch(function () { return segmenteSprechen(e); });
      })
      .catch(function () { /* weiter mit der nächsten */ })
      .then(function () {
        z.spielt = false;
        z.spieltId = null;
        if (!stueck.wiederholung) {
          z.letzte = { ms: jetzt(), text: String((e.segmente || []).join(" ")).slice(0, 140) };
        }
        melden();
        naechste();
      });
  }

  /* Die Halle, mit der die Seite fragt. Eine leere Liste heißt entweder „nur
     eine Halle" oder „noch kein BTP-Stand" (Turnier-PC startet gerade neu).
     Hat die Seite schon Hallen gesehen, ist es Letzteres: Dann bleibt sie bei
     ihrer Halle — sonst stünde ein Pi nach jedem Neustart des PCs stumm da
     oder hörte kurz fremde Hallen. Nur ohne je gesehene Hallen (Turnier mit
     einer Halle) fragt sie ohne. */
  function wirksameHalle() {
    return z.halls.length || z.hallenGesehen ? z.halle : "";
  }

  /* Darf die Seite mit ihrer Halle spielen und sich melden? Eine fest
     vorgegebene Halle muss es im Turnier geben, sobald es Hallen gibt. */
  function halleOk() {
    if (!halleGueltig(z.halls, z.halle)) return false;
    if (!halleFest || !z.halls.length || String(z.halle).trim() === "") return true;
    return z.halls.some(function (h) { return hallePasst(h, z.halle) && String(h).trim() !== ""; });
  }

  /* Neue Hallenliste übernehmen. Gemerkte oder per Link vorgegebene Halle
     nur übernehmen, wenn es sie gibt; eine leere Liste ändert an der Wahl
     nichts. */
  function hallenUebernehmen(halls) {
    if (JSON.stringify(halls) === JSON.stringify(z.halls)) return;
    z.halls = halls;
    if (halls.length) {
      z.hallenGesehen = true;
      var passend = halls.filter(function (h) { return hallePasst(h, z.halle) && z.halle !== ""; })[0];
      z.halle = passend || (halleFest ? z.halle : "");
    }
    hallenMelden(halls);
  }

  /* Spielt eine Ansage aus dem Verlauf noch einmal — nur auf diesem Gerät,
     hinten in derselben strikten Schlange (nie über eine laufende Ansage).
     Der Tipp auf ↻ ist eine Nutzergeste: Er gibt den Ton frei, falls nötig —
     und die Schlange läuft erst weiter, wenn der Ton wieder läuft, sonst
     fiele der Gong weg (Kontext nach Anruf/Bildschirm aus angehalten).
     Mehrfaches Tippen stapelt nichts: Liegt dieselbe Ansage schon als
     Wiederholung in der Schlange, bleibt es bei der einen. */
  function wiederholen(id) {
    var auftrag = wiederholungsAuftrag(z.verlauf, id);
    if (!auftrag) return false;
    var schonDa = z.warteschlange.some(function (s) { return s.wiederholung && s.e.id === id; });
    if (schonDa) return true;
    z.warteschlange.push(auftrag);
    var ctx = audioKontext();
    if (ctx && ctx.state !== "running") {
      freischalten();
      var weiter = function () { naechste(); };
      try { ctx.resume().then(weiter, weiter); } catch (e) { weiter(); }
      return true;
    }
    naechste();
    return true;
  }

  function halleWaehlen(halle) {
    var vorher = z.halle;
    z.halle = String(halle || "");
    // Neue Halle: Was schon in der Schlange liegt, gehört zur alten — bis auf
    // Wiederholungen, die der Nutzer selbst angefordert hat. Der Verlauf
    // bleibt stehen: Er ist das, was dieses Gerät gespielt hat.
    if (vorher !== z.halle) {
      z.warteschlange = z.warteschlange.filter(function (s) { return s.wiederholung; });
    }
    melden();
  }

  /* ── Abfrage ───────────────────────────────────────────────────── */
  function abfragen() {
    if (z.abrufLaeuft) return;
    if (z.fehltSeit && jetzt() - z.fehltSeit < ANSAGE_FEHLT_PAUSE_MS) return;
    var hoert = meldetPraesenz(z.feed, hatGeraeteStimme(), tonPruefen()) && halleOk();
    var abbruch = w.AbortController ? new w.AbortController() : null;
    var abruf;
    // Ein synchroner Wurf darf die Sperre nie setzen, ohne sie zu lösen —
    // sonst fragte die Seite nie wieder (Review E1b).
    try {
      abruf = w.fetch(feedAdresse(base, wirksameHalle(), z.stand.lastId, hoert),
        { cache: "no-store", signal: abbruch ? abbruch.signal : undefined });
    } catch (e) {
      abruf = Promise.reject(e);
    }
    var frist = w.setTimeout(function () { if (abbruch) abbruch.abort(); }, ANSAGE_FEED_FRIST_MS);
    z.abrufLaeuft = true;
    abruf
      .then(function (r) {
        if (r.status === 404) {
          z.fehltSeit = jetzt();
          throw new Error("kein Feed");
        }
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (feed) {
        z.verbunden = true;
        z.fehltSeit = 0;
        z.fehlversuche = 0;
        z.feed = feed;
        hallenUebernehmen(feed.halls || []);
        var r = neueEintraege(z.stand, feed);
        z.stand = r.stand;
        // Nur abspielen, wenn diese Seite wirklich bereit ist — sonst liefen
        // Aufrufe einer fremden Halle oder ohne Ton in die Schlange.
        if (z.tonFrei && halleOk()) {
          var empfangen = jetzt();
          r.neu.forEach(function (e) { z.warteschlange.push({ e: e, empfangen: empfangen }); });
          naechste();
        }
      })
      .catch(function () { z.verbunden = false; z.fehlversuche += 1; })
      .then(function () {
        w.clearTimeout(frist);
        z.abrufLaeuft = false;
        melden();
      });
  }

  function starten() {
    // Läuft der Ton schon (Pi mit Autoplay-Freigabe, Kiosk-App), ist die
    // Seite ohne Tippen bereit.
    audioKontext();
    melden();
    abfragen();
    w.setInterval(abfragen, ANSAGE_TAKT_MS);
  }

  return {
    zustand: z,
    starten: starten,
    abfragen: abfragen,
    freischalten: freischalten,
    halleWaehlen: halleWaehlen,
    wiederholen: wiederholen,
    halleOk: halleOk,
    tonPruefen: tonPruefen,
    hatGeraeteStimme: hatGeraeteStimme,
    stimmeArt: function () { return stimme(z.feed && z.feed.hostAudio, hatGeraeteStimme()); },
  };
}

/* ── Ansage-Modus der Monitor-Seiten (E1b) ───────────────────────────── */

/** Liest den Modus aus der Adresse: `?ansage=<Halle>` schaltet ihn ein,
 *  auch mit leerem Wert (Turnier mit einer Halle). */
function ansageModusAusQuery(search) {
  var such;
  try { such = new URLSearchParams(search || ""); } catch (e) { return null; }
  if (!such.has("ansage")) return null;
  return { halle: String(such.get("ansage") || "").trim() };
}

/** Den Ansage-Feed gibt es in E1b nur am Turnier-PC im Hallennetz (Basis
 *  `/`); über das Relay (`/bts-relay/<ns>/`) kommt er erst mit E4. */
function ansageImLan(base) {
  return base === "/";
}

/**
 * Was der Monitor im Ansage-Modus als kleinen Hinweis zeigt — leer, wenn
 * alles läuft (dann bleibt die Anzeige unverändert). `lage`: `{ lan, fehlt,
 * verbunden, feed, tonFrei, halleOk, halle, stimme }`.
 */
function monitorHinweis(lage) {
  if (!lage.lan) return "Ansage: nur im Hallennetz (LAN) am Turnier-PC — über die Cloud noch nicht.";
  if (lage.fehlt) return "Ansage: Der Turnier-PC bietet hier keine Ansagen an (bts-light zu alt oder Slave-Brücke).";
  if (!lage.verbunden || !lage.feed) return "Ansage: keine Verbindung zum Turnier-PC.";
  if (!lage.feed.aktiv) return "Ansage: " + grundText(lage.feed.grund);
  if (!lage.halleOk) {
    return lage.halle
      ? "Ansage: Die Halle „" + lage.halle + "“ gibt es in diesem Turnier nicht."
      : "Ansage: Bitte die Halle angeben (?ansage=<Halle>).";
  }
  if (!lage.tonFrei) return "Ansage: Ton gesperrt — der Browser braucht die Autoplay-Freigabe (Pi-Einrichtung aktualisieren).";
  if (lage.stimme === "keine") return "Ansage: Dieses Gerät kann nicht sprechen (kein Audio vom Turnier-PC, keine Gerätestimme).";
  return "";
}

/**
 * Startet den Ansage-Modus einer Monitor-Seite, wenn die Adresse ihn
 * verlangt. Die Anzeige selbst bleibt unberührt; nur bei einem Problem
 * erscheint unten links ein kleiner Hinweis. Ohne freigegebenen Ton meldet
 * sich die Seite nicht als Ansage-Gerät (das regelt der Kern).
 */
function ansageMonitorStarten(base, welt, dokument) {
  var modus = ansageModusAusQuery(welt.location && welt.location.search);
  if (!modus) return null;
  var hinweis = dokument.createElement("div");
  hinweis.id = "ansage-hinweis";
  hinweis.setAttribute("role", "status");
  hinweis.style.cssText = "position:fixed;left:.6vmin;bottom:.6vmin;z-index:2147483000;" +
    "max-width:60vw;padding:.4vmin .9vmin;border-radius:.6vmin;font:1.6vmin/1.3 system-ui,sans-serif;" +
    "background:rgba(15,23,42,.82);color:#fbbf24;pointer-events:none;display:none";
  dokument.body.appendChild(hinweis);
  function zeigen(text) {
    hinweis.textContent = text;
    hinweis.style.display = text ? "block" : "none";
  }
  if (!ansageImLan(base)) {
    // Kein Abruf, keine Fehlerschleife: Im Cloud-Pfad gibt es den Feed noch nicht.
    zeigen(monitorHinweis({ lan: false }));
    return null;
  }
  var kern = ansageKern({
    base: base,
    halle: modus.halle,
    halleFest: true,
    welt: welt,
    beiAenderung: function () {
      var z = kern ? kern.zustand : null;
      if (!z) return;
      zeigen(monitorHinweis({
        lan: true,
        fehlt: !!z.fehltSeit,
        // Erst nach drei Fehlschlägen in Folge (≈ 5 s) — ein WLAN-Wackler
        // soll nicht jedes Mal einen Hinweis in die Halle blitzen lassen.
        verbunden: z.verbunden || (!!z.feed && z.fehlversuche < 3),
        feed: z.feed,
        tonFrei: kern.tonPruefen(),
        halleOk: kern.halleOk(),
        halle: z.halle,
        stimme: kern.stimmeArt(),
      }));
    },
  });
  // Kein Freischalt-Knopf am TV — aber eine zufällige Geste (Maus, Taste)
  // gibt den Ton frei, falls die Autoplay-Freigabe fehlt.
  ["pointerdown", "keydown"].forEach(function (art) {
    dokument.addEventListener(art, kern.freischalten, { passive: true });
  });
  kern.starten();
  return kern;
}
/* </ansageKern.mjs> */

ansageMonitorStarten(ANSAGE_BASIS, window, document);
})();
</script>
