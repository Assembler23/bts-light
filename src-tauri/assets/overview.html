<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Court-Übersicht</title>
<style>
/* ── Layout-Grundlagen ─────────────────────────────────────────────────
   Wie monitor.html: dunkles Marine, gelbe Akzente, slate-Töne. Größen
   in vmin damit die Skala auf jedem Bildschirm passt — Beamer wie TV. */
html, body {
  margin: 0; height: 100%; background: #0b1120; color: #f8fafc;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  cursor: none; overflow: hidden;
}
/* Body als Flex-Spalte: die Kopfzeile nimmt ihre echte Höhe, `main` füllt
   exakt den Rest. (Vorher: main = calc(100% - 7vh) mit hartcodierter
   Kopfzeilen-Höhe → war die Kopfzeile real höher, lief das Grid unten aus
   dem Bild.) */
body { display: flex; flex-direction: column; }

/* Pivot-Unterstützung: ?rotate=90|180|270 → CSS-Transform am Wurzel-
   Element. So lässt sich derselbe Pi mit derselben URL um 90° rotieren,
   ohne im OS herumzuschrauben (xrandr-Pendant einfach im Browser). */
body.rotate-90  { transform: rotate(90deg);  transform-origin: 50vh 50vh; width: 100vh; height: 100vw; }
body.rotate-180 { transform: rotate(180deg); }
body.rotate-270 { transform: rotate(270deg); transform-origin: 50vh 50vh; width: 100vh; height: 100vw; }

header.bar {
  display: flex; align-items: baseline; gap: 2vw;
  padding: 1.2vh 3vw; flex: 0 0 auto;
  background: linear-gradient(180deg, #141f33, #1c2942);
  border-bottom: .3vh solid #334155;
}
/* Sponsor-Leiste: Turnierlogo + 1–2 kleine Werbebilder, rechts außen. Weißer
   Grund, damit Logos auf beliebigem Motiv sauber sitzen. Leer, wenn nichts
   markiert/hinterlegt ist. */
header.bar .sponsor-bar { margin-left: auto; display: flex; align-items: center; gap: 1.2vw; }
header.bar .sponsor-bar img {
  height: 6vh; width: auto; max-width: 20vw; object-fit: contain;
  background: #fff; border-radius: .6vh; padding: .5vh;
}
header.bar .live-dot {
  width: 1.4vmin; height: 1.4vmin; border-radius: 50%;
  background: #f43f5e; box-shadow: 0 0 1.5vmin #f43f5e;
  animation: live-pulse 1.6s ease-in-out infinite;
  align-self: center;
}
@keyframes live-pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
header.bar .title {
  flex: 0 0 auto; font-size: 3.6vmin; font-weight: 800;
  letter-spacing: .02em; color: #fbbf24; text-transform: uppercase;
}
/* Hallenname direkt hinter dem Titel (spart die separate Zeile im Body). */
header.bar .bar-hall {
  flex: 0 0 auto; font-size: 3vmin; font-weight: 700; color: #e2e8f0;
  letter-spacing: .02em; text-transform: uppercase;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
header.bar .bar-hall:empty { display: none; }
header.bar .bar-hall:not(:empty)::before {
  content: "·"; margin-right: 1.6vw; color: #64748b; font-weight: 800;
}
header.bar .tournament {
  flex: 1 1 auto; font-size: 3vmin; font-weight: 600; color: #cbd5e1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

main {
  flex: 1 1 auto; min-height: 0; overflow: hidden;
  padding: 2vh 2vw; display: flex; flex-direction: column; gap: 1.5vh;
}

/* Court-Grid: Spaltenzahl wird per JS gesetzt (dynamisch nach Feldzahl),
   die Zeilen teilen sich die Höhe gleichmäßig (grid-auto-rows: 1fr) →
   wenige Felder = große Kacheln, die den Schirm füllen. */
.courts {
  display: grid; gap: 1.4vh 1.6vw;
  /* minmax(0,1fr) statt 1fr: ein nacktes 1fr ist implizit minmax(auto,1fr) →
     hohe Kacheln (gestapelte Doppel) wachsen über ihren Anteil und das Grid
     läuft unten aus dem Bild. minmax(0,…) zwingt gleiche Höhenteilung; der
     Kachel-`overflow:hidden` clippt im Notfall statt nach unten zu schieben. */
  grid-auto-rows: minmax(0, 1fr); flex: 1 1 auto; min-height: 0;
}
.court {
  background: linear-gradient(180deg, #1a2842, #0f1a30);
  border: .25vmin solid #334155; border-radius: 1.4vmin;
  padding: 1.6vh 1.8vw; display: flex; flex-direction: column;
  gap: 1vh; min-height: 0; overflow: hidden;
}
.court.empty { opacity: .55; }
.court.live  { border-color: #1f6f4a; }
.court.pause { border-color: #b08400; }
.court__head {
  display: flex; align-items: center; gap: 1.2vw; flex: 0 0 auto;
}
.court__name {
  font-size: 5vmin; font-weight: 900; color: #fbbf24; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.court__status {
  font-size: 2.6vmin; font-weight: 700; color: #64748b;
  text-transform: uppercase; letter-spacing: .04em;
}
.court__status.live { color: #34d399; }
.court__status.pause { color: #fbbf24; }
.court__discipline {
  margin-left: auto; font-size: 2.6vmin; font-weight: 700; color: #94a3b8;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Aufruf-Uhr in der Wartephase (Plan 4): Minuten seit 1. Aufruf + Ampel.
   Ampelfarben wie die Einzelanzeige: ok neutral, warn gelb, due rot. */
.callchip {
  align-self: flex-start; margin: .4vh 0 0; padding: .3vh 1.4vw;
  border-radius: 1vmin; font-size: 2.4vmin; font-weight: 800;
  white-space: nowrap; letter-spacing: .01em;
  background: rgba(148,163,184,.16); color: #cbd5e1;
}
.callchip.warn { background: rgba(251,191,36,.18); color: #fde68a; }
.callchip.due  { background: rgba(244,63,94,.20); color: #fda4af; }

/* Teams + Sätze: Name(n) links, Satzstand rechts gross. */
.teams {
  display: flex; flex-direction: column; gap: .6vh;
  flex: 1 1 auto; justify-content: center; min-height: 0; overflow: hidden;
}
.trow { display: flex; align-items: center; gap: 1.2vw; min-width: 0; }
/* Bei Doppel stehen die beiden Partner UNTEREINANDER (je eigene Zeile mit
   Flagge + Name) – sonst teilen sie sich eine Zeile und werden abgeschnitten.
   Bei Einzel ist es einfach eine einzelne Zeile. */
.trow__names {
  flex: 1 1 auto; min-width: 0;
  display: flex; flex-direction: column; gap: .3vh;
  font-size: 2.9vmin; font-weight: 700; color: #e2e8f0;
}
.trow.winner .trow__names { color: #34d399; }
.trow__names .pl {
  display: flex; align-items: center; gap: .8vw; min-width: 0;
  line-height: 1.15;
}
/* Feste Flaggen-Box, damit die Namen der Partner bündig untereinander stehen –
   auch wenn ein Spieler keine Nationalität/Flagge hat (dann unsichtbar, aber
   Platz bleibt reserviert). */
.trow__names .flag {
  flex: 0 0 auto; width: 3.6vmin; height: 2.7vmin; object-fit: contain;
  border-radius: .3vh; box-shadow: 0 0 .4vh rgba(0,0,0,.5);
}
.trow__names .flag.hidden { visibility: hidden; box-shadow: none; }
.trow__names .nm {
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* Setzplatz [1]/[3/4] hinter dem letzten Spieler (Spec setzplaetze-anzeigen):
   wird nie gekürzt — bei langen Namen weicht zuerst der Name. */
.trow__names .seed {
  flex: 0 0 auto; white-space: nowrap; color: #94a3b8; font-weight: 600;
}
.trow__sets { flex: 0 0 auto; display: flex; gap: 1vw; font-variant-numeric: tabular-nums; }
.sset {
  min-width: 1.6ch; text-align: center;
  font-size: 4.4vmin; font-weight: 900; color: #64748b; line-height: 1;
}
.sset.won { color: #f8fafc; }
.sset.current { color: #fbbf24; }

.idle {
  height: 100%; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3vh;
  color: #94a3b8; text-align: center; padding: 6vmin;
}
.idle h1 { font-size: 6vmin; color: #fbbf24; margin: 0; }
.idle p { font-size: 3vmin; max-width: 70vw; line-height: 1.4; }

#offline {
  position: fixed; top: 1vh; right: 2vw;
  background: rgba(244,63,94,.18); color: #fda4af;
  border: .2vmin solid #b91c1c; border-radius: 1vmin;
  padding: .5vh 1.4vw; font-size: 2.4vmin; font-weight: 700;
  display: none;
}
#offline.show { display: block; }

/* ─── Identifizieren-Overlay (Fernbefehl) — wie monitor.html ─────────── */
#identify-overlay {
  position: fixed; inset: 0; display: none; z-index: 100;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 2vh; background: #fbbf24; color: #1a1206;
  animation: identify-flash 1s ease-in-out infinite;
}
#identify-overlay.show { display: flex; }
@keyframes identify-flash { 0%, 100% { opacity: 1; } 50% { opacity: .65; } }
#identify-overlay .i-code {
  font-size: 26vmin; font-weight: 900; line-height: 1; letter-spacing: .08em;
}
#identify-overlay .i-court { font-size: 7vmin; font-weight: 800; }
</style>
</head>
<body>
<header class="bar">
  <span class="live-dot" aria-hidden="true"></span>
  <span class="title">Court-Übersicht</span>
  <span class="bar-hall" id="bar-hall"></span>
  <span class="tournament" id="t-name"></span>
  <span class="sponsor-bar" id="sponsor-bar"></span>
</header>
<main id="board"></main>
<div id="offline">Keine Verbindung zum Turnier-PC</div>
<div id="identify-overlay">
  <div class="i-code" id="identify-code">····</div>
  <div class="i-court" id="identify-court">Übersicht</div>
</div>

<script>
(function () {
  'use strict';

  // ── Konfiguration aus URL-Parametern ────────────────────────────────
  var params = new URLSearchParams(location.search);

  // Basis-Pfad aus dem eigenen URL: LAN "/", Cloud "/bts-relay/{ns}/". Die
  // Seite wird unter "<BASE>info/overview" ausgeliefert; alle Fetches/Flaggen/
  // Umleitungen laufen darüber, damit sie im Cloud unter dem Namespace-Präfix
  // landen (kein absolutes "/…" → 404).
  var BASE = location.pathname.replace(/info\/overview\/?$/, '');

  // Rotation: ?rotate=0|90|180|270 — body bekommt CSS-Klasse rotate-<n>.
  // Damit lässt sich ein Pivot-Monitor ohne OS-Eingriff drehen.
  var rotate = (params.get('rotate') || '0').replace(/[^0-9]/g, '');
  if (rotate === '90' || rotate === '180' || rotate === '270') {
    document.body.classList.add('rotate-' + rotate);
  }

  // Geräte-Code aus dem URL-Parameter (bts-monitor.sh haengt ihn an):
  // ?device=<8 chars>. Wenn gesetzt, pollen wir periodisch
  // /monitor/state, um Reassignment (Info→Court oder Info→anderes-Info)
  // zu erkennen und uns selbst umzuleiten.
  var deviceId = (params.get('device') || '').trim();

  // ── Diagnose-Mini-Logger ──────────────────────────────────────────────
  // Wie combo.html: JS-Fehler + Schlüsselereignisse best-effort an /pi-log
  // (lokal + Cloud, Datei mon-<device>.log). Nur LAN; Cloud-Modus scheitert still.
  var MLOG = [], MLOG_MAX = 200;
  function mlog(level, event, detail) {
    var e = { t: Date.now(), level: level, event: event };
    if (detail !== undefined) e.d = detail;
    MLOG.push(e); while (MLOG.length > MLOG_MAX) MLOG.shift();
    try { console.log('[' + new Date(e.t).toISOString() + '] ' + level + ' ' + event, detail || ''); } catch (x) {}
  }
  function mlogDevice() {
    var id = (deviceId || '').replace(/[^a-z0-9_-]/gi, '').slice(0, 56);
    return 'mon-' + (id || 'unbekannt');
  }
  function uploadMonitorLog() {
    try {
      var body = 'Monitor overview · device=' + mlogDevice() + '\nUA: ' + navigator.userAgent
        + '\nGeneriert: ' + new Date().toISOString() + '\n\n'
        + MLOG.map(function (e) {
            return '[' + new Date(e.t).toISOString() + '] ' + e.level + ' ' + e.event
              + (e.d !== undefined ? ' ' + JSON.stringify(e.d) : '');
          }).join('\n') + '\n';
      fetch(BASE + 'pi-log?device=' + encodeURIComponent(mlogDevice()), {
        method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: body, keepalive: true,
      }).catch(function () {});
    } catch (x) {}
  }
  window.addEventListener('error', function (ev) {
    try { mlog('error', 'js_error', { msg: String((ev && ev.message) || ev), src: (ev && ev.filename) || '', line: (ev && ev.lineno) || 0 }); uploadMonitorLog(); } catch (x) {}
  });
  window.addEventListener('unhandledrejection', function (ev) {
    try { var r = ev && ev.reason; mlog('error', 'unhandled_rejection', { msg: r != null ? (r.message || String(r)) : 'unknown' }); uploadMonitorLog(); } catch (x) {}
  });
  window.addEventListener('pagehide', uploadMonitorLog);
  mlog('info', 'monitor_boot', {});

  // Hallen-Filter: ?halle=<Name> — wie bei badhub/live, zeigt nur Felder
  // dieser Halle. Vergleich getrimmt + case-insensitiv. Ist er gesetzt, zeigt
  // dieser Monitor fest genau diese Halle (keine Rotation).
  var hallFilter = (params.get('halle') || '').trim();
  function hallKey(name) {
    return (name == null ? '' : String(name)).trim().toLowerCase();
  }

  // Auto-Rotation: erkennt der Monitor MEHRERE Hallen und ist KEIN ?halle=
  // gesetzt, zeigt er jede Halle nacheinander im Vollbild (statt alle
  // gestapelt zu quetschen). Intervall via ?hallSeconds=<n> (Default 12,
  // min 3). Eigener Param – nicht der Pivot-`rotate` oben.
  var hallSeconds = parseInt(params.get('hallSeconds'), 10);
  if (!hallSeconds || hallSeconds < 3) hallSeconds = 12;
  var lastData = null; // letzte Daten, damit der Rotations-Timer neu rendern kann
  var hallIdx = 0; // aktuell gezeigte Halle (Index in der Hallen-Liste)
  var hallTimer = null;
  // Aufruf-Timer: Server-Zeit + Config aus dem letzten /health-Poll (Plan 4),
  // damit renderCourt „Zeit seit Aufruf" relativ zur Server-Uhr rechnen kann.
  //
  // Gemerkt wird der **Versatz** zur eigenen Uhr, nicht der Zeitpunkt: Seit
  // dem Antwortcache (Spec monitor-livestand-push, S1) beantwortet der Server
  // einen unveränderten Stand mit einer leeren Bestätigung — dann kommt keine
  // neue Server-Zeit, und eine gemerkte Uhrzeit stünde still. Der Versatz
  // dagegen bleibt gültig; die Uhr läuft aus der lokalen Zeit weiter und
  // bleibt trotzdem an der Server-Uhr ausgerichtet (gegen Geräte-Drift).
  var callOffset = 0;
  function serverJetzt() { return Date.now() + callOffset; }
  var callTimer = null;

  // Anzeige-Cap bei sehr großen Turnieren (sollte nicht greifen, dient
  // nur als Sicherheit gegen pathologische Daten).
  var MAX_COURTS = 64;

  // ── DOM-Helfer ──────────────────────────────────────────────────────
  function h(tag, cls, text) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text != null) el.textContent = text;
    return el;
  }

  function setStatus(text, cssClass) {
    var el = h('span', 'court__status' + (cssClass ? ' ' + cssClass : ''), text);
    return el;
  }

  // Gruppiert Courts nach Halle. Reihenfolge nach erstem Vorkommen.
  // Felder ohne Halle landen in einer Restgruppe (ohne Überschrift).
  function groupByHall(courts) {
    var groups = []; var byKey = {};
    courts.forEach(function (c) {
      var key = hallKey(c.location);
      if (!byKey[key]) { byKey[key] = { name: c.location || '', courts: [] }; groups.push(byKey[key]); }
      byKey[key].courts.push(c);
    });
    return groups;
  }

  // Flaggen-IMG aus IOC-3-Nationalität; unbekannt/leer → versteckt.
  function flagEl(nat) {
    var img = document.createElement('img');
    img.className = 'flag';
    var code = (nat || '').trim().toUpperCase();
    if (code) {
      img.src = BASE + 'flags/' + encodeURIComponent(code) + '.svg';
      img.onerror = function () { img.classList.add('hidden'); };
    } else {
      img.classList.add('hidden');
    }
    return img;
  }

  function setVal(s, idx) {
    if (Array.isArray(s)) return s[idx] != null ? s[idx] : 0;
    return idx === 0
      ? (s.a != null ? s.a : (s[0] != null ? s[0] : 0))
      : (s.b != null ? s.b : (s[1] != null ? s[1] : 0));
  }

  // „Zeit seit Aufruf"-Chip (Plan 4): hochzählende Minuten seit dem 1. Aufruf
  // + Ampel (1. → 2. → Letzter Aufruf) wie auf der Einzelanzeige. Nur solange
  // das Spiel aufgerufen, aber NOCH NICHT am Zählen ist (Wartephase) — sonst
  // würde ein Board voller laufender Spiele nach 4 min komplett rot; der
  // laufende Satzstand ist dann ohnehin der Status. Leer, wenn Timer aus/
  // keine Aufrufzeit.
  function callChip(c) {
    if (!callTimer || !callTimer.enabled) return null;
    if (typeof c.on_court_since_ms !== 'number' || c.on_court_since_ms <= 0) return null;
    var sec = Math.max(0, Math.floor((serverJetzt() - c.on_court_since_ms) / 1000));
    var min = sec / 60;
    var label = '1. Aufruf', tone = 'ok';
    if (typeof callTimer.thirdCallMinutes === 'number' && callTimer.thirdCallMinutes > 0
        && min >= callTimer.thirdCallMinutes) {
      label = 'Letzter Aufruf'; tone = 'due';
    } else if (typeof callTimer.secondCallMinutes === 'number' && callTimer.secondCallMinutes > 0
        && min >= callTimer.secondCallMinutes) {
      label = '2. Aufruf'; tone = 'warn';
    }
    var mins = Math.floor(min);
    var txt = (mins < 1 ? 'gerade aufgerufen' : 'vor ' + mins + ' min') + ' · ' + label;
    return h('span', 'callchip ' + tone, txt);
  }

  // Spielt das Feld schon (Punkte gefallen oder Aufschläger bekannt)? Dann ist
  // es keine Wartephase mehr → kein Aufruf-Chip.
  function hasStarted(c) {
    if (c.serving_team && c.serving_team > 0) return true;
    var sets = Array.isArray(c.sets) ? c.sets : [];
    return sets.some(function (s) { return (setVal(s, 0) + setVal(s, 1)) > 0; });
  }

  /** Die Satzstand-Spalte einer Mannschaft. Eigene Funktion, weil der
   *  Teil-Patch (Spec monitor-livestand-push, S5) genau sie erneuert —
   *  Aufbau und Nachbesserung müssen dasselbe Ergebnis liefern, sonst
   *  unterschiede sich eine gepatchte Karte von einer frisch gebauten. */
  function satzSpalte(c, selfIdx, otherIdx) {
    var sets = Array.isArray(c.sets) ? c.sets : [];
    var lastIdx = sets.length - 1;
    var running = !(c.injury || c.official_call);
    var setsEl = h('div', 'trow__sets');
    sets.forEach(function (s, i) {
      var mine = setVal(s, selfIdx), theirs = setVal(s, otherIdx);
      var cls = 'sset';
      if (i === lastIdx && running) cls += ' current';
      else if (mine > theirs) cls += ' won';
      setsEl.appendChild(h('span', cls, String(mine)));
    });
    return setsEl;
  }

  function renderCourt(c) {
    var card = h('div', 'court');
    var head = h('div', 'court__head');
    head.appendChild(h('span', 'court__name', c.court || ('Feld ' + c.court_id)));

    var isLive = c.match_id && c.match_id > 0 && c.team1 && c.team1.length > 0;
    if (!isLive) {
      card.classList.add('empty');
      head.appendChild(setStatus('frei'));
      card.appendChild(head);
      return card;
    }

    var isPause = !!(c.injury || c.official_call);
    if (c.injury) {
      card.classList.add('pause');
      head.appendChild(setStatus('Behandlung', 'pause'));
    } else if (c.official_call) {
      card.classList.add('pause');
      head.appendChild(setStatus('TL', 'pause'));
    } else {
      card.classList.add('live');
      head.appendChild(setStatus('läuft', 'live'));
    }

    head.appendChild(h('span', 'court__discipline', c.match_name || ''));
    card.appendChild(head);

    // Aufruf-Uhr nur in der Wartephase (aufgerufen, noch nicht am Zählen).
    if (!isPause && !hasStarted(c)) {
      var chip = callChip(c);
      if (chip) card.appendChild(chip);
    }

    // Eine Team-Zeile: bei Doppel die zwei Partner UNTEREINANDER (je Flagge +
    // Name), bei Einzel eine einzelne Zeile; Satzstand rechts.
    function teamRow(names, nats, seed, selfIdx, otherIdx) {
      var row = h('div', 'trow');
      var nameBox = h('div', 'trow__names');
      var list = (names && names.length) ? names : ['—'];
      list.forEach(function (n, i) {
        var pl = h('div', 'pl');
        pl.appendChild(flagEl(nats && nats[i]));
        pl.appendChild(h('span', 'nm', n));
        // Setzplatz einmal je Seite, hinter dem letzten Spieler.
        if (seed && i === list.length - 1) pl.appendChild(h('span', 'seed', '[' + seed + ']'));
        nameBox.appendChild(pl);
      });
      row.appendChild(nameBox);
      row.appendChild(satzSpalte(c, selfIdx, otherIdx));
      return row;
    }

    var teams = h('div', 'teams');
    teams.appendChild(teamRow(c.team1, c.team1_nationalities, c.team1_seed, 0, 1));
    teams.appendChild(teamRow(c.team2, c.team2_nationalities, c.team2_seed, 1, 0));
    card.appendChild(teams);

    return card;
  }

  function renderIdle(msg) {
    var idle = h('div', 'idle');
    idle.appendChild(h('h1', null, 'Court-Übersicht'));
    idle.appendChild(h('p', null, msg || 'Warten auf Turnier-Daten…'));
    return idle;
  }

  // Court-Grid einer Halle (dynamische Spaltenzahl).
  function buildGrid(g) {
    var grid = h('div', 'courts');
    // Dynamische Spaltenzahl: wenige Felder → wenige Spalten → grosse Kacheln,
    // die (zusammen mit grid-auto-rows:minmax(0,1fr)) den Schirm füllen.
    grid.style.gridTemplateColumns = 'repeat(' + gridColsFor(g.courts.length) + ', 1fr)';
    g.courts.forEach(function (c) {
      var karte = renderCourt(c);
      // Karte je Feld merken (Spec monitor-livestand-push, S5): Der
      // Teil-Patch bessert später genau diese Elemente nach, statt das
      // Brett neu zu bauen.
      kartenNachFeld[c.court_id] = karte;
      grid.appendChild(karte);
    });
    return grid;
  }

  // Eine Halle als Vollbild-Section: Kopf (Name [+ Zyklus „1 / N"]) + Grid.
  // Hallenname (+ Zyklus „1 / N" bei Rotation) in die Kopfzeile schreiben –
  // statt einer eigenen Zeile im Body (spart vertikalen Platz).
  function setBarHall(name, idx, total, color) {
    var el = document.getElementById('bar-hall');
    if (!el) return;
    el.textContent = '';
    if (!name) return;
    // Hallen-Farbmarke (Spec hallen-farben): kleiner Punkt vor dem Namen.
    // Strikte #rrggbb-Form erzwingen — der Wert landet in einem Style.
    if (color && /^#[0-9a-f]{6}$/.test(color)) {
      var dot = document.createElement('span');
      dot.setAttribute('aria-hidden', 'true');

      el.appendChild(dot);

    el.appendChild(document.createTextNode(
      total > 1 ? (name + '  ' + (idx + 1) + ' / ' + total) : name));
  }

  // Farbe einer Hallen-Gruppe: vom ersten Feld, das eine trägt (alle Felder
  // einer Halle tragen dieselbe; alte Hosts liefern keine → undefined).
  function groupColor(g) {
    for (var i = 0; i < g.courts.length; i++) {
      if (g.courts[i].hall_color) return g.courts[i].hall_color;
    }
    return '';
  }

  function stopHallRotation() {
    if (hallTimer) { clearInterval(hallTimer); hallTimer = null; }
    hallIdx = 0;
  }
  function startHallRotation() {
    if (hallTimer) return; // läuft bereits
    hallTimer = setInterval(function () {
      hallIdx += 1; // render() nimmt modulo der aktuellen Hallenzahl
      // Voll-Render: Die Rotation tauscht die gezeigte Halle komplett aus.
      // (Die Sicht-Signatur erkennt das ohnehin — hier ausdrücklich, damit
      // es beim nächsten Umbau nicht stillschweigend verloren geht.)
      render(lastData, true);

  }

  /** Abschaltbare Render-Messung (Spec monitor-livestand-push, S0 c).

   *  ein 2-s-Render, hier bis zu vier je Sekunde — eine Zeile je Render wäre
   *  in einem Messlauf nicht auswertbar. Die Sammelzeile hat denselben Takt
   *  wie die Perf-Zeile des Servers und lässt sich direkt danebenlegen.

   *  länger als ein 60-Hz-Bild dauert, hat auf dem Pi eines verschluckt. */

    if (jetzt - messSeit < 10000) return;
    console.log('[ov] ' + messZahl + ' Renders in ' + ((jetzt - messSeit) / 1000).toFixed(0)
      + ' s (' + (messZahl / ((jetzt - messSeit) / 1000)).toFixed(1) + '/s), Ø '
      + (messSumme / messZahl).toFixed(1) + ' ms, max ' + messMax.toFixed(1)
      + ' ms, ' + messUeber16 + ' über 16 ms');
    messZahl = 0; messSumme = 0; messMax = 0; messUeber16 = 0; messSeit = jetzt;
  }

  // ── Teil-Patch statt Board-Neuaufbau (Spec monitor-livestand-push, S5) ──
  //
  // Bis hierher warf jeder eintreffende Stand das komplette Board weg und
  // baute es neu — bei zwanzig Feldern rund siebzig Mal je Sekunde ein
  // voller DOM-Neuaufbau auf jedem Pi, für eine Änderung von zwei Ziffern.
  var kartenNachFeld = {};        // court_id → Karten-Element des letzten Baus

  var letzteSicht = '';           // Anordnung, die gerade auf dem Schirm steht
  var VOLL_RENDER_SPAETESTENS_MS = 30000;

  /** Darf die Karte dieses Felds nachgebessert werden?
   *
   *  **Inline-Kopie von `src/io/courtPatch.mjs`** — dort steht die
   *  kanonische Fassung samt Test (`scripts/test-court-patch.mjs`, eigener
   *  CI-Schritt). Änderungen hier und dort gemeinsam.
   *
   *  Die Regel ist bewusst streng: Gepatcht wird nur der Normalfall, ein
   *  gezählter Punkt im laufenden Satz. Ein zu vorsichtiges „nein" kostet
   *  einen Neubau, den es vorher ohnehin gab; ein zu großzügiges „ja"
   *  hinterlässt eine Karte, die dauerhaft etwas Falsches zeigt. */
  function istPatchbar(vorher, nachher, brettGleich, timer) {
    if (!brettGleich || !vorher || !nachher) return false;
    if (vorher.court_id !== nachher.court_id) return false;
    // Beschriftung, Halle und Farbe gelten für freie wie belegte Karten.
    if ((vorher.court || '') !== (nachher.court || '')) return false;
    if ((vorher.location || '') !== (nachher.location || '')) return false;
    if ((vorher.hall_color || '') !== (nachher.hall_color || '')) return false;
    if ((vorher.match_id || 0) !== (nachher.match_id || 0)) return false;
    var liveV = istLiveFeld(vorher), liveN = istLiveFeld(nachher);
    if (liveV !== liveN) return false;
    // Ein durchgehend freies Feld ist patchbar — es gibt nichts zu tun.
    // Stünde hier `false`, wäre die ganze Etappe wirkungslos: Die Übersicht
    // listet ALLE Felder, in jeder Halle ist ständig eines zwischen zwei
    // Spielen, und ein einziges „nein" zwingt das ganze Brett in den Neubau.
    if (!liveN) return true;
    if (!!vorher.injury !== !!nachher.injury) return false;
    if (!!vorher.official_call !== !!nachher.official_call) return false;
    var satzZahl = function (c) { return Array.isArray(c.sets) ? c.sets.length : 0; };
    if (satzZahl(vorher) !== satzZahl(nachher)) return false;
    if (uhrSichtbar(vorher, timer) !== uhrSichtbar(nachher, timer)) return false;
    if ((vorher.match_name || '') !== (nachher.match_name || '')) return false;
    if (!listeGleich(vorher.team1, nachher.team1)) return false;
    if (!listeGleich(vorher.team2, nachher.team2)) return false;
    if (!listeGleich(vorher.team1_nationalities, nachher.team1_nationalities)) return false;
    if (!listeGleich(vorher.team2_nationalities, nachher.team2_nationalities)) return false;
    if ((vorher.team1_seed || '') !== (nachher.team1_seed || '')) return false;
    if ((vorher.team2_seed || '') !== (nachher.team2_seed || '')) return false;

  /** Hat sich am Satzstand etwas geändert? Nur dann muss die Karte angefasst
   *  werden — sonst tauschte ein Punkt auf Feld 3 die Ziffern ALLER Felder
   *  aus und gäbe einen großen Teil der Ersparnis wieder her. */

    var a = Array.isArray(vorher && vorher.sets) ? vorher.sets : [];
    var b = Array.isArray(nachher && nachher.sets) ? nachher.sets : [];

    for (var i = 0; i < a.length; i++) {

      if (setVal(a[i], 1) !== setVal(b[i], 1)) return false;

    if (!timer || !timer.enabled) return false;
    if (!c || typeof c.on_court_since_ms !== 'number' || c.on_court_since_ms <= 0) return false;

   *  Patch das Umschalten der Halle für „nichts geändert".

    var felder = list.map(function (c) { return c.court_id + ':' + (c.location || ''); }).join('|');

  /** Die Satzstände der **gezeigten** Felder erneuern, soweit sie sich
   *  geändert haben. Gibt `false` zurück, wenn eine Karte nicht (mehr) im
   *  Dokument steht — dann baut der Aufrufer neu.

    var ids = Object.keys(kartenNachFeld);

      if (!istLiveFeld(c)) continue;     // freie Karte hat keine Satz-Zeilen
      var karte = kartenNachFeld[ids[i]];
      if (!karte || !karte.isConnected) return false;
      var zeilen = karte.querySelectorAll('.trow');
      if (zeilen.length !== 2) return false;
      for (var t = 0; t < 2; t++) {

        if (!alt) return false;

      }

    return true;
  }

  /** `voll = true` erzwingt den Neubau — für Aufrufer, die etwas anderes als
   *  die Satzstände ändern (der Sekundentakt der Aufruf-Uhr). */
  function render(data, voll) {

    // mehreren Stellen zurück (Leerstand, Hallen-Rotation), eine Messung im
    // Rumpf träfe deshalb nur einen Teil der Fälle.
    if (renderMessen === '0') return renderMitPatch(data, voll);
    var start = performance.now();
    try { return renderMitPatch(data, voll); }
    finally { messVermerken(performance.now() - start); }
  }

  /** Nachbessern, wo es reicht — sonst neu bauen. */
  function renderMitPatch(data, voll) {
    var jetzt = Date.now();
    var alt = lastData;
    var neueCourts = Array.isArray(data && data.courts) ? data.courts : [];
    var alteCourts = Array.isArray(alt && alt.courts) ? alt.courts : [];
    // Zwangs-Neubau spätestens alle 30 s: Der Patch fasst nur die Ziffern an;
    // hat sich unbemerkt etwas anderes verschoben (fehlende Karte, Fehler in
    // der Regel), heilt sich die Anzeige so von selbst, statt bis zum
    // nächsten Match-Wechsel falsch zu bleiben.
    var faellig = voll || jetzt - letzterVollRender >= VOLL_RENDER_SPAETESTENS_MS;
    var timer = (data && data.callTimer) || null;
    // Gegen die Sicht des letzten BAUS vergleichen, nicht gegen eine frisch
    // gebildete: Beim Umschalten der Hallen-Rotation sind die Felder
    // dieselben, nur `hallIdx` ist weiter — würden beide Signaturen jetzt
    // gebildet, wären sie gleich und die Rotation bliebe stehen.
    var jetztSicht = sichtSignatur(neueCourts);
    var brettGleich = letzteSicht !== '' && letzteSicht === jetztSicht
      && alteCourts.length > 0

      && JSON.stringify((alt && alt.callTimer) || null) === JSON.stringify(timer);

    if (!faellig && brettGleich) {
      var alteNachFeld = {}, neueNachFeld = {};
      alteCourts.forEach(function (c) { alteNachFeld[c.court_id] = c; });
      neueCourts.forEach(function (c) { neueNachFeld[c.court_id] = c; });
      // Geprüft wird nur, was auch auf dem Schirm steht — bei Rotation oder
      // `?halle=` ist das eine Teilmenge.
      var gezeigt = Object.keys(kartenNachFeld);
      var allePatchbar = gezeigt.length > 0 && gezeigt.every(function (id) {

      // nichts zu tun (etwa ein Anstoß, der nur eine Meldung betraf).
      var etwasNeu = gezeigt.some(function (id) {
        return !satzstandGleich(alteNachFeld[id], neueNachFeld[id]);
      });
      if (allePatchbar && (!etwasNeu || patcheKarten(neueNachFeld))) {
        // `lastData` fortschreiben, auch wenn nicht neu gebaut wurde: Die

        lastData = data;
        return;

    kartenNachFeld = {};
    renderIntern(data);
    // **Nach** dem Bauen: `renderIntern` kann `stopHallRotation()` aufrufen
    // und dabei `hallIdx` zurücksetzen. Vorher gemerkt, beschriebe der
    // Schlüssel eine Sicht, die so nie gezeichnet wurde — und der nächste
    // unveränderte Abruf löste einen überflüssigen Neubau aus
    // (Review-Fund 19.08.2026).
    letzteSicht = sichtSignatur(neueCourts);

  function renderIntern(data) {

    // Antwort: `render` läuft auch mit gemerkten Daten (Hallen-Rotation,
    // Uhr-Takt), und deren `serverNowMs` ist dann längst alt — der Versatz
    // liefe mit jedem solchen Render weiter zurück.
    callTimer = (data && data.callTimer) || null;
    var board = document.getElementById('board');
    board.textContent = '';

    var courts = Array.isArray(data && data.courts) ? data.courts.slice(0, MAX_COURTS) : [];

    if (hallFilter) {
      var wanted = hallKey(hallFilter);
      var matched = courts.filter(function (c) { return hallKey(c.location) === wanted; });
      if (matched.length > 0) courts = matched;
    }

    if (courts.length === 0) {
      stopHallRotation();
      setBarHall('');
      board.appendChild(renderIdle('Noch keine Felder aktiv. Sobald der Liveticker läuft, erscheinen sie hier.'));
      return;
    }

    // Mehrere benannte Hallen UND kein fester ?halle=-Filter → Auto-Rotation:
    // immer nur EINE Halle im Vollbild, zyklisch durchgewechselt.
    var rotating = !hallFilter && groups.filter(function (g) { return g.name; }).length >= 2;

    if (rotating) {
      var idx = hallIdx % groups.length;
      var g = groups[idx];
      setBarHall(g.name, idx, groups.length, groupColor(g)); // Name + „1 / N" in die Kopfzeile
      board.appendChild(buildGrid(g));
      startHallRotation();
      return;
    }

    // Eine (ggf. gefilterte) Halle im Vollbild: Name in die Kopfzeile, nur das
    // Grid in den Body. Bei genau einer Halle der Normalfall; ein gemischter
    // Mehr-Gruppen-Fall (benannt + unbenannt) fällt auf gestapelte Grids zurück.
    stopHallRotation();
    if (groups.length === 1) {
      setBarHall(groups[0].name || '', 0, 1, groupColor(groups[0]));
      board.appendChild(buildGrid(groups[0]));

  // Spaltenzahl je Feldanzahl: 1→1, 2→2, 3-4→2, 5-6→3, 7-9→3, mehr→4.
  // ceil(sqrt(n)) ergibt ein ausgewogenes, möglichst quadratisches Raster.
  function gridColsFor(n) {
    if (n <= 1) return 1;
    return Math.min(4, Math.ceil(Math.sqrt(n)));
  }

  // minutenlang OPEN, ohne dass je etwas ankommt.
  //

  // zehn Sekunden.
  //

  /** Soll ein eintreffender Stand angewendet werden? (Spec

  /** Steht die Anzeige still, ohne es zu merken?

    var gezeigt = Number.isFinite(gezeigtSeq) ? gezeigtSeq : 0;

    if (neu <= 0) return true;
    if (gezeigt <= 0) return true;
    return quelle === 'push' ? neu > gezeigt : neu >= gezeigt;
  }

  function showOffline(show) {
    var el = document.getElementById('offline');
    if (el) el.classList.toggle('show', !!show);
  }

  // Reassignment-Check: alle 30 s gegen /monitor/state pruefen, ob das
  // Geraet inzwischen einem anderen Target zugewiesen ist. Wenn ja:
  // selbst umleiten (zurueck auf /monitor fuer ein Feld, oder weiter zu
  // /info/preparation etc.).
  // Zeigt diese Seite bereits das vom Server gewünschte Ziel? Vergleich über
  // Pfad + Query (z. B. ?halle=…), aber OHNE die laufzeit-eigenen Parameter
  // `device`/`rotate`/`hallSeconds`. WICHTIG: ein naiver Vergleich gegen
  // location.pathname (ohne Query) würde bei einem ?halle=-Ziel IMMER abweichen
  // → Endlos-Redirect/Flackern (Bug bis v0.9.89).
  function currentUrlMatches(redirectTo) {

      var here = new URL(location.href);

      here.searchParams.delete('rotate');
      here.searchParams.delete('ansage');
      here.searchParams.delete('hallSeconds');

      var sep = href.indexOf('?') >= 0 ? '&' : '?';
      href += sep + 'rotate=' + encodeURIComponent(hereRotate);

    // sonst verstummte ein Pi beim ersten Zielwechsel.
    var hereParams = new URLSearchParams(location.search);
    if (hereParams.has('ansage') && !/[?&]ansage(=|&|$)/.test(href)) {

  // atomaren Schreiben server-seitig).

  // eines Hängers jede Sekunde einen weiteren Abruf auf einer toten
  // Leitung (Review-Fund 08.09.2026).
  var checkLaeuft = false;
  function checkReassignment() {
    if (!deviceId) return;
    if (checkLaeuft) return;
    checkLaeuft = true;
    // `src=check` statt `push`/`poll`: Dieser Abruf ist KEINE Anzeige-
    // Aktualisierung, sondern die sekündliche Frage „bin ich noch diesem
    // Ziel zugewiesen?". Ohne eigene Kennzeichnung liefe er in den
    // Court-Monitor-Zähler und verfälschte die Messung, an der alle
    // Folge-Etappen hängen (Review-Fund 19.08.2026).
    abrufMitFrist(BASE + 'monitor/state?device=' + encodeURIComponent(deviceId) + '&src=check', { cache: 'no-store' }, function (r) { return r.ok ? r.json() : null; })
      .then(function (s) {
        checkLaeuft = false;
        if (!s) return;
        if (s.deviceCode) lastDeviceCode = s.deviceCode;
        // Reihenfolge wie monitor.html: navigieren wir weg, wird KEIN Befehl
        // mehr ausgeführt (sonst würde ein gleichzeitiges „Neu laden" die
        // Navigation abbrechen). Erst Reassignment prüfen + früh raus …

          noRedirectPolls = 0;
          var dest = BASE + String(s.redirectTo).replace(/^\//, '');
          var sep = dest.indexOf('?') >= 0 ? '&' : '?';
          navigateWithRotate(dest + sep + 'device=' + encodeURIComponent(deviceId));
          return;

        if (!s.redirectTo) {

          // damit ein einzelnes transientes Leer-Lesen nicht sofort wegnavigiert.
          if (++noRedirectPolls < DEASSIGN_AFTER) return;
          mlog('info', 'deassign_to_monitor', { polls: noRedirectPolls });
          uploadMonitorLog();
          navigateWithRotate(BASE + 'monitor?device=' + encodeURIComponent(deviceId));
          return;
        }
        noRedirectPolls = 0;
        // … wir bleiben auf dieser Seite → Fernbefehl behandeln. Dieser Poll
        // konsumiert den Command ohnehin; ohne das ginge „Identifizieren"
        // für die Übersicht verloren (der bisherige Bug).
        handleCommand(s.command);

      .catch(function () { checkLaeuft = false; });
  }
  setInterval(checkReassignment, 1000);

  // ─── Fernbefehle (Identifizieren/Neu laden) ──────────────────────────
  // Identische Logik wie monitor.html: der erste Poll setzt nur die Basis
  // (ein offener Command wird nicht nachgeholt), danach wird jeder neue
  // Command genau einmal per id ausgeführt.
  var lastDeviceCode = '';
  var lastCmdId = 0;
  try { lastCmdId = parseInt(localStorage.getItem('bts-monitor-cmd-id') || '0', 10) || 0; }
  catch (e) {}
  var cmdBaselineSet = false;
  var identifyTimer = null;
  function saveCmdId() {
    try { localStorage.setItem('bts-monitor-cmd-id', String(lastCmdId)); } catch (e) {}
  }
  function handleCommand(cmd) {
    var id = (cmd && typeof cmd.id === 'number') ? cmd.id : 0;

  function showIdentify() {

    }
    var ov = document.getElementById('identify-overlay');
    if (!ov) return;
    ov.classList.add('show');
    if (identifyTimer) clearTimeout(identifyTimer);
    identifyTimer = setTimeout(function () { ov.classList.remove('show'); }, 10000);
  }

  // Was den nächsten Abruf ausgelöst hat (Spec monitor-livestand-push, S0).
  // Fallen Nudge und Fallback-Takt zusammen, gewinnt 'push': Der Abruf wäre
  // durch den Nudge ohnehin gekommen, der Takt hat ihn nicht verursacht.
  //
  // Zurückgesetzt wird beim **Start** des Fetchs, nicht an seinem Ende: Trifft
  // ein Nudge WÄHREND eines laufenden Fetchs ein, merkt der In-Flight-Schutz
  // nur einen Nachschlag vor (`refetchQueued`) — und genau dieser Nachschlag
  // ist der vom Nudge verursachte Abruf. Ein Rücksetzen in `pollDone` hätte
  // ihn als 'poll' abgeschickt und damit die Push-Zahl systematisch klein
  // gerechnet (Review-Fund 19.08.2026); bei zwanzig Feldern ist der
  // Nachschlag-Fall der Normalfall, nicht die Ausnahme.
  var naechsteQuelle = 'poll';
  function healthUrl(quelle) {
    // Geraete-ID als Heartbeat-Markierung (v0.9.22) — Server zaehlt
    // den /health-Poll dann als Online-Lebenszeichen.
    var u = deviceId
      ? BASE + 'health?device=' + encodeURIComponent(deviceId)
      : BASE + 'health';
    // `src` trennt in der Messung nudge-getriebene von Fallback-Abrufen.
    return u + (u.indexOf('?') >= 0 ? '&' : '?') + 'src=' + quelle;
  }
  // Der eigentliche Health-Fetch (ohne eigene Terminierung). In-Flight-Schutz:
  // Nudge und Fallback teilen sich diesen Fetch; läuft schon einer, wird EIN
  // Nachschlag gemerkt, damit am Ende sicher der neueste Stand geholt wird.
  // Marke der zuletzt empfangenen Antwort. Damit fragt der Fallback-Poll
  // „hat sich etwas geändert?" statt „gib mir alles" — bei unverändertem
  // Stand kommt eine leere Bestätigung (HTTP 304) statt rund 16 KB
  // (Spec monitor-livestand-push, S1). Der Browser fragt nicht von selbst
  // bedingt nach: `cache: 'no-store'` schaltet seinen eigenen Zwischen-
  // speicher ab, deshalb setzen wir den Kopf hier von Hand.
  var letzteMarke = null;
  // Spätestens jede Minute einmal voll abrufen, auch wenn sich nichts geändert
  // hat. Der Uhr-Versatz (`callOffset`) wird NUR aus einer vollen Antwort
  // gesetzt, und eine ruhige Halle — Rundenpause, Nachtbetrieb, leeres Feld —
  // liefert unbegrenzt lange Bestätigungen. Verstellt sich in dieser Zeit die
  // Uhr des Anzeige-Rechners (ein Pi-Kiosk hat keine gepufferte Uhr, NTP
  // springt nach dem Start um Sekunden bis Stunden), zeigte „Zeit seit
  // Aufruf" bis zur nächsten Inhaltsänderung Unsinn (Review-Fund 19.08.2026).
  //
  // Kosten: ein voller Abruf je Minute statt bis zu 240 — die Ersparnis aus
  // S1/S8 bleibt praktisch vollständig erhalten.
  var MARKE_SPAETESTENS_MS = 60000;
  var markeGesetztAt = 0;
  // Frist des Stand-Abrufs: Kopfzeilen 5 s, Rumpf danach 15 s. Ein Abruf,
  // der weder scheitert noch antwortet, blockierte sonst alle folgenden
  // (Turnier 05./06.09.2026). **Inline-Kopie von `src/io/abrufFrist.mjs`**
  // — dort die kanonische Fassung mit Begründung und Test
  // (`scripts/test-abruf-frist.mjs`, eigener CI-Schritt); hier ohne
  // `fetchFn`-Parameter. Änderungen hier und dort gemeinsam.
  var KOPF_FRIST_MS = 5000, RUMPF_FRIST_MS = 15000;
  function abrufMitFrist(url, opt, lesen) {
    var ctrl = (typeof AbortController === 'function') ? new AbortController() : null;
    var o = Object.assign({}, opt);
    if (ctrl) o.signal = ctrl.signal;
    var timer = null, abgelaufen = false, abbrechen = null;
    var abbruch = new Promise(function (_, reject) {
      abbrechen = function (was) {
        abgelaufen = true;
        if (ctrl) ctrl.abort();
        reject(new Error('Abruf-Frist überschritten (' + was + ')'));

      timer = setTimeout(function () { abbrechen('Kopfzeilen ' + KOPF_FRIST_MS + ' ms'); }, KOPF_FRIST_MS);

      return lesen ? lesen(r) : r;
    });

      function (wert) { clearTimeout(timer); return wert; },
      function (fehler) { clearTimeout(timer); throw fehler; }

  // Ein Abruf ist geglückt — Kopfzeilen UND Rumpf. Ein Ort für beide Zweige
  // (304 und voller Stand), damit die Entwarnung nirgends vor dem Rumpf steht.
  function abrufGeglueckt() {
    errorCount = 0; backoffUntil = 0; showOffline(false);
    lastFetchOk = true;
    letzterAbrufOkMs = Date.now();
  }
  function pollHealth() {
    if (fetching) { refetchQueued = true; return; }

    if (letzteMarke && Date.now() - markeGesetztAt >= MARKE_SPAETESTENS_MS) {

    }

    // der jetzt noch eintrifft, gehört zum NÄCHSTEN Abruf, nicht zu diesem.

        // jeder Antwort den Fehlerzähler zurück, bevor er geworfen wird —

        // zeigte endlos den eingefrorenen Stand (Review-Fund 19.08.2026).

        if (r.status === 304) return { status: 304 };

      })
      .then(function (paket) {

        // Kopfzeilen und der Rumpf liefe in die Frist, stünde der Fehlerzähler

        // Stillstands-Wächter hielte die Abrufe für geglückt.
        abrufGeglueckt();

        }

        // S4). Sie stehen NEBEN der Feld-Liste (`seqs`: CourtID → Zahl),
        // nicht darin — sonst wechselte die Marke der Antwort bei jedem
        // Anstoß und die Bestätigung ohne Nutzdaten wäre wirkungslos.
        //

        // Vorbereitung — und schon jetzt der Grund, warum ein überholter

        });

        // Erst NACH dem Rendern: Wirft `render` (defekte Antwort, kaputtes
        // DOM), zählt der Stand nicht als angekommen — und genau das soll der
        // Wächter dann ja melden.
        letzterStandMs = Date.now();
        // Turniername könnten wir aus health nicht, /api/snapshot wäre besser —
        // erstmal leer lassen, kein Drama für die Funktionalität.
        pollDone();
      })
      .catch(function () {
        errorCount++;
        // Ein EINZIGER Fehlversuch macht den Kanal ungesund und schaltet
        // sofort auf den schnellen Takt zurück (Spec
        // monitor-livestand-push, S6). Lieber ein paar überflüssige Abrufe
        // als eine Anzeige, die einen Ausfall verschläft.
        lastFetchOk = false;

  function pollDone() {

  // langsam. Siehe `pushGesund` oben.
  function pushHealthy() {
    return pushGesund(kanalZustand(), Date.now());
  }
  // Sponsor-Leiste (Turnierlogo + als „in Leiste" markierte Werbebilder) —
  // unabhängig vom Health-Poll, selten aktualisiert (Bilder ändern sich kaum).
  // Fehlt ein Bild, entfernt onerror das <img> (kein kaputtes Motiv).
  (function sponsorBar() {
    var box = document.getElementById('sponsor-bar');
    if (!box) return;
    // Ohne Abgleich auf Unverändertheit — Begründung siehe monitor.html.
    function paint(st) {
      var h = '';

  // ── Poll-Fallback + Monitor-WS-Nudge-Client (A1, ADR 0016) ────────────
  requestPoll();

  // Anzeige, die weiterläuft und trotzdem nichts Neues mehr übernimmt. Sie
  // wirft dabei keinen Fehler und wird nicht geschlossen, fällt also durch

  //

    var jetzt = Date.now();

      startMs: seitStartMs,
      letzterAbrufOkMs: letzterAbrufOkMs,
      letzterStandMs: letzterStandMs,
      gemeldeteArt: gemeldeteStillstandsArt,

      gemeldeteStillstandsArt = lage.art;

      // hat kein zweites Gerät daneben.

        stillMs: lage.stillMs,
        verworfeneNudges: verworfeneNudges,
        bestaetigungen: bestaetigungen,
        wsOpen: mwsOpen,
        frameAltMs: lastServerFrameAt ? jetzt - lastServerFrameAt : null,
        fetchOk: lastFetchOk,
        fehler: errorCount,
        taktMs: fallbackTakt(pushGesund(kanalZustand(), jetzt), langsamErlaubt),

        markeAltMs: markeGesetztAt ? jetzt - markeGesetztAt : null,
      });
      uploadMonitorLog();
    } else if (lage.erholt) {
      gemeldeteStillstandsArt = null;
      mlog('info', 'stillstand_vorbei', { verworfeneNudges: verworfeneNudges });
      uploadMonitorLog();
    }
  }, 10000);
  // Sicherheits-Poll (Spec monitor-livestand-push, S6). Er läuft im
  // 250-ms-Raster und entscheidet bei jedem Tick neu, wie lange die Seite
  // ohne eigenen Abruf auskommen darf:
  //
  // - Kanal **nicht** gesund → 250 ms (wie bisher, viermal je Sekunde).
  // - Kanal gesund, Schalter gesetzt → 4 s.
  // - Kanal gesund, Schalter aus → weiterhin 250 ms.

  // Etappe konnte er pausieren, weil „gesund" an einen Anstoß < 1,2 s hing
  // und damit von selbst kurzlebig war; der Herzschlag hält ihn jetzt
  // dauerhaft. Nicht jede Änderung stößt an: Feld-Beschriftungen,
  // Hallen-Zuordnung und alles aus der Konfiguration (Aufruf-Schwellen,
  // Hallen-Farben) heben nur die Revision. Ohne Abruf bliebe die Tafel
  // darauf stehen (Review-Fund 19.08.2026).
  //
  // Gemessen wird gegen den **tatsächlich letzten Abruf**, nicht gegen einen

  // zusätzlicher Abruf an.
  //
  // Bleibt der Herzschlag länger als 25 s aus, gilt der Kanal als tot: Der
  // Socket wird aktiv geschlossen und der Reconnect geplant. Bewusste Umkehr
  // des früheren „kein Force-Close bei Stille" — das galt nur, weil der
  // schnelle Poll ohnehin alles auffing.
  setInterval(function () {
    var jetzt = Date.now();
    // `|| mwsOffenSeitMs`: Eine Leitung, die seit dem Verbinden NIE etwas

      // nicht tot". Bliebe hier der alte, über 25 s alte Zeitpunkt stehen,
      // erklärte der nächste Tick den eben verbundenen Socket sofort wieder
      // für tot (Review-Fund 19.08.2026). Der Zeitpunkt des Verbindens dient
      // als Ersatz-Bezug, damit eine Leitung, die nie etwas liefert, nicht

      // monitor-livestand-push, S6).

      // Veraltete/doppelte Nudges verwerfen (Spec monitor-livestand-push, S4).
      if (!seqAnwenden(lastSeqByCourt[msg.court] || 0, msg.seq, 'push')) {
        verworfeneNudges++;
        return;

      lastSeqByCourt[msg.court] = msg.seq;

      // Voll-Stand niedrig-latent holen (coalesct).
      naechsteQuelle = 'push';

    mws.onerror = function () { /* onclose folgt und plant den Reconnect */ };
  }

  // schwarzlochender Socket hängt danach bis zum Handshake-Timeout des
  // Browsers in CLOSING, und der Wächter unten verbindet nur bei CLOSED neu.
  // Deshalb hängen wir die Ereignisse ab, geben die Referenz frei und planen
  // den Reconnect selbst — sonst meldete das späte `onclose` des alten
  // Sockets `mwsOpen = false` für den längst neuen.
  function mwsTrennen() {
    var alt = mws;
    mws = null;
    mwsOpen = false;
    if (alt) {
      alt.onopen = null; alt.onmessage = null; alt.onclose = null; alt.onerror = null;
      try { alt.close(); } catch (e) { /* egal, die Referenz ist weg */ }
    }
    lastServerFrameAt = 0;
    mwsOffenSeitMs = 0;
    mwsSchedule();
  }
  function mwsSchedule() {
    // Exponentielles Backoff – schont im Cloud-Modus den Relay, wenn noch kein
    // Host verbunden ist (Namespace existiert dann nicht → sofortiger Close).
    // Der Poll-Fallback überbrückt die Zeit bis zum Host.
    mwsNextAt = Date.now() + mwsBackoff;
    mwsBackoff = Math.min(MWS_BACKOFF_MAX, mwsBackoff * 2);
  }
  // Watchdog: einziger Reconnect-Treiber (Muster aus tablet.html). Verbindet
  // neu, sobald der Socket fehlt/geschlossen ist und das Backoff-Fenster
  // abgelaufen ist. Den Force-Close bei ausbleibendem Herzschlag erledigt
  // seit S6 `mwsTrennen()` im Sicherheits-Poll oben — es setzt `mws` auf
  // null, sodass hier sofort der `!mws`-Zweig greift.
  setInterval(function () {
    if ((!mws || mws.readyState === WebSocket.CLOSED) && Date.now() >= mwsNextAt) {
      mwsConnect();
    }
  }, 2000);
  mwsConnect();
})();

<script>
/* Ansage-Modus (Spec docs/features/ansage-im-browser.md, Etappe E1b):

   den Markern hält scripts/test-ansage-kern.mjs wortgleich zu src/io/. */

 *  Seite, die offline war, spricht beim Wiederkommen nichts nach. */
const ANSAGE_VERFALL_MS = 60000;

 *  Fassung des Turnier-PCs) wird übersprungen. */
const ANSAGE_ARTEN = [

  "freetext", "desktop", "court_assigned",

 *  nicht, ein leeres Ziel gilt allen. */
function hallePasst(ziel, geraet) {
  const z = String(ziel || "").trim().toLowerCase();
  const g = String(geraet || "").trim().toLowerCase();
  return z === "" || g === "" || z === g;

 *  damit fremde Aufrufe in dieser Halle. */

  return Array.isArray(halls) && halls.length >= 2;
}

/** Darf die Seite mit dieser Halle loslegen? Bei Pflicht nur mit einer
 *  Halle, die es im Turnier gibt. */
function halleGueltig(halls, gewaehlt) {
  if (!halleNoetig(halls)) return true;
  const g = String(gewaehlt || "").trim();
  return g !== "" && halls.some((h) => hallePasst(h, g) && String(h).trim() !== "");

/**
 * Nimmt einen Feed entgegen und sagt, was neu zu spielen ist.
 *
 * `stand` = `{ lastId, bestand }`. Der **erste** Feed ist Bestandsaufnahme:
 * Was schon da war, wird nicht gesprochen — wer die Seite öffnet, will nicht
 * die letzte Minute nachhören.

  const eintraege = Array.isArray(feed && feed.eintraege) ? feed.eintraege : [];
  let lastId = stand.lastId || 0;

  for (const e of eintraege) {
    if (!e || typeof e.id !== "number" || e.id <= lastId) continue;
    if (stand.bestand && ANSAGE_ARTEN.indexOf(e.art) >= 0) neu.push(e);
  }
  for (const e of eintraege) {
    if (e && typeof e.id === "number" && e.id > lastId) lastId = e.id;
  }

/** Passt ein Eintrag noch zur Belegung? Mit Spiel-Bezug nur, wenn genau
 *  dieses Spiel auf genau diesem Feld steht. */
function belegungPasst(e, belegung) {
  if (e.courtId == null || e.matchId == null) return true;
  return (belegung || []).some(
    (b) => b.courtId === e.courtId && b.matchId === e.matchId,
  );

 *  zählt ab Empfang auf diesem Gerät — die Uhr des Geräts muss dafür nicht
 *  zur Uhr des Turnier-PCs passen. */

    case "schalter_aus":
      return "Der Turnier-PC erzeugt keine Ansagen für diese Seite (Schalter „Audio für Ansage-Seiten erzeugen“ ist aus).";
    case "slave":
      return "Dieser Rechner ist ein Ansage-Slave — die Seite gehört an den Turnier-PC.";
    case "renderer_weg":

 * Aufrufer sein Warten, damit die Sprache nicht in den Nachklang einsetzt.

 * in Tonzahl, Klangfarbe und Bewegung.

  const now = ctx.currentTime;
  if (kind === "info") {
    const notes = [523.25, 659.25, 783.99]; // C5 – E5 – G5
    const step = 0.15;

      const t = now + i * step;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.32, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
      g.connect(ctx.destination);
      const o = ctx.createOscillator();
      o.type = "triangle";
      o.frequency.value = notes[i];
      o.connect(g);
      o.start(t);
      const stopAt = t + 0.38;
      o.stop(stopAt);
      letzter = o;
      endeSec = stopAt;
    }
    return { letzter, endeSec };

  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.4, now + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
  gain.connect(ctx.destination);

  const o1 = ctx.createOscillator();
  o1.type = "sine";
  o1.frequency.value = 880;
  o1.connect(gain);
  o1.start(now);
  o1.stop(now + 0.6);

  const o2 = ctx.createOscillator();
  o2.type = "sine";
  o2.frequency.value = 587.33;
  o2.connect(gain);
  o2.start(now + 0.18);
  o2.stop(now + 1.1);

  // danach wirkungslos. 1,2 s dient nur der konservativen Fallback-Frist.

  /* ── Warteschlange: strikt nacheinander, nichts überlappt ──────── */
  function naechste() {

    var stueck = z.warteschlange.shift();
    if (!stueck) return;

    if (!nochAbspielbar(stueck.e, belegung, stueck.empfangen, jetzt())) {

      .then(function () {

      .catch(function () { /* weiter mit der nächsten */ })
      .then(function () {
        z.spielt = false;
        z.letzte = { ms: jetzt(), text: String((e.segmente || []).join(" ")).slice(0, 140) };
        melden();
        naechste();
      });
  }

  /* Die Halle, mit der die Seite fragt. Eine leere Liste heißt entweder „nur
     eine Halle" oder „noch kein BTP-Stand" (Turnier-PC startet gerade neu).
     Hat die Seite schon Hallen gesehen, ist es Letzteres: Dann bleibt sie bei
     ihrer Halle — sonst stünde ein Pi nach jedem Neustart des PCs stumm da
     oder hörte kurz fremde Hallen. Nur ohne je gesehene Hallen (Turnier mit
     einer Halle) fragt sie ohne. */
  function wirksameHalle() {
    return z.halls.length || z.hallenGesehen ? z.halle : "";
  }

  /* Darf die Seite mit ihrer Halle spielen und sich melden? Eine fest
     vorgegebene Halle muss es im Turnier geben, sobald es Hallen gibt. */
  function halleOk() {
    if (!halleGueltig(z.halls, z.halle)) return false;
    if (!halleFest || !z.halls.length || String(z.halle).trim() === "") return true;
    return z.halls.some(function (h) { return hallePasst(h, z.halle) && String(h).trim() !== ""; });
  }

  /* Neue Hallenliste übernehmen. Gemerkte oder per Link vorgegebene Halle
     nur übernehmen, wenn es sie gibt; eine leere Liste ändert an der Wahl
     nichts. */
  function hallenUebernehmen(halls) {
    if (JSON.stringify(halls) === JSON.stringify(z.halls)) return;
    z.halls = halls;
    if (halls.length) {
      z.hallenGesehen = true;
      var passend = halls.filter(function (h) { return hallePasst(h, z.halle) && z.halle !== ""; })[0];
      z.halle = passend || (halleFest ? z.halle : "");
    }
    hallenMelden(halls);
  }

  function halleWaehlen(halle) {
    var vorher = z.halle;
    z.halle = String(halle || "");
    // Neue Halle: Was schon in der Schlange liegt, gehört zur alten.
    if (vorher !== z.halle) z.warteschlange = [];
    melden();
  }

  /* ── Abfrage ───────────────────────────────────────────────────── */
  function abfragen() {
    if (z.abrufLaeuft) return;
    if (z.fehltSeit && jetzt() - z.fehltSeit < ANSAGE_FEHLT_PAUSE_MS) return;
    var hoert = meldetPraesenz(z.feed, hatGeraeteStimme(), tonPruefen()) && halleOk();
    var abbruch = w.AbortController ? new w.AbortController() : null;
    var abruf;
    // Ein synchroner Wurf darf die Sperre nie setzen, ohne sie zu lösen —
    // sonst fragte die Seite nie wieder (Review E1b).
    try {
      abruf = w.fetch(feedAdresse(base, wirksameHalle(), z.stand.lastId, hoert),
        { cache: "no-store", signal: abbruch ? abbruch.signal : undefined });
    } catch (e) {
      abruf = Promise.reject(e);
    }
    var frist = w.setTimeout(function () { if (abbruch) abbruch.abort(); }, ANSAGE_FEED_FRIST_MS);
    z.abrufLaeuft = true;
    abruf
      .then(function (r) {
        if (r.status === 404) {
          z.fehltSeit = jetzt();
          throw new Error("kein Feed");
        }
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (feed) {
        z.verbunden = true;
        z.fehltSeit = 0;
        z.fehlversuche = 0;
        z.feed = feed;
        hallenUebernehmen(feed.halls || []);
        var r = neueEintraege(z.stand, feed);
        z.stand = r.stand;
        // Nur abspielen, wenn diese Seite wirklich bereit ist — sonst liefen
        // Aufrufe einer fremden Halle oder ohne Ton in die Schlange.
        if (z.tonFrei && halleOk()) {
          var empfangen = jetzt();
          r.neu.forEach(function (e) { z.warteschlange.push({ e: e, empfangen: empfangen }); });
          naechste();
        }
      })
      .catch(function () { z.verbunden = false; z.fehlversuche += 1; })
      .then(function () {
        w.clearTimeout(frist);
        z.abrufLaeuft = false;
        melden();
      });
  }

  function starten() {
    // Läuft der Ton schon (Pi mit Autoplay-Freigabe, Kiosk-App), ist die
    // Seite ohne Tippen bereit.
    audioKontext();
    melden();
    abfragen();
    w.setInterval(abfragen, ANSAGE_TAKT_MS);
  }

  return {
    zustand: z,
    starten: starten,
    abfragen: abfragen,
    freischalten: freischalten,
    halleWaehlen: halleWaehlen,
    halleOk: halleOk,
    tonPruefen: tonPruefen,
    hatGeraeteStimme: hatGeraeteStimme,
    stimmeArt: function () { return stimme(z.feed && z.feed.hostAudio, hatGeraeteStimme()); },
  };
}

/* ── Ansage-Modus der Monitor-Seiten (E1b) ───────────────────────────── */

/** Liest den Modus aus der Adresse: `?ansage=<Halle>` schaltet ihn ein,
 *  auch mit leerem Wert (Turnier mit einer Halle). */
function ansageModusAusQuery(search) {
  var such;
  try { such = new URLSearchParams(search || ""); } catch (e) { return null; }
  if (!such.has("ansage")) return null;
  return { halle: String(such.get("ansage") || "").trim() };
}

/** Den Ansage-Feed gibt es in E1b nur am Turnier-PC im Hallennetz (Basis
 *  `/`); über das Relay (`/bts-relay/<ns>/`) kommt er erst mit E4. */
function ansageImLan(base) {
  return base === "/";
}

/**
 * Was der Monitor im Ansage-Modus als kleinen Hinweis zeigt — leer, wenn
 * alles läuft (dann bleibt die Anzeige unverändert). `lage`: `{ lan, fehlt,
 * verbunden, feed, tonFrei, halleOk, halle, stimme }`.
 */
function monitorHinweis(lage) {
  if (!lage.lan) return "Ansage: nur im Hallennetz (LAN) am Turnier-PC — über die Cloud noch nicht.";
  if (lage.fehlt) return "Ansage: Der Turnier-PC bietet hier keine Ansagen an (bts-light zu alt oder Slave-Brücke).";
  if (!lage.verbunden || !lage.feed) return "Ansage: keine Verbindung zum Turnier-PC.";
  if (!lage.feed.aktiv) return "Ansage: " + grundText(lage.feed.grund);
  if (!lage.halleOk) {
    return lage.halle
      ? "Ansage: Die Halle „" + lage.halle + "“ gibt es in diesem Turnier nicht."
      : "Ansage: Bitte die Halle angeben (?ansage=<Halle>).";
  }
  if (!lage.tonFrei) return "Ansage: Ton gesperrt — der Browser braucht die Autoplay-Freigabe (Pi-Einrichtung aktualisieren).";
  if (lage.stimme === "keine") return "Ansage: Dieses Gerät kann nicht sprechen (kein Audio vom Turnier-PC, keine Gerätestimme).";
  return "";
}

/**
 * Startet den Ansage-Modus einer Monitor-Seite, wenn die Adresse ihn
 * verlangt. Die Anzeige selbst bleibt unberührt; nur bei einem Problem
 * erscheint unten links ein kleiner Hinweis. Ohne freigegebenen Ton meldet
 * sich die Seite nicht als Ansage-Gerät (das regelt der Kern).
 */
function ansageMonitorStarten(base, welt, dokument) {
  var modus = ansageModusAusQuery(welt.location && welt.location.search);
  if (!modus) return null;
  var hinweis = dokument.createElement("div");
  hinweis.id = "ansage-hinweis";
  hinweis.setAttribute("role", "status");
  hinweis.style.cssText = "position:fixed;left:.6vmin;bottom:.6vmin;z-index:2147483000;" +
    "max-width:60vw;padding:.4vmin .9vmin;border-radius:.6vmin;font:1.6vmin/1.3 system-ui,sans-serif;" +
    "background:rgba(15,23,42,.82);color:#fbbf24;pointer-events:none;display:none";
  dokument.body.appendChild(hinweis);
  function zeigen(text) {
    hinweis.textContent = text;
    hinweis.style.display = text ? "block" : "none";
  }
  if (!ansageImLan(base)) {
    // Kein Abruf, keine Fehlerschleife: Im Cloud-Pfad gibt es den Feed noch nicht.
    zeigen(monitorHinweis({ lan: false }));
    return null;
  }
  var kern = ansageKern({
    base: base,
    halle: modus.halle,
    halleFest: true,
    welt: welt,
    beiAenderung: function () {
      var z = kern ? kern.zustand : null;
      if (!z) return;
      zeigen(monitorHinweis({
        lan: true,
        fehlt: !!z.fehltSeit,
        // Erst nach drei Fehlschlägen in Folge (≈ 5 s) — ein WLAN-Wackler
        // soll nicht jedes Mal einen Hinweis in die Halle blitzen lassen.
        verbunden: z.verbunden || (!!z.feed && z.fehlversuche < 3),
        feed: z.feed,
        tonFrei: kern.tonPruefen(),
        halleOk: kern.halleOk(),
        halle: z.halle,
        stimme: kern.stimmeArt(),
      }));
    },
  });
  // Kein Freischalt-Knopf am TV — aber eine zufällige Geste (Maus, Taste)
  // gibt den Ton frei, falls die Autoplay-Freigabe fehlt.
  ["pointerdown", "keydown"].forEach(function (art) {
    dokument.addEventListener(art, kern.freischalten, { passive: true });
  });
  kern.starten();
  return kern;
}
/* </ansageKern.mjs> */

ansageMonitorStarten(ANSAGE_BASIS, window, document);
})();
</script>
