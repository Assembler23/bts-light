<!doctype html>
<html lang="de" translate="no">
<head>
<meta charset="utf-8" />
<meta name="google" content="notranslate" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Feld wählen – bts-light</title>
<!--
  Felder-Lobby (/felder): Start-Seite fürs Zähltablett. Listet alle Felder,
  Tippen führt auf /court/<id> (zählen). Belegte Felder (ein Tablet zählt sie
  schon) sind als „belegt" markiert und führen auf die bestehende Übernahme-
  Abfrage — Doppelbelegung bleibt serverseitig ausgeschlossen. Pollt /courts.

  Meetingpoint (Spec meetingpoint-am-kiosk-tablet): Ist der Meetingpoint an
  (eigener Takt auf /meetingpoint/state, 404 = aus), steht unter den Feldern
  ein Eintrag „Meetingpoint" hinter der Tablet-PIN — er öffnet die
  Anzeige-Hülle, ohne ein Feld zu belegen. War das Gerät zuletzt Meetingpoint
  (Merker der Hülle), bringt ein Knopf oben ohne PIN dorthin zurück; die
  Kiosk-App lädt nach jedem WLAN-Aussetzer diese Seite. Umgeleitet wird nie.
-->
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #0b1120; color: #f8fafc;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; flex-direction: column; }
  header.bar {
    flex: 0 0 auto; display: flex; align-items: center; gap: .6rem;
    padding: .8rem 1rem; border-bottom: 1px solid #1e293b;
  }
  header.bar h1 { font-size: 1.15rem; margin: 0; font-weight: 800; letter-spacing: .02em; }
  header.bar .hint { margin-left: auto; font-size: .8rem; color: #94a3b8; }
  /* Akkustand (Spec-Erweiterung 13.09.2026): im Kiosk fehlt die Android-
     Statusleiste. Schlicht, ohne Animation; Schwellen aus src/io/akku.mjs. */
  header.bar .akku { font-size: .8rem; color: #94a3b8; white-space: nowrap; font-variant-numeric: tabular-nums; }
  header.bar .akku.niedrig { color: #fbbf24; font-weight: 800; }
  header.bar .akku.kritisch { color: #f87171; font-weight: 800; }
  main { flex: 1 1 auto; overflow: auto; padding: 1rem; }
  #grid {
    display: grid; gap: .8rem;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  }
  .tile {
    position: relative; border: 2px solid #334155; border-radius: 1rem;
    background: #111c33; padding: 1rem; min-height: 120px; display: flex;
    flex-direction: column; gap: .35rem; cursor: pointer; text-align: left;
    color: inherit; font: inherit; appearance: none; -webkit-appearance: none;
    transition: transform .08s, border-color .15s, background .15s;
  }
  .tile:active { transform: scale(.97); }
  .tile.free { border-color: #22c55e; }
  .tile.free:active { background: #15331f; }
  .tile.busy { border-color: #f59e0b; background: #1c1606; }
  .tile .court { font-size: 1.6rem; font-weight: 900; line-height: 1; }
  .tile .pairing { font-size: .9rem; color: #e2e8f0; line-height: 1.2; }
  .tile .sub { font-size: .72rem; color: #94a3b8; }
  .tile .state {
    margin-top: auto; font-size: .75rem; font-weight: 800;
    text-transform: uppercase; letter-spacing: .05em;
  }
  .tile.free .state { color: #4ade80; }
  .tile.busy .state { color: #fbbf24; }
  /* Meetingpoint: abgesetzt von den Feldern (violett statt grün/gelb). */
  #mp-zurueck {
    display: block; width: 100%; margin: 0 0 1rem; padding: 1.4rem 1rem;
    border: 2px solid #a78bfa; border-radius: 1rem; background: #2e1065;
    color: #f5f3ff; font: inherit; font-size: 1.4rem; font-weight: 900; cursor: pointer;
    appearance: none; -webkit-appearance: none;
  }
  #mp-zurueck:active { transform: scale(.98); }
  #mp-zurueck[hidden] { display: none; }
  #mp-bereich { margin-top: 1.4rem; }
  #mp-kachel { width: 100%; max-width: 22rem; border-color: #a78bfa; background: #1e1338; }
  #mp-kachel .state { color: #c4b5fd; }
  #pin-modal {
    position: fixed; inset: 0; background: rgba(2, 6, 23, .92); display: flex;
    flex-direction: column; align-items: center; justify-content: center; gap: 1rem; z-index: 10;
  }
  #pin-modal[hidden] { display: none; }
  #pin-modal .titel { font-size: 1.3rem; font-weight: 800; }
  #pin-modal .unter { font-size: .9rem; color: #94a3b8; }
  .pin-display { font-size: 2rem; letter-spacing: .6rem; min-height: 2.4rem; font-weight: 700; }
  .pin-pad { display: grid; grid-template-columns: repeat(3, 5rem); gap: .75rem; }
  .pin-pad button { width: 5rem; height: 4rem; font-size: 1.5rem; font-weight: 700;
    border-radius: .75rem; border: 1px solid #334155; background: #111c33; color: #f8fafc; }
  .pin-pad button:active { background: #1e293b; }
  .pin-pad button.pin-aux { font-size: 1.2rem; color: #94a3b8; }
  #empty, #offline { text-align: center; color: #94a3b8; padding: 2rem; }
  #offline { color: #fda4af; display: none; }
  #offline.show { display: block; }
</style>
</head>
<body>
<header class="bar">
  <h1>Feld wählen</h1>
  <span class="hint">Tippen zum Zählen</span>
  <span class="akku" id="akku" hidden title="Akkustand des Tablets"></span>
</header>
<main>
  <div id="offline">Keine Verbindung zum Turnier-PC …</div>
  <button type="button" id="mp-zurueck" hidden>Zurück zum Meetingpoint</button>
  <div id="grid"></div>
  <div id="empty" style="display:none">Noch keine Felder vorhanden.</div>
  <div id="mp-bereich" hidden>
    <button type="button" class="tile" id="mp-kachel">
      <div class="court">Meetingpoint</div>
      <div class="sub">Anzeige für Spieler · belegt kein Feld</div>
      <div class="state">PIN — antippen</div>
    </button>
  </div>
</main>
<div id="pin-modal" hidden>
  <div class="titel">Meetingpoint</div>
  <div class="unter">PIN eingeben</div>
  <div class="pin-display" id="pin-display"></div>
  <div class="pin-pad" id="pin-pad">
    <button type="button" data-k="1">1</button>
    <button type="button" data-k="2">2</button>
    <button type="button" data-k="3">3</button>
    <button type="button" data-k="4">4</button>
    <button type="button" data-k="5">5</button>
    <button type="button" data-k="6">6</button>
    <button type="button" data-k="7">7</button>
    <button type="button" data-k="8">8</button>
    <button type="button" data-k="9">9</button>
    <button type="button" data-k="del" class="pin-aux">⌫</button>
    <button type="button" data-k="0">0</button>
    <button type="button" data-k="cancel" class="pin-aux">✕</button>
  </div>
</div>
<script>
(function () {
  'use strict';
  var grid = document.getElementById('grid');
  var offline = document.getElementById('offline');
  var empty = document.getElementById('empty');
  var POLL_OK = 3000, POLL_FAIL = 4000;

  // ── Akkustand: Inline-Kopie von src/io/akku.mjs (Test scripts/test-akku.mjs)
  //    — Änderungen dort und hier gemeinsam ──
  var AKKU_NIEDRIG = 20;
  var AKKU_KRITISCH = 10;
  var AKKU_TAKT_MS = 60000;
  function prozent(v) {
    if (v === null || v === undefined || v === "") return null;
    const n = Number(v);
    if (!Number.isFinite(n)) return null;
    return Math.max(0, Math.min(100, Math.round(n)));
  }
  function akkuStufe(percent) {
    const p = prozent(percent);
    if (p === null) return null;
    if (p < AKKU_KRITISCH) return "kritisch";
    if (p < AKKU_NIEDRIG) return "niedrig";
    return "ok";
  }
  function akkuText(percent, charging) {
    const p = prozent(percent);
    if (p === null) return "";
    return (charging ? "⚡ " : "🔋 ") + p + " %";
  }
  function akkuAusFully(fully) {
    if (!fully || typeof fully.getBatteryLevel !== "function") return null;
    let lvl;
    try { lvl = Number(fully.getBatteryLevel()); } catch (e) { return null; }
    if (!Number.isFinite(lvl) || lvl < 0) return null;
    let charging = false;
    if (typeof fully.isPlugged === "function") {
      try { charging = !!fully.isPlugged(); } catch (e) { charging = false; }
    }
    return { percent: prozent(lvl), charging };
  }
  function akkuAusWebBattery(bat) {
    if (!bat) return null;
    const p = prozent(Number(bat.level) * 100);
    if (p === null) return null;
    return { percent: p, charging: !!bat.charging };
  }
  function akkuBeobachten(win, melde) {
    const fully = win.fully;
    if (fully && typeof fully.getBatteryLevel === "function") {
      const lies = () => { const a = akkuAusFully(fully); if (a) melde(a); };
      lies();
      const t = win.setInterval(lies, AKKU_TAKT_MS);
      return () => win.clearInterval(t);
    }
    const nav = win.navigator;
    if (nav && typeof nav.getBattery === "function") {
      let aktiv = true;
      let bat = null;
      const lies = () => { if (!aktiv) return; const a = akkuAusWebBattery(bat); if (a) melde(a); };
      let p;
      try { p = nav.getBattery(); } catch (e) { return null; }
      Promise.resolve(p).then((b) => {
        bat = b;
        b.addEventListener("levelchange", lies);
        b.addEventListener("chargingchange", lies);
        lies();
      }).catch(() => { /* nicht verfügbar – Anzeige bleibt stumm */ });
      return () => { aktiv = false; };
    }
    return null;
  }
  // ── Ende Inline-Kopie ──
  var akkuEl = document.getElementById('akku');
  akkuBeobachten(window, function (a) {
    var text = akkuText(a.percent, a.charging);
    if (akkuEl.textContent === text) return; // Takt ohne Änderung → kein DOM-Schreiben
    var stufe = akkuStufe(a.percent);
    akkuEl.hidden = !text;
    akkuEl.textContent = text;
    akkuEl.classList.toggle('niedrig', stufe === 'niedrig');
    akkuEl.classList.toggle('kritisch', stufe === 'kritisch');
  });

  // ── Meetingpoint: Inline-Kopie von src/io/lobbyMeetingpoint.mjs (Drift-Test
  //    scripts/test-inline-kopien.mjs) — Änderungen dort und hier gemeinsam ──
  var ZULETZT_KEY = "badhub.anzeige.zuletzt";
  function meetingpointZiel() {
    return "/anzeige?layout=meetingpoint";
  }
  function mpAusStatus(status, bisher) {
    if (status === 200) return true;
    if (status === 404) return false;
    return !!bisher;
  }
  function merkerLesen(roh) {
    if (typeof roh !== "string" || roh === "") return null;
    var o;
    try { o = JSON.parse(roh); } catch (e) { return null; }
    return o && typeof o === "object" && !Array.isArray(o) ? o : null;
  }
  function warZuletztMeetingpoint(roh) {
    var o = merkerLesen(roh);
    return !!o && o.layout === "meetingpoint";
  }
  function ohneMeetingpointMarke(roh) {
    var o = merkerLesen(roh);
    if (!o || o.layout !== "meetingpoint") return null;
    return JSON.stringify({ layout: "tafel", court: o.court === undefined ? null : o.court, halle: o.halle === undefined ? null : o.halle });
  }
  // ── Ende Inline-Kopie ──

  // ── PIN-Freigabe: Inline-Kopie von src/io/pinFreigabe.mjs (Drift-Test
  //    scripts/test-inline-kopien.mjs). Derselbe Schlüssel wie Zähl-Tablet
  //    und Hülle (gleicher Origin) — wer am Zahnrad gerade die PIN eingab,
  //    kommt ohne zweite Eingabe zum Meetingpoint. ──
  var PIN_FREIGABE_KEY = "badhub.tablet.pinFreigabeBis";
  var FREIGABE_MS = 5 * 60 * 1000;
  function neueFreigabe(jetztMs) { return jetztMs + FREIGABE_MS; }
  function freigabeGueltig(bisMs, jetztMs) {
    if (typeof bisMs !== "number" || !Number.isFinite(bisMs) || bisMs <= 0) return false;
    if (bisMs <= jetztMs) return false;
    return bisMs - jetztMs <= FREIGABE_MS;
  }
  function freigabeLesen(roh) {
    if (typeof roh !== "string" || !/^\d{1,16}$/.test(roh)) return null;
    var n = Number(roh);
    return n > 0 ? n : null;
  }
  // ── Ende Inline-Kopie ──

  // Bedien-PIN (Bedienschutz, keine Sicherheitsgrenze). Gestückelt, damit
  // der Server den Vergleichswert nicht mitersetzt; unersetzt → „0000".
  var PIN = "__TABLET_PIN__";
  var SETTINGS_PIN = (!PIN || PIN === "__TABLET" + "_PIN__") ? "0000" : PIN;
  function lies(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function pinFreigabeAktiv() { return freigabeGueltig(freigabeLesen(lies(PIN_FREIGABE_KEY)), Date.now()); }
  function pinFreigabeMerken() {
    try { localStorage.setItem(PIN_FREIGABE_KEY, String(neueFreigabe(Date.now()))); } catch (e) {}
  }
  // Marke „zuletzt Meetingpoint" löschen — nur `layout`, die Halle bleibt.
  function markeLoeschen() {
    var neu = ohneMeetingpointMarke(lies(ZULETZT_KEY));
    if (neu !== null) { try { localStorage.setItem(ZULETZT_KEY, neu); } catch (e) {} }
  }

  var mpAn = false;
  var mpZurueck = document.getElementById('mp-zurueck');
  var mpBereich = document.getElementById('mp-bereich');
  var pinModal = document.getElementById('pin-modal');
  var pinDisplay = document.getElementById('pin-display');
  var pinEntry = '';
  function zeigeMeetingpoint() {
    mpBereich.hidden = !mpAn;
    mpZurueck.hidden = !(mpAn && warZuletztMeetingpoint(lies(ZULETZT_KEY)));
  }
  function zumMeetingpoint() { location.href = meetingpointZiel(); }
  function renderPin() {
    var total = Math.max(SETTINGS_PIN.length, 4);
    pinDisplay.textContent = '•'.repeat(pinEntry.length) + '–'.repeat(Math.max(0, total - pinEntry.length));
  }
  function pinKey(k) {
    if (k === 'cancel') { pinModal.hidden = true; pinEntry = ''; return; }
    if (k === 'del') { pinEntry = pinEntry.slice(0, -1); renderPin(); return; }
    if (pinEntry.length >= Math.max(SETTINGS_PIN.length, 8)) return;
    pinEntry += k; renderPin();
    if (pinEntry.length >= SETTINGS_PIN.length) {
      if (pinEntry === SETTINGS_PIN) { pinFreigabeMerken(); zumMeetingpoint(); }
      else { pinDisplay.textContent = 'PIN falsch'; pinEntry = ''; setTimeout(renderPin, 800); }
    }
  }
  document.getElementById('mp-kachel').addEventListener('click', function () {
    if (pinFreigabeAktiv()) { zumMeetingpoint(); return; }
    pinEntry = ''; renderPin(); pinModal.hidden = false;
  });
  document.getElementById('pin-pad').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-k]');
    if (btn) pinKey(btn.dataset.k);
  });
  // Ohne PIN: Das Tablet lag schon als Meetingpoint aus und ist nur auf die
  // Feldwahl zurückgefallen — jeder Spieler soll es zurückholen können.
  mpZurueck.addEventListener('click', zumMeetingpoint);

  function go(id) { markeLoeschen(); location.href = '/court/' + encodeURIComponent(id); }

  function render(courts) {
    offline.classList.remove('show');
    if (!courts.length) { grid.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    // Liste ist klein → komplett neu aufbauen (kein Diff nötig).
    grid.innerHTML = '';
    courts.forEach(function (c) {
      var busy = !!c.occupied;
      var t = document.createElement('button');
      t.className = 'tile ' + (busy ? 'busy' : 'free');
      t.onclick = function () { go(c.id); };

      var court = document.createElement('div');
      court.className = 'court';
      court.textContent = c.label || ('Feld ' + c.id);
      t.appendChild(court);

      if (c.pairing) {
        var p = document.createElement('div');
        p.className = 'pairing';
        p.textContent = c.pairing;
        t.appendChild(p);
      }
      if (c.sub) {
        var s = document.createElement('div');
        s.className = 'sub';
        s.textContent = c.sub;
        t.appendChild(s);
      }

      var st = document.createElement('div');
      st.className = 'state';
      st.textContent = busy ? 'belegt — übernehmen' : 'frei — antippen';
      t.appendChild(st);

      grid.appendChild(t);
    });
  }

  // Frist des Stand-Abrufs: Kopfzeilen 5 s, Rumpf danach 15 s. Ein Abruf,
  // der weder scheitert noch antwortet, blockierte sonst alle folgenden
  // (Turnier 05./06.09.2026). **Inline-Kopie von `src/io/abrufFrist.mjs`**
  // — dort die kanonische Fassung mit Begründung und Test
  // (`scripts/test-abruf-frist.mjs`, eigener CI-Schritt); hier ohne
  // `fetchFn`-Parameter. Änderungen hier und dort gemeinsam.
  var KOPF_FRIST_MS = 5000, RUMPF_FRIST_MS = 15000;
  function abrufMitFrist(url, opt, lesen) {
    var ctrl = (typeof AbortController === 'function') ? new AbortController() : null;
    var o = Object.assign({}, opt);
    if (ctrl) o.signal = ctrl.signal;
    var timer = null, abgelaufen = false, abbrechen = null;
    var abbruch = new Promise(function (_, reject) {
      abbrechen = function (was) {
        abgelaufen = true;
        if (ctrl) ctrl.abort();
        reject(new Error('Abruf-Frist überschritten (' + was + ')'));
      };
      timer = setTimeout(function () { abbrechen('Kopfzeilen ' + KOPF_FRIST_MS + ' ms'); }, KOPF_FRIST_MS);
    });
    var abruf = fetch(url, o).then(function (r) {
      // Nur ohne AbortController erreichbar: Der Wettlauf ist entschieden,
      // der Leser darf seine Nebenwirkungen nicht mehr entfalten.
      if (abgelaufen) throw new Error('Antwort nach Ablauf der Frist verworfen');
      clearTimeout(timer);
      timer = setTimeout(function () { abbrechen('Rumpf ' + RUMPF_FRIST_MS + ' ms'); }, RUMPF_FRIST_MS);
      return lesen ? lesen(r) : r;
    });
    return Promise.race([abruf, abbruch]).then(
      function (wert) { clearTimeout(timer); return wert; },
      function (fehler) { clearTimeout(timer); throw fehler; }
    );
  }

  function tick() {
    abrufMitFrist('/courts', { cache: 'no-store' }, function (r) { return r.ok ? r.json() : null; })
      .then(function (list) {
        if (!Array.isArray(list)) throw new Error('bad');
        render(list);
        setTimeout(tick, POLL_OK);
      })
      .catch(function () {
        offline.classList.add('show');
        setTimeout(tick, POLL_FAIL);
      });
  }
  tick();

  // Meetingpoint an/aus: eigener, langsamer Takt — der Status ändert sich
  // selten, und ein Aussetzer lässt den bisherigen Stand stehen.
  var MP_TAKT_MS = 15000;
  function mpTick() {
    abrufMitFrist('/meetingpoint/state', { cache: 'no-store' }, function (r) { return r.status; })
      .then(function (status) { mpAn = mpAusStatus(status, mpAn); }, function () { /* Stand bleibt */ })
      .then(function () { zeigeMeetingpoint(); setTimeout(mpTick, MP_TAKT_MS); });
  }
  mpTick();
})();
</script>
</body>
</html>
