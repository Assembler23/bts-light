[package]
name = "bts-light"
version = "0.9.456"
description = "Plug-and-play liveticker bridge between BTP (Tournament Planner) and badhub.de"
authors = ["Badhub"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bts_light_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1.1.9"
thiserror = "2.0.18"
tracing = "0.1.44"
quick-xml = "0.42"
tokio = { version = "1.52.3", features = ["net", "io-util", "time", "rt", "macros", "sync"] }
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "charset"] }
axum = { version = "0.8.9", features = ["ws"] }
relay-proto = { path = "../relay-proto" }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# TLS für den LAN-Tablet-Server (ADR 0047). Beide aus dem rustls-Umfeld.
# `ring` statt `aws-lc-rs` als Krypto-Backend: keine C-Toolchain nötig, und
# der Provider wird im Code EXPLIZIT gewählt (`builder_with_provider`) — im
# Baum liegen beide Provider, ein Prozess-Default existiert daher nicht.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
futures-util = "0.3"
local-ip-address = "0.6.13"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-dialog = "2"
include_dir = "0.7"
base64 = "0.23"
mdns-sd = "0.21"
# Lokale Uhrzeit fürs BTP-Spielende (Player.LastTimeOnCourt) — bereits
# transitiv im Baum (Tauri-Ökosystem), daher keine neue Supply-Chain-Fläche.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# SHA-256 der TP-Datei für den Takt-Upload (ADR 0061): `ring` liegt über
# rcgen/tokio-rustls ohnehin im Baum — nur eine direkte Abhängigkeit, kein
# neuer Code im Build (die Stufe-1-Spec wollte deshalb kein `sha2`).
ring = "0.17"
# Prüfung der Seiten-Pakete mit dem Updater-Schlüssel (ADR 0099). Kommt über
# `tauri-plugin-updater` ohnehin mit; hier nur direkt benannt.
minisign-verify = "0.3"
# Turnierkern (badhub ADR-0084, Paket L2): faltet die Ereignisse eines
# badhub-Turniers lokal zum Stand. Privates Repo — in der CI über das Secret
# `TURNIERKERN_LESE_TOKEN` (insteadOf vor jedem cargo-Aufruf). Version gleich
# dem Kern-Dienst in badhub, sonst meldet badhub beim Hochladen (L3)
# `abweichung`. Der Kern-Code wird NICHT ins öffentliche Repo kopiert.
turnierkern = { git = "https://github.com/Assembler23/turnierkern", tag = "v0.14.0" }
# Offline-Stimme (ADR 0104), bisher NUR für das Messwerkzeug E0
# `tests/offline_stimme_probe.rs`: hinter dem Feature `offline-probe`, das
# weder die CI noch der Release-Build einschaltet. Apache-2.0, ohne GPL
# (seit 2.0 ohne espeak-ng). Die Engine-Bibliothek kommt geprüft über
# `SHERPA_ONNX_LIB_DIR` (Anleitung im Kopf des Messwerkzeugs).
sherpa-onnx = { version = "=2.0.1", optional = true, default-features = false, features = ["static"] }

# Stiller Druck des Schiedsrichterzettels (ADR 0042): GDI an einen
# benannten Drucker, ohne Dialog. Von Microsoft gepflegt, MIT/Apache-2.0,
# und **transitiv ohnehin im Baum** (Tauri auf Windows) — die neue
# Supply-Chain-Fläche ist damit gleich null. Nur unter Windows: Die App
# ist eine Windows-Desktop-App, und `--workspace` soll auf Linux
# (Relay-Deploy) weiter durchlaufen.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
  # StartDocW/EndDoc/StartPage/EndPage und DOCINFOW liegen im Binding
  # unter `Storage::Xps` — trotz ihres GDI-Ursprungs in gdi32.dll.
  "Win32_Storage_Xps",
  # Feste COM-Initialisierung des Ansage-Audio-Threads (ADR 0065).
  "Win32_System_Com",
  # IMMDeviceEnumerator: aktuelles Standardgerät als konkreter Endpunkt
  # (Ansage-Ton, ADR 0065) — cpal 0.18 gibt sonst das virtuelle Gerät.
  "Win32_Media_Audio",
  # Windows-Stimme im Kern (ADR 0066): `SpeechSynthesizer` samt
  # `SynthesizeTextToStreamAsync` (braucht Media_Core + Storage_Streams)
  # und `DataReader` zum Auslesen des WAV-Stroms.
  "Foundation",
  "Media_SpeechSynthesis",
  "Media_Core",
  "Storage_Streams",
  # TP-Datei selbst finden (ADR 0096): Prozessliste (ToolHelp), fremdes
  # Prozess-Handle (Threading) und Pfad je Datei-Handle (FileSystem).
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Storage_FileSystem",
  # Arbeitsspeicher des eigenen Prozesses fürs Messwerkzeug der
  # Offline-Stimme (`K32GetProcessMemoryInfo`).
  "Win32_System_ProcessStatus",
  # Schlüssel des verschlüsselten Personenauszugs eines badhub-Turniers an
  # das Benutzerkonto binden (DPAPI `CryptProtectData`, Paket L2).
  "Win32_Security_Cryptography",
] }
# Ansage-Ton aus dem Kern (ADR 0065): WASAPI-Ausgabe mit Gerät je Stück.
# Apache-2.0 (RustAudio), hängt an derselben `windows`-Version 0.62 — keine
# zweite Kopie im Baum. Nur Windows: Der Linux-CI-Job hat kein ALSA, und
# unter Linux bleibt die Ansage beim alten Weg im WebView.
cpal = "0.18"

[features]
# Messwerkzeug der Offline-Stimme (Spec `ansage-offline-stimme`, E0).
offline-probe = ["dep:sherpa-onnx"]

[[test]]
name = "offline_stimme_probe"
required-features = ["offline-probe"]

[dev-dependencies]
tempfile = "3.27.0"
# Pausierte Zeit fuer die Gate-Tests (btp/write_gate.rs): start_paused/advance
tokio = { version = "1.52.3", features = ["test-util"] }

