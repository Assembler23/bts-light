name: CI

on:
  push:
    branches: [main]
    # Nur auf main-Pushes gefiltert, NICHT auf pull_request -- siehe Kommentar
    # bei `concurrency`. Ein Merge, der nur Markdown anfasst, muss den
    # Windows-Build nicht wiederholen; die PR-Pruefung lief da schon.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'

  pull_request:
    # Hier BEWUSST kein paths-ignore: `build` ist Required-Check auf main.
    # Ein uebersprungener Lauf erzeugt keinen Status, und der PR haengt dann
    # dauerhaft auf "ausstehend" statt gemergt zu werden. Lieber ein
    # ueberfluessiger Build als ein blockierter Doku-PR.

# Dieser Job laeuft auf windows-latest, und Windows-Minuten zaehlen bei GitHub
# DOPPELT. Gemessen 2026-08-08: ein Lauf ~626 s = 11 min, also 22 berechnete
# Minuten -- so viel wie zwei komplette badhub-PRs mit acht Jobs.
#
# Am 2026-07-28 liefen 15 Laeufe an einem Tag (~330 Minuten, gut 11 % des
# Monatskontingents von 3000). Ohne Abbruch laufen bei fuenf schnellen Pushes
# alle fuenf Builds zu Ende, auch die vier laengst ueberholten.
#
# Auf main wird NICHT abgebrochen: Dort ist jeder Commit ein eigener Stand, der
# gruen sein soll -- ein abgebrochener main-Build hinterliesse eine Luecke in
# der Historie. Auf PRs zaehlt nur der letzte Stand.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # windows-latest = Zielplattform; WebView2 ist vorinstalliert, keine extra system-deps.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # Die Assets (tl.html, tablet.html, monitor.html …) durchlaufen KEINEN
      # Build — ein Syntaxfehler darin lässt die Seite im Betrieb leer. Am
      # 13.08.2026 ist genau das passiert (Zeilenumbruch in einem
      # String-Literal), deshalb prüft die CI die Inline-Skripte.
      - name: Asset-Syntax (JS in HTML)
        run: node scripts/check-asset-syntax.mjs

      # Baseline der Feld-Ansage: Ein leerer erster Abruf (Sync-Lauf hat noch
      # keinen BTP-Schnappschuss) darf nicht als Baseline gelten — sonst sagt
      # die App beim Start alle laufenden Spiele an (Befund 14.08.2026).
      - name: Ansage-Baseline (JS)
        run: node scripts/test-announce-baseline.mjs

      # BWF-Aufschlag-Positionierung des Tablets (Plan 12b) — reiner
      # Node-Test der sicherheitskritischen Positionslogik.
      - name: Tablet-Aufschlagpositionen (JS)
        run: node scripts/test-serving.mjs

      # Zettel-Ereignisse am Tablet (Spec schiedsrichterzettel-druck,
      # ADR 0038): Vereinigung und Undo-Schnitt sind die einzige Stelle,
      # an der ein Bedienfehler unbemerkt Daten kostet — ein Undo, das
      # eine Karte stehen lässt, fällt erst beim gedruckten Zettel nach
      # dem Turnier auf.
      - name: Zettel-Ereignisse (JS)
        run: node scripts/test-match-events.mjs

      # Gong-Auflöse-Timing (Plan 15) — onended-/Fallback-Pfad + done-Guard
      # der geteilten gongTiming.mjs (kein Überlappen der ersten Silbe).
      - name: Gong-Timing (JS)
        run: node scripts/test-gong-timing.mjs

      # Satz-/Matchball-Erkennung der Felderübersicht (Plan 16).
      - name: Satz-/Matchball (JS)
        run: node scripts/test-gamepoint.mjs

      # Hallen-Raster-Zellen-Abbildung (Task 10, Turnierleitung-Web): bildet
      # BTP-Feldnummern auf Bildschirm-Koordinaten ab für die Hallen-Übersicht.
      - name: Hallen-Raster (JS)
        run: node scripts/test-hallgrid.mjs

      # Aussprache-Korrektur-Rangfolge auf dem Azure-Pfad (IPA > say-Respelling)
      # — sorgt dafür, dass die phonetische Ersatzschreibweise auch bei Azure
      # greift und IPA nicht verdrängt.
      - name: Aussprache-Korrektur (JS)
        run: node scripts/test-name-correction.mjs

      # Stimmenwahl je Disziplin (optionales Azure-Feature): Override greift nur
      # bei gesetztem, nicht-leerem Wert, sonst Standard-Stimme.
      - name: Stimme je Disziplin (JS)
        run: node scripts/test-discipline-voice.mjs

      # Doppel-Gruppierung der Check-In-Liste: gleiche entry_id (genau zwei
      # Träger) wird eine Zeile; entry_id 0 (altes badhub) klumpt nie.
      - name: Check-In-Doppel (JS)
        run: node scripts/test-checkin-pairs.mjs

      # Wortlaut der Spielbeginn-Ansage: mit dem Nutzer abgestimmt und in
      # beiden Synthese-Pfaden identisch — ohne Paarung, ohne Stufenwort
      # (sie ist kein Aufruf).
      - name: Spielbeginn-Ansage (JS)
        run: node scripts/test-start-play-text.mjs
      # Wortlaut des Zähltafelbediener-Nachrufs: in beiden Synthese-Pfaden
      # identisch, Stufenwort ab dem zweiten Mal, ohne Adressat gar nichts.
      - name: Bediener-Nachruf (JS)
        run: node scripts/test-scorekeeper-call-text.mjs

      # Ordnung zwischen Push und Voll-Abruf auf den Anzeige-Seiten: Push nur
      # bei echt neuerer Sequenz, ein Voll-Abruf darf gleichziehen (der
      # BTP-Rückfall-Fall). Eine falsche Regel hier friert Anzeigen ein.
      - name: Anzeige-Ordnung seq (JS)
        run: node scripts/test-monitor-seq.mjs

      # Zuständigkeitsgrenze des Teil-Patches der Feld-Übersicht: Gepatcht
      # wird nur der gezählte Punkt im laufenden Satz. Eine zu großzügige
      # Regel hinterlässt eine Karte, die dauerhaft Falsches zeigt.
      - name: Teil-Patch der Übersicht (JS)
        run: node scripts/test-court-patch.mjs

      # Adressvergleich und Ausrichtung der Kombi-Anzeige. Zu streng: der TV
      # navigiert im Sekundentakt neu; zu großzügig: eine Umzuweisung kommt
      # nie an oder eine hand-getippte Kiosk-URL verliert ihren Startwert.
      - name: "Kombi-Anzeige: Adresse und Ausrichtung (JS)"
        run: node scripts/test-combo-ansicht.mjs

      # Auto-Scroll-Tempo beim Umsortieren der Spielliste. Tempo 0, wo
      # gescrollt werden muesste, macht die Ziehgeste wieder so hakelig wie
      # vor v0.9.271; Tempo ungleich 0 in der Mitte laesst die Liste wandern,
      # waehrend man in Ruhe einsortieren will.
      - name: Auto-Scroll beim Umsortieren (JS)
        run: node scripts/test-drag-scroll.mjs

      # Wann steht eine Anzeige still, ohne es zu merken? Ein Fehlalarm hier
      # schickt Log-Uploads von zwanzig Geraeten los und laesst eine gesunde
      # Halle krank aussehen; ein verpasster Fall laesst den Fehler weiter
      # unbezeugt (Feldtest 22.08.2026).
      - name: Stillstands-Waechter der Anzeigen (JS)
        run: node scripts/test-standstill.mjs

      # Wann wiederholt das Tablet ein Ergebnis, und wann hoert es auf?
      # Ein Fehler hier kostet im besten Fall einen ueberfluessigen Request,
      # im schlimmsten ein Ergebnis (Feldtest 22.08.2026).
      - name: Ergebnis-Retry-Regel (JS)
        run: node scripts/test-result-retry.mjs

      # Merkt eine geladene Tablet-Seite, dass sie veraltet ist — und laedt
      # sie im richtigen Moment neu? Der stille Abgleich darf mitten im Spiel
      # NICHT springen, der Fernbefehl der Turnierleitung muss es. Und der
      # Knopf darf an einem aelteren Turnier-PC gar nicht erscheinen, sonst
      # gilt ein still verworfener Befehl als erledigt (Feldtest 22.08.2026).
      - name: Tablet-Versionsabgleich + Fernbefehl (JS)
        run: node scripts/test-tablet-version.mjs

      # Wann gilt der Push-Kanal einer Anzeige als gesund? Laut Spec das
      # höchste Risiko des Vorhabens: Eine falsche Regel hier friert alle
      # Anzeigen einer Halle ein.
      - name: Gesundheit des Push-Kanals (JS)
        run: node scripts/test-push-health.mjs

      # Server-Uhr der Anzeigen (Etappe ETag, 1c): Der Offset kommt aus dem
      # 200-Abruf UND dem WS-Herzschlag, überlebt eine 304-Serie und bleibt
      # monoton plausibel — sonst stünde der Pausen-Countdown still.
      - name: Server-Uhr der Anzeigen (JS)
        run: node scripts/test-monitor-clock.mjs

      # Regel hinter dem "Release faellig?"-Check: zwei Grenzen (Uhr UND Menge),
      # weil je eine allein den echten Vorfall verschluckt haette.
      - name: Release-Faellig-Regel (JS)
        run: node scripts/test-version-tagged.mjs

      # Haelt fest, dass die Update-Notes die ganze Strecke seit dem letzten
      # Tag abdecken — vorher sah der Nutzer nur den getaggten Eintrag, und
      # bei neun gebuendelten Versionen fehlten acht.
      - name: Update-Notes ueber die Release-Strecke (JS)
        run: node scripts/test-release-notes.mjs

      # Umschalter Produktiv/Test (test.badhub.de). Greift er zu weit, verliert
      # ein Betreiber mit eigener badhub-Instanz beim ersten Klick seine
      # Adresse; greift er zu kurz, laeuft ein Testturnier stumm in die
      # Produktiv-Datenbank und faellt erst oeffentlich im Liveticker auf.
      - name: Umschalter Produktiv-Test (JS)
        run: node scripts/test-badhub-ziel.mjs

      # Cargo-Workspace: src-tauri (App) + relay + relay-proto.
      - name: Rust format check
        run: cargo fmt --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace
