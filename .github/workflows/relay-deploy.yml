name: Relay bauen & deployen

# Baut die bts-relay-Binary (Linux) und schiebt sie auf den Hetzner-Server.
# Läuft bei Änderungen am Relay-Code auf main, plus manuell.
#
# Voraussetzungen auf dem Server (einmalig, siehe docs/cloud-relay.md):
#   - Verzeichnis /opt/bts-relay/ existiert, der Gruppe bts-deploy schreibbar
#   - systemd-Unit bts-relay.service installiert (ops/bts-relay.service),
#     laeuft als eigener Benutzer bts-relay — NICHT als badhub
#   - sudoers: bts-deploy darf `systemctl restart bts-relay` ohne Passwort,
#     und sonst nichts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "relay/**"
      - "relay-proto/**"
      # ALLE Seiten, die das Relay-Binary per `include_str!` einbettet
      # (`relay/src/main.rs`, Zeilen 40–62). Fehlt eine davon hier, bleibt
      # eine Änderung an ihr im Cloud-Betrieb unsichtbar, während sie im LAN
      # längst wirkt — bis zufällig ein anderer Deploy läuft.
      #
      # Dreimal passiert: `tl.html` fehlte anfangs, und `overview.html`,
      # `preparation.html` und `ad.html` bis v0.9.238. **Wer im Relay ein
      # `include_str!` ergänzt, ergänzt hier den Pfad.**
      - "src-tauri/assets/tablet.html"
      - "src-tauri/assets/monitor.html"
      - "src-tauri/assets/tl.html"
      - "src-tauri/assets/overview.html"
      - "src-tauri/assets/preparation.html"
      - "src-tauri/assets/ad.html"
      - ".github/workflows/relay-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      # -p bts-relay baut nur den Relay (+ relay-proto) – die Tauri-App
      # wird nicht angefasst, es braucht also keine GTK/WebKit-System-Libs.
      - name: Relay bauen (Release)
        run: cargo build --release -p bts-relay

      - name: SSH einrichten
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_DEPLOY_KEY_V2 }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # Erst .new hochladen, dann atomar umbenennen + Dienst neu starten –
      # so läuft die alte Binary bis zum Restart-Moment weiter.
      - name: Binary hochladen & Dienst neu starten
        run: |
          set -euo pipefail
          rsync -av target/release/bts-relay \
            bts-deploy@178.104.221.177:/opt/bts-relay/bts-relay.new
          ssh bts-deploy@178.104.221.177 \
            'mv /opt/bts-relay/bts-relay.new /opt/bts-relay/bts-relay \
             && sudo systemctl restart bts-relay \
             && sleep 2 \
             && curl -sf http://127.0.0.1:8090/health'
