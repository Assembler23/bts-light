# Automatische Abhaengigkeits-Updates als PULL REQUEST. Sicherheits-Updates
# meldet GitHub zusaetzlich als Alert.
#
# Minor und Patch laufen seit 2026-08-08 nach gruenen Required-Checks von selbst
# durch (.github/workflows/dependabot-automerge.yml, docs/adr/0010). Major bleibt
# von Hand — hier besonders wichtig, weil viele Rust-Crates auf 0.x stehen und
# dort schon ein Minor-Sprung ein Bruch ist.
#
# Die Gruppen unten sind der Grund, warum das ueberhaupt traegt: minor/patch
# kommen als EIN Sammel-PR je Oekosystem, Major immer einzeln. Wer die Gruppen
# entfernt, macht aus dem Auto-Merge einen Dauerregen einzelner Windows-Builds.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: '06:00', timezone: Europe/Berlin }
    open-pull-requests-limit: 5
    labels: ['dependencies']
    commit-message: { prefix: 'chore(deps)' }
    groups:
      npm:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # Rust-Crates inkl. Tauri (Workspace-Root Cargo.toml).
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday, time: '06:00', timezone: Europe/Berlin }
    open-pull-requests-limit: 5
    labels: ['dependencies']
    commit-message: { prefix: 'chore(deps)' }
    groups:
      cargo:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    labels: ['dependencies']
    commit-message: { prefix: 'chore(ci)' }
