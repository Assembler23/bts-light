# Automatische Abhaengigkeits-Updates als PULL REQUEST — bewusst ohne Auto-Merge
# (bvbb-hub ADR 0015). Sicherheits-Updates meldet GitHub zusaetzlich als Alert.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: '06:00', timezone: Europe/Berlin }
    open-pull-requests-limit: 5
    labels: ['dependencies']
    commit-message: { prefix: 'chore(deps)' }
    groups:
      npm:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # Rust-Crates inkl. Tauri (Workspace-Root Cargo.toml).
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday, time: '06:00', timezone: Europe/Berlin }
    open-pull-requests-limit: 5
    labels: ['dependencies']
    commit-message: { prefix: 'chore(deps)' }
    groups:
      cargo:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    labels: ['dependencies']
    commit-message: { prefix: 'chore(ci)' }
